                const currentHeadingTarget = Number(actionTargetSettings.manualHeading);
                if (!Number.isFinite(currentHeadingTarget) || Math.abs(signedAngleDiff(frozenHeading, currentHeadingTarget)) > 0.1) return;

                actionTargetSettings.requestStateTimeSec = commitStateTime;
                controlGuidanceDirty = true;
                recordExperimentEvent('desired_hdg_commit', {
                    desired_hdg_deg: frozenHeading,
                    change_source: source,
                    request_state_time_sec: commitStateTime,
                    steering_session_id: Number(sessionId)
                });
                fetchControlGuidance({ forceRefresh: true, liveUpdate: false });
            }, ACTION_HEADING_COMMIT_DELAY_MS);
        }

        function classifyColregCue(os, ts) {
            if (!os || !ts) return { encounter: 'NO TARGET', action: '---', note: 'Select or approach a target.' };
            const op = shipPositionMeters(os), tp = shipPositionMeters(ts);
            const bearing = normalize360(Math.atan2(tp.east - op.east, tp.north - op.north) / DEG2RAD);
            const relBearing = signedAngleDiff(bearing, os.hdg);
            const reciprocal = Math.abs(signedAngleDiff(ts.cog, os.cog));
            const bearingFromTarget = normalize360(Math.atan2(op.east - tp.east, op.north - tp.north) / DEG2RAD);
            const ownInTargetStern = Math.abs(signedAngleDiff(bearingFromTarget, ts.hdg)) > 157.5;
            if (Math.abs(relBearing) <= 10 && reciprocal >= 150) {
                return { encounter: 'HEAD-ON', action: 'ALTER TO STBD', note: 'Simplified screening cue; navigator verifies COLREG applicability.' };
            }
            if (ownInTargetStern) {
                return { encounter: 'OVERTAKING', action: 'KEEP CLEAR', note: 'Own ship appears within target stern sector.' };
            }
            if (relBearing > 0 && relBearing <= 112.5) {
                return { encounter: 'CROSSING', action: 'GIVE-WAY CUE', note: 'Target is on own-ship starboard side.' };
            }
            if (relBearing < 0 && relBearing >= -112.5) {
                return { encounter: 'CROSSING', action: 'STAND-ON CUE', note: 'Target is on own-ship port side; continue monitoring.' };
            }
            return { encounter: 'OTHER', action: 'MONITOR', note: 'Geometry does not fit the simplified screening sectors.' };
        }

        function drawFutureGhostShip(ctx, eastMeters, northMeters, heading, color, alpha, label = '') {
            const r = worldVectorToHeadUp(eastMeters, northMeters);
            const unit = 400 / 1852;
            const relX = r.right * unit;
            const relZ = -r.forward * unit;
            ctx.save();
            ctx.globalAlpha = alpha;
            drawShipHullLocal(ctx, vObj.panX, vObj.panY, vObj.viewScale, relX, relZ, displayRelativeHeading(heading), color, false, label);
            ctx.restore();
        }

        function predictTurningDisplacement(ship, secondsAhead) {
            const speed = Math.max(0, Number(ship && ship.sog) || 0) * 0.514444;
            const course = normalize360(Number(ship && ship.cog) || Number(ship && ship.hdg) || 0);
            const rotDegPerMin = Number(ship && ship.rot) || 0;
            const omega = rotDegPerMin * DEG2RAD / 60.0;
            const t = Math.max(0, Number(secondsAhead) || 0);
            const theta0 = course * DEG2RAD;
            let east, north;
            if (Math.abs(omega) < 1e-7) {
                east = speed * Math.sin(theta0) * t;
                north = speed * Math.cos(theta0) * t;
            } else {
                const theta1 = theta0 + omega * t;
                east = speed / omega * (Math.cos(theta0) - Math.cos(theta1));
                north = speed / omega * (Math.sin(theta1) - Math.sin(theta0));
            }
            return {
                east, north,
                heading: normalize360((Number(ship && ship.hdg) || course) + rotDegPerMin * t / 60.0),
                cog: normalize360(course + rotDegPerMin * t / 60.0)
            };
        }

        function renderFuturePositions(ctx) {
            const os = vObj.massEntity;
            if (!os) return;
            const futureShips = getFuturePositionShips();
            const alphas = [0.14, 0.19, 0.24, 0.30, 0.38];

            const futureMarksSec = getFutureProjectionSeconds();
            let ownPrev = { east: 0, north: 0 };
            futureMarksSec.forEach((secondsAhead, index) => {
                const pred = predictTurningDisplacement(os, secondsAhead);
                if (Math.abs(Number(os.rot) || 0) >= 0.5) {
                    const p0 = relativeMetersToCanvas(ownPrev.east, ownPrev.north);
                    const p1 = relativeMetersToCanvas(pred.east, pred.north);
                    drawGlowLine(ctx, p0.x, p0.y, p1.x, p1.y, 'rgba(148,163,184,0.34)', 1.0, [4,5]);
                }
                drawFutureGhostShip(ctx, pred.east, pred.north, pred.heading, '#94a3b8', alphas[index] || 0.3, '');
                ownPrev = pred;
            });

            futureShips.forEach(ts => {
                const rel = shipRelativeMeters(ts);
                let prev = { east: rel.east, north: rel.north };
                futureMarksSec.forEach((secondsAhead, index) => {
                    const pred = predictTurningDisplacement(ts, secondsAhead);
                    const e = rel.east + pred.east;
                    const n = rel.north + pred.north;
                    if (Math.abs(Number(ts.rot) || 0) >= 0.5) {
                        const p0 = relativeMetersToCanvas(prev.east, prev.north);
                        const p1 = relativeMetersToCanvas(e, n);
                        drawGlowLine(ctx, p0.x, p0.y, p1.x, p1.y, 'rgba(148,163,184,0.34)', 1.0, [4,5]);
                    }
                    drawFutureGhostShip(ctx, e, n, pred.heading, '#94a3b8', alphas[index] || 0.3, '');
                    prev = { east: e, north: n };
                });
            });
        }

        function renderCollisionPoints(ctx) {
            const os = vObj.massEntity;
            if (!os) return;
            const ownVel = velocityFromCourseMps(os.cog, os.sog);
            getNearbyTrafficShips().forEach(ts => {
                const motion = evaluateRelativeMotion(os, ts);
                if (!Number.isFinite(motion.tcpaMin) || motion.tcpaMin < 0 || motion.tcpaMin > SUPPORT_CONFIG.horizonMin) return;
                if (motion.cpaNM >= getDesiredCpaNM()) return;
                const sec = motion.tcpaMin * 60;
                const targetVel = velocityFromCourseMps(ts.cog, ts.sog);
                const relNow = shipRelativeMeters(ts);
                const ownFuture = { east: ownVel.east * sec, north: ownVel.north * sec };
                const targetFuture = { east: relNow.east + targetVel.east * sec, north: relNow.north + targetVel.north * sec };
                const encounter = {
                    east: (ownFuture.east + targetFuture.east) / 2,
                    north: (ownFuture.north + targetFuture.north) / 2
                };
                const p = relativeMetersToCanvas(encounter.east, encounter.north);
                const color = '#fb7185';
                ctx.save();
                ctx.strokeStyle = color; ctx.lineWidth = 2.2;
                ctx.beginPath();
                ctx.moveTo(p.x - 9, p.y - 9); ctx.lineTo(p.x + 9, p.y + 9);
                ctx.moveTo(p.x + 9, p.y - 9); ctx.lineTo(p.x - 9, p.y + 9);
                ctx.stroke();
                ctx.restore();
                drawSupportTag(ctx, `TCPA ${motion.tcpaMin.toFixed(1)} min`, p.x + 13, p.y - 4, color);
            });
        }

        function renderThreatHighlight(ctx) {
            // Intentionally no extra ring/text. Dangerous targets are rendered red in render2D();
            // non-dangerous targets remain white to avoid layered circles and duplicate labels.
        }

        function renderRelativeMotion(ctx) {
            const os = vObj.massEntity;
            if (!os) return;
            const ov = velocityFromCourseMps(os.cog, os.sog);
            getFuturePositionShips().forEach(ts => {
                const tv = velocityFromCourseMps(ts.cog, ts.sog);
                const rel = shipRelativeMeters(ts);
                let prev = relativeMetersToCanvas(rel.east, rel.north);
                SUPPORT_CONFIG.futureMinutes.forEach((minute, j) => {
                    const sec = minute * 60;
                    const e = rel.east + (tv.east - ov.east) * sec;
                    const n = rel.north + (tv.north - ov.north) * sec;
                    const p = relativeMetersToCanvas(e, n);
                    drawGlowLine(ctx, prev.x, prev.y, p.x, p.y, 'rgba(34,211,238,0.64)', 1.25, [4, 4]);
                    ctx.save();
                    ctx.strokeStyle = j === SUPPORT_CONFIG.futureMinutes.length - 1 ? '#22d3ee' : 'rgba(34,211,238,0.72)';
                    ctx.fillStyle = 'rgba(34,211,238,0.08)';
                    ctx.lineWidth = 1.4;
                    ctx.beginPath(); ctx.arc(p.x, p.y, 5 + j * 1.4, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
                    ctx.restore();
                    drawSupportTag(ctx, `${ts.name} +${minute}분`, p.x + 7, p.y - 4, '#67e8f9');
                    prev = p;
                });
            });
        }
        function renderApproachRanking(ctx) {
            getVisibleApproachRankingList().slice(0, 5).forEach((item, index) => {
                const p = shipCanvasPoint(item.ship);
                const danger = supportRiskClass(item.motion.cpaNM, item.motion.tcpaMin) === 'danger';
                const color = danger ? '#fb7185' : '#cbd5e1';
                ctx.save();
                ctx.fillStyle = 'rgba(5,10,18,0.94)';
                ctx.strokeStyle = color;
                ctx.lineWidth = 1.2;
                ctx.beginPath();
                ctx.arc(p.x - 16, p.y - 16, 10, 0, Math.PI * 2);
                ctx.fill(); ctx.stroke();
                ctx.fillStyle = color;
                ctx.font = '700 11px Segoe UI';
                ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
                ctx.fillText(String(index + 1), p.x - 16, p.y - 16);
                ctx.restore();
            });
        }

        function renderManeuverTrend(ctx) {
            getTrafficShips().slice(0, 12).forEach(ts => {
                const p = shipCanvasPoint(ts);
                const rot = Number(ts.rot) || 0;
                const color = Math.abs(rot) < 0.5 ? '#94a3b8' : '#38bdf8';
                const label = Math.abs(rot) < 0.5 ? 'STEADY' : rot > 0 ? `STBD ${Math.abs(rot).toFixed(1)}` : `PORT ${Math.abs(rot).toFixed(1)}`;
                ctx.save(); ctx.strokeStyle = color; ctx.lineWidth = 1.6; ctx.setLineDash([3,3]);
                ctx.beginPath(); ctx.arc(p.x, p.y, 25, rot > 0 ? -Math.PI * 0.65 : Math.PI * 0.15, rot > 0 ? Math.PI * 0.15 : Math.PI * 0.85, rot < 0); ctx.stroke(); ctx.restore();
                drawSupportTag(ctx, label, p.x + 18, p.y - 23, color);
            });
        }

        function getSafeHeadingBandSamples(os, targets) {
            if (!os) return [];
            const samples = [];
            const halfSpan = SUPPORT_CONFIG.headingBandSpanDeg / 2;
            for (let d = -halfSpan; d <= halfSpan + 1e-9; d += SUPPORT_CONFIG.safeBandDisplayStepDeg) {
                const r = SupportModels.collisionAvoidance.evaluateHeading(
                    os, targets, os.cog + d, os.sog, getDesiredCpaNM('dm:safe-heading-band')
                );
                r.delta = signedAngleDiff(r.heading, os.cog);
                samples.push(r);
            }
            return samples;
        }

        function renderDangerHeadingArcs(ctx) {
            const os = vObj.massEntity;
            if (!os) return;
            // ARC display is intentionally independent from the route-search planner.
            // This removes the previous delay where the route could be ready while ARC
            // drawing still waited for a target to enter the fixed planning horizon.
            const targets = getNearbyTrafficShips(SUPPORT_CONFIG.supportRadiusNM);
            const snapshot = buildDangerHeadingArcSnapshot(
                os, targets, getDesiredCpaNM('dm:safe-heading-band')
            );
            if (!snapshot || !Array.isArray(snapshot.arcs)) return;
            const unit = 400 / 1852;
            const maxVisiblePx = Math.hypot(canvas.width, canvas.height);

            snapshot.arcs.forEach(arc => {
                const radiusPx = Number(arc.radiusMeters) * unit * vObj.viewScale;
                if (!Number.isFinite(radiusPx) || radiusPx < 2 || radiusPx > maxVisiblePx) return;
                const relBearing = displayRelativeHeading(arc.bearing);
                const center = (relBearing - 90) * DEG2RAD;
                const half = arc.halfDeg * DEG2RAD;
                ctx.save();
                ctx.strokeStyle = 'rgba(244,63,94,0.82)';
                ctx.lineWidth = 4.0;
                ctx.beginPath();
                ctx.arc(vObj.panX, vObj.panY, radiusPx, center - half, center + half, false);
                ctx.stroke();
                ctx.restore();
            });
        }

        function renderArcTimeRings(ctx, solution) {
            if (!solution || !solution.arc || !Array.isArray(solution.arcRings)) return;
            const unit = 400 / 1852;
            const maxVisiblePx = Math.hypot(canvas.width, canvas.height);
            solution.arcRings.forEach((ring, index) => {
                const radiusPx = ring.radiusMeters * unit * vObj.viewScale;
                if (radiusPx < 2 || radiusPx > maxVisiblePx) return;
                const minute = ring.minute;
                const showCircle = Math.abs(minute / 2 - Math.round(minute / 2)) < 1e-6 || index === solution.arcRings.length - 1;
                if (showCircle) {
                    ctx.save();
                    ctx.strokeStyle = 'rgba(100,116,139,0.16)';
                    ctx.lineWidth = 0.8;
                    ctx.setLineDash([4,7]);
                    ctx.beginPath(); ctx.arc(vObj.panX, vObj.panY, radiusPx, 0, Math.PI * 2); ctx.stroke();
                    ctx.restore();
                }
                if ((ring.arcs || []).length) {
                    ctx.save();
                    ctx.strokeStyle = 'rgba(244,63,94,0.72)';
                    ctx.lineWidth = 3.5;
                    (ring.arcs || []).forEach(arc => {
                        const relBearing = displayRelativeHeading(arc.bearing);
                        const center = (relBearing - 90) * DEG2RAD;
                        const half = arc.halfDeg * DEG2RAD;
                        ctx.beginPath(); ctx.arc(vObj.panX, vObj.panY, radiusPx, center - half, center + half, false); ctx.stroke();
                    });
                    ctx.restore();
                }
            });
        }

        function renderAvoidanceRoute(ctx) {
            const os = vObj.massEntity, targets = getTrafficShips();
            if (!os) return;
            const solution = SupportModels.collisionAvoidance.findMinimumAlterationOptions(
                os, targets, getDesiredCpaNM('dm:minimum-alteration')
            );
            if (!solution) return;

            // Original ARC recommendation is a single route. Select the shorter safe side
            // candidate and draw only that one from OS to the current target waypoint.
            const candidate = chooseBestArcCandidate(solution);
            if (!candidate) return;
            const route = SupportModels.collisionAvoidance.buildAvoidanceRoute(os, targets, candidate);
            if (!Array.isArray(route) || route.length < 2) return;
            drawWaypointLegRoute(ctx, route, '#facc15', {
                dash: [],
                lineWidth: 2.6,
                alpha: 1,
                showLabels: false,
                showWaypoints: false
            });
        }

        function renderPortStarboard(ctx) {
            const os = vObj.massEntity;
            if (!os) return;
            const p = drawHeadingRay(ctx, os.cog - SUPPORT_CONFIG.compareAlterDeg, '#38bdf8', 115, [6,4]);
            const s = drawHeadingRay(ctx, os.cog + SUPPORT_CONFIG.compareAlterDeg, '#facc15', 115, [6,4]);
            drawSupportTag(ctx, `PORT ${SUPPORT_CONFIG.compareAlterDeg}°`, p.x + 4, p.y, '#38bdf8');
            drawSupportTag(ctx, `STBD ${SUPPORT_CONFIG.compareAlterDeg}°`, s.x + 4, s.y, '#facc15');
        }

        function renderSpeedOption(ctx) {
            const os = vObj.massEntity;
            if (!os) return;
            const option = findSpeedOption(os, getTrafficShips());
            if (!option || !option.recommended) return;
            const scale = os.sog > 0 ? clampValue(option.recommended.speed / os.sog, 0.35, 1.5) : 1;
            const tip = drawHeadingRay(ctx, os.cog, '#facc15', 110 * scale, []);
            drawSupportTag(ctx, `${option.recommended.speed.toFixed(1)} kt`, tip.x + 5, tip.y, '#facc15');
        }

        function renderWhatIfCourse(ctx) {
            const os = vObj.massEntity;
            if (!os) return;
            const targets = getTrafficShips();
            const scenarios = getArcWhatIfScenarios(os, targets);
            const available = scenarios.filter(s => s.available);
            if (!available.length) return;

            available.forEach((scenario) => {
                const hue = 270 + scenario.index * 4;
                const color = `hsl(${hue}, 46%, ${58 + (scenario.index % 2) * 7}%)`;
                const route = Array.isArray(scenario.route) ? scenario.route : [];
                if (route.length < 2) return;
                drawWaypointLegRoute(ctx, route, color, {
                    lineWidth: 1.6 + scenario.index * 0.04,
                    alpha: 0.78,
                    showLabels: false,
                    showWaypoints: false
                });

                const frac = 0.24 + 0.065 * scenario.index;
                const labelIndex = Math.min(route.length - 1, Math.max(1, Math.floor((route.length - 1) * frac)));
                const lp0 = route[labelIndex];
                const lp = relativeMetersToCanvas(lp0.east, lp0.north);
                drawSupportTag(ctx, `CPA ${scenario.cpaNM.toFixed(1)} NM`, lp.x + 6, lp.y - 3, color);
            });
        }

        function renderColregCue(ctx) {
            const ts = getPreferredTarget();
            if (!ts) return;
            const p = shipCanvasPoint(ts);
            ctx.save(); ctx.strokeStyle = '#facc15'; ctx.lineWidth = 2.2; ctx.setLineDash([5,4]); ctx.beginPath(); ctx.arc(p.x, p.y, 32, 0, Math.PI * 2); ctx.stroke(); ctx.restore();
        }

        function renderTargetHeading(ctx) {
            const target = getDecisionTargetHeading();
            if (!Number.isFinite(target)) return;
            const tip = drawHeadingRay(ctx, target, '#34d399', 145, []);
            ctx.save(); ctx.strokeStyle = '#34d399'; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(tip.x, tip.y, 8, 0, Math.PI * 2); ctx.stroke(); ctx.restore();
            drawSupportTag(ctx, `TARGET ${target.toFixed(0)}°`, tip.x + 7, tip.y, '#34d399');
        }

        function renderDesiredHeadingGuide(ctx) {
            if (!isAnyActionControlActive() || !vObj.massEntity) return;
            const target = getDecisionTargetHeading();
            if (!Number.isFinite(target)) return;

            const rel = displayRelativeHeading(target);
            const rad = rel * DEG2RAD;
            const dx = Math.sin(rad);
            const dy = -Math.cos(rad);
            const distances = [];
            if (dx > 1e-9) distances.push((canvas.width - vObj.panX) / dx);
            else if (dx < -1e-9) distances.push((0 - vObj.panX) / dx);
            if (dy > 1e-9) distances.push((canvas.height - vObj.panY) / dy);
            else if (dy < -1e-9) distances.push((0 - vObj.panY) / dy);
            const positive = distances.filter(v => Number.isFinite(v) && v > 0);
            if (!positive.length) return;

            const length = Math.max(160, Math.min(...positive) * 0.88);
            const x2 = vObj.panX + dx * length;
            const y2 = vObj.panY + dy * length;
            drawGlowLine(ctx, vObj.panX, vObj.panY, x2, y2, '#cbd5e1', 2.0, [12,6]);
        }

        function renderRudderDirection(ctx) {
            const os = vObj.massEntity; if (!os) return;
            const target = getDecisionTargetHeading();
            if (!Number.isFinite(target)) return;
            const error = signedAngleDiff(target, os.hdg);
            const color = '#cbd5e1';
            ctx.save();
            ctx.strokeStyle = color; ctx.lineWidth = 3.5;
            const start = -90 * DEG2RAD;
            const sweep = clampValue(error, -80, 80) * DEG2RAD;
            ctx.beginPath(); ctx.arc(vObj.panX, vObj.panY, 52, start, start + sweep, sweep < 0); ctx.stroke();
            ctx.restore();
        }

        function renderHeadingError(ctx) {
            const os = vObj.massEntity; if (!os) return;
            const target = getDecisionTargetHeading();
            if (!Number.isFinite(target)) return;
            drawHeadingRay(ctx, os.hdg, 'rgba(148,163,184,0.70)', 95, [4,4]);
            drawHeadingRay(ctx, target, '#34d399', 115, []);
        }

        function renderActionOverlay(ctx, feature) {
            if (feature === 'rudder-angle') renderRudderDirection(ctx);
            else if (feature === 'heading-error') renderHeadingError(ctx);
            else if (feature === 'rot-guidance') renderHeadingError(ctx);
            else if (feature === 'ease-timing') renderHeadingError(ctx);
        }

        function renderSupportOverlay(ctx) {
            if (!vObj.massEntity) { updateSupportCards(); return; }

            renderDesiredHeadingGuide(ctx);

            if (activeSupportFeatures.has('sa:future-position')) renderFuturePositions(ctx);
            if (activeSupportFeatures.has('sa:threat-highlight')) renderThreatHighlight(ctx);
            if (activeSupportFeatures.has('sa:approach-ranking')) renderApproachRanking(ctx);

            if (activeSupportFeatures.has('dm:safe-heading-band')) renderDangerHeadingArcs(ctx);
            // Multi-CPA comparison routes are deliberately drawn first so the selected
            // minimum-alteration ARC solution remains visually dominant when both are ON.
            if (activeSupportFeatures.has('dm:minimum-alteration')) renderAvoidanceRoute(ctx);

            updateSupportCards();
        }

        function cardRows(rows, note = '', status = null) {
            const body = rows.map(([key, value]) => `<div class="support-card-row"><span class="support-card-key">${key}</span><span class="support-card-value">${value}</span></div>`).join('');
            const noteHtml = note ? `<div class="support-card-note">${note}</div>` : '';
            const statusHtml = status ? `<div class="support-card-status ${status[0]}">${status[1]}</div>` : '';
            return body + noteHtml + statusHtml;
        }

        function buildSupportCardModel(group, feature) {
            const os = vObj.massEntity;
            if (!os || !feature) return null;
            const targets = getTrafficShips();
            const target = getPreferredTarget();
            const threatList = getThreatList();
            const primary = threatList[0];
            if (group === 'sa') {
                if (feature === 'future-position') {
                    const count = getFuturePositionShips().length;
                    return { title: 'FUTURE POSITION', rows: [['Projected targets', String(count)], ['Time interval', `${futureProjectionSettings.intervalSec}s × 1–5`], ['Basis', 'COG · SOG']], note: `Projects unique vessels currently within ${SUPPORT_CONFIG.futureRadiusNM.toFixed(0)} NM using live COG/SOG.`, status: count ? ['caution', 'FUTURE TRAFFIC PROJECTION'] : ['safe', 'NO TARGET WITHIN 5 NM'] };
                }
                if (feature === 'collision-point') {
                    const collisionCandidates = threatList.filter(t => t.future && t.motion.cpaNM < getDesiredCpaNM()); const c = collisionCandidates[0]; return { title: 'COLLISION POINT', rows: [['Primary', c ? c.ship.name : '---'], ['CPA', c ? `${c.motion.cpaNM.toFixed(2)} NM` : '---'], ['TCPA', c && Number.isFinite(c.motion.tcpaMin) ? `${c.motion.tcpaMin.toFixed(1)} min.` : '---']], note: 'Marks the calculated future encounter location on the chart, not the own-ship position.', status: c ? ['danger', 'PROJECTED COLLISION LOCATION'] : ['safe', 'NO CPA BELOW SELECTED LIMIT'] };
                }
                if (feature === 'threat-highlight') {
                    const items = getTrafficShips().map(ship => ({ ship, motion: evaluateRelativeMotion(os, ship) }));
                    const threatCpaNM = getDesiredCpaNM('sa:threat-highlight');
                    const danger = items.filter(t => isThreatHighlightDangerMotion(t.motion, threatCpaNM)).length;
                    return { title: 'THREAT HIGHLIGHT', rows: [['Danger targets', String(danger)], ['Criterion', `CPA < ${threatCpaNM.toFixed(2)} NM · TCPA > 0`]], note: '양수 TCPA의 실제 CPA가 설정값보다 작은 선박만 빨간색으로 표시합니다.', status: danger ? ['danger', `${danger} HIGH-RISK TARGET(S)`] : ['safe', 'NO HIGH-RISK TARGET'] };
                }
                if (feature === 'relative-motion') {
                    const m = target ? evaluateRelativeMotion(os, target) : null;
                    const relSpeed = m ? Math.hypot(m.relVelEast, m.relVelNorth) / 0.514444 : 0;
                    return { title: 'RELATIVE MOTION', rows: [['Target', target ? target.name : '---'], ['Relative speed', target ? `${relSpeed.toFixed(1)} kt` : '---'], ['CPA', m ? `${m.cpaNM.toFixed(2)} NM` : '---']], note: 'Selected target first; otherwise the current highest-risk target.', status: m ? [supportRiskClass(m.cpaNM, m.tcpaMin), '5-MIN RELATIVE TRACK'] : ['safe', 'NO TARGET'] };
                }
                if (feature === 'approach-ranking') {
                    const top = getVisibleApproachRankingList().slice(0, 5);
                    return { title: 'PRIORITY MONITORING', html: cardRows(top.map((t,i) => [`#${i+1} ${t.ship.name}`, `CPA ${t.motion.cpaNM.toFixed(2)} / ${Number.isFinite(t.motion.tcpaMin) ? t.motion.tcpaMin.toFixed(1) : '--'}m`]), 'CPA가 작은 선박을 우선하고, CPA가 비슷하면 TCPA가 가까운 선박을 우선합니다.', top[0] ? [supportRiskClass(top[0].motion.cpaNM, top[0].motion.tcpaMin), 'PRIORITY MONITORING LIST'] : ['safe','NO TARGET']) };
                }
                if (feature === 'maneuver-trend') {
                    const moving = targets.filter(t => Math.abs(Number(t.rot)||0) >= 0.5).length;
                    return { title: 'MANEUVER TREND', rows: [['Turning targets', String(moving)], ['Signal', 'ROT sign / magnitude'], ['STBD / PORT', '+ / −']], note: 'Displays observed turn trend only; it does not infer intention.', status: moving ? ['caution', 'MANEUVER CHANGE DETECTED'] : ['safe', 'TARGETS MOSTLY STEADY'] };
                }
            }

            if (group === 'dm') {
                if (feature === 'safe-heading-band') {
                    const snapshot = buildDangerHeadingArcSnapshot(
                        os, getNearbyTrafficShips(SUPPORT_CONFIG.supportRadiusNM), getDesiredCpaNM('dm:safe-heading-band')
                    );
                    const arcCount = snapshot && Array.isArray(snapshot.arcs) ? snapshot.arcs.length : 0;
                    return { title: 'DANGER HEADING ARC', rows: [['ARC targets', String(arcCount)], ['CPA limit', `${getDesiredCpaNM('dm:safe-heading-band').toFixed(2)} NM`]], note: '양수 TCPA 선박의 위험 ARC만 즉시 표시합니다.', status: arcCount ? ['danger', 'DANGER ARC DISPLAY'] : ['safe', 'NO POSITIVE-TCPA ARC'] };
                }
                if (feature === 'minimum-alteration') {
                    const sol = SupportModels.collisionAvoidance.findMinimumAlterationOptions(os, targets);
                    const r = chooseBestArcCandidate(sol);
                    const delta = r ? signedAngleDiff(r.heading, os.cog) : 0;
                    return { title: 'RECOMMENDED ROUTE', rows: [['Current COG', `${os.cog.toFixed(0)}°`], ['Avoidance COG', r ? `${r.heading.toFixed(0)}°` : '---'], ['Course change', r ? `${delta>=0?'STBD':'PORT'} ${Math.abs(delta).toFixed(0)}°` : '---'], ['Worst CPA', r && r.worst ? `${r.worst.cpaNM.toFixed(2)} NM` : '---']], note: '1분 단위 ARC 탐색으로 위험 HDG 벽을 피하는 최단 추천항로 1개만 표시합니다.', status: r ? ['safe','SAFE ARC ROUTE'] : ['danger','NO SAFE ARC ROUTE'] };
                }
                if (feature === 'port-starboard') {
                    const p = SupportModels.collisionAvoidance.evaluateHeading(os, targets, os.cog - SUPPORT_CONFIG.compareAlterDeg, os.sog);
                    const s = SupportModels.collisionAvoidance.evaluateHeading(os, targets, os.cog + SUPPORT_CONFIG.compareAlterDeg, os.sog);
                    const better = [p,s].sort((a,b)=>a.unsafeCount-b.unsafeCount || b.worst.cpaNM-a.worst.cpaNM)[0];
                    return { title: 'PORT / STBD', rows: [['PORT worst CPA', `${p.worst.cpaNM.toFixed(2)} NM`], ['STBD worst CPA', `${s.worst.cpaNM.toFixed(2)} NM`], ['Screened option', signedAngleDiff(better.heading, os.cog) >= 0 ? 'STBD' : 'PORT']], note: `Compares equal ${SUPPORT_CONFIG.compareAlterDeg}° trial alterations only.`, status: better.safe ? ['safe','ONE OR MORE OPTIONS PASS CPA LIMIT'] : ['danger','BOTH OPTIONS NEED REVIEW'] };
                }
                if (feature === 'speed-option') {
                    const opt = findSpeedOption(os, targets);
                    const safeSpeeds = opt ? opt.safe.map(c=>c.speed) : [];
                    return { title: 'SPEED OPTION', rows: [['Current SOG', `${os.sog.toFixed(1)} kt`], ['Suggested', opt && opt.recommended ? `${opt.recommended.speed.toFixed(1)} kt` : '---'], ['Safe samples', safeSpeeds.length ? `${Math.min(...safeSpeeds).toFixed(1)}–${Math.max(...safeSpeeds).toFixed(1)} kt` : 'NONE']], note: 'Heading is held constant while speed samples are screened.', status: opt && opt.hasSafe ? ['safe','SPEED-ONLY OPTION FOUND'] : ['danger','NO SAFE SPEED SAMPLE'] };
                }
                if (feature === 'what-if-course') {
                    const scenarios = getArcWhatIfScenarios(os, targets);
                    const available = scenarios.filter(s => s.available);
                    return { title: 'WHAT-IF COURSE', rows: [['CPA criteria', '0.1–1.0 NM'], ['ARC routes', `${available.length} / ${scenarios.length}`], ['TR', `${SUPPORT_CONFIG.arcTRSec}s`]], note: 'Each displayed line is an ARC avoidance-and-rejoin route calculated for its own CPA criterion; ARC sectors themselves are intentionally hidden in this feature.', status: available.length ? ['safe','MULTI-CPA ARC ROUTES'] : ['danger','NO ARC ROUTE FOUND'] };
                }
            }

            if (group === 'act') {
                const targetHeading = getDecisionTargetHeading();
                if (!Number.isFinite(targetHeading)) {
                    return { title: 'ACTION TARGET REQUIRED', rows: [['Current HDG', `${os.hdg.toFixed(1)}°`], ['Target HDG', '---']], note: '상단 중앙 DESIRED HDG에서 원하는 HDG를 먼저 설정하세요.', status: ['caution','WAITING FOR TARGET HDG'] };
                }
                const g = latestControlGuidance;
                const pythonReady = !!(g && g.available === true && Number.isFinite(Number(g.target_heading))
                    && Math.abs(signedAngleDiff(targetHeading, Number(g.target_heading))) <= 0.6);
                if (!pythonReady) {
                    return { title: feature === 'rudder-balance' ? 'RUDDER SUGGESTION' : 'ROT SUGGESTION', rows: [['Target HDG', `${targetHeading.toFixed(1)}°`]], note: 'PID 조타지원 계산을 기다리는 중입니다.', status: ['caution','STEERING MODEL WAIT'] };
                }

                const error = Number(g.heading_error);
                if (feature === 'rudder-balance') {
                    return {
                        title: 'RUDDER SUGGESTION', assessment: String(g.rudder_assessment || 'GOOD'),
                        current: Number(g.current_rudder) || 0, desired: Number(g.pid_target_rudder),
                        targetHeading, error, note: '현재 Rudder에서 조종모델의 목표 Rudder로 움직여야 할 방향만 안내합니다.'
                    };
                }
                if (feature === 'rot-balance') {
                    const pidIntendedRot = Number(g.pid_intended_rot);
                    return {
                        title: 'ROT SUGGESTION', assessment: String(g.rot_assessment || 'GOOD'),
                        current: Number(g.current_rot) || 0,
                        desired: Number.isFinite(pidIntendedRot) ? pidIntendedRot : NaN,
                        targetHeading, error,
                        note: 'PID 목표 Rudder와 레이더 시뮬레이터와 동일한 선박동역학이 만드는 ROT 변화 방향만 안내합니다.'
                    };
                }
            }
            return null;
        }

        function buildSupportCardPresentation(group, feature, model) {
            const os = vObj.massEntity;
            if (!os) return null;
            const targets = getTrafficShips();
            const target = getPreferredTarget();
            const limit = getDesiredCpaNM(`${group}:${feature}`);
            const cls = model && model.status ? model.status[0] : 'safe';
            const p = (primary, secondary = '', status = '', state = cls) => ({ primary, secondary, status, state });

            if (group === 'sa') {
                if (feature === 'future-position') {
                    const count = getFuturePositionShips().length;
                    return p(`${count}척`, `간격 ${futureProjectionSettings.intervalSec}s`, count ? '본선·타선 미래 위치' : '해당 범위 선박 없음', count ? 'caution' : 'safe');
                }
                if (feature === 'collision-point') {
                    const c = getThreatList().find(t => t.future && t.motion.cpaNM < limit);
                    return c ? p(`${c.motion.tcpaMin.toFixed(1)}분 후`, `${c.ship.name} · CPA ${c.motion.cpaNM.toFixed(2)} NM`, '충돌 예상 위치 표시', 'danger')
                             : p('충돌 예상 없음', `CPA < ${limit.toFixed(2)} NM 없음`, '현재 기준', 'safe');
                }
                if (feature === 'threat-highlight') {
                    const items = getTrafficShips().map(ship => ({ship, motion:evaluateRelativeMotion(os, ship)}));
                    const d = items.filter(t => isThreatHighlightDangerMotion(t.motion, limit)).length;
                    return d ? p(`위험 ${d}척`, `CPA < ${limit.toFixed(2)} NM · TCPA > 0`, '위험선박만 빨간색 표시', 'danger')
                             : p('위험 없음', `CPA < ${limit.toFixed(2)} NM · TCPA > 0 대상 없음`, '일반 타선은 흰색', 'safe');
                }
                if (feature === 'relative-motion') {
                    const count = getFuturePositionShips().length;
                    return p(`${count}척 추적`, '본선 기준 상대운동', count ? '1 / 2 / 3 / 4 / 5분 상대 위치' : '해당 범위 선박 없음', count ? 'caution' : 'safe');
                }
                if (feature === 'approach-ranking') {
                    const top = getVisibleApproachRankingList()[0];
                    return top ? p(`#1 ${top.ship.name}`, `CPA ${top.motion.cpaNM.toFixed(2)} NM · TCPA ${top.motion.tcpaMin.toFixed(1)} min`, '우선 감시 선박', supportRiskClass(top.motion.cpaNM,top.motion.tcpaMin))
                               : p('대상 없음','유효한 미래 CPA/TCPA 대상 없음','우선 감시 선박','safe');
                }
                if (feature === 'maneuver-trend') {
                    const moving = targets.filter(t => Math.abs(Number(t.rot)||0) >= 0.5).length;
                    return moving ? p(`${moving}척 선회`, 'ROT로 PORT / STBD 추세 판별', '조종 변화 감지','caution')
                                  : p('대체로 직진','큰 ROT 없음','조종 추세','safe');
                }
            }

            if (group === 'dm') {
                if (feature === 'safe-heading-band') {
                    const snapshot = buildDangerHeadingArcSnapshot(os, getNearbyTrafficShips(SUPPORT_CONFIG.supportRadiusNM), limit);
                    const count = snapshot && Array.isArray(snapshot.arcs) ? snapshot.arcs.length : 0;
                    return count
                        ? p(`위험 ARC ${count}개`, `CPA ${limit.toFixed(2)} NM · TCPA > 0`, '위험 헤딩 ARC만 표시', 'danger')
                        : p('위험 ARC 없음', `CPA ${limit.toFixed(2)} NM · TCPA > 0`, '현재 표시할 ARC 없음', 'safe');
                }
                if (feature === 'minimum-alteration') {
                    const sol = SupportModels.collisionAvoidance.findMinimumAlterationOptions(os,targets);
                    const best = chooseBestArcCandidate(sol);
                    if (!best) return p('경로 없음', `MIN CPA ${limit.toFixed(2)} NM`, '안전한 ARC 통과 경로 없음', 'danger');
                    const delta = signedAngleDiff(best.heading, os.cog);
                    const side = delta >= 0 ? 'STBD ▶' : '◀ PORT';
                    return p(side, `변침 ${Math.abs(delta).toFixed(0)}° · MIN CPA ${limit.toFixed(2)} NM`, '노란색 ARC 추천항로 1개 표시', 'safe');
                }
                if (feature === 'port-starboard') {
                    const port = SupportModels.collisionAvoidance.evaluateHeading(os,targets,os.cog-SUPPORT_CONFIG.compareAlterDeg,os.sog);
                    const stbd = SupportModels.collisionAvoidance.evaluateHeading(os,targets,os.cog+SUPPORT_CONFIG.compareAlterDeg,os.sog);
                    const better = [port,stbd].sort((a,b)=>a.unsafeCount-b.unsafeCount || b.worst.cpaNM-a.worst.cpaNM)[0];
                    const side = signedAngleDiff(better.heading,os.cog) >= 0 ? 'STBD ▶' : '◀ PORT';
                    return p(side, `CPA PORT ${port.worst.cpaNM.toFixed(2)} · STBD ${stbd.worst.cpaNM.toFixed(2)}`, `${SUPPORT_CONFIG.compareAlterDeg}° 동일 변침 비교`, better.safe?'safe':'danger');
                }
                if (feature === 'speed-option') {
                    const opt = findSpeedOption(os,targets);
                    if (!opt || !opt.recommended) return p('대안 없음',`현재 ${os.sog.toFixed(1)} kt`,'속력만 변경','danger');
                    return p(`${opt.recommended.speed.toFixed(1)} kt`, `현재 ${os.sog.toFixed(1)} kt`, opt.hasSafe?'CPA 기준 만족 속력':'최선 속력 대안', opt.hasSafe?'safe':'danger');
                }
                if (feature === 'what-if-course') {
                    const scenarios = getArcWhatIfScenarios(os, targets);
                    const available = scenarios.filter(s => s.available);
                    return available.length
                        ? p(`${available.length} / ${scenarios.length} 경로`, 'CPA 0.1 → 1.0 NM · ARC', '피항 후 원침로 복귀 경로', 'safe')
                        : p('경로 없음', 'CPA 0.1 → 1.0 NM · ARC', '현재 교통에서 계산 불가', 'danger');
                }
            }

            if (group === 'act') {
                const targetHeading = getDecisionTargetHeading();
                if (!Number.isFinite(targetHeading)) return p('HDG 설정 필요','상단 중앙 DESIRED HDG에서 마우스 휠','조종계산 대기','caution');
                if (!model || !model.assessment) return p('계산 중',`목표 HDG ${targetHeading.toFixed(0)}°`,'조종모델 대기','caution');

                const directionalSuggestion = (current, desired, tolerance) => {
                    const c = Number(current) || 0;
                    const d = Number(desired) || 0;
                    const delta = d - c;
                    if (Math.abs(delta) <= tolerance) return '유지';
                    return delta > 0 ? '우현으로' : '좌현으로';
                };
                if (feature === 'rudder-balance') {
                    const r = Number(model.current) || 0;
                    const desired = Number(model.desired) || 0;
                    const primary = directionalSuggestion(r, desired, 2.0);
                    const state = primary === '유지' ? 'safe' : 'caution';
                    return p(primary, '', '', state);
                }
                if (feature === 'rot-balance') {
                    const current = Number(model.current) || 0;
                    const desired = Number(model.desired);
                    if (!Number.isFinite(desired)) return p('계산 대기', '', '', 'caution');
                    const primary = directionalSuggestion(current, desired, 1.0);
                    const state = primary === '유지' ? 'safe' : 'caution';
                    return p(primary, '', '', state);
                }
            }
            return p('활성','','지원 기능 ON',cls);
        }

        const SUPPORT_PANEL_LAYOUT = {
            compactThreshold: 4,
            gap: 9,
            compactWidth: 258,
            transitionMs: 280
        };

        function clearSupportCardCut(card) {
            card.classList.remove('dynamic-cut');
            card.style.removeProperty('--support-mask');
            card.style.paddingLeft = '12px';
            card.style.paddingRight = '12px';
            const outline = card.querySelector('.support-curve-outline');
            if (outline) outline.removeAttribute('style');
        }

        function applySupportCardCut(card, side, x, y, width, height, circle) {
            const nearestX = Math.max(x, Math.min(circle.cx, x + width));
            const nearestY = Math.max(y, Math.min(circle.cy, y + height));
            const intersects = Math.hypot(nearestX - circle.cx, nearestY - circle.cy) < circle.r - 2;
            if (!intersects) {
                clearSupportCardCut(card);
                return;
            }

            const localCx = circle.cx - x;
            const localCy = circle.cy - y;
            const innerStop = Math.max(0, circle.r - 1.5);
            const outerStop = circle.r + 1.5;
            const mask = `radial-gradient(circle ${circle.r.toFixed(1)}px at ${localCx.toFixed(1)}px ${localCy.toFixed(1)}px, transparent 0 ${innerStop.toFixed(1)}px, #000 ${outerStop.toFixed(1)}px)`;
            card.style.setProperty('--support-mask', mask);
            card.classList.add('dynamic-cut');

            const midY = y + height / 2;
            const dy = Math.abs(midY - circle.cy);
            let cutDepth = 0;
            if (dy < circle.r) {
                const dx = Math.sqrt(Math.max(0, circle.r * circle.r - dy * dy));
                if (side === 'left') {
                    const boundaryX = circle.cx - dx;
                    cutDepth = Math.max(0, x + width - boundaryX);
                    card.style.paddingRight = `${Math.min(width * 0.44, 12 + cutDepth).toFixed(1)}px`;
                    card.style.paddingLeft = '12px';
                } else {
                    const boundaryX = circle.cx + dx;
                    cutDepth = Math.max(0, boundaryX - x);
                    card.style.paddingLeft = `${Math.min(width * 0.44, 12 + cutDepth).toFixed(1)}px`;
                    card.style.paddingRight = '12px';
                }
            }

            const outline = card.querySelector('.support-curve-outline');
            if (outline) {
                const outlineR = circle.r + 1.5;
                outline.style.width = `${(outlineR * 2).toFixed(1)}px`;
                outline.style.height = `${(outlineR * 2).toFixed(1)}px`;
                outline.style.left = `${(localCx - outlineR).toFixed(1)}px`;
                outline.style.top = `${(localCy - outlineR).toFixed(1)}px`;
            }
        }

        function placeSupportCard(card, x, y, width, height) {
            card.style.left = `${Math.round(x)}px`;
            card.style.top = `${Math.round(y)}px`;
            card.style.width = `${Math.max(96, Math.round(width))}px`;
            card.style.height = `${Math.max(88, Math.round(height))}px`;
        }

        function balancedRowsForColumn(size) {
            if (size <= 0) return [];
            if (size === 1) return [1];
            if (size === 2) return [0, 2];
            return [0, 1, 2];
        }

        function layoutSupportSide(cards, side, geometry) {
            if (!cards.length) return;
            const { width: W, height: H, circle, gap, maxCardWidth } = geometry;
            const margin = 0;
            const cols = Math.max(1, Math.ceil(cards.length / 3));
            const overlap = geometry.overlap;
            const bankLimit = side === 'left' ? circle.cx - circle.r + overlap : W - (circle.cx + circle.r - overlap);
            const bankWidth = Math.max(1, bankLimit - margin);
            const usableWidth = Math.max(1, bankWidth - gap * (cols - 1));
            let weights = cols === 3 ? [0.30, 0.30, 0.40] : cols === 2 ? [0.44, 0.56] : [1];
            let colWidths = weights.map(w => Math.max(105, Math.min(maxCardWidth, usableWidth * w)));
            const totalCols = colWidths.reduce((a,b) => a+b, 0) + gap * (cols - 1);
            if (totalCols > bankWidth) {
                const scale = Math.max(0.72, (bankWidth - gap * (cols - 1)) / Math.max(1, colWidths.reduce((a,b)=>a+b,0)));
                colWidths = colWidths.map(w => Math.max(96, w * scale));
            }
            const cellH = Math.max(118, (H - gap * 2) / 3);
            const offsets = [];
            let cursor = 0;
            colWidths.forEach((w, i) => { offsets.push(cursor); cursor += w + (i < colWidths.length - 1 ? gap : 0); });

            let index = 0;
            for (let col = 0; col < cols; col++) {
                const remain = cards.length - index;
                const inColumn = Math.min(3, remain);
                const rows = balancedRowsForColumn(inColumn);
                const cellW = colWidths[col];
                rows.forEach(row => {
                    const card = cards[index++];
                    const x = side === 'left'
                        ? margin + offsets[col]
                        : W - margin - cellW - offsets[col];
                    const y = row * (cellH + gap);
                    placeSupportCard(card, x, y, cellW, cellH);
                    card.dataset.layoutSide = side;
                    applySupportCardCut(card, side, x, y, cellW, cellH, circle);
                });
            }
        }

        function layoutAllSupportCardsByGroupRows(cards, geometry) {
            const { width: W, height: H, circle, gap, maxCardWidth } = geometry;
            const groups = ['sa', 'dm', 'act'];
            const rows = { sa: 0, dm: 1, act: 2 };
            const cellH = Math.max(88, (H - gap * 2) / 3);
            const overlap = geometry.overlap;
            const bankLimit = circle.cx - circle.r + overlap;
            const bankWidth = Math.max(1, bankLimit);
            const maxGroupSize = Math.max(0, ...groups.map(group => cards.filter(card => String(card.dataset.supportKey || '').startsWith(group + ':')).length));
            const perSide = maxGroupSize <= 4 ? 2 : 3;
            const cols = perSide;
            const usable = Math.max(1, bankWidth - gap * Math.max(0, cols - 1));
            let colWidths = (perSide === 2 ? [0.48, 0.52] : [0.30, 0.30, 0.40]).map(w => Math.max(perSide === 2 ? 116 : 96, Math.min(maxCardWidth, usable * w)));
            const sum = colWidths.reduce((a,b)=>a+b,0);
            if (sum + gap * Math.max(0, cols - 1) > bankWidth) {
                const scale = (bankWidth - gap * Math.max(0, cols - 1)) / Math.max(1, sum);
                colWidths = colWidths.map(w => Math.max(perSide === 2 ? 108 : 88, w * scale));
            }
            const offsets=[]; let cursor=0;
            colWidths.forEach((w,i)=>{ offsets.push(cursor); cursor += w + (i<cols-1?gap:0); });

            groups.forEach(group => {
                const groupCards = cards
                    .filter(card => String(card.dataset.supportKey || '').startsWith(group + ':'))
                    .sort((a,b) => Number(a.dataset.buttonIndex||0) - Number(b.dataset.buttonIndex||0));
                const row = rows[group];
                groupCards.forEach((card, i) => {
                    const side = i < perSide ? 'left' : 'right';
                    const col = i < perSide ? i : i - perSide;
                    const cellW = colWidths[Math.min(col, colWidths.length - 1)];
                    const x = side === 'left' ? offsets[Math.min(col, offsets.length - 1)] : W - cellW - offsets[Math.min(col, offsets.length - 1)];
                    const y = row * (cellH + gap);
                    placeSupportCard(card, x, y, cellW, cellH);
                    card.dataset.layoutSide = side;
                    applySupportCardCut(card, side, x, y, cellW, cellH, circle);
                });
            });
        }

        function supportSlotGeometry(slot) {
            const W = supportCardsContainer ? supportCardsContainer.clientWidth : 0;
            const H = supportCardsContainer ? supportCardsContainer.clientHeight : 0;
            const gap = 9;
            const cardW = Math.max(190, Math.min(226, W * 0.135));
            const cardH = Math.max(104, Math.min(138, (H - gap * 2) / 3));
            const side = slot % 2 === 0 ? 'left' : 'right';
            const sideIndex = Math.floor(slot / 2);
            const col = Math.floor(sideIndex / 3);
            const row = sideIndex % 3;
            const x = side === 'left'
                ? col * (cardW + gap)
                : W - cardW - col * (cardW + gap);
            const y = row * (cardH + gap);
            return { x, y, width: cardW, height: cardH, side };
        }

        function firstFreeSupportSlot(exceptCard = null) {
            const used = new Set(Array.from(supportCardsContainer.querySelectorAll('.support-feature-card'))
                .filter(c => c !== exceptCard && c.dataset.supportSlot !== undefined)
                .map(c => Number(c.dataset.supportSlot))
                .filter(Number.isFinite));
            for (let slot = 0; slot < 24; slot++) if (!used.has(slot)) return slot;
            return used.size;
        }

        function keepSupportCardInBounds(card) {
            if (!card || !supportCardsContainer) return;
            const maxLeft = Math.max(0, supportCardsContainer.clientWidth - card.offsetWidth);
            const maxTop = Math.max(0, supportCardsContainer.clientHeight - card.offsetHeight);
            const left = Math.min(maxLeft, Math.max(0, parseFloat(card.style.left) || 0));
            const top = Math.min(maxTop, Math.max(0, parseFloat(card.style.top) || 0));
            card.style.left = `${left}px`;
            card.style.top = `${top}px`;
        }

        function supportGroupGeometry(group, index) {
            const W = supportCardsContainer ? supportCardsContainer.clientWidth : 0;
            const H = supportCardsContainer ? supportCardsContainer.clientHeight : 0;
            const gap = 9;
            const cardW = Math.max(190, Math.min(226, W * 0.135));
            const cardH = Math.max(104, Math.min(138, (H - gap * 2) / 3));
            const rowY = row => Math.min(Math.max(0, H - cardH), row * (cardH + gap));
            const leftX = col => Math.min(Math.max(0, W - cardW), col * (cardW + gap));
            const rightX = col => Math.max(0, W - cardW - col * (cardW + gap));

            // Keep automatic cards visually clustered by functional group while preserving
            // the clear center of the Head-Up display. Manually moved cards are excluded.
            if (group === 'sa') {
                const slots = [
                    {x:leftX(0), y:rowY(0), side:'left'},
                    {x:leftX(0), y:rowY(1), side:'left'},
                    {x:leftX(0), y:rowY(2), side:'left'},
                    {x:leftX(1), y:rowY(0), side:'left'}
                ];
                const p = slots[index] || {x:leftX(Math.floor(index/3)), y:rowY(index%3), side:'left'};
                return {...p, width:cardW, height:cardH};
            }
            if (group === 'dm') {
                const slots = [
                    {x:rightX(0), y:rowY(0), side:'right'},
                    {x:rightX(0), y:rowY(1), side:'right'},
                    {x:rightX(1), y:rowY(0), side:'right'}
                ];
                const p = slots[index] || {x:rightX(Math.floor(index/3)), y:rowY(index%3), side:'right'};
                return {...p, width:cardW, height:cardH};
            }
            const slots = [
                {x:rightX(0), y:rowY(2), side:'right'},
                {x:rightX(1), y:rowY(2), side:'right'}
            ];
            const p = slots[index] || {x:rightX(1 + Math.floor(index/3)), y:rowY(2 - (index%3)), side:'right'};
            return {...p, width:cardW, height:cardH};
        }

        function placeNewSupportCard(card) {
            if (!card || card.dataset.placed === 'true') return;
            const key = String(card.dataset.supportKey || '');
            const group = key.split(':')[0] || 'sa';
            const siblings = Array.from(supportCardsContainer.querySelectorAll('.support-feature-card'))
                .filter(c => c !== card && c.dataset.userPlaced !== 'true' && String(c.dataset.supportKey || '').startsWith(group + ':'))
                .sort((a,b) => Number(a.dataset.buttonIndex||0) - Number(b.dataset.buttonIndex||0));
            const index = siblings.filter(c => Number(c.dataset.buttonIndex||0) < Number(card.dataset.buttonIndex||0)).length;
            const g = supportGroupGeometry(group, index);
            card.dataset.supportSlot = `${group}-${index}`;
            card.dataset.layoutSide = g.side;
            placeSupportCard(card, g.x, g.y, g.width, g.height);
            clearSupportCardCut(card);
            card.dataset.placed = 'true';
        }

        function makeSupportCardInteractive(card) {
            if (!card || card.dataset.interactive === 'true') return;
            card.dataset.interactive = 'true';
            if (typeof ResizeObserver === 'function' && !card._supportResizeObserver) {
                card._supportResizeObserver = new ResizeObserver(() => {
                    keepSupportCardInBounds(card);
                    scheduleFloatingWindowLayout();
                });
                card._supportResizeObserver.observe(card);
            }
            card.addEventListener('mousedown', (e) => {
                if (e.button !== 0 || !e.target.closest('.support-card-title, .support-card-kicker')) return;
                e.preventDefault();
                const parentRect = supportCardsContainer.getBoundingClientRect();
                const cardRect = card.getBoundingClientRect();
                const startX = e.clientX, startY = e.clientY;
                const startLeft = cardRect.left - parentRect.left;
                const startTop = cardRect.top - parentRect.top;
                card.dataset.userPlaced = 'true';
                const move = ev => {
                    card.style.left = `${startLeft + ev.clientX - startX}px`;
                    card.style.top = `${startTop + ev.clientY - startY}px`;
                    keepSupportCardInBounds(card);
                    scheduleFloatingWindowLayout();
                };
                const up = () => {
                    window.removeEventListener('mousemove', move);
                    window.removeEventListener('mouseup', up);
                };
                window.addEventListener('mousemove', move);
                window.addEventListener('mouseup', up);
            });
        }

        function supportRectFromMapRect(mapRect) {
            const sr = supportCardsContainer.getBoundingClientRect();
            const mr = container.getBoundingClientRect();
            const ox = sr.left - mr.left, oy = sr.top - mr.top;
            return { left:mapRect.left-ox, top:mapRect.top-oy, right:mapRect.right-ox, bottom:mapRect.bottom-oy };
        }

        function findFreeSupportPosition(card, group, index, occupied) {
            const W = supportCardsContainer.clientWidth, H = supportCardsContainer.clientHeight;
            const w = Math.max(card.offsetWidth, 190), h = Math.max(card.offsetHeight, 104), gap = 9;
            const preferred = [];
            preferred.push(supportGroupGeometry(group, index));
            for (let i = 0; i < 12; i++) preferred.push(supportGroupGeometry(group, i));
            const fits = (x, y) => {
                if (x < 0 || y < 0 || x + w > W || y + h > H) return false;
                const r = {left:x, top:y, right:x+w, bottom:y+h};
                return !occupied.some(o => rectsOverlap(r, o, gap));
            };
            for (const p of preferred) if (fits(p.x, p.y)) return {x:p.x, y:p.y, width:w, height:h, side:p.side || (p.x < W/2 ? 'left':'right')};

            const xOrder = group === 'sa'
                ? Array.from({length:Math.max(1,Math.ceil(W/(w+gap)))},(_,i)=>i*(w+gap))
                : Array.from({length:Math.max(1,Math.ceil(W/(w+gap)))},(_,i)=>Math.max(0,W-w-i*(w+gap)));
            for (let y = 0; y <= H-h; y += h+gap) {
                for (const x of xOrder) if (fits(x,y)) return {x,y,width:w,height:h,side:x<W/2?'left':'right'};
            }
            for (let y = 0; y <= H-h; y += Math.max(24, Math.floor(h/2))) {
                for (let x = 0; x <= W-w; x += Math.max(24, Math.floor(w/2))) {
                    if (fits(x,y)) return {x,y,width:w,height:h,side:x<W/2?'left':'right'};
                }
            }
            const fallback = supportGroupGeometry(group, index);
            return {x:fallback.x,y:fallback.y,width:w,height:h,side:fallback.side};
        }

        function layoutSupportCards(cards, skipTargetLayout = false) {
            if (!supportCardsContainer) return;

            cards.filter(card => card.dataset.userPlaced === 'true').forEach(keepSupportCardInBounds);

            const occupied = [];
            cards.filter(card => card.dataset.userPlaced === 'true').forEach(card => {
                occupied.push({left:parseFloat(card.style.left)||0, top:parseFloat(card.style.top)||0,
                    right:(parseFloat(card.style.left)||0)+card.offsetWidth, bottom:(parseFloat(card.style.top)||0)+card.offsetHeight});
            });
            panelsContainer.querySelectorAll('.target-info-panel[data-manual="true"]').forEach(panel => {
                occupied.push(supportRectFromMapRect(domRectRelativeToMap(panel)));
            });

            ['sa','dm','act'].forEach(group => {
                const autoCards = cards
                    .filter(card => card.dataset.userPlaced !== 'true' && String(card.dataset.supportKey || '').startsWith(group + ':'))
                    .sort((a,b) => Number(a.dataset.buttonIndex||0) - Number(b.dataset.buttonIndex||0));
                autoCards.forEach((card, index) => {
                    const g = findFreeSupportPosition(card, group, index, occupied);
                    card.dataset.supportSlot = `${group}-${index}`;
                    card.dataset.layoutSide = g.side;
                    placeSupportCard(card, g.x, g.y, g.width, g.height);
                    clearSupportCardCut(card);
                    card.dataset.placed = 'true';
                    occupied.push({left:g.x, top:g.y, right:g.x+card.offsetWidth, bottom:g.y+card.offsetHeight});
                });
            });

            cards.forEach(card => {
                makeSupportCardInteractive(card);
                keepSupportCardInBounds(card);
            });
            if (!skipTargetLayout) arrangeTargetPanels(true);
        }

        function updateSupportCards() {
            if (!supportCardsContainer) return;
            const buttons = Array.from(document.querySelectorAll('[data-support-group]'));
            const activeEntries = [];

            if (vObj.massEntity && activeSupportFeatures.size > 0) {
                buttons.forEach((button, buttonIndex) => {
                    const group = button.dataset.supportGroup;
                    const feature = button.dataset.supportFeature;
                    const key = `${group}:${feature}`;
                    if (!activeSupportFeatures.has(key)) return;
                    // Keep on-screen support text only for Rudder / ROT suggestions.
                    if (group !== 'act') return;
                    const model = buildSupportCardModel(group, feature);
                    if (!model) return;
                    activeEntries.push({ button, buttonIndex, group, feature, key, model });
                });
            }

            const activeKeys = new Set(activeEntries.map(e => e.key));
            Array.from(supportCardsContainer.querySelectorAll('.support-feature-card')).forEach(card => {
                if (activeKeys.has(card.dataset.supportKey)) return;
                card.remove();
            });

            const cards = [];
            activeEntries.forEach(({ button, buttonIndex, group, feature, key, model }) => {
                let card = Array.from(supportCardsContainer.children).find(el => el.dataset && el.dataset.supportKey === key);
                const isNew = !card;
                if (!card) {
                    card = document.createElement('div');
                    card.dataset.supportKey = key;
                    card.dataset.buttonIndex = String(buttonIndex);
                    card.dataset.creationOrder = String(++supportCardCreationCounter);
                    card.className = `support-feature-card ${group}`;
                    card.innerHTML = `<div class="support-card-content"></div><span class="support-curve-outline"></span>`;
                    supportCardsContainer.appendChild(card);
                }

                const content = card.querySelector('.support-card-content');
                const view = buildSupportCardPresentation(group, feature, model);
                const html = `
                    <div class="support-card-title">${(SUPPORT_FEATURE_KO[key] && SUPPORT_FEATURE_KO[key].label) || model.title}</div>
                    <div class="support-card-rule"></div>
                    <div class="support-card-primary ${view ? view.state : ''}">${view ? view.primary : ''}</div>
                `;
                if (content && content.__lastHtml !== html) {
                    content.innerHTML = html;
                    content.__lastHtml = html;
                }
                cards.push(card);
                if (isNew) placeNewSupportCard(card);
                makeSupportCardInteractive(card);
            });

            layoutSupportCards(cards);
        }

        document.querySelectorAll('[data-support-group-title]').forEach(title => {
            title.addEventListener('click', () => {
                const group = title.dataset.supportGroupTitle;
                const buttons = Array.from(document.querySelectorAll(`[data-support-group="${group}"]`));
                const allOn = buttons.length > 0 && buttons.every(button => activeSupportFeatures.has(`${group}:${button.dataset.supportFeature}`));
                const turningOn = !allOn;
                buttons.forEach(button => {
                    const key = `${group}:${button.dataset.supportFeature}`;
                    if (allOn) {
                        activeSupportFeatures.delete(key);
                        button.classList.remove('active-btn');
                    } else {
                        activeSupportFeatures.add(key);
                        button.classList.add('active-btn');
                    }
                });
                supportFocus = allOn || !buttons.length
                    ? { group: null, feature: null }
                    : { group, feature: buttons[0].dataset.supportFeature };
                syncArcNavigationReferenceLifecycle();
                if (group === 'act') {
                    if (turningOn) {
                        resetSteeringSession({ clearTarget: true, showStatus: true });
                    } else {
                        resetSteeringSession({ clearTarget: true, showStatus: false }).then(() => hideSteeringStatus());
                    }
                }
                updateMinCpaControl();
                updateActionTargetControl();
                updateInlineButtonSettings();
                recordExperimentEvent('support_group_toggle', {
                    group,
                    action: allOn ? 'OFF' : 'ON'
                });
                if (isSimulationRunning) render2D(); else updateSupportCards();
            });
        });

        document.querySelectorAll('[data-support-group]').forEach(button => {
            button.addEventListener('click', () => {
                const group = button.dataset.supportGroup;
                const feature = button.dataset.supportFeature;
                const key = `${group}:${feature}`;
                const wasActive = activeSupportFeatures.has(key);
                if (wasActive) {
                    activeSupportFeatures.delete(key);
                    button.classList.remove('active-btn');
                    if (supportFocus.group === group && supportFocus.feature === feature) supportFocus = { group: null, feature: null };
                } else {
                    activeSupportFeatures.add(key);
                    button.classList.add('active-btn');
                    supportFocus = { group, feature };
                }
                const nowActive = activeSupportFeatures.has(key);
                syncArcNavigationReferenceLifecycle();
                if (group === 'act') {
                    // User rule: turning either Rudder or ROT suggestion ON starts a clean
                    // steering session, even if another learned policy already exists.
                    if (nowActive) {
                        resetSteeringSession({ clearTarget: true, showStatus: true });
                    } else if (!isAnyActionControlActive()) {
                        resetSteeringSession({ clearTarget: true, showStatus: false }).then(() => hideSteeringStatus());
                    }
                }
                updateMinCpaControl();
                updateActionTargetControl();
                updateInlineButtonSettings();
                recordExperimentEvent('support_feature_toggle', {
                    feature_key: key,
                    action: nowActive ? 'ON' : 'OFF'
                });
                if (isSimulationRunning) render2D(); else updateSupportCards();
            });
        });

        function adjustCpaFromWheel(e, featureKey, source = 'button-wheel') {
            e.preventDefault(); e.stopPropagation();
            if (!featureKey || !Object.prototype.hasOwnProperty.call(supportUserSettings.cpaByFeature, featureKey)) return;
            const dir = e.deltaY > 0 ? 1 : -1;
            const previousCpa = Number(getDesiredCpaNM(featureKey));
            const next = clampValue(previousCpa + dir * supportUserSettings.stepNM, supportUserSettings.minAllowedNM, supportUserSettings.maxAllowedNM);
            const rounded = Math.round(next * 100) / 100;
            if (SHARED_ARC_CPA_FEATURES.has(featureKey)) {
                SHARED_ARC_CPA_FEATURES.forEach(key => { supportUserSettings.cpaByFeature[key] = rounded; });
            } else {
                supportUserSettings.cpaByFeature[featureKey] = rounded;
            }
            if (rounded !== previousCpa) recordCpaSetting(previousCpa, rounded, `${source}:${featureKey}`);
            supportFocus = { group: featureKey.split(':')[0], feature: featureKey.split(':')[1] };
            updateMinCpaControl();
            updateActionTargetControl();
            if (isSimulationRunning) render2D(); else updateSupportCards();
        }

        function adjustActionHeadingFromWheel(e, source = 'button-wheel') {
            e.preventDefault(); e.stopPropagation();
            if (!isAnyActionControlActive() || !vObj.massEntity) return;
            const resolved = resolveActionTargetHeading();
            const base = Number.isFinite(resolved.heading) ? resolved.heading : normalize360(Number(vObj.massEntity.hdg) || 0);
            const dir = e.deltaY > 0 ? 1 : -1;
            actionTargetSettings.manualHeading = normalize360(base + dir * actionTargetSettings.stepDeg);
            actionTargetSettings.manualOverride = true;
            actionTargetSettings.requestStateTimeSec = null;
            recordExperimentEvent('desired_hdg_change', {
                desired_hdg_deg: actionTargetSettings.manualHeading,
                change_source: source
            });
            // While the wheel is moving, change only the displayed target. Retrieval starts
            // once, after the wheel has stopped for ACTION_HEADING_COMMIT_DELAY_MS.
            markControlGuidanceDirty();
            updateActionTargetControl();
            if (isSimulationRunning) render2D(); else updateSupportCards();
            scheduleActionTargetCommit(source);
        }

        const futurePositionButton = document.querySelector('button[data-support-group="sa"][data-support-feature="future-position"]');
        if (futurePositionButton) {
            futurePositionButton.addEventListener('wheel', e => {
                e.preventDefault(); e.stopPropagation();
                if (!activeSupportFeatures.has('sa:future-position')) return;
                const dir = e.deltaY < 0 ? 1 : -1;
                const previous = futureProjectionSettings.intervalSec;
                futureProjectionSettings.intervalSec = Math.max(
                    futureProjectionSettings.minIntervalSec,
                    previous + dir * futureProjectionSettings.stepSec
                );
                if (futureProjectionSettings.intervalSec !== previous) {
                    recordExperimentEvent('future_interval_change', {
                        previous_interval_sec: previous,
                        future_interval_sec: futureProjectionSettings.intervalSec
                    });
                }
                updateInlineButtonSettings();
                if (isSimulationRunning) render2D(); else updateSupportCards();
            }, { passive: false });
        }

        [
            ['sa', 'threat-highlight'],
            ['dm', 'safe-heading-band'],
            ['dm', 'minimum-alteration']
        ].forEach(([group, feature]) => {
            const key = `${group}:${feature}`;
            const button = document.querySelector(`button[data-support-group="${group}"][data-support-feature="${feature}"]`);
            if (button) button.addEventListener('wheel', e => {
                if (!activeSupportFeatures.has(key)) return;
                adjustCpaFromWheel(e, key, 'button-wheel');
            }, { passive: false });
        });

        ['rudder-balance','rot-balance'].forEach(feature => {
            const button = document.querySelector(`button[data-support-group="act"][data-support-feature="${feature}"]`);
            if (button) button.addEventListener('wheel', e => {
                if (!activeSupportFeatures.has(`act:${feature}`)) return;
                adjustActionHeadingFromWheel(e, `act:${feature}`);
            }, { passive: false });
        });

        if (minCpaControl) {
            minCpaControl.addEventListener('wheel', (e) => {
                const featureKey = getFocusedCpaFeatureKey();
                if (!featureKey || !activeSupportFeatures.has(featureKey)) return;
                adjustCpaFromWheel(e, featureKey, 'hud-wheel');
            }, { passive: false });
        }

        if (actionTargetControl) {
            actionTargetControl.addEventListener('wheel', (e) => {
                adjustActionHeadingFromWheel(e, 'hud-wheel');
            }, { passive: false });
        }
        if (arcPlanAdjustmentButton) {
            arcPlanAdjustmentButton.addEventListener('wheel', adjustArcPlanAdjustmentFromWheel, { passive: false });
        }

        updateArcWeightControls();
        updateMinCpaControl();
        updateActionTargetControl();
        updateInlineButtonSettings();

        // ==========================================
        // 4. HTMS 오리지널 렌더링 함수
        // ==========================================
        function drawShipHullLocal(ctx, panX, panY, viewScale, x, z, heading, color, isOwnShip, label) {
            const cx = panX + x * viewScale; 
            const cy = panY + z * viewScale;
            
            ctx.save(); 
            ctx.translate(cx, cy); 
            ctx.rotate(heading * DEG2RAD); 
            ctx.scale(viewScale, viewScale); 
            
            ctx.fillStyle = color;
            
            const halfLen = SHIP_LEN_UNIT / 2; 
            const halfWid = SHIP_WID_UNIT / 2; 
            
            ctx.beginPath(); 
            ctx.moveTo(0, -halfLen); 
            ctx.lineTo(halfWid, -halfLen + 12); 
            ctx.lineTo(halfWid, halfLen); 
            ctx.lineTo(-halfWid, halfLen); 
            ctx.lineTo(-halfWid, -halfLen + 12); 
            ctx.closePath(); 
            ctx.fill();
            
            ctx.lineWidth = 1 / viewScale; 
            ctx.strokeStyle = '#ffffff'; 
            ctx.stroke(); 
            ctx.restore();
            
            if (label) { 
                ctx.fillStyle = color; 
                ctx.font = '700 12px Segoe UI'; 
                ctx.textAlign = 'center'; 
                ctx.fillText(label, cx, cy + Math.max(25, (SHIP_LEN_UNIT / 2) * viewScale + 15)); 
            }
        }
        
        function drawVectorArrowLocal(ctx, panX, panY, viewScale, x, z, heading, distUnit, color) {
            if (distUnit <= 0) return;
            const cx = panX + x * viewScale; 
            const cy = panY + z * viewScale; 
            const rad = (heading - 90) * DEG2RAD;
            
            const wpX = cx + Math.cos(rad) * (distUnit * viewScale); 
            const wpY = cy + Math.sin(rad) * (distUnit * viewScale);
            
            ctx.strokeStyle = color; 
            ctx.lineWidth = 1.5; 
            ctx.setLineDash([4, 4]);
            ctx.beginPath(); 
            ctx.moveTo(cx, cy); 
            ctx.lineTo(wpX, wpY); 
            ctx.stroke(); 
            ctx.setLineDash([]);
            
            ctx.save(); 
            ctx.translate(wpX, wpY); 
            ctx.rotate(heading * DEG2RAD);
            ctx.fillStyle = color; 
            ctx.beginPath(); 
            ctx.moveTo(0, -6); /* 오타 복구 완료된 부분 */
            ctx.lineTo(6, 6); 
            ctx.lineTo(-6, 6); 
            ctx.closePath(); 
            ctx.fill(); 
            ctx.restore();
        }

        function chooseScaleBarNM() {
            const pxPerNM = 400 * vObj.viewScale;
            const candidates = [0.1, 0.2, 0.5, 1, 2, 5, 10];
            let best = candidates[0];
            candidates.forEach(v => {
                const px = v * pxPerNM;
                if (px >= 70 && px <= 180) best = v;
            });
            if (best * pxPerNM < 55) best = candidates.find(v => v * pxPerNM >= 55) || best;
            return best;
        }

        function drawBottomScale(ctx) {
            const scaleNM = chooseScaleBarNM();
            const len = scaleNM * 400 * vObj.viewScale;
            const x = 18;
            const y = canvas.height - 18;
            ctx.save();
            ctx.strokeStyle = '#cbd5e1';
            ctx.fillStyle = '#cbd5e1';
            ctx.lineWidth = 1.4;
            ctx.beginPath();
            ctx.moveTo(x, y); ctx.lineTo(x + len, y);
            ctx.moveTo(x, y - 5); ctx.lineTo(x, y + 5);
            ctx.moveTo(x + len, y - 5); ctx.lineTo(x + len, y + 5);
            ctx.stroke();
            ctx.font = '600 11px Segoe UI';
            ctx.textAlign = 'left';
            ctx.fillText(`${scaleNM < 1 ? scaleNM.toFixed(1) : scaleNM.toFixed(0)} NM`, x, y - 8);
            ctx.restore();
        }

        function drawDistanceRings(ctx) {
            const maxRadiusPx = Math.max(
                Math.hypot(vObj.panX, vObj.panY),
                Math.hypot(canvas.width - vObj.panX, vObj.panY),
                Math.hypot(vObj.panX, canvas.height - vObj.panY),
                Math.hypot(canvas.width - vObj.panX, canvas.height - vObj.panY)
            );
            const pxPerNM = 400 * vObj.viewScale;
            const maxNM = Math.ceil(maxRadiusPx / Math.max(1e-6, pxPerNM));
            ctx.save();
            ctx.setLineDash([4, 6]);
            for (let nm = 1; nm <= maxNM; nm++) {
                const radiusPx = nm * pxPerNM;
                ctx.strokeStyle = nm % 5 === 0 ? 'rgba(100,116,139,0.38)' : 'rgba(100,116,139,0.18)';
                ctx.lineWidth = nm % 5 === 0 ? 1.2 : 0.75;
                ctx.beginPath(); ctx.arc(vObj.panX, vObj.panY, radiusPx, 0, Math.PI * 2); ctx.stroke();
                const labelY = vObj.panY + radiusPx;
                if (labelY >= canvas.height * 0.70 && labelY <= canvas.height - 32 && (nm <= 5 || nm % 2 === 0)) {
                    ctx.setLineDash([]);
                    ctx.fillStyle = '#7f8b9d';
                    ctx.font = '600 10px Segoe UI';
                    ctx.textAlign = 'left';
                    ctx.fillText(`${nm} NM`, vObj.panX + 6, labelY - 4);
                    ctx.setLineDash([4, 6]);
                }
            }
            ctx.restore();
        }

        function renderScenarioPlannedRoute(ctx) {
            const os = vObj.massEntity;
            const pts = getScenarioRouteRelativePoints(os);
            if (!os || pts.length < 2) return;
            ctx.save();
            ctx.strokeStyle = '#00ffff';
            ctx.lineWidth = 1.8;
            ctx.setLineDash([]);
            ctx.beginPath();
            pts.forEach((pt, index) => {
                const p = relativeMetersToCanvas(pt.east, pt.north);
                if (index === 0) ctx.moveTo(p.x, p.y); else ctx.lineTo(p.x, p.y);
            });
            ctx.stroke();
            pts.forEach((pt, index) => {
                const p = relativeMetersToCanvas(pt.east, pt.north);
                const active = (typeof onlineCurrentWaypointIndex !== 'undefined' && index === onlineCurrentWaypointIndex);
                ctx.beginPath();
                ctx.fillStyle = active ? '#00ffff' : 'rgba(0,255,255,0.55)';
                ctx.arc(p.x, p.y, active ? 5 : 3, 0, Math.PI * 2);
                ctx.fill();
                if (active) {
                    ctx.strokeStyle = '#00ffff';
                    ctx.lineWidth = 1.4;
                    ctx.beginPath();
                    ctx.arc(p.x, p.y, 9, 0, Math.PI * 2);
                    ctx.stroke();
                }
            });
            ctx.restore();
        }

        function isDangerTarget(ship) {
            if (!vObj.massEntity || !ship || ship.isMASS) return false;
            const m = evaluateRelativeMotion(vObj.massEntity, ship);
            return isThreatHighlightDangerMotion(m, getDesiredCpaNM('sa:threat-highlight'));
        }

        function render2D() {
            if (!vObj.massEntity || !isSimulationRunning) {
                updateOwnShipHud();
                updateOddOeLight(null);
                return;
            }
            updateOwnShipHud();
            const oddOeState = getOddOeState();
            updateOddOeLight(oddOeState);
            frameLabelBoxes = [];

            vObj.panX = canvas.width / 2 + vObj.panOffsetX;
            vObj.panY = canvas.height / 2 + vObj.panOffsetY;

            const ctx = canvas.getContext('2d');
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            ctx.strokeStyle = 'rgba(100,116,139,0.28)';
            ctx.lineWidth = 1;
            ctx.beginPath();
            ctx.moveTo(0, vObj.panY); ctx.lineTo(canvas.width, vObj.panY);
            ctx.moveTo(vObj.panX, 0); ctx.lineTo(vObj.panX, canvas.height);
            ctx.stroke();

            drawDistanceRings(ctx);
            renderScenarioPlannedRoute(ctx);
            renderSupportOverlay(ctx);

            simEntities.forEach((s) => {
                const isOwnShip = (s === vObj.massEntity);
                const offset = isOwnShip ? { x: 0, z: 0 } : shipDisplayOffsetUnits(s);
                const oddOeTriggered = !isOwnShip && oddOeState && oddOeState.triggerIds.has(String(s.id));
                const color = isOwnShip ? '#cbd5e1' : (oddOeTriggered ? oddOeState.color : '#f8fafc');
