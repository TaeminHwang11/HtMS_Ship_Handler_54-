                const hdgDisplay = isOwnShip ? 0 : displayRelativeHeading(s.hdg);
                const cogDisplay = isOwnShip ? displayRelativeHeading(s.cog) : displayRelativeHeading(s.cog);

                ctx.save();
                ctx.globalAlpha = 1;
                drawVectorArrowLocal(ctx, vObj.panX, vObj.panY, vObj.viewScale, offset.x, offset.z, cogDisplay, s.sog * VECTOR_SCALE, '#94a3b8');
                drawShipHullLocal(ctx, vObj.panX, vObj.panY, vObj.viewScale, offset.x, offset.z, hdgDisplay, color, isOwnShip, isOwnShip ? 'OS' : s.name);
                ctx.restore();

        function getFuzzyVal(obj, possibleKeys, defaultVal) {
            for (let k of possibleKeys) {
                if (obj[k] !== undefined && obj[k] !== null) return parseFloat(obj[k]);
            }
            return defaultVal;
        }

        function getRudderDeg(obj, defaultVal = 0) {
            const keys = ['P-Rudder(deg)', 'Rudder(deg)', 'Rudder', 'P-Rudder'];
            for (const k of keys) {
                if (obj[k] !== undefined && obj[k] !== null && obj[k] !== '') {
                    const v = parseFloat(obj[k]);
                    if (Number.isFinite(v)) return -v; // same sign convention as steering_base (STBD +)
                }
            }
            return defaultVal;
        }

        function getRotDegPerMin(obj, defaultVal = 0) {
            // Legacy simulator channel ROT(deg/min) is delivered in radians/minute;
            // this matches the original MATLAB use of rad2deg(ROT(deg/min)).
            const radPerMinKeys = ['ROT(deg/min)', 'ROT(rad/min)'];
            for (const k of radPerMinKeys) {
                if (obj[k] !== undefined && obj[k] !== null && obj[k] !== '') {
                    const v = parseFloat(obj[k]);
                    if (Number.isFinite(v)) return v * (180.0 / Math.PI);
                }
            }
            const degPerMinKeys = ['RateOfTurn', 'ROT_deg_min', 'ROT(deg_per_min)'];
            for (const k of degPerMinKeys) {
                if (obj[k] !== undefined && obj[k] !== null && obj[k] !== '') {
                    const v = parseFloat(obj[k]);
                    if (Number.isFinite(v)) return v;
                }
            }
            const radPerSecKeys = ['ROT(rad/sec)', 'r(rad/sec)'];
            for (const k of radPerSecKeys) {
                if (obj[k] !== undefined && obj[k] !== null && obj[k] !== '') {
                    const v = parseFloat(obj[k]);
                    if (Number.isFinite(v)) return v * (180.0 / Math.PI) * 60.0;
                }
            }
            const degPerSecKeys = ['r(deg/sec)', 'ROT(deg/sec)', 'ROT_deg_sec'];
            for (const k of degPerSecKeys) {
                if (obj[k] !== undefined && obj[k] !== null && obj[k] !== '') {
                    const v = parseFloat(obj[k]);
                    if (Number.isFinite(v)) return v * 60.0;
                }
            }
            return defaultVal;
        }

        function validateInputEntity(entity, source, kind) {
            const issues = [];
            if (!Number.isFinite(entity.hdg) || entity.hdg < -360 || entity.hdg > 720) issues.push(`HDG=${entity.hdg}`);
            if (!Number.isFinite(entity.cog) || entity.cog < -360 || entity.cog > 720) issues.push(`COG=${entity.cog}`);
            if (!Number.isFinite(entity.rot) || Math.abs(entity.rot) > 180) issues.push(`ROT=${entity.rot}`);
            if (!Number.isFinite(entity.sog) || entity.sog < 0 || entity.sog > 25) issues.push(`SOG=${entity.sog}`);
            if (issues.length) console.warn(`[INPUT CHECK] ${kind} ${entity.name || entity.id}: ${issues.join(', ')}`, source);
        }

        function getSpeedKnots(obj, knotKeys, mpsKeys, defaultVal = 0) {
            for (const k of knotKeys) {
                if (obj[k] !== undefined && obj[k] !== null && obj[k] !== '') {
                    const v = parseFloat(obj[k]);
                    if (Number.isFinite(v)) return v;
                }
            }
            for (const k of mpsKeys) {
                if (obj[k] !== undefined && obj[k] !== null && obj[k] !== '') {
                    const v = parseFloat(obj[k]);
                    if (Number.isFinite(v)) return v * 1.9438444924406;
                }
            }
            return defaultVal;
        }

        function fetchControlGuidance(options = {}) {
            const forceRefresh = options.forceRefresh === true;
            if (!vObj.massEntity || !isAnyActionControlActive()) {
                latestControlGuidance = null;
                controlPolicyReady = false;
                controlPolicyTargetHeading = null;
                updateActionTargetControl();
                return;
            }

            const resolved = resolveActionTargetHeading();
            const targetHeading = resolved.heading;
            updateActionTargetControl();
            if (!Number.isFinite(targetHeading)) {
                latestControlGuidance = null;
                controlPolicyReady = false;
                controlPolicyTargetHeading = null;
                return;
            }

            const os = vObj.massEntity;
            const normalizedTarget = normalize360(Number(targetHeading));
            const nowSec = Number(currentSimulatorTimeSec());
            const error = signedAngleDiff(normalizedTarget, Number(os.hdg) || 0);

            if (forceRefresh || browserPidState.targetHeading === null || Math.abs(signedAngleDiff(normalizedTarget, browserPidState.targetHeading)) > 0.1) {
                browserPidState.integral = 0;
                browserPidState.prevError = error;
                browserPidState.prevTimeSec = Number.isFinite(nowSec) ? nowSec : null;
                browserPidState.targetHeading = normalizedTarget;
            }

            let dt = 1.0;
            if (Number.isFinite(nowSec) && Number.isFinite(browserPidState.prevTimeSec)) {
                const candidate = nowSec - browserPidState.prevTimeSec;
                if (candidate >= 0.05 && candidate <= 10.0) dt = candidate;
            }
            const currentRudder = Number(os.rudder) || 0;
            const currentRot = Number(os.rot) || 0;
            const errorD = (error - browserPidState.prevError) / Math.max(0.1, dt);

            // Browser-only PID support cue.  Use a two-stage response for emergency manoeuvring:
            // turn more decisively while the heading error is large, then brake earlier and harder
            // as the accumulated ROT can carry the ship through the target heading.
            const FAR_ERROR_DEG = 12.0;
            const farFromTarget = Math.abs(error) > FAR_ERROR_DEG;
            const KP = farFromTarget ? 0.90 : 0.68;
            const KI = 0.0015;
            const KD = farFromTarget ? 0.22 : 0.48;
            const ROT_DAMPING = farFromTarget ? 0.25 : 0.62;
            const T_NOM_SEC = 25.0;
            const residualTurnDeg = currentRot * T_NOM_SEC / 60.0;
            const predictedErrorAfterCoast = error - residualTurnDeg;
            const movingTowardTarget = error * currentRot > 0;
            const brakingZone = Math.abs(error) <= Math.abs(residualTurnDeg) * 1.35 + 2.5;
            const predictedOvershoot = movingTowardTarget && (error * predictedErrorAfterCoast <= 0 || brakingZone);

            if (predictedOvershoot) {
                browserPidState.integral *= 0.25;
            } else if (Math.abs(error) < 8) {
                browserPidState.integral *= 0.88;
                browserPidState.integral = clampValue(browserPidState.integral + error * dt, -180, 180);
            } else {
                browserPidState.integral = clampValue(browserPidState.integral + error * dt, -300, 300);
            }

            let pidRudder = KP * error + KI * browserPidState.integral + KD * errorD - ROT_DAMPING * currentRot;
            if (predictedOvershoot && Math.abs(currentRot) > 0.6) {
                const overshootDeg = Math.max(0, Math.abs(residualTurnDeg) - Math.abs(error));
                const counterRudder = clampValue(8.0 + 0.60 * Math.abs(currentRot) + 1.5 * overshootDeg, 8.0, 25.0);
                pidRudder = -Math.sign(currentRot) * counterRudder;
            }
            pidRudder = clampValue(pidRudder, -35, 35);

            // Same Nomoto-like equilibrium used by the online radar ship model: targetRot = K_nom * Rudder, K_nom=2.0.
            const pidIntendedRot = 2.0 * pidRudder;
            const rudderDelta = pidRudder - currentRudder;
            const rotDelta = pidIntendedRot - currentRot;
            const rudderAssessment = Math.abs(rudderDelta) <= 2.0 ? 'GOOD' : (Math.abs(pidRudder) > Math.abs(currentRudder) ? 'INCREASE' : 'REDUCE');
            const rotAssessment = Math.abs(rotDelta) <= 1.0 ? 'GOOD' : (Math.abs(pidIntendedRot) > Math.abs(currentRot) ? 'INCREASE' : 'REDUCE');

            browserPidState.prevError = error;
            browserPidState.prevTimeSec = Number.isFinite(nowSec) ? nowSec : browserPidState.prevTimeSec;
            browserPidState.targetHeading = normalizedTarget;

            latestControlGuidance = {
                available: true,
                source: 'browser-fixed-pid-radar-dynamics',
                session_id: steeringSessionId,
                target_heading: normalizedTarget,
                heading_error: error,
                current_heading: Number(os.hdg) || 0,
                current_rot: currentRot,
                current_rudder: currentRudder,
                pid_target_rudder: pidRudder,
                pid_intended_rot: pidIntendedRot,
                rudder_assessment: rudderAssessment,
                rot_assessment: rotAssessment,
                kp: KP, ki: KI, kd: KD
            };
            controlGuidanceDirty = false;
            controlPolicyReady = true;
            controlPolicyTargetHeading = normalizedTarget;
            actionTargetSettings.requestStateTimeSec = null;
            if (forceRefresh) showSteeringStatus('PID 조타지원 준비', 'success', 1200);
            if (isSimulationRunning) render2D();
        }

        function updateOnlinePhysics(simDtHours, realDt) {
            // Exact radar-simulator own-ship response model.
            const rDiff = onlineOs.targetRudder - onlineOs.actualRudder;
            const rStep = 2.5 * realDt;
            if (Math.abs(rDiff) <= rStep) onlineOs.actualRudder = onlineOs.targetRudder;
            else onlineOs.actualRudder += Math.sign(rDiff) * rStep;

            const K_nom = 2.0;
            const T_nom = 25.0;
            const targetRot = K_nom * onlineOs.actualRudder;
            const rotDerivative = (targetRot - onlineOs.rot) / T_nom;
            onlineOs.rot += rotDerivative * realDt;
            onlineOs.hdg += (onlineOs.rot / 60.0) * realDt;
            if (onlineOs.hdg >= 360) onlineOs.hdg -= 360;
            if (onlineOs.hdg < 0) onlineOs.hdg += 360;

            const osHdgRad = onlineOs.hdg * Math.PI / 180;
            const speedLossFactor = 0.008;
            const targetSpeed = onlineOs.cmdSpd * (1.0 - speedLossFactor * Math.abs(onlineOs.rot));
            const T_surge = 15.0;
            onlineOs.spd += (targetSpeed - onlineOs.spd) * (realDt / T_surge);

            let moveX = onlineOs.spd * Math.sin(osHdgRad) * simDtHours;
            let moveY = onlineOs.spd * Math.cos(osHdgRad) * simDtHours;

            if (onlineEnv.currentSpd > 0) {
                const currentRad = onlineEnv.currentDir * Math.PI / 180;
                moveX += onlineEnv.currentSpd * Math.sin(currentRad) * simDtHours;
                moveY += onlineEnv.currentSpd * Math.cos(currentRad) * simDtHours;
            }
            if (onlineEnv.windSpd > 0) {
                const windDriftSpeed = (onlineEnv.windSpd * onlineEnv.windSpd) * 0.005 * Math.sin(((onlineEnv.windDir - onlineOs.hdg + 360) % 360) * Math.PI / 180);
                moveX += windDriftSpeed * Math.cos(osHdgRad) * simDtHours;
                moveY -= windDriftSpeed * Math.sin(osHdgRad) * simDtHours;
            }

            const actualVx = moveX / Math.max(1e-12, simDtHours);
            const actualVy = moveY / Math.max(1e-12, simDtHours);
            onlineOs.sog = Math.sqrt(actualVx * actualVx + actualVy * actualVy);
            onlineOs.cog = (Math.atan2(actualVx, actualVy) * 180 / Math.PI + 360) % 360;
            onlineOs.x += moveX;
            onlineOs.y += moveY;
            onlineOs.lat += moveY / 60;
            onlineOs.lon += moveX / (60 * Math.cos(onlineOs.lat * Math.PI / 180));
            onlineOs.latMove = actualVx * Math.cos(osHdgRad) - actualVy * Math.sin(osHdgRad);

            onlineTargets.forEach(t => {
                // Follow each target's own saved route; preserve straight-line motion
                // for targets without waypoints and after the final waypoint.
                const route = t.waypoints || [];
                let targetWp = t.waypointIndex < route.length ? route[t.waypointIndex] : null;
                if (targetWp) {
                    const legStart = t.waypointIndex === 0
                        ? { x: t.routeStartX, y: t.routeStartY }
                        : route[t.waypointIndex - 1];
                    const distToWp = Math.hypot(targetWp.x - t.x, targetWp.y - t.y);
                    const legDx = targetWp.x - legStart.x;
                    const legDy = targetWp.y - legStart.y;
                    const passedWp = legDx * legDx + legDy * legDy > 1e-9 &&
                        (t.x - targetWp.x) * legDx + (t.y - targetWp.y) * legDy >= 0;
                    if (distToWp < 0.3 || passedWp) {
                        t.waypointIndex++;
                        targetWp = t.waypointIndex < route.length ? route[t.waypointIndex] : null;
                    }
                }
                const previousHdg = t.hdg;
                if (targetWp) {
                    const desiredHdg = (Math.atan2(targetWp.x - t.x, targetWp.y - t.y) * 180 / Math.PI + 360) % 360;
                    const error = ((desiredHdg - t.hdg + 540) % 360) - 180;
                    // Limited, continuous turn; no instantaneous heading jumps.
                    const maxTurnDeg = 12.0 * realDt / 60;
                    const turnDeg = Math.max(-maxTurnDeg, Math.min(maxTurnDeg, error));
                    t.hdg = (t.hdg + turnDeg + 360) % 360;
                }
                t.rot = (((t.hdg - previousHdg + 540) % 360) - 180) * 60 / Math.max(1e-9, realDt);
                const r = t.hdg * Math.PI / 180;
                t.x += t.spd * simDtHours * Math.sin(r);
                t.y += t.spd * simDtHours * Math.cos(r);
            });

            onlineSimTimeSeconds += simDtHours * 3600;

            // Same waypoint arrival threshold as the radar simulator.
            if (onlineCurrentWaypointIndex < onlineRouteWorld.length) {
                const wp = onlineRouteWorld[onlineCurrentWaypointIndex];
                const distNM = Math.hypot(wp.x - onlineOs.x, wp.y - onlineOs.y);
                if (distNM < 0.3) {
                    onlineCurrentWaypointIndex += 1;
                    recordExperimentEvent('waypoint_pass', { waypoint_index: onlineCurrentWaypointIndex - 1, waypoint_name: wp.name });
                    if (onlineCurrentWaypointIndex >= onlineRouteWorld.length) finishOnlineSimulationAndSendData();
                }
            }

            if (onlineSimTimeSeconds - onlineLastLogTimeSec >= 1.0) {
                onlineLastLogTimeSec = onlineSimTimeSeconds;
                syncOnlineEntities();
                appendOnlineLog(onlineSimTimeSeconds.toFixed(1));
                if (experimentRecorder.recording && experimentRecorder.session) captureExperimentSnapshot(lastApiPayload, 'live_tick');
            }
        }

        function onlineGameLoop(currentTime) {
            if (!onlineRunning || onlineFinished) return;
            let dt = (currentTime - onlineLastFrameTime) / 1000;
            if (!Number.isFinite(dt) || dt < 0) dt = 0;
            onlineLastFrameTime = currentTime;

            if (!onlinePaused && dt > 0) {
                // Never discard elapsed real time. If a slow PC or an ARC calculation makes
                // one frame late, integrate that whole elapsed interval in <=0.1 s pieces.
                // Normal high-FPS machines keep their original small frame dt, while low-FPS
                // machines no longer run the vessel in artificial slow motion.
                let remainingSec = dt * onlineTimeMultiplier;
                while (remainingSec > 1e-9 && onlineRunning && !onlineFinished) {
                    const stepSec = Math.min(ONLINE_MAX_PHYSICS_STEP_SEC, remainingSec);
                    updateOnlinePhysics(stepSec / 3600, stepSec);
                    remainingSec -= stepSec;
                }
            }

            // Support display remains 5 Hz; recommended ARC itself is cached at 1 Hz.
            if (currentTime - onlineLastUiTime >= 200) {
                onlineLastUiTime = currentTime;
                syncOnlineEntities();
                if (isAnyActionControlActive() && controlPolicyReady) fetchControlGuidance({ forceRefresh: false, liveUpdate: true });
                render2D();
                updateAllTargetPanels();
            }
            requestAnimationFrame(onlineGameLoop);
        }

        function finalizeOnlineSupportRecord() {
            if (!experimentRecorder.recording || !experimentRecorder.session) return experimentRecorder.lastCompleted || null;
            recordExperimentEvent('record_stop', { mode: 'automatic_online_P' });
            experimentRecorder.session.ended_at = nowIsoLocal();
            const payload = { ...experimentRecorder.session };
            delete payload.started_performance_ms;
            experimentRecorder.recording = false;
            experimentRecorder.lastCompleted = payload;
            experimentRecorder.session = null;
            return payload;
        }

        function finishOnlineSimulationAndSendData() {
            if (onlineFinished) return;
            onlineFinished = true;
            onlineRunning = false;
            onlinePaused = false;
            if (onlinePauseBtn) onlinePauseBtn.classList.remove('visible', 'paused');
            syncOnlineEntities();
            appendOnlineLog(onlineSimTimeSeconds.toFixed(1));
            const supportData = finalizeOnlineSupportRecord();

            const overlay = document.getElementById('online-finish-overlay');
            const finishTitle = document.getElementById('online-finish-title');
            const finishDesc = document.getElementById('online-finish-desc');
            overlay.style.display = 'flex';

            const now = new Date();
            const p = n => String(n).padStart(2, '0');
            const dateStr = `${now.getFullYear()}${p(now.getMonth()+1)}${p(now.getDate())}_${p(now.getHours())}${p(now.getMinutes())}${p(now.getSeconds())}`;
            const customFileName = `${onlineLoadedScenarioName}_P_${dateStr}_${onlineStudentInfo.id}_${onlineStudentInfo.name}.json`;
            const payload = {
                studentId: onlineStudentInfo.id,
                studentName: onlineStudentInfo.name,
                fileName: customFileName,
                logData: onlineLogData,
                supportData: supportData
            };
            let sendAttempt = 0;

            async function sendUntilSuccess() {
                sendAttempt += 1;
                if (sendAttempt === 1) {
                    finishTitle.textContent = '데이터 전송 중...';
                    finishTitle.style.color = '#34d399';
                    finishDesc.textContent = 'Navigation Supporter 실험 결과를 Google Drive에 저장하고 있습니다.';
                } else {
                    finishTitle.textContent = '데이터 재전송 중...';
                    finishTitle.style.color = '#fde047';
                    finishDesc.textContent = `네트워크 연결을 확인하며 자동 재전송 중입니다. (${sendAttempt}회째)`;
                }
                const controller = new AbortController();
                const timeoutId = setTimeout(() => controller.abort(), 30000);
                try {
                    const res = await fetch(GOOGLE_SCRIPT_URL, {
                        method: 'POST',
                        headers: { 'Content-Type': 'text/plain' },
                        body: JSON.stringify(payload),
                        signal: controller.signal
                    });
                    if (!res.ok) throw new Error(`HTTP ${res.status}`);
                    await res.json();
                    clearTimeout(timeoutId);
                    finishTitle.textContent = '데이터 전송 성공!';
                    finishTitle.style.color = '#34d399';
                    finishDesc.textContent = 'Navigation Supporter 실험 결과가 안전하게 저장되었습니다.';
                } catch (err) {
                    clearTimeout(timeoutId);
                    console.error(`데이터 전송 실패 (${sendAttempt}회째):`, err);
                    finishTitle.textContent = '전송 대기 중...';
                    finishTitle.style.color = '#fb7185';
                    finishDesc.textContent = `전송에 실패했습니다. 3초 후 자동으로 다시 시도합니다. (${sendAttempt}회 시도)`;
                    setTimeout(sendUntilSuccess, 3000);
                }
            }
            sendUntilSuccess();
        }

        window.addEventListener('keydown', e => {
            if (!onlineRunning || onlineFinished) return;
            if (e.code === 'ArrowLeft' && !e.repeat) {
                onlineOs.targetRudder = Math.max(-35, onlineOs.targetRudder - 5);
                onlineOs.targetRudder = Math.round(onlineOs.targetRudder / 5) * 5;
                recordExperimentEvent('rudder_key', { key: 'ArrowLeft', target_rudder_deg: onlineOs.targetRudder });
                e.preventDefault();
            }
            if (e.code === 'ArrowRight' && !e.repeat) {
                onlineOs.targetRudder = Math.min(35, onlineOs.targetRudder + 5);
                onlineOs.targetRudder = Math.round(onlineOs.targetRudder / 5) * 5;
                recordExperimentEvent('rudder_key', { key: 'ArrowRight', target_rudder_deg: onlineOs.targetRudder });
                e.preventDefault();
            }
            if (e.code === 'Space') {
                onlineOs.targetRudder = 0;
                recordExperimentEvent('rudder_key', { key: 'Space', target_rudder_deg: 0 });
                e.preventDefault();
            }
        });

        function showErrorOnCanvas(msg) {
            if (osFixedHud) osFixedHud.classList.remove('visible');
            const ctx = canvas.getContext('2d');
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            drawPlaceholderGrid();
            ctx.fillStyle = '#f43f5e';
            ctx.font = 'bold 16px Segoe UI';
            ctx.textAlign = 'center';
            ctx.fillText("오류 발생 (F12 콘솔 창을 확인하세요):", canvas.width / 2, canvas.height / 2 - 20);
            ctx.fillText(msg, canvas.width / 2, canvas.height / 2 + 10);
        }

        window.addEventListener('DOMContentLoaded', () => {
            fetchOnlineScenarioList();
        });
    </script>
</body>
