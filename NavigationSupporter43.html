            if (floatingLayoutScheduled) return;
            floatingLayoutScheduled = true;
            requestAnimationFrame(() => {
                floatingLayoutScheduled = false;
                if (floatingLayoutBusy) return;
                floatingLayoutBusy = true;
                try {
                    const cards = supportCardsContainer ? Array.from(supportCardsContainer.querySelectorAll('.support-feature-card')) : [];
                    layoutSupportCards(cards, true);
                    arrangeTargetPanels(true);
                } finally {
                    floatingLayoutBusy = false;
                }
            });
        }

        function arrangeTargetPanels(fromCombinedLayout = false) {
            panelsContainer.querySelectorAll('.target-info-panel[data-manual="true"]').forEach(keepTargetPanelInMap);

            const panels = Array.from(targetAutoContent.children).filter(el => el.classList && el.classList.contains('target-info-panel'));
            if (!panels.length) {
                targetAutoArea.style.display = 'none';
                return;
            }
            targetAutoArea.style.display = 'block';

            const occupied = [];
            if (supportCardsContainer) {
                Array.from(supportCardsContainer.querySelectorAll('.support-feature-card')).forEach(card => occupied.push(domRectRelativeToMap(card)));
            }
            panelsContainer.querySelectorAll('.target-info-panel[data-manual="true"]').forEach(panel => occupied.push(domRectRelativeToMap(panel)));

            panels.forEach((panel, index) => {
                const w = panel.offsetWidth, h = panel.offsetHeight;
                const preferred = [
                    { x: container.clientWidth - targetPanelMargin - w, y: targetPanelMargin + index * (h + targetPanelGap) },
                    { x: targetPanelMargin, y: targetPanelMargin + index * (h + targetPanelGap) }
                ];
                const pos = findFreeMapPosition(w, h, occupied, preferred);
                panel.style.left = `${Math.round(pos.x)}px`;
                panel.style.top = `${Math.round(pos.y)}px`;
                occupied.push({ left:pos.x, top:pos.y, right:pos.x+w, bottom:pos.y+h });
            });

            if (!fromCombinedLayout && !floatingLayoutBusy) scheduleFloatingWindowLayout();
        }

        // 폰트 로딩/창 크기/패널 높이 변화에도 실제 크기로 재배치한다.
        const targetPanelResizeObserver = typeof ResizeObserver === 'function'
            ? new ResizeObserver(scheduleFloatingWindowLayout) : null;
        if (targetPanelResizeObserver) targetPanelResizeObserver.observe(container);
        window.addEventListener('resize', scheduleFloatingWindowLayout);
        if (document.fonts && document.fonts.ready) {
            document.fonts.ready.then(scheduleFloatingWindowLayout);
        }

        function createTargetPanel(id, name) {
            if (document.getElementById(`panel-${id}`)) return;
            const panel = document.createElement('div');
            panel.className = 'target-info-panel';
            panel.id = `panel-${id}`;
            panel.dataset.manual = 'false';
            // 항목/순서/클래스/기존 CSS 크기는 원본과 동일하게 유지.
            panel.innerHTML = `
                <div class="tgt-header">
                    <span class="tgt-title"></span>
                    <button class="tgt-close-btn" type="button">✖</button>
                </div>
                <div class="tgt-row"><span>HDG:</span> <span class="tgt-val">-</span></div>
                <div class="tgt-row"><span>COG:</span> <span class="tgt-val">-</span></div>
                <div class="tgt-row"><span>SOG:</span> <span class="tgt-val">-</span></div>
                <div class="tgt-row"><span>ROT:</span> <span class="tgt-val">-</span></div>
                <div class="tgt-row"><span>DIST:</span> <span class="tgt-val">-</span></div>
                <div class="tgt-row"><span>BRG:</span> <span class="tgt-val">-</span></div>
                <div class="tgt-row"><span>CPA:</span> <span class="tgt-val">---</span></div>
                <div class="tgt-row"><span>TCPA:</span> <span class="tgt-val">---</span></div>
                <div class="tgt-row"><span>BCR:</span> <span class="tgt-val">---</span></div>
            `;
            panel.querySelector('.tgt-title').textContent = name;
            const fields = ['hdg', 'cog', 'sog', 'rot', 'dist', 'brg', 'cpa', 'tcpa', 'bcr'];
            panel.querySelectorAll('.tgt-val').forEach((value, index) => {
                value.id = `${fields[index]}-${id}`;
            });
            // 인라인 문자열 변환 없이 원래 ID를 전달: 숫자 MMSI도 정상적으로 해제.
            panel.querySelector('.tgt-close-btn').addEventListener('click', e => {
                e.stopPropagation();
                closeTargetPanel(id);
            });
            targetAutoContent.appendChild(panel);
            makePanelDraggable(panel);
            if (targetPanelResizeObserver) targetPanelResizeObserver.observe(panel);
            scheduleFloatingWindowLayout();
        }

        window.closeTargetPanel = function(id) {
            const panel = document.getElementById(`panel-${id}`);
            const target = simEntities.find(s => !s.isMASS && String(s.id) === String(id));
            if (panel) {
                if (panel.finishTargetDrag) panel.finishTargetDrag();
                if (targetPanelResizeObserver) targetPanelResizeObserver.unobserve(panel);
                panel.remove();
            }
            selectedTargetIds.forEach(selectedId => {
                if (String(selectedId) === String(id)) selectedTargetIds.delete(selectedId);
            });
            recordExperimentEvent('target_info_close', { target_id: id, target_name: target ? target.name : null });
            if (lastApiPayload) captureExperimentSnapshot(lastApiPayload, 'target_info_close');
            scheduleFloatingWindowLayout();
            if (isSimulationRunning) render2D();
        };

        function makePanelDraggable(panel) {
            const header = panel.querySelector('.tgt-header');
            header.addEventListener('mousedown', e => {
                if (e.button !== 0 || e.target.closest('.tgt-close-btn')) return;
                e.preventDefault();
                e.stopPropagation();
                const mapRect = panelsContainer.getBoundingClientRect();
                const panelRect = panel.getBoundingClientRect();
                const startX = e.clientX;
                const startY = e.clientY;
                const startLeft = panelRect.left - mapRect.left;
                const startTop = panelRect.top - mapRect.top;
                let hasMoved = false;

                panelsContainer.querySelectorAll('.target-info-panel')
                    .forEach(p => p.style.zIndex = '20');
                panel.style.zIndex = '21';

                function move(ev) {
                    const dx = ev.clientX - startX;
                    const dy = ev.clientY - startY;
                    if (!hasMoved && Math.abs(dx) <= 3 && Math.abs(dy) <= 3) return;
                    ev.preventDefault();
                    if (!hasMoved) {
                        hasMoved = true;
                        panel.dataset.manual = 'true';
                        panelsContainer.appendChild(panel);
                        panel.style.left = `${startLeft}px`;
                        panel.style.top = `${startTop}px`;
                        scheduleFloatingWindowLayout();
                    }
                    panel.style.left = `${startLeft + dx}px`;
                    panel.style.top = `${startTop + dy}px`;
                    keepTargetPanelInMap(panel);
                    scheduleFloatingWindowLayout();
                }
                function finish() {
                    window.removeEventListener('mousemove', move);
                    window.removeEventListener('mouseup', finish);
                    window.removeEventListener('blur', finish);
                    delete panel.finishTargetDrag;
                }
                panel.finishTargetDrag = finish;
                window.addEventListener('mousemove', move);
                window.addEventListener('mouseup', finish);
                window.addEventListener('blur', finish);
            });
        }

        function calculateTargetEncounter(os, ts) {
            const result = {
                cpaNM: null, tcpaMin: null, bcrNM: null,
                cpaNote: '위치 또는 속도 데이터가 유효하지 않습니다.', bcrNote: '위치/속도 또는 자선 HDG가 유효하지 않습니다.'
            };
            if (!os || !ts || ![os.x, os.z, ts.x, ts.z].every(Number.isFinite)) return result;

            // 기존 수신부가 만든 좌표를 그대로 역변환: 400 display units = 1 NM.
            // 기존 sog는 화면에 표시되는 knot 값으로 가정. 수신부 단위 변환은 변경하지 않음.
            const unitsPerMetre = 400 / 1852;
            const rEast = (ts.x - os.x) / unitsPerMetre;
            const rNorth = -(ts.z - os.z) / unitsPerMetre;
            const knotToMps = 1852 / 3600;
            const velocityEpsilon = 1e-6; // m/s, 0 나눗셈 방지용 수치 허용오차
            const timeEpsilon = 1e-6; // seconds

            function velocity(ship) {
                if (!Number.isFinite(ship.sog) || ship.sog < 0) return null;
                if (ship.sog === 0) return { east: 0, north: 0 };
                if (!Number.isFinite(ship.cog)) return null;
                const angle = ship.cog * DEG2RAD;
                return {
                    east: ship.sog * knotToMps * Math.sin(angle),
                    north: ship.sog * knotToMps * Math.cos(angle)
                };
            }
            const ownVelocity = velocity(os);
            const targetVelocity = velocity(ts);
            if (!ownVelocity || !targetVelocity) return result;
            const vEast = targetVelocity.east - ownVelocity.east;
            const vNorth = targetVelocity.north - ownVelocity.north;
            const relativeSpeedSquared = vEast * vEast + vNorth * vNorth;

            // 등속·직진 상대운동. TCPA는 음수를 유지하며 과거로 외삽된 CPA와 짝지음.
            if (relativeSpeedSquared <= velocityEpsilon * velocityEpsilon) {
                result.cpaNM = Math.hypot(rEast, rNorth) / 1852;
                result.cpaNote = '상대속도가 0에 가까워 거리가 일정합니다. CPA=현재 거리, TCPA=미정.';
            } else {
                const tcpaSeconds = -(rEast * vEast + rNorth * vNorth) / relativeSpeedSquared;
                result.tcpaMin = tcpaSeconds / 60;
                result.cpaNM = Math.hypot(
                    rEast + vEast * tcpaSeconds, rNorth + vNorth * tcpaSeconds
                ) / 1852;
                result.cpaNote = tcpaSeconds < 0
                    ? '현재 COG/SOG를 직선으로 연장하면 최근접 시점이 과거입니다. 과거 실측값은 아닙니다.'
                    : '현재 COG/SOG를 유지하는 등속·직진 예측값입니다. 선회/가감속/선체 크기는 미반영.';
            }

            // BCR: 움직이는 자선의 현재 HDG 선수미선과 타선 상대궤적의 교차.
            // 자선 데이터 기준점에서 잰 부호 있는 거리. 실제 선수 끝 오프셋은 사용하지 않음.
            if (!Number.isFinite(os.hdg)) return result;
            const heading = os.hdg * DEG2RAD;
            const forwardEast = Math.sin(heading);
            const forwardNorth = Math.cos(heading);
            const rStarboard = rEast * forwardNorth - rNorth * forwardEast;
            const vStarboard = vEast * forwardNorth - vNorth * forwardEast;
            if (Math.abs(vStarboard) <= velocityEpsilon) {
                result.bcrNote = '상대궤적이 선수미선과 평행하거나 일치하여 유일한 횡단점이 없습니다.';
                return result;
            }
            const crossingSeconds = -rStarboard / vStarboard;
            if (crossingSeconds < -timeEpsilon) {
                result.bcrNote = '현재 상대운동 기준 선수미선 교차시점이 과거여서 향후 BCR은 표시하지 않습니다.';
                return result;
            }
            const futureTime = Math.max(0, crossingSeconds);
            const crossEast = rEast + vEast * futureTime;
            const crossNorth = rNorth + vNorth * futureTime;
            result.bcrNM = (crossEast * forwardEast + crossNorth * forwardNorth) / 1852;
            result.bcrNote = '자선 데이터 기준점/현재 HDG 기준. +: 선수 쪽, -: 선미 쪽 통과. 등속·직진 예측.';
            return result;
        }

        function formatTargetEncounterValue(value, digits, unit, showPlus = false) {
            if (!Number.isFinite(value)) return '---';
            // 부동소수점 오차나 반올림 때문에 -0.00으로 표시되지 않도록 한다.
            const rounded = Number(value.toFixed(digits));
            const prefix = showPlus && rounded > 0 ? '+' : '';
            return `${prefix}${rounded.toFixed(digits)} ${unit}`;
        }

        function writeTargetEncounter(id, values) {
            const fields = [
                ['cpa', values.cpaNM, 2, 'NM', false, values.cpaNote],
                ['tcpa', values.tcpaMin, 1, 'min.', false, values.cpaNote],
                ['bcr', values.bcrNM, 2, 'NM', true, values.bcrNote]
            ];
            fields.forEach(([key, value, digits, unit, showPlus, note]) => {
                const element = document.getElementById(`${key}-${id}`);
                if (!element) return;
                element.textContent = formatTargetEncounterValue(value, digits, unit, showPlus);
                // 기존 행은 pointer-events:none이므로 실제 포인터를 받는 패널에도 설명 제공.
                element.title = note;
            });
            const panel = document.getElementById(`panel-${id}`);
            if (panel) panel.title = `CPA/TCPA: ${values.cpaNote}\nBCR: ${values.bcrNote}`;
        }

        function updateAllTargetPanels() {
            const os = vObj.massEntity;
            const hasCurrentOwnShip = os && simEntities.includes(os);
            selectedTargetIds.forEach(id => {
                const panel = document.getElementById(`panel-${id}`);
                if (!panel) return;
                const ts = simEntities.find(s => String(s.id) === String(id));
                if (!hasCurrentOwnShip || !ts) {
                    writeTargetEncounter(id, {
                        cpaNM: null, tcpaMin: null, bcrNM: null,
                        cpaNote: '현재 프레임에 자선 또는 타선 데이터가 없습니다.',
                        bcrNote: '현재 프레임에 자선 또는 타선 데이터가 없습니다.'
                    });
                    return;
                }

                // 기존 6개 정보의 계산/표시 방식은 유지.
                document.getElementById(`hdg-${id}`).innerText = ts.hdg.toFixed(1) + '°';
                document.getElementById(`cog-${id}`).innerText = ts.cog.toFixed(1) + '°';
                document.getElementById(`sog-${id}`).innerText = ts.sog.toFixed(1) + ' kt';
                document.getElementById(`rot-${id}`).innerText = ts.rot.toFixed(1) + '°/min';

                const dEast = (ts.x - os.x) / (400 / 1852);
                const dNorth = -(ts.z - os.z) / (400 / 1852);
                const distMeters = Math.hypot(dEast, dNorth);
                const distNM = distMeters / 1852;
                let brgRad = Math.atan2(dEast, dNorth);
                let brgDeg = brgRad * (180 / Math.PI);
                if (brgDeg < 0) brgDeg += 360;
                document.getElementById(`dist-${id}`).innerText = distNM.toFixed(2) + ' NM';
                document.getElementById(`brg-${id}`).innerText = brgDeg.toFixed(1) + '°';

                writeTargetEncounter(id, calculateTargetEncounter(os, ts));
            });
        }


        // ==========================================
        // 3-B. HTMS Navigation Support 기능
        //      아래 SupportModels의 함수만 교체하면 추후 다른 충돌회피/조종모델로 대체 가능.
        // ==========================================
        function normalize360(deg) {
            deg %= 360;
            return deg < 0 ? deg + 360 : deg;
        }

        function signedAngleDiff(targetDeg, currentDeg) {
            return ((targetDeg - currentDeg + 540) % 360) - 180;
        }

        function clampValue(value, minValue, maxValue) {
            return Math.max(minValue, Math.min(maxValue, value));
        }

        function shipPositionMeters(ship) {
            const unit = 400 / 1852;
            return { east: ship.x / unit, north: -ship.z / unit };
        }

        function velocityFromCourseMps(courseDeg, sogKnots) {
            const speed = Math.max(0, Number(sogKnots) || 0) * 0.514444;
            const rad = normalize360(Number(courseDeg) || 0) * DEG2RAD;
            return { east: speed * Math.sin(rad), north: speed * Math.cos(rad) };
        }

        function getTrafficShips() {
            // Support calculations use one current record per vessel ID. The raw simEntities array and map rendering stay untouched.
            // If the backend ever contains repeated rows for the same MMSI/ID in one snapshot, counting those rows as separate ships
            // inflates support-feature counts and can distort collision-avoidance screening.
            const unique = new Map();
            simEntities.forEach(s => {
                if (s.isMASS) return;
                const key = String(s.id);
                unique.set(key, s); // last current-snapshot row wins for a repeated stable ID
            });
            return Array.from(unique.values());
        }

        function getNearbyTrafficShips(radiusNM = SUPPORT_CONFIG.supportRadiusNM) {
            if (!vObj.massEntity) return [];
            const os = vObj.massEntity;
            return getTrafficShips().filter(ts => evaluateRelativeMotion(os, ts).distanceNM <= radiusNM + 1e-9);
        }

        function isShipInForwardSupportArea(os, ts) {
            if (!os || !ts) return false;
            const own = shipPositionMeters(os);
            const pos = shipPositionMeters(ts);
            const relEast = pos.east - own.east;
            const relNorth = pos.north - own.north;
            const distanceNM = Math.hypot(relEast, relNorth) / 1852;
            if (distanceNM > SUPPORT_CONFIG.futureRadiusNM + 1e-9) return false;
            const rad = normalize360(os.cog) * DEG2RAD;
            const alongTrackNM = (relEast * Math.sin(rad) + relNorth * Math.cos(rad)) / 1852;
            return alongTrackNM >= -SUPPORT_CONFIG.futureAsternNM - 1e-9;
        }

        function getFuturePositionShips() {
            if (!vObj.massEntity) return [];
            const os = vObj.massEntity;
            return getTrafficShips().filter(ts => isShipInForwardSupportArea(os, ts));
        }

        function getVisibleApproachRankingList() {
            if (!vObj.massEntity) return [];
            const os = vObj.massEntity;
            // Every target within 5 NM participates in priority ranking, even when
            // outside the currently visible canvas or after its closest approach.
            return getNearbyTrafficShips(5.0).map(ship => {
                const motion = evaluateRelativeMotion(os, ship);
                return { ship, motion };
            }).sort((a, b) => {
                const aFuture = Number.isFinite(a.motion.tcpaMin) && a.motion.tcpaMin >= 0;
                const bFuture = Number.isFinite(b.motion.tcpaMin) && b.motion.tcpaMin >= 0;
                if (aFuture !== bFuture) return aFuture ? -1 : 1;
                if (aFuture && bFuture) {
                    return a.motion.cpaNM - b.motion.cpaNM
                        || a.motion.tcpaMin - b.motion.tcpaMin
                        || a.motion.distanceNM - b.motion.distanceNM;
                }
                return a.motion.distanceNM - b.motion.distanceNM;
            });
        }

        function evaluateRelativeMotion(os, ts, ownHeading = os.cog, ownSpeed = os.sog, horizonMin = SUPPORT_CONFIG.horizonMin) {
            const op = shipPositionMeters(os);
            const tp = shipPositionMeters(ts);
            const ov = velocityFromCourseMps(ownHeading, ownSpeed);
            const tv = velocityFromCourseMps(ts.cog, ts.sog);
            const rE = tp.east - op.east;
            const rN = tp.north - op.north;
            const vE = tv.east - ov.east;
            const vN = tv.north - ov.north;
            const vv = vE * vE + vN * vN;
            const horizonSec = horizonMin * 60;
            const rawTcpaSec = vv < 1e-8 ? Infinity : -(rE * vE + rN * vN) / vv;
            const evalSec = vv < 1e-8 ? 0 : clampValue(rawTcpaSec, 0, horizonSec);
            const currentDistanceMeters = Math.hypot(rE, rN);
            const cpaMeters = Math.hypot(rE + vE * evalSec, rN + vN * evalSec);
            // Threat Highlight needs the actual straight-line CPA at its positive TCPA,
            // not the 10-minute display-horizon-clamped CPA used by the other support features.
            const rawCpaMeters = Number.isFinite(rawTcpaSec)
                ? Math.hypot(rE + vE * rawTcpaSec, rN + vN * rawTcpaSec)
                : currentDistanceMeters;
            const currentDistanceNM = currentDistanceMeters / 1852;
            return {
                cpaNM: cpaMeters / 1852,
                rawCpaNM: rawCpaMeters / 1852,
                tcpaMin: Number.isFinite(rawTcpaSec) ? rawTcpaSec / 60 : null,
                evalTcpaMin: evalSec / 60,
                distanceNM: currentDistanceNM,
                relEast: rE,
                relNorth: rN,
                relVelEast: vE,
                relVelNorth: vN
            };
        }

        function getOddOeState() {
            const os = vObj.massEntity;
            if (!os) return null;

            const general = [];
            const critical = [];
            getTrafficShips().forEach(ship => {
                const motion = evaluateRelativeMotion(os, ship);
                const tcpa = Number(motion.tcpaMin);
                const dcpa = Number(motion.rawCpaNM);
                if (!Number.isFinite(tcpa) || !Number.isFinite(dcpa) || tcpa < 0) return;
                if (dcpa <= 1.0 + 1e-9 && tcpa <= 10.0 + 1e-9) general.push({ ship, motion });
                if (dcpa <= 0.3 + 1e-9 && tcpa <= 3.0 + 1e-9) critical.push({ ship, motion });
            });

            let level = 'green';
            let color = '#34d399';
            let triggers = general;
            if (critical.length >= 1) {
                level = 'red';
                color = '#fb7185';
                triggers = critical;
            } else if (general.length > 2) {
                level = 'yellow';
                color = '#facc15';
                triggers = general;
            }

            return {
                level, color,
                generalCount: general.length,
                criticalCount: critical.length,
                triggerIds: new Set(triggers.map(item => String(item.ship.id)))
            };
        }

        function updateOddOeLight(state) {
            if (!oddOeLight || !osFixedHud || !vObj.massEntity || !state) {
                if (oddOeLight) oddOeLight.classList.remove('visible');
                return;
            }

            oddOeLight.classList.add('visible');
            oddOeLight.style.backgroundColor = state.color;
            const glow = state.level === 'red'
                ? 'rgba(251,113,133,0.92)'
                : state.level === 'yellow' ? 'rgba(250,204,21,0.88)' : 'rgba(52,211,153,0.78)';
            oddOeLight.style.boxShadow = `0 0 0 2px rgba(5,10,18,0.92), 0 0 12px ${glow}`;
            oddOeLight.title = `ODD/OE ${state.level.toUpperCase()} · DCPA≤1NM/TCPA≤10min ${state.generalCount}척 · DCPA≤0.3NM/TCPA≤3min ${state.criticalCount}척`;

            const mapRect = container.getBoundingClientRect();
            const hudRect = osFixedHud.getBoundingClientRect();
            const size = oddOeLight.offsetWidth || 27;
            const desiredLeft = hudRect.right - mapRect.left + 14;
            const desiredTop = hudRect.top - mapRect.top + (hudRect.height - size) * 0.5;
            oddOeLight.style.left = `${Math.max(8, Math.min(container.clientWidth - size - 8, desiredLeft))}px`;
            oddOeLight.style.top = `${Math.max(8, desiredTop)}px`;
        }

        function drawThreatHighlightRing(ctx, ship) {
            if (!ship || ship.isMASS || !activeSupportFeatures.has('sa:threat-highlight') || !isDangerTarget(ship)) return;
            const p = shipCanvasPoint(ship);
            // Smaller than the clicked-target selection ring and kept clear of the vessel label.
            const radius = Math.max(14, (SHIP_LEN_UNIT / 2) * vObj.viewScale + 5);
            ctx.save();
            ctx.strokeStyle = '#fb7185';
            ctx.lineWidth = 1.8;
            ctx.beginPath();
            ctx.arc(p.x, p.y, radius, 0, Math.PI * 2);
            ctx.stroke();
            ctx.restore();
        }

        function getThreatList() {
            if (!vObj.massEntity) return [];
            const os = vObj.massEntity;
            return getTrafficShips().map(ship => {
                const motion = evaluateRelativeMotion(os, ship);
                const tcpa = motion.tcpaMin;
                const future = Number.isFinite(tcpa) && tcpa >= 0 && tcpa <= SUPPORT_CONFIG.horizonMin;
                const cpaTerm = Math.max(0, (getCautionCpaNM() - motion.cpaNM) / getCautionCpaNM());
                const timeTerm = future ? Math.max(0, 1 - tcpa / SUPPORT_CONFIG.horizonMin) : 0;
                const distanceTerm = Math.max(0, 1 - motion.distanceNM / 6);
                const score = future ? cpaTerm * 0.60 + timeTerm * 0.28 + distanceTerm * 0.12 : distanceTerm * 0.08;
                return { ship, motion, score, future };
            }).sort((a, b) => b.score - a.score || a.motion.distanceNM - b.motion.distanceNM);
        }

        function getPreferredTarget() {
            const ids = Array.from(selectedTargetIds);
            for (let i = ids.length - 1; i >= 0; i--) {
                const selected = simEntities.find(s => !s.isMASS && String(s.id) === String(ids[i]));
                if (selected) return selected;
            }
            const threat = getThreatList()[0];
            return threat ? threat.ship : null;
        }

        function displayReferenceHeading() {
            return vObj.massEntity ? normalize360(Number(vObj.massEntity.hdg) || 0) : 0;
        }

        function worldVectorToHeadUp(eastMeters, northMeters) {
            const h = displayReferenceHeading() * DEG2RAD;
            return {
                right: eastMeters * Math.cos(h) - northMeters * Math.sin(h),
                forward: eastMeters * Math.sin(h) + northMeters * Math.cos(h)
            };
        }

        function displayRelativeHeading(absoluteHeading) {
            return signedAngleDiff(normalize360(Number(absoluteHeading) || 0), displayReferenceHeading());
        }

        function relativeMetersToCanvas(eastMeters, northMeters) {
            const unit = 400 / 1852;
            const r = worldVectorToHeadUp(eastMeters, northMeters);
            return {
                x: vObj.panX + r.right * unit * vObj.viewScale,
                y: vObj.panY - r.forward * unit * vObj.viewScale
            };
        }

        function shipRelativeMeters(ship) {
            if (!vObj.massEntity) return { east: 0, north: 0 };
            const own = shipPositionMeters(vObj.massEntity);
            const pos = shipPositionMeters(ship);
            return { east: pos.east - own.east, north: pos.north - own.north };
        }

        function shipCanvasPoint(ship) {
            const rel = shipRelativeMeters(ship);
            return relativeMetersToCanvas(rel.east, rel.north);
        }

        function shipDisplayOffsetUnits(ship) {
            const rel = shipRelativeMeters(ship);
            const r = worldVectorToHeadUp(rel.east, rel.north);
            const unit = 400 / 1852;
            return { x: r.right * unit, z: -r.forward * unit };
        }

        function drawGlowLine(ctx, x1, y1, x2, y2, color, width = 2, dash = []) {
            ctx.save();
            ctx.strokeStyle = color;
            ctx.lineWidth = width;
            ctx.setLineDash(dash);
            ctx.beginPath();
            ctx.moveTo(x1, y1);
            ctx.lineTo(x2, y2);
            ctx.stroke();
            ctx.restore();
        }

        function labelColor(color) {
            const c = String(color || '').toLowerCase();
            return (c.includes('fb7185') || c.includes('f43f5e') || c.includes('ef4444')) ? '#fb7185' : '#cbd5e1';
        }

        function chooseNonOverlappingLabel(x, y, width, height) {
            const offsets = [[0,0],[0,22],[0,-22],[18,0],[-18,0],[18,22],[-18,22],[18,-22],[-18,-22],[0,44],[0,-44]];
            for (const [dx,dy] of offsets) {
                const box = { x: x + dx, y: y + dy - height, w: width, h: height };
                const overlaps = frameLabelBoxes.some(b => !(box.x + box.w + 3 < b.x || b.x + b.w + 3 < box.x || box.y + box.h + 3 < b.y || b.y + b.h + 3 < box.y));
                if (!overlaps) {
                    frameLabelBoxes.push(box);
                    return { x: box.x, y: box.y + height };
                }
            }
            const box = { x, y: y - height, w: width, h: height };
            frameLabelBoxes.push(box);
            return { x, y };
        }

        function drawSupportTag(ctx, text, x, y, color) {
            ctx.save();
            ctx.font = '600 11px Segoe UI';
            const width = ctx.measureText(text).width + 12;
            const height = 18;
            const pos = chooseNonOverlappingLabel(x, y, width, height);
            ctx.fillStyle = 'rgba(5,10,18,0.92)';
            ctx.strokeStyle = 'rgba(100,116,139,0.72)';
            ctx.lineWidth = 1;
            ctx.beginPath();
            if (ctx.roundRect) ctx.roundRect(pos.x, pos.y - 14, width, height, 3);
            else ctx.rect(pos.x, pos.y - 14, width, height);
            ctx.fill();
            ctx.stroke();
            ctx.fillStyle = labelColor(color);
            ctx.textAlign = 'left';
            ctx.fillText(text, pos.x + 6, pos.y);
            ctx.restore();
        }

        function drawHeadingRay(ctx, heading, color, lengthPx = 125, dash = []) {
            const relHeading = displayRelativeHeading(heading);
            const rad = relHeading * DEG2RAD;
            const x2 = vObj.panX + Math.sin(rad) * lengthPx;
            const y2 = vObj.panY - Math.cos(rad) * lengthPx;
            drawGlowLine(ctx, vObj.panX, vObj.panY, x2, y2, color, 2.2, dash);
            return { x: x2, y: y2 };
        }

        function supportRiskClass(cpaNM, tcpaMin, minCpaNM = SUPPORT_CONFIG.safeCpaNM) {
            const futureEncounter = Number.isFinite(tcpaMin) && tcpaMin >= 0 && tcpaMin <= SUPPORT_CONFIG.horizonMin;
            if (!futureEncounter) return 'safe';
            if (cpaNM < Number(minCpaNM)) return 'danger';
            if (cpaNM < Math.max(SUPPORT_CONFIG.cautionCpaNM, Number(minCpaNM) + 0.50)) return 'caution';
            return 'safe';
        }

        function isThreatHighlightDangerMotion(motion, minCpaNM) {
            if (!motion) return false;
            const tcpa = Number(motion.tcpaMin);
            const cpa = Number.isFinite(Number(motion.rawCpaNM)) ? Number(motion.rawCpaNM) : Number(motion.cpaNM);
            return Number.isFinite(tcpa) && tcpa > 0 && Number.isFinite(cpa) && cpa < Number(minCpaNM);
        }

        function riskColorFromEncounter(cpaNM, tcpaMin, minCpaNM = SUPPORT_CONFIG.safeCpaNM) {
            const risk = supportRiskClass(cpaNM, tcpaMin, minCpaNM);
            return risk === 'danger' ? '#fb7185' : risk === 'caution' ? '#facc15' : '#34d399';
        }


        // ==========================================
        // ARC collision-avoidance planner (TR = 30 s)
        // Time Rings are centered at the current own-ship position. Each ring represents
        // the distance own ship would travel in one more TR while maintaining current SOG.
        // The requested CPA is split equally between own-ship and target safety domains.
        // ==========================================
        function arcTargetState(os, ts) {
            const own = shipPositionMeters(os);
            const pos = shipPositionMeters(ts);
            const ownVel = velocityFromCourseMps(os.cog, os.sog);
            const vel = velocityFromCourseMps(ts.cog, ts.sog);
            const relEast = pos.east - own.east;
            const relNorth = pos.north - own.north;
            const relVelEast = vel.east - ownVel.east;
            const relVelNorth = vel.north - ownVel.north;
            const vv = relVelEast * relVelEast + relVelNorth * relVelNorth;
            const tcpaSec = vv > 1e-10 ? -(relEast * relVelEast + relNorth * relVelNorth) / vv : Infinity;
            return {
                ship: ts, relEast, relNorth, velEast: vel.east, velNorth: vel.north,
                relVelEast, relVelNorth, tcpaSec
            };
        }

        function arcFutureTargetPoint(targetState, timeSec) {
            return {
                east: targetState.relEast + targetState.velEast * timeSec,
                north: targetState.relNorth + targetState.velNorth * timeSec
            };
        }

        function blockedSectorsFromAngles(blockedAngles) {
            const sectors = [];
            let start = null;
            for (let a = 0; a < 360; a++) {
                if (blockedAngles[a] && start === null) start = a;
                if ((!blockedAngles[a] || a === 359) && start !== null) {
                    const end = blockedAngles[a] && a === 359 ? 359 : a - 1;
                    sectors.push({ start, end });
                    start = null;
                }
            }
            return sectors;
        }

        function buildArcRingData(os, targets, safetyNM = getDesiredCpaNM('dm:minimum-alteration'), planningMinutes = SUPPORT_CONFIG.arcPlanningMaxMin, useFullCpaWall = false, trSecOverride = null) {
            const trSec = Number.isFinite(Number(trSecOverride)) ? Math.max(1, Number(trSecOverride)) : SUPPORT_CONFIG.arcTRSec;
            const horizonMin = clampValue(Math.ceil(Number(planningMinutes) || SUPPORT_CONFIG.arcPlanningMaxMin), 1, SUPPORT_CONFIG.arcPlanningMaxMin);
            const horizonSec = Math.max(trSec, horizonMin * 60);
            const ownSpeedMps = Math.max(0.1, Number(os.sog) || 0) * 0.514444;
            const requestedSafetyNM = Math.max(0.02, Number(safetyNM) || getDesiredCpaNM('dm:minimum-alteration'));
            // Recommended-route correction: when useFullCpaWall is true, the entered CPA itself
            // is used as the ARC wall radius. Other callers keep their existing convention unchanged.
            const domainSafetyNM = useFullCpaWall ? requestedSafetyNM : requestedSafetyNM / 2.0;
            const domainSafetyMeters = domainSafetyNM * 1852;
            const safetyMeters = domainSafetyMeters;
            const targetStates = (targets || []).map(ts => arcTargetState(os, ts));
            const ringCount = Math.max(1, Math.round(horizonSec / trSec));
            const rings = [];
            const exactArcs = [];

            for (let i = 1; i <= ringCount; i++) {
                const timeSec = i * trSec;
                rings.push({
                    index: i,
                    timeSec,
                    minute: timeSec / 60,
                    radiusMeters: ownSpeedMps * timeSec,
                    blockedAngles: new Array(360).fill(false),
                    blockedSectors: [],
                    arcs: []
                });
            }

            // Same Time-Ring concept as the original ARC: each target contributes its
            // CPA wall to the one 1-minute ring that contains its positive TCPA.
            targetStates.forEach(targetState => {
                const tcpaSec = targetState.tcpaSec;
                if (!Number.isFinite(tcpaSec) || tcpaSec <= 0 || tcpaSec > horizonSec + 1e-9) return;
                const ringIndex = clampValue(Math.ceil(tcpaSec / trSec), 1, ringCount);
                const ring = rings[ringIndex - 1];
                const tf = arcFutureTargetPoint(targetState, tcpaSec);
                const d = Math.hypot(tf.east, tf.north);
                if (d < 1e-9) return;

                const bearing = normalize360(Math.atan2(tf.east, tf.north) / DEG2RAD);
                const halfDeg = d <= safetyMeters
                    ? 90
                    : Math.asin(clampValue(safetyMeters / d, 0, 1)) / DEG2RAD;

                for (let a = 0; a < 360; a++) {
                    if (Math.abs(signedAngleDiff(a, bearing)) <= halfDeg + 0.5) ring.blockedAngles[a] = true;
                }
                const arcRecord = {
                    targetId: String(targetState.ship.id),
                    targetName: targetState.ship.name || String(targetState.ship.id),
                    tcpaSec, bearing, halfDeg,
                    radiusMeters: ownSpeedMps * tcpaSec
                };
                ring.arcs.push(arcRecord);
                exactArcs.push(arcRecord);
            });

            rings.forEach(ring => { ring.blockedSectors = blockedSectorsFromAngles(ring.blockedAngles); });
            return { trSec, horizonMin, safetyMeters, safetyNM: requestedSafetyNM, domainSafetyNM, domainSafetyMeters, ownSpeedMps, targetStates, rings, exactArcs };
        }

        // Lightweight display-only ARC snapshot. Unlike the route planner, this does not wait
        // for a fixed 10-minute planning horizon and does not run the dynamic-programming search.
        // Any nearby vessel with a positive TCPA contributes its ARC immediately at its own TCPA ring.
        function buildDangerHeadingArcSnapshot(os, targets, safetyNM = getDesiredCpaNM('dm:safe-heading-band')) {
            if (!os) return null;
            const requestedSafetyNM = Math.max(0.02, Number(safetyNM) || getDesiredCpaNM('dm:safe-heading-band'));
            // Danger-HDG ARC correction: the displayed CPA value is the actual wall radius.
            const domainSafetyNM = requestedSafetyNM;
            const safetyMeters = domainSafetyNM * 1852;
            const ownSpeedMps = Math.max(0.1, Number(os.sog) || 0) * 0.514444;
            const arcs = [];

            (targets || []).map(ts => arcTargetState(os, ts)).forEach(targetState => {
                const tcpaSec = Number(targetState.tcpaSec);
                if (!Number.isFinite(tcpaSec) || tcpaSec <= 0) return;
                const tf = arcFutureTargetPoint(targetState, tcpaSec);
                const d = Math.hypot(tf.east, tf.north);
                if (d < 1e-9) return;

                const bearing = normalize360(Math.atan2(tf.east, tf.north) / DEG2RAD);
                const halfDeg = d <= safetyMeters
                    ? 90
                    : Math.asin(clampValue(safetyMeters / d, 0, 1)) / DEG2RAD;
                arcs.push({
                    targetId: String(targetState.ship.id),
                    targetName: targetState.ship.name || String(targetState.ship.id),
                    tcpaSec,
                    radiusMeters: ownSpeedMps * tcpaSec,
                    bearing,
                    halfDeg
                });
            });

            return { arc: true, safetyNM: requestedSafetyNM, domainSafetyNM, safetyMeters, ownSpeedMps, arcs };
        }

        function arcSegmentMinSeparationMeters(p0, p1, t0Sec, t1Sec, targetState) {
            const tf0 = arcFutureTargetPoint(targetState, t0Sec);
            const tf1 = arcFutureTargetPoint(targetState, t1Sec);
            const r0e = tf0.east - p0.east;
            const r0n = tf0.north - p0.north;
            const r1e = tf1.east - p1.east;
            const r1n = tf1.north - p1.north;
            const de = r1e - r0e;
            const dn = r1n - r0n;
            const dd = de * de + dn * dn;
            const u = dd > 1e-12 ? clampValue(-(r0e * de + r0n * dn) / dd, 0, 1) : 0;
            return Math.hypot(r0e + de * u, r0n + dn * u);
        }

        function arcSegmentIsSafe(p0, p1, t0Sec, t1Sec, arcData) {
            const safety = arcData.safetyMeters;
            for (const targetState of arcData.targetStates) {
                if (arcSegmentMinSeparationMeters(p0, p1, t0Sec, t1Sec, targetState) < safety - 0.5) return false;
            }
            return true;
        }

        function validateArcPath(points, arcData) {
            let minMeters = Infinity;
            for (let i = 1; i < points.length; i++) {
                const p0 = points[i - 1], p1 = points[i];
                for (const targetState of arcData.targetStates) {
                    minMeters = Math.min(minMeters, arcSegmentMinSeparationMeters(p0, p1, p0.timeSec, p1.timeSec, targetState));
                }
            }
            if (!Number.isFinite(minMeters)) minMeters = Infinity;
            return { minSeparationNM: minMeters / 1852, safe: minMeters + 0.5 >= arcData.safetyMeters };
        }

        function arcSegmentMovesOutward(p0, p1) {
            const r0 = Math.hypot(Number(p0.east) || 0, Number(p0.north) || 0);
            if (r0 < 1e-6) return true;
            const de = (Number(p1.east) || 0) - (Number(p0.east) || 0);
            const dn = (Number(p1.north) || 0) - (Number(p0.north) || 0);
            return (Number(p0.east) || 0) * de + (Number(p0.north) || 0) * dn >= -1e-6;
        }

        function arcSegmentCrossesExactWall(p0, p1, arc) {
            const x0 = Number(p0.east) || 0, y0 = Number(p0.north) || 0;
            const x1 = Number(p1.east) || 0, y1 = Number(p1.north) || 0;
            const dx = x1 - x0, dy = y1 - y0;
            const rr = Number(arc && arc.radiusMeters);
            if (!Number.isFinite(rr) || rr <= 0) return false;
            const A = dx * dx + dy * dy;
            if (A < 1e-12) return false;
            const B = 2 * (x0 * dx + y0 * dy);
            const C = x0 * x0 + y0 * y0 - rr * rr;
            const D = B * B - 4 * A * C;
            if (D < -1e-9) return false;
            const root = Math.sqrt(Math.max(0, D));
            const roots = [(-B - root) / (2 * A), (-B + root) / (2 * A)];
            for (const u of roots) {
                if (u < -1e-9 || u > 1 + 1e-9) continue;
                const east = x0 + dx * u;
                const north = y0 + dy * u;
                const bearing = normalize360(Math.atan2(east, north) / DEG2RAD);
                if (Math.abs(signedAngleDiff(bearing, Number(arc.bearing) || 0)) <= Number(arc.halfDeg || 0) + 0.5) return true;

            return false;

        function arcTransitionCrossesAnyExactWall(p0, p1, arcData) {
            const walls = arcData && Array.isArray(arcData.exactArcs) ? arcData.exactArcs : [];

            if (!Array.isArray(points) || points.length < 2) return Infinity;
            let total = 0;
            for (let i = 1; i < points.length; i++) {
                total += Math.hypot(
                    (Number(points[i].east) || 0) - (Number(points[i - 1].east) || 0),
                    (Number(points[i].north) || 0) - (Number(points[i - 1].north) || 0)

        function planArcSide(os, arcData, side, maxAllowedTurnLimitDeg = 180, headingStepDeg = 1) {
            // Original ARC intent retained:
            // - 1-minute route decision interval
            // - 360 heading samples (1 deg)
            // - max_turn_limit grows by 5 deg until a route exists
            // - original lazy-altering objective: prev_cost + goal_diff / (turn_cost + 1)
            // Route geometry correction:
            // - every route starts exactly at OS
            // - intermediate points are one-minute travel rings measured from OS
            // - final point is exactly the CURRENT target waypoint (no overshoot-and-return point)
            // - every connecting segment is rejected if it crosses the exact same CPA/TCPA ARC wall
            //   drawn by Danger HDG, so equal CPA settings visibly agree.
            const currentHeading = Math.round(normalize360(Number(os.cog) || Number(os.hdg) || 0)) % 360;
            const ref = getArcNavigationReference(os);
            if (!ref || !arcData) return null;
            const goalHeading = Math.round(arcReferenceGoalHeading(os, ref)) % 360;
            const sideSign = side === 'PORT' ? -1 : side === 'STBD' ? 1 : 0;
            const ownWorld = shipPositionMeters(os);
            const goalRel = { east: ref.goalEast - ownWorld.east, north: ref.goalNorth - ownWorld.north };
            const goalDistance = Math.hypot(goalRel.east, goalRel.north);
            if (goalDistance < 1) return null;

            const oneMinuteMeters = Math.max(1, arcData.ownSpeedMps * arcData.trSec);
            const goalTimeSec = goalDistance / Math.max(0.01, arcData.ownSpeedMps);
            const fullMinutePoints = Math.max(0, Math.floor((goalTimeSec - 1e-6) / arcData.trSec));
            const planningRings = [];
            for (let i = 1; i <= fullMinutePoints; i++) {
                planningRings.push({
                    radiusMeters: oneMinuteMeters * i,
                    timeSec: arcData.trSec * i,
                    minute: arcData.trSec * i / 60,
                    terminal: false

                radiusMeters: goalDistance,
                timeSec: goalTimeSec,
                minute: goalTimeSec / 60,
                terminal: true

            const searchHeadingStepDeg = clampValue(Math.round(Number(headingStepDeg) || 1), 1, 15);
            const stateKey = (heading, firstAlterSign) => `${heading}|${firstAlterSign}`;
            const makePoint = (heading, ring) => {
                if (ring.terminal) {
                    return { east: goalRel.east, north: goalRel.north, timeSec: ring.timeSec, minute: ring.minute, heading };
                }
                const rad = heading * DEG2RAD;
                return {
                    east: Math.sin(rad) * ring.radiusMeters,
                    north: Math.cos(rad) * ring.radiusMeters,
                    timeSec: ring.timeSec,
                    minute: ring.minute,
                    heading

            for (let maxTurnLimit = 0; maxTurnLimit <= turnLimitCeiling; maxTurnLimit += 5) {

                states.set(stateKey(currentHeading, 0), {
                    heading: currentHeading,
                    firstAlterSign: 0,
                    cost: 0,
                    cumulativeTurn: 0,
                    pathLengthMeters: 0,
                    point: { east: 0, north: 0, timeSec: 0, minute: 0, heading: currentHeading },
                    points: [{ east: 0, north: 0, timeSec: 0, minute: 0, heading: currentHeading }]

                                heading: currAngle,
                                firstAlterSign: best.firstAlterSign,
                                cost: best.cost,
                                cumulativeTurn: best.cumulativeTurn,
                                pathLengthMeters: best.pathLengthMeters,

                                (Math.abs(state.cost - existing.cost) <= 1e-9 && Math.abs(state.pathLengthMeters - existing.pathLengthMeters) <= 1e-6 && state.cumulativeTurn < existing.cumulativeTurn)) {

                const finals = Array.from(states.values())
                    .filter(st => sideSign === 0 || st.firstAlterSign === 0 || st.firstAlterSign === sideSign)
                    .sort((a, b) =>
                        a.cost - b.cost ||
                        a.pathLengthMeters - b.pathLengthMeters ||
                        a.cumulativeTurn - b.cumulativeTurn

                if (!finals.length) continue;

                const state = finals[0];
                let peakPoint = state.points[0];
                let peakDelta = 0;
                state.points.forEach(pt => {
                    const d = signedAngleDiff(pt.heading, ref.baseHeading);
                    if (Math.abs(d) > Math.abs(peakDelta)) { peakDelta = d; peakPoint = pt; }
                });
                const validation = validateArcPath(state.points, arcData);
                return {
                    side: side || (state.firstAlterSign < 0 ? 'PORT' : state.firstAlterSign > 0 ? 'STBD' : 'STRAIGHT'),
                    hasPath: true,
                    safe: true,
                    rejoined: true,
                    points: state.points,
                    cost: state.cost,
                    pathLengthMeters: state.pathLengthMeters,
                    cumulativeTurn: state.cumulativeTurn,
                    peakHeading: peakPoint.heading,
                    peakDelta,
                    finalHeading: state.heading,
                    finalCrossTrackMeters: 0,
                    minSeparationNM: validation.minSeparationNM,
                    usedTurnLimitDeg: maxTurnLimit,
                    extreme: maxTurnLimit > 90,
                    goalHeading,
                    virtualGoal: { east: ref.goalEast, north: ref.goalNorth },
                    referenceHeading: ref.baseHeading,
                    targetWaypointIndex: ref.targetWaypointIndex,
                    targetWaypointName: ref.targetWaypointName

            }

            return {
                side, hasPath: false, safe: false, rejoined: false, points: [],
                minSeparationNM: 0, usedTurnLimitDeg: turnLimitCeiling, extreme: false,
                goalHeading, referenceHeading: ref.baseHeading,
                targetWaypointIndex: ref.targetWaypointIndex,
                targetWaypointName: ref.targetWaypointName

        }

            const ref = getArcNavigationReference(os);
            if (!ref || !arcData) return null;
            const goalHeading = Math.round(arcReferenceGoalHeading(os, ref)) % 360;
            const sideSign = side === 'PORT' ? -1 : side === 'STBD' ? 1 : 0;
            const ownWorld = shipPositionMeters(os);
            const goalRel = { east: ref.goalEast - ownWorld.east, north: ref.goalNorth - ownWorld.north };
            const goalDistance = Math.hypot(goalRel.east, goalRel.north);

            const physicalDiscreteTurnDeg = Math.max(1, Math.floor(physicalTurnPerRingDeg + 1e-9));

            for (let limit = startTurnLimit + fineStep; limit <= Math.min(20, turnLimitCeiling); limit += fineStep) pushTurnLimit(limit);

            for (let limit = mediumStart; limit <= Math.min(60, turnLimitCeiling); limit += 5) pushTurnLimit(limit);

            for (let limit = coarseStart; limit <= turnLimitCeiling; limit += 10) pushTurnLimit(limit);

                        } else {
                            group.push(candidate);

                            a.cost - b.cost ||
                            a.pathLengthMeters - b.pathLengthMeters ||
                            a.cumulativeTurn - b.cumulativeTurn

                            continue;

                        for (const candidate of group) {

                        }

                }

                const finals = Array.from(states.values())
                    .filter(st => sideSign === 0 || st.firstAlterSign === 0 || st.firstAlterSign === sideSign)
                    .sort((a, b) =>
                        a.cost - b.cost ||
                        a.pathLengthMeters - b.pathLengthMeters ||
                        a.cumulativeTurn - b.cumulativeTurn
                    );
                if (!finals.length) continue;

                const state = finals[0];
                let peakPoint = state.points[0];
                let peakDelta = 0;
                state.points.forEach(pt => {
                    const d = signedAngleDiff(pt.heading, ref.baseHeading);
                    if (Math.abs(d) > Math.abs(peakDelta)) { peakDelta = d; peakPoint = pt; }
                });

        function arcPathConflictingTargetIds(points, allArcData) {

            for (const targetState of allArcData.targetStates) {
                for (let i = 1; i < points.length; i++) {
                    const p0 = points[i - 1], p1 = points[i];
                    if (arcSegmentMinSeparationMeters(p0, p1, p0.timeSec, p1.timeSec, targetState) < safety - 0.5) {
                        conflicts.add(String(targetState.ship.id));
                        break;

                }
            }
            return conflicts;

        function planArcSideWithAdaptiveTraffic(os, allTargets, seedTargets, minCpaNM, side, fullArcData) {
            const byId = new Map(allTargets.map(t => [String(t.id), t]));
            const included = new Map(seedTargets.map(t => [String(t.id), t]));
            let lastData = buildArcRingData(os, Array.from(included.values()), minCpaNM);

                    if (!included.has(id) && byId.has(id)) {

                        added = true;

                    lastPath.safe = fullValidation.safe;
                    lastPath.hasPath = fullValidation.safe;

        function recommendationArcWorkerMain() {
            const DEG2RAD_W = Math.PI / 180;
            const normalize360W = d => ((Number(d) || 0) % 360 + 360) % 360;

            const clampW = (v, lo, hi) => Math.max(lo, Math.min(hi, v));

        function extendArcDisplayRouteToScenarioEnd(os, arcRoute) {

                    const ref = getArcNavigationReference(os);
                    const simSec = Number(currentSimulatorTimeSec());
                    const recalcMs = Number(SUPPORT_CONFIG.recommendedArcRecalcMs) || 1000;
                    const timeBucket = Number.isFinite(simSec) ? Math.floor(simSec * 1000 / recalcMs) : Math.floor(performance.now() / recalcMs);
                    const targetKey = (targets || []).map(t => String(t.id)).sort().join(',');

                            }
                            queueRecommendedArcWork(job);
                        }
                    }
                    return recommendedArcLastSolution;
                },
                buildAvoidanceRoute(os, targets, solutionOrCandidate) {
                    if (!os || !solutionOrCandidate) return [];
                    const candidate = solutionOrCandidate.recommended || solutionOrCandidate;
                    if (candidate.arcPath && Array.isArray(candidate.arcPath.points)) {
                        const referenceHeading = Number(candidate.arcPath.referenceHeading ?? os.cog) || 0;
                        const fallbackSide = candidate.displaySide || candidate.side || candidate.arcPath.side || null;
                        const routeSide = inferDisplayedRouteSide(candidate.arcPath.points, referenceHeading, fallbackSide);
                        const finiteArcRoute = candidate.arcPath.points.map((pt, idx) => ({ ...pt, routeSide, waypointLabel: idx === 0 ? 'OS' : `W${idx}` }));
                        return finiteArcRoute.map(pt => ({ ...pt, routeSide }));
                    }
                    return [];
                }
            },

            shipControl: {
                _hasPythonGuidance(targetHeading) {
                    if (!latestControlGuidance || latestControlGuidance.available !== true) return false;
                    const guidedTarget = Number(latestControlGuidance.target_heading);
                    return Number.isFinite(guidedTarget) && Math.abs(signedAngleDiff(targetHeading, guidedTarget)) <= 0.6;
                },

                _legacyRudderCommand(os, targetHeading) {
                    const error = signedAngleDiff(targetHeading, os.hdg);
                    if (Math.abs(error) < 1.2 && Math.abs(os.rot) < 0.8) return { error, rudder: 0, direction: 'MIDSHIP', steerDirection: 'MIDSHIP', source: 'legacy' };
                    let raw = SUPPORT_CONFIG.rudderKp * error - SUPPORT_CONFIG.rudderKd * (Number(os.rot) || 0);
                    raw = clampValue(raw, -SUPPORT_CONFIG.maxRudderDeg, SUPPORT_CONFIG.maxRudderDeg);
                    const stepped = Math.round(raw / SUPPORT_CONFIG.rudderStepDeg) * SUPPORT_CONFIG.rudderStepDeg;
                    const direction = stepped > 0 ? 'STBD' : stepped < 0 ? 'PORT' : 'MIDSHIP';
                    return { error, rudder: stepped, direction, steerDirection: direction, source: 'legacy' };
                },

                rudderCommand(os, targetHeading) {
                    if (!this._hasPythonGuidance(targetHeading)) return this._legacyRudderCommand(os, targetHeading);
                    const g = latestControlGuidance;
                    const rudder = Number(g.target_rudder) || 0;
                    return {
                        error: Number(g.heading_error),
                        rudder,
                        direction: g.target_rudder_direction || (rudder > 0 ? 'STBD' : rudder < 0 ? 'PORT' : 'MIDSHIP'),
                        steerDirection: g.steer_direction || 'MIDSHIP',
                        steerDelta: Number(g.steer_delta) || 0,
                        currentRudder: Number(g.current_rudder) || 0,
                        rlTargetRudder: Number(g.rl_target_rudder) || 0,
                        source: 'python'
                    };
                },

                _legacyRotGuidance(os, targetHeading) {
                    const error = signedAngleDiff(targetHeading, os.hdg);
                    const targetRot = clampValue(error * SUPPORT_CONFIG.rotKp, -SUPPORT_CONFIG.maxTargetRotDegPerMin, SUPPORT_CONFIG.maxTargetRotDegPerMin);
                    const currentRot = Number(os.rot) || 0;
                    const delta = targetRot - currentRot;
                    const cue = Math.abs(delta) < 1.0 ? 'HOLD ROT' : Math.sign(delta) === Math.sign(targetRot || 1) ? 'BUILD ROT' : 'REDUCE ROT';
                    return { error, targetRot, currentRot, cue, source: 'legacy' };
                },

                rotGuidance(os, targetHeading) {
                    if (!this._hasPythonGuidance(targetHeading)) return this._legacyRotGuidance(os, targetHeading);
                    const g = latestControlGuidance;
                    return {
                        error: Number(g.heading_error),
                        targetRot: Number.isFinite(Number(g.pid_intended_rot)) ? Number(g.pid_intended_rot) : Number(g.current_rot) || 0,
                        currentRot: Number(g.current_rot) || 0,
                        cue: g.pid_rot_cue || g.rot_cue || 'HOLD ROT',
                        source: 'python'
                    };
                },

                _legacyEaseGuidance(os, targetHeading) {
                    const error = signedAngleDiff(targetHeading, os.hdg);
                    const direction = Math.sign(error);
                    const currentRot = Number(os.rot) || 0;
                    const sameTurn = direction !== 0 && Math.sign(currentRot) === direction;
                    const residualDeg = sameTurn ? Math.abs(currentRot) * SUPPORT_CONFIG.easeTauSec / 60 : 0;
                    const easeHeading = normalize360(targetHeading - direction * residualDeg);
                    const toEase = signedAngleDiff(easeHeading, os.hdg);
                    const predictedStop = normalize360(os.hdg + currentRot * SUPPORT_CONFIG.easeTauSec / 60);
                    const easeNow = sameTurn && direction * toEase <= 0.8;
                    return { error, residualDeg, easeHeading, predictedStop, easeNow, sameTurn, source: 'legacy' };
                },

                easeGuidance(os, targetHeading) {
                    if (!this._hasPythonGuidance(targetHeading)) return this._legacyEaseGuidance(os, targetHeading);
                    const g = latestControlGuidance;
                    return {
                        error: Number(g.heading_error),
                        residualDeg: Number(g.residual_deg) || 0,
                        easeHeading: Number(g.ease_heading),
                        predictedStop: Number(g.predicted_stop),
                        easeNow: g.ease_now === true,
                        sameTurn: g.same_turn === true,
                        currentRudder: Number(g.current_rudder) || 0,
                        rudderToMidshipSec: Number.isFinite(Number(g.rudder_to_midship_sec)) ? Number(g.rudder_to_midship_sec) : null,
                        easeModel: g.ease_model || '',
                        source: 'python'
                    };
                }
            }
        };
        // 외부에서 모델만 교체할 수 있도록 명시적 접근점을 둔다.
        window.HTMSSupportModels = SupportModels;

        function chooseBestArcCandidate(solution) {
            if (!solution) return null;
            const choices = [solution.portRecommended, solution.starboardRecommended].filter(Boolean);
            if (!choices.length) return null;
            return choices.sort((a, b) => {
                const aLen = a.arcPath && Number.isFinite(Number(a.arcPath.pathLengthMeters)) ? Number(a.arcPath.pathLengthMeters) : arcRouteLengthMeters(a.arcPath && a.arcPath.points);
                const bLen = b.arcPath && Number.isFinite(Number(b.arcPath.pathLengthMeters)) ? Number(b.arcPath.pathLengthMeters) : arcRouteLengthMeters(b.arcPath && b.arcPath.points);
                return aLen - bLen ||
                    ((a.arcPath && a.arcPath.cost) || Infinity) - ((b.arcPath && b.arcPath.cost) || Infinity) ||
                    Math.abs(Number(a.delta) || 0) - Math.abs(Number(b.delta) || 0);
            })[0];
        }


        function crossTrackMetersOnHeading(eastMeters, northMeters, headingDeg) {
            const r = (Number(headingDeg) || 0) * DEG2RAD;
            return eastMeters * Math.cos(r) - northMeters * Math.sin(r);
        }

        function inferDisplayedRouteSide(route, referenceHeading, fallbackSide = null) {
            if (!Array.isArray(route) || route.length < 2) return fallbackSide;
            let chosen = null;
            let maxAbs = 0;
            route.slice(1).forEach(pt => {
                const xtrack = crossTrackMetersOnHeading(Number(pt.east) || 0, Number(pt.north) || 0, referenceHeading);
                const mag = Math.abs(xtrack);
                if (mag > maxAbs + 1e-6) {
                    maxAbs = mag;
                    chosen = xtrack >= 0 ? 'STBD' : 'PORT';
                }
            });
            return chosen || fallbackSide;
        }

        function pointLineDistanceMeters(point, start, end) {
            const px = Number(point.east) || 0, py = Number(point.north) || 0;
            const x1 = Number(start.east) || 0, y1 = Number(start.north) || 0;
            const x2 = Number(end.east) || 0, y2 = Number(end.north) || 0;
            const dx = x2 - x1, dy = y2 - y1;
            if (Math.abs(dx) < 1e-9 && Math.abs(dy) < 1e-9) return Math.hypot(px - x1, py - y1);
            const t = Math.max(0, Math.min(1, ((px - x1) * dx + (py - y1) * dy) / (dx * dx + dy * dy)));
            const projX = x1 + t * dx, projY = y1 + t * dy;
            return Math.hypot(px - projX, py - projY);
        }

        function rdpIndices(points, epsilon) {
            if (!Array.isArray(points) || points.length <= 2) return [0, Math.max(0, points.length - 1)];
            const recurse = (start, end, out) => {
                let maxDist = -1, index = -1;
                for (let i = start + 1; i < end; i++) {
                    const dist = pointLineDistanceMeters(points[i], points[start], points[end]);
                    if (dist > maxDist) { maxDist = dist; index = i; }
                }
                if (maxDist > epsilon && index > start && index < end) {
                    recurse(start, index, out);
                    out.push(index);
                    recurse(index, end, out);
                }
            };
            const mids = [];
            recurse(0, points.length - 1, mids);
            return [0, ...mids.sort((a, b) => a - b), points.length - 1];
        }

        function simplifyArcRouteForDisplay(route, referenceHeading, fallbackSide = null) {
            if (!Array.isArray(route) || route.length <= 2) return route || [];
            const epsilon = Math.max(35, Math.min(90, route.length * 7));
            const indexSet = new Set(rdpIndices(route, epsilon));
            let peakIdx = 1, peakAbs = -1;
            for (let i = 1; i < route.length; i++) {
                const pt = route[i];
                const xtrack = crossTrackMetersOnHeading(Number(pt.east) || 0, Number(pt.north) || 0, referenceHeading);
                const mag = Math.abs(xtrack);
                if (mag > peakAbs) { peakAbs = mag; peakIdx = i; }
            }
            indexSet.add(peakIdx);
            const sorted = Array.from(indexSet).sort((a, b) => a - b);
            let compact = sorted.map(i => ({ ...route[i] }));
            if (compact.length > 5) {
                const keep = new Set([0, peakIdx, route.length - 1]);
                const beforePeak = sorted.find(i => i > 0 && i < peakIdx);
                const afterPeak = [...sorted].reverse().find(i => i > peakIdx && i < route.length - 1);
                if (beforePeak !== undefined) keep.add(beforePeak);
                if (afterPeak !== undefined) keep.add(afterPeak);
                compact = Array.from(keep).sort((a, b) => a - b).map(i => ({ ...route[i] }));
            }
            const routeSide = inferDisplayedRouteSide(compact, referenceHeading, fallbackSide);
            return compact.map((pt, idx) => ({ ...pt, routeSide, waypointLabel: idx === 0 ? 'OS' : `W${idx}` }));
        }

        function drawWaypointLegRoute(ctx, route, color, options = {}) {
            if (!Array.isArray(route) || route.length < 2) return;
            const dash = options.dash || [];
            const lineWidth = options.lineWidth || 2.4;
            const alpha = Number.isFinite(options.alpha) ? options.alpha : 1;
            ctx.save();
            ctx.strokeStyle = color;
            ctx.lineWidth = lineWidth;
            ctx.lineJoin = 'round';
            ctx.lineCap = 'round';
            ctx.globalAlpha = alpha;
            ctx.setLineDash(dash);
            ctx.beginPath();
            route.forEach((pt, index) => {
                const p = relativeMetersToCanvas(pt.east, pt.north);
                if (index === 0) ctx.moveTo(p.x, p.y); else ctx.lineTo(p.x, p.y);
            });
            ctx.stroke();
            ctx.restore();

            if (options.showWaypoints !== false) route.slice(1).forEach((pt, idx) => {
                const p = relativeMetersToCanvas(pt.east, pt.north);
                ctx.save();
                ctx.fillStyle = 'rgba(5,10,18,0.94)';
                ctx.strokeStyle = color;
                ctx.lineWidth = 1.4;
                ctx.beginPath();
                ctx.arc(p.x, p.y, 4.2, 0, Math.PI * 2);
                ctx.fill();
                ctx.stroke();
                ctx.restore();
                if (options.showLabels === true) {
                    drawSupportTag(ctx, pt.waypointLabel || `W${idx + 1}`, p.x + 6, p.y - 4, color);
                }
            });
        }

        // Double-buffer WHAT-IF routes: keep the last complete route set visible while
        // the next live-state batch is calculated, then swap the whole set at once.
        // This prevents the routes from disappearing/reappearing on every recalculation.
        let arcWhatIfCache = { key: null, scenarios: [], computing: false, pendingKey: null };

        function buildArcWhatIfSingleRoute(os, targets, cpaNM) {
            const allTargets = Array.isArray(targets) ? targets : [];
            const ref = getArcNavigationReference(os);
            if (!os || !ref) return null;
            const ownWorld = shipPositionMeters(os);
            const goalDistanceMeters = Math.hypot(ref.goalEast - ownWorld.east, ref.goalNorth - ownWorld.north);
            const ownSpeedMps = Math.max(0.1, Number(os.sog) || 0) * 0.514444;
            const goalTravelMin = goalDistanceMeters / ownSpeedMps / 60;
            const planningMinutes = clampValue(Math.ceil(goalTravelMin), 1, SUPPORT_CONFIG.arcPlanningMaxMin);
            const arcData = buildArcRingData(os, allTargets, cpaNM, planningMinutes);

            // One DP search is allowed to choose PORT or STBD.  WHAT-IF is exploratory,
            // so a route requiring an excessive per-ring alteration is treated as unavailable
            // instead of spending more CPU to force an unrealistic path.
            const path = planArcSide(
                os, arcData, null, SUPPORT_CONFIG.whatIfMaxTurnLimitDeg, SUPPORT_CONFIG.whatIfHeadingStepDeg
            );
            if (!path || !path.hasPath || path.usedTurnLimitDeg > SUPPORT_CONFIG.whatIfMaxTurnLimitDeg) return null;
            const candidate = {
                heading: path.peakHeading,
                delta: path.peakDelta,
                safe: true,
                unsafeCount: 0,
                worst: { cpaNM: path.minSeparationNM, tcpaMin: null, ship: null },
                arcPath: path
            };
            const route = SupportModels.collisionAvoidance.buildAvoidanceRoute(os, allTargets, candidate);
            if (!Array.isArray(route) || route.length < 2) return null;
            return { candidate, route, usedTurnLimitDeg: path.usedTurnLimitDeg };
        }

        function getArcWhatIfScenarios(os, targets) {
            if (!os || !targets.length) return [];
            const ref = getArcNavigationReference(os);
            const simSec = Number(currentSimulatorTimeSec());
            const timeBucket = Number.isFinite(simSec)
                ? Math.floor(simSec * 1000 / SUPPORT_CONFIG.whatIfRecalcMs)
                : Math.floor(performance.now() / SUPPORT_CONFIG.whatIfRecalcMs);
            const targetKey = targets.map(t => String(t.id)).sort().join(',');
            const refKey = ref ? `${ref.targetWaypointIndex ?? ''}:${Number(ref.goalEast).toFixed(1)}:${Number(ref.goalNorth).toFixed(1)}` : 'NOREF';
            const cacheKey = `${onlineLoadedScenarioName}|${refKey}|${targetKey}|${timeBucket}`;
            if (arcWhatIfCache.key === cacheKey) return arcWhatIfCache.scenarios;

            // Never blank the currently displayed routes while a newer batch is being built.
            // If a calculation is already running, keep returning the last complete set.
            if (arcWhatIfCache.computing) return arcWhatIfCache.scenarios;

            const nextScenarios = SUPPORT_CONFIG.whatIfCpaLevels.map((cpaNM, index) => ({
                cpaNM, index, candidate: null, route: [], available: false,
                usedTurnLimitDeg: null, pending: true
            }));
            arcWhatIfCache.computing = true;
            arcWhatIfCache.pendingKey = cacheKey;

            // Spread the 10 CPA calculations across separate event-loop turns instead of
            // blocking one display refresh with ten full ARC searches.  Each criterion
            // contributes at most one practical route; impossible/extreme routes stay hidden.
            const osSnapshot = { ...os };
            const targetSnapshot = targets.map(t => ({ ...t }));
            let idx = 0;
            const computeNext = () => {
                if (arcWhatIfCache.pendingKey !== cacheKey) return;
                if (idx >= SUPPORT_CONFIG.whatIfCpaLevels.length) {
                    // Atomic swap: only now replace the visible route set.
                    arcWhatIfCache.key = cacheKey;
                    arcWhatIfCache.scenarios = nextScenarios;
                    arcWhatIfCache.computing = false;
                    arcWhatIfCache.pendingKey = null;
                    if (false) render2D();
                    return;
                }
                const cpaNM = SUPPORT_CONFIG.whatIfCpaLevels[idx];
                const result = buildArcWhatIfSingleRoute(osSnapshot, targetSnapshot, cpaNM);
                if (arcWhatIfCache.pendingKey !== cacheKey) return;
                nextScenarios[idx] = {
                    cpaNM, index: idx,
                    candidate: result ? result.candidate : null,
                    route: result ? result.route : [],
                    available: !!result,
                    usedTurnLimitDeg: result ? result.usedTurnLimitDeg : null,
                    pending: false
                };
                idx += 1;
                setTimeout(computeNext, 0);
            };
            setTimeout(computeNext, 0);
            return arcWhatIfCache.scenarios;
        }

        function findSpeedOption(os, targets) {
            if (!os || !targets.length) return null;
            const minSpeed = Math.max(0, Math.min(os.sog, Math.max(1, os.sog * 0.30)));
            const maxSpeed = Math.max(os.sog + 0.5, os.sog * 1.20);
            const candidates = [];
            for (let speed = minSpeed; speed <= maxSpeed + 1e-6; speed += 0.5) {
                const result = SupportModels.collisionAvoidance.evaluateHeading(os, targets, os.cog, speed);
                result.deltaSpeed = speed - os.sog;
                candidates.push(result);
            }
            const safe = candidates.filter(c => c.safe).sort((a, b) => Math.abs(a.deltaSpeed) - Math.abs(b.deltaSpeed) || b.worst.cpaNM - a.worst.cpaNM);
            const recommended = safe[0] || candidates.slice().sort((a, b) => a.unsafeCount - b.unsafeCount || b.worst.cpaNM - a.worst.cpaNM || Math.abs(a.deltaSpeed) - Math.abs(b.deltaSpeed))[0];
            return { candidates, safe, recommended, hasSafe: safe.length > 0 };
        }

        function isAnyDecisionMakingActive() {
            return Array.from(activeSupportFeatures).some(key => String(key).startsWith('dm:'));
        }

        function isAnyActionControlActive() {
            return Array.from(activeSupportFeatures).some(key => String(key).startsWith('act:'));
        }

        function getAutomaticDecisionTargetHeading() {
            const os = vObj.massEntity;
            if (!os) return null;
            const solution = SupportModels.collisionAvoidance.findSafeHeading(os, getTrafficShips());
            if (solution && solution.recommended && Number.isFinite(Number(solution.recommended.heading))) {
                return normalize360(Number(solution.recommended.heading));
            }
            // DECISION MAKING이 켜져 있으나 타선이 없는 경우 현재 COG 유지가 기본 목표가 된다.
            return normalize360(Number(os.cog) || Number(os.hdg) || 0);
        }

        function resolveActionTargetHeading() {
            const os = vObj.massEntity;
            if (!os) return { heading: null, mode: 'none', label: 'NO OWN SHIP' };

            // ACTION & CONTROL target HDG is controlled only from the AC buttons.
            // DM / SAFE-HDG settings never overwrite or move this steering target.
            if (actionTargetSettings.manualOverride && Number.isFinite(actionTargetSettings.manualHeading)) {
                return { heading: normalize360(actionTargetSettings.manualHeading), mode: 'manual', label: 'MANUAL TARGET' };
            }
            return { heading: null, mode: 'manual-required', label: 'MANUAL REQUIRED' };
        }

        function getDecisionTargetHeading() {
            return resolveActionTargetHeading().heading;
        }

        function updateActionTargetControl() {
            if (!actionTargetControl || !actionTargetValue || !actionTargetLabel || !actionTargetMode) { updateInlineButtonSettings(); return; }
            const active = isAnyActionControlActive();
            actionTargetControl.classList.toggle('visible', active);
            if (!active) { updateInlineButtonSettings(); return; }

            const target = resolveActionTargetHeading();
            const valid = Number.isFinite(target.heading);
            actionTargetControl.classList.toggle('required', !valid);
            if (!valid) {
                actionTargetLabel.textContent = 'DESIRED HDG · WHEEL TO SET';
                actionTargetValue.textContent = '---° ↕';
                actionTargetMode.textContent = 'DECISION MAKING OFF · MANUAL REQUIRED';
                updateInlineButtonSettings();
                return;
            }

            actionTargetValue.textContent = `${normalize360(target.heading).toFixed(0)}° ↕`;
            if (target.mode === 'manual') {
                actionTargetLabel.textContent = 'DESIRED HDG · WHEEL TO ADJUST';
                actionTargetMode.textContent = isAnyDecisionMakingActive() ? 'MANUAL OVERRIDE' : 'MANUAL TARGET';
            } else if (target.mode === 'auto-safe') {
                actionTargetLabel.textContent = 'DESIRED HDG · WHEEL TO OVERRIDE';
                actionTargetMode.textContent = 'AUTO · SAFE HDG (YELLOW)';
            } else {
                actionTargetLabel.textContent = 'DESIRED HDG · WHEEL TO OVERRIDE';
                actionTargetMode.textContent = 'AUTO · DECISION MAKING';
            }
            updateInlineButtonSettings();
        }

        function showSteeringStatus(message, state = 'working', timeoutMs = 0) {
            if (!steeringModelStatus) return;
            if (steeringStatusTimer) { clearTimeout(steeringStatusTimer); steeringStatusTimer = null; }
            if (steeringStatusPhaseTimer) { clearTimeout(steeringStatusPhaseTimer); steeringStatusPhaseTimer = null; }
            steeringModelStatus.textContent = message;
            steeringModelStatus.className = `visible ${state}`;
            if (timeoutMs > 0) {
                steeringStatusTimer = setTimeout(() => {
                    steeringModelStatus.className = '';
                    steeringStatusTimer = null;
                }, timeoutMs);
            }
        }

        function hideSteeringStatus() {
            if (!steeringModelStatus) return;
            if (steeringStatusTimer) { clearTimeout(steeringStatusTimer); steeringStatusTimer = null; }
            if (steeringStatusPhaseTimer) { clearTimeout(steeringStatusPhaseTimer); steeringStatusPhaseTimer = null; }
            steeringModelStatus.className = '';
        }

        function markControlGuidanceDirty() {
            controlGuidanceDirty = true;
            controlPolicyReady = false;
            controlPolicyTargetHeading = null;
            controlGuidanceGeneration += 1;
            latestControlGuidance = null;
        }

        function clearActionHeadingCommitTimer() {
            if (actionHeadingCommitTimer) {
                clearTimeout(actionHeadingCommitTimer);
                actionHeadingCommitTimer = null;
            }
        }

        const browserPidState = {
            integral: 0,
            prevError: 0,
            prevTimeSec: null,
            targetHeading: null
        };

        async function resetSteeringSession({ clearTarget = true, showStatus = true } = {}) {
            controlGuidanceGeneration += 1;
            controlGuidanceDirty = true;
            controlPolicyReady = false;
            controlPolicyTargetHeading = null;
            latestControlGuidance = null;
            clearActionHeadingCommitTimer();
            controlRequestInFlight = false;
            steeringSessionId = Number.isFinite(Number(steeringSessionId)) ? Number(steeringSessionId) + 1 : 1;
            browserPidState.integral = 0;
            browserPidState.prevError = 0;
            browserPidState.prevTimeSec = null;
            browserPidState.targetHeading = null;

            if (clearTarget) {
                actionTargetSettings.manualHeading = null;
                actionTargetSettings.manualOverride = false;
                actionTargetSettings.requestStateTimeSec = null;
            }
            updateActionTargetControl();
            if (isSimulationRunning) render2D(); else updateSupportCards();
            if (showStatus && isAnyActionControlActive()) showSteeringStatus('PID 조타지원 준비 · HDG 설정', 'success', 1400);
            return steeringSessionId;
        }

        function scheduleActionTargetCommit(source = 'wheel') {
            clearActionHeadingCommitTimer();
            if (!Number.isFinite(Number(actionTargetSettings.manualHeading))) return;
            showSteeringStatus('HDG 입력중...', 'working');

            actionHeadingCommitTimer = setTimeout(async () => {
                actionHeadingCommitTimer = null;
                if (!isAnyActionControlActive() || !vObj.massEntity) return;
                const commitHeading = Number(actionTargetSettings.manualHeading);
                if (!Number.isFinite(commitHeading)) return;
                const frozenHeading = normalize360(commitHeading);
                const commitStateTime = currentSimulatorTimeSec();

                const sessionId = await resetSteeringSession({ clearTarget: false, showStatus: false });
                if (!Number.isFinite(Number(sessionId)) || !isAnyActionControlActive()) return;
