<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>[HTMS] Navigation Supporter</title>
    
    <style>
        :root {
            --bg-color: #0b0f19;
            --panel-bg: #111827;
            --border-color: #1f293d;
            --accent-cyan: #06b6d4;
            --accent-green: #10b981;
            --accent-rose: #f43f5e;
            --accent-yellow: #eab308;
            --accent-orange: #f97316; 
            --text-main: #f3f4f6;
            --text-muted: #9ca3af;
        }

        body, html { 
            margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; 
            background: var(--bg-color); color: var(--text-main); 
            font-family: 'Segoe UI', sans-serif; user-select: none; touch-action: none; 
        }

        #main-wrapper { 
            display: flex; flex-direction: column; width: 100vw; height: 100vh; 
        }

        /* --- 상단 2D 탑뷰 영역 --- */
        #top-view-area { 
            flex: 1 1 auto; min-height: 0;
            position: relative; background: radial-gradient(circle at center, #111a2e 0%, #050a10 100%);
            border-bottom: 2px solid var(--border-color); overflow: hidden; 
        }
        
        .vp-canvas { 
            width: 100%; height: 100%; display: block; cursor: crosshair; 
        }

        .hud-label {
            position: absolute; top: 15px; left: 15px; color: var(--accent-cyan); 
            font-weight: bold; font-size: 18px; letter-spacing: 1px; text-shadow: 0 2px 4px #000; 
            background: rgba(0,0,0,0.5); padding: 8px 15px; border-radius: 4px; 
            border: 1px solid var(--accent-cyan); pointer-events: none; z-index: 10;
        }

        .hud-range {
            position: absolute; top: 48px; left: 50%; transform: translateX(-50%);
            width: 224px; height: 50px; box-sizing: border-box;
            display: flex; align-items: center; justify-content: center;
            color: var(--accent-yellow); font-weight: bold; font-size: 16px; 
            background: rgba(0,0,0,0.6); padding: 6px 12px; border-radius: 5px; 
            border: 1px solid var(--accent-yellow); z-index: 10;
        }

        /* --- 다중 타겟 인포 패널 스타일 --- */
        #target-panels-container {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 20;
        }

        .target-info-panel {
            position: absolute; 
            background: rgba(17, 24, 39, 0.85); border: 1px solid var(--accent-cyan); 
            padding: 15px; border-radius: 6px; width: 220px;
            backdrop-filter: blur(4px); box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            pointer-events: auto; /* 패널 위에서는 클릭 이벤트 받기 */
        }

        .tgt-header {
            display: flex; justify-content: space-between; align-items: center;
            margin-bottom: 12px; padding-bottom: 6px; border-bottom: 1px solid var(--border-color);
            cursor: grab; /* 드래그 가능하다는 커서 표시 */
        }
        .tgt-header:active { cursor: grabbing; }

        .tgt-title { font-size: 16px; font-weight: 700; color: var(--accent-orange); pointer-events: none;}
        
        .tgt-close-btn {
            background: none; border: none; color: var(--text-muted); font-size: 16px; 
            cursor: pointer; padding: 0 4px; font-weight: bold; transition: 0.2s;
        }
        .tgt-close-btn:hover { color: var(--accent-rose); transform: scale(1.1); }

        .tgt-row { display: flex; justify-content: space-between; margin-bottom: 6px; font-size: 15px; pointer-events: none;}
        .tgt-val { font-weight: bold; color: var(--accent-yellow); }

        /* --- 하단 3분할 컨트롤 패널 --- */
        #bottom-view-wrapper { 
            flex: 0 0 clamp(156px, 20vh, 206px); min-height: 150px; max-height: 206px;
            display: flex; flex-direction: row; background: #000; overflow: hidden;
        }

        .split-side-panel { 
            display: flex; flex-direction: column; background: var(--panel-bg); 
            padding: 15px; overflow: hidden; flex: 1; min-width: 0; min-height: 0; border-right: 1px solid var(--border-color); 
        }
        .split-side-panel:last-child { border-right: none; }

        .panel-title { 
            font-size: clamp(10px, 1.5vh, 16px); font-weight: 700; text-align: center; margin-bottom: clamp(4px, 1vh, 12px); 
            letter-spacing: 1.5px; border-bottom: 1px solid var(--border-color); padding-bottom: clamp(3px, 0.7vh, 8px);
            flex-shrink: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
        }
        .panel-title.support-group-toggle { cursor: pointer; }

        .control-btn-grid { 
            display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); grid-template-rows: repeat(2, minmax(0, 1fr));
            gap: clamp(4px, 0.82vh, 9px); width: 100%; flex: 1; min-height: 0; overflow: hidden;
        }
        
        .placeholder-btn { 
            background: #1e293b; color: #94a3b8; border: 1px solid #334155; 
            padding: clamp(3px, 0.9vh, 12px) 4px; min-width: 0; min-height: 0; overflow: hidden;
            border-radius: 6px; font-family: 'Segoe UI', sans-serif; line-height: 1.04;
            font-weight: bold; font-size: clamp(9px, 1.35vh, 14px); cursor: pointer; transition: 0.2s; text-align: center; 
        }
        .placeholder-btn:focus, .placeholder-btn:focus-visible { outline: none; }
        
        .sa-btn:hover { background: rgba(6,182,212,0.2); color: #fff; border-color: var(--accent-cyan); transform: translateY(-2px); }
        .sa-btn.active-btn { background: var(--accent-cyan); color: #000; border-color: var(--accent-cyan); }

        .dm-btn:hover { background: rgba(234,179,8,0.2); color: #fff; border-color: var(--accent-yellow); transform: translateY(-2px); }
        .dm-btn.active-btn { background: var(--accent-yellow); color: #000; border-color: var(--accent-yellow); }

        .act-btn:hover { background: rgba(16,185,129,0.2); color: #fff; border-color: var(--accent-green); transform: translateY(-2px); }
        .act-btn.active-btn { background: var(--accent-green); color: #000; border-color: var(--accent-green); }


        /* --- HTMS Navigation Support 기능 표시 (기존 레이아웃 비변경, 오버레이만 사용) --- */
        .support-btn-code {
            display: inline-block; min-width: clamp(25px, 3.2vw, 34px); margin-right: clamp(2px, 0.35vw, 5px); opacity: 0.72;
            font-size: clamp(8px, 1.0vh, 11px); letter-spacing: 0.5px;
        }
        #support-cards-container {
            position: absolute; left: 15px; top: 116px; right: 15px; bottom: 15px;
            pointer-events: none; z-index: 15; overflow: visible;
        }
        .support-feature-card {
            --support-accent: rgba(148,163,184,0.72);
            position: absolute; width: 258px;
            box-sizing: border-box; padding: 10px 12px 11px;
            background: linear-gradient(145deg, rgb(8,15,28), rgb(17,24,39));
            border: 1px solid var(--support-accent); border-radius: 8px;
            box-shadow: 0 10px 28px rgba(0,0,0,0.42), inset 0 0 24px rgba(255,255,255,0.015);
            backdrop-filter: blur(6px); pointer-events: none; overflow: hidden;
            transform-origin: center center; opacity: 1;
            transition:
                left 280ms cubic-bezier(.22,.8,.28,1),
                top 280ms cubic-bezier(.22,.8,.28,1),
                width 280ms cubic-bezier(.22,.8,.28,1),
                height 280ms cubic-bezier(.22,.8,.28,1),
                padding 280ms cubic-bezier(.22,.8,.28,1),
                border-radius 280ms ease, opacity 180ms ease, transform 220ms ease, filter 220ms ease;
            will-change: left, top, width, height, padding, transform;
        }
        .support-feature-card.sa { --support-accent: rgba(6,182,212,0.88); box-shadow: 0 10px 28px rgba(0,0,0,0.42), 0 0 18px rgba(6,182,212,0.13); }
        .support-feature-card.dm { --support-accent: rgba(234,179,8,0.88); box-shadow: 0 10px 28px rgba(0,0,0,0.42), 0 0 18px rgba(234,179,8,0.13); }
        .support-feature-card.act { --support-accent: rgba(16,185,129,0.88); box-shadow: 0 10px 28px rgba(0,0,0,0.42), 0 0 18px rgba(16,185,129,0.13); }
        .support-feature-card.sa .support-card-kicker { color: #67e8f9; }
        .support-feature-card.dm .support-card-kicker { color: #fde047; }
        .support-feature-card.act .support-card-kicker { color: #6ee7b7; }
        .support-feature-card.support-card-enter { opacity: 0; transform: scale(0.96); }
        .support-feature-card.support-card-exit { opacity: 0; filter: blur(2px); }
        .support-feature-card.dynamic-cut {
            -webkit-mask-image: var(--support-mask);
            mask-image: var(--support-mask);
            -webkit-mask-repeat: no-repeat; mask-repeat: no-repeat;
            -webkit-mask-size: 100% 100%; mask-size: 100% 100%;
        }
        .support-card-content { position: relative; z-index: 2; height: 100%; box-sizing: border-box; overflow: hidden; }
        .support-curve-outline {
            display: none; position: absolute; z-index: 1; pointer-events: none;
            border: 1px solid var(--support-accent); border-radius: 50%;
            box-shadow: 0 0 16px color-mix(in srgb, var(--support-accent) 44%, transparent);
        }
        .support-feature-card.dynamic-cut .support-curve-outline { display: block; }
        #support-cards-container.layout-dynamic .support-feature-card { border-radius: 10px; }
        #support-cards-container.layout-dense .support-card-kicker { font-size: 10px; letter-spacing: 1.3px; }
        #support-cards-container.layout-dense .support-card-title { font-size: 17px; }
        #support-cards-container.layout-dense .support-card-primary { font-size: 24px; }
        #support-cards-container.layout-dense .support-card-secondary { font-size: 12px; }
        #support-cards-container.layout-dense .support-card-status { font-size: 11px; margin-top: 7px; padding: 5px 7px; }
        #support-cards-container.layout-dense .support-card-rule { margin: 6px 0 7px; }
        .support-card-kicker { font-size: 11px; color: #94a3b8; letter-spacing: 1.6px; font-weight: 700; }
        .support-card-title { margin-top: 2px; font-size: 20px; line-height: 1.03; color: #f8fafc; font-weight: 700; letter-spacing: 0.8px; }
        .support-card-rule { height: 1px; margin: 8px 0 9px; background: linear-gradient(90deg, rgba(148,163,184,0.55), transparent); }
        .support-card-primary { margin-top: 2px; color: #ffffff; font-family: 'Segoe UI', sans-serif; font-size: 30px; line-height: 0.98; font-weight: 700; letter-spacing: 0.4px; text-shadow: 0 2px 8px rgba(0,0,0,0.55); white-space: normal; }
        .support-card-primary.safe { color: #6ee7b7; }
        .support-card-primary.caution { color: #fde047; }
        .support-card-primary.danger { color: #fb7185; }
        .support-card-secondary { margin-top: 8px; color: #cbd5e1; font-size: 14px; line-height: 1.1; font-weight: 700; letter-spacing: 0.35px; }
        .support-card-status { margin-top: 10px; padding: 6px 8px; border-radius: 4px; font-size: 12px; font-weight: 700; letter-spacing: 0.8px; text-align: center; }
        .support-card-status.safe { color: #6ee7b7; background: rgba(16,185,129,0.12); border: 1px solid rgba(16,185,129,0.35); }
        .support-card-status.caution { color: #fde047; background: rgba(234,179,8,0.12); border: 1px solid rgba(234,179,8,0.35); }
        .support-card-status.danger { color: #fb7185; background: rgba(244,63,94,0.12); border: 1px solid rgba(244,63,94,0.35); }

        /* 본선 정보는 2D 화면 패닝/확대축소와 무관한 고정 HUD로 항상 최상단에 유지 */
        #os-fixed-hud {
            display: none; position: absolute; top: 9px; left: 50%; transform: translateX(-50%); z-index: 45; pointer-events: none;
            align-items: center; justify-content: center; gap: clamp(5px, 0.7vw, 10px); max-width: min(80vw, 760px);
            padding: 6px 10px; box-sizing: border-box; border-radius: 5px;
            background: rgba(5,10,18,0.92); border: 1px solid rgba(16,185,129,0.72);
            box-shadow: 0 5px 16px rgba(0,0,0,0.42), 0 0 10px rgba(16,185,129,0.16);
            color: #d1fae5; font-family: 'Segoe UI', sans-serif; font-size: clamp(10px, 1.2vw, 14px); font-weight: 700;
            white-space: nowrap; overflow: hidden;
        }
        #os-fixed-hud.visible { display: flex; }
        #os-fixed-hud .os-hud-name { color: #34d399; font-size: 1.08em; letter-spacing: 1px; }
        #os-fixed-hud .os-hud-item { color: #94a3b8; }
        #os-fixed-hud .os-hud-item b { color: #ffffff; margin-left: 3px; }

        /* Online pause: independent overlay left of the existing HUD; does not shift the HUD/layout. */
        #online-pause-btn {
            display: none; position: absolute; z-index: 47; pointer-events: auto;
            height: 30px; min-width: 72px; box-sizing: border-box; padding: 0 10px;
            border: 1px solid rgba(100,116,139,0.72); border-radius: 5px;
            background: rgba(9,15,26,0.96); color: #cbd5e1;
            font-family: 'Segoe UI', sans-serif; font-size: 12px; font-weight: 800; letter-spacing: 0.5px;
            cursor: pointer; user-select: none;
        }
        #online-pause-btn.visible { display: block; }
        #online-pause-btn:hover { border-color: rgba(148,163,184,0.92); color: #ffffff; }
        #online-pause-btn.paused { color: #fde047; border-color: rgba(234,179,8,0.82); }

        /* ARC recommendation cost weights: independent overlay beside the existing OS HUD. */
        #arc-weight-controls {
            display: none; position: absolute; z-index: 47; pointer-events: auto;
            flex-direction: column; gap: 4px;
        }
        #arc-weight-controls.visible { display: flex; }
        .arc-weight-btn {
            width: 138px; height: 28px; box-sizing: border-box; padding: 0 8px;
            border: 1px solid rgba(100,116,139,0.72); border-radius: 5px;
            background: rgba(9,15,26,0.96); color: #cbd5e1;
            font-family: 'Segoe UI', sans-serif; font-size: 11px; font-weight: 800;
            letter-spacing: 0.25px; text-align: center; cursor: ns-resize; user-select: none;
        }
        .arc-weight-btn:hover { border-color: rgba(250,204,21,0.85); color: #ffffff; }
        .arc-weight-btn:focus, .arc-weight-btn:focus-visible { outline: none; }
        .arc-weight-btn b { color: #fde047; margin-left: 3px; font-weight: 800; }

        /* 실험용 ODD/OE 상태 라이트: 기존 HUD 레이아웃을 밀지 않는 독립 오버레이 */
        #odd-oe-light {
            display: none; position: absolute; z-index: 46; pointer-events: none;
            width: 27px; height: 27px; box-sizing: border-box; border-radius: 50%;
            background: #34d399; border: 2px solid rgba(255,255,255,0.88);
            box-shadow: 0 0 0 2px rgba(5,10,18,0.92), 0 0 11px rgba(52,211,153,0.78);
            transition: background-color 120ms linear, box-shadow 120ms linear;
        }
        #odd-oe-light.visible { display: block; }

        /* 사용자가 직접 조정하는 최소 피항거리: 지원기능이 켜졌을 때만 RANGE 아래에 표시 */
        #hud-min-cpa {
            display: none; position: absolute; top: 102px; left: 50%; transform: translateX(-50%);
            z-index: 30; width: 224px; height: 50px; box-sizing: border-box; padding: 5px 12px;
            align-items: center; justify-content: center; flex-direction: column;
            color: #111827; background: #facc15; border: 1px solid #fde047; border-radius: 5px;
            font-family: 'Segoe UI', sans-serif; text-align: center; font-weight: 700; cursor: ns-resize;
            box-shadow: 0 5px 18px rgba(0,0,0,0.45), 0 0 12px rgba(250,204,21,0.36); pointer-events: auto; user-select: none;
        }
        #hud-min-cpa.visible { display: flex; }
        #hud-min-cpa:hover { box-shadow: 0 5px 18px rgba(0,0,0,0.45), 0 0 19px rgba(250,204,21,0.62); }
        #hud-min-cpa .min-cpa-label { display:block; font-size: 10px; letter-spacing: 1.25px; line-height: 1; opacity: 0.82; }
        #hud-min-cpa .min-cpa-value { display:block; margin-top: 2px; font-size: 19px; line-height: 1; letter-spacing: 0.6px; }


        /* ACTION & CONTROL 목표 HDG 수동설정: 기존 레이아웃을 밀지 않는 오버레이 */
        #hud-action-target {
            display: none; position: absolute; top: 156px; left: 50%; transform: translateX(-50%); z-index: 48;
            width: 224px; height: 50px; box-sizing: border-box; padding: 4px 11px;
            align-items: center; justify-content: center; flex-direction: column;
            background: rgba(5,10,18,0.94); border: 1px solid rgba(16,185,129,0.78); border-radius: 5px;
            box-shadow: 0 5px 18px rgba(0,0,0,0.45), 0 0 12px rgba(16,185,129,0.18);
            font-family: 'Segoe UI', sans-serif; text-align: center; cursor: ns-resize; pointer-events: auto; user-select: none;
        }
        #hud-action-target.visible { display: flex; }
        #hud-action-target .action-target-label { display:block; color:#94a3b8; font-size:10px; line-height:1; letter-spacing:1.15px; font-weight:700; }
        #hud-action-target .action-target-value { display:block; margin-top:3px; color:#6ee7b7; font-size:20px; line-height:1; letter-spacing:0.7px; font-weight:700; }
        #hud-action-target .action-target-mode { display:block; margin-top:4px; color:#cbd5e1; font-size:10px; line-height:1; letter-spacing:0.75px; font-weight:700; }
        #hud-action-target.required { border-color: rgba(234,179,8,0.92); box-shadow: 0 5px 18px rgba(0,0,0,0.45), 0 0 13px rgba(234,179,8,0.24); }
        #hud-action-target.required .action-target-value { color:#fde047; }

        #steering-model-status {
            display:none; position:absolute; top:82px; right:15px; z-index:49; pointer-events:none;
            min-width:214px; max-width:330px; box-sizing:border-box; padding:7px 10px;
            border-radius:5px; background:rgba(5,10,18,0.94); border:1px solid rgba(148,163,184,0.5);
            color:#cbd5e1; font-family:'Segoe UI',sans-serif; font-size:12px; font-weight:700; letter-spacing:0.5px; text-align:center;
            box-shadow:0 5px 16px rgba(0,0,0,0.42); opacity:0; transform:translateY(-4px); transition:opacity 140ms ease, transform 140ms ease;
        }
        #steering-model-status.visible { display:block; opacity:1; transform:translateY(0); }
        #steering-model-status.working { color:#fde047; border-color:rgba(234,179,8,0.62); }
        #steering-model-status.success { color:#6ee7b7; border-color:rgba(16,185,129,0.62); }
        #steering-model-status.error { color:#fb7185; border-color:rgba(244,63,94,0.62); }

        /* 화면 높이가 작아져도 하단 18개 버튼이 잘리지 않도록 동일한 3분할 구조 안에서만 축소 */
        @media (max-height: 760px) {
            #bottom-view-wrapper { flex-basis: clamp(150px, 23vh, 188px); min-height: 150px; }
            .split-side-panel { padding: 8px 10px; }
            .panel-title { font-size: 14px; margin-bottom: 6px; padding-bottom: 4px; }
            .control-btn-grid { gap: 5px; }
            .placeholder-btn { padding: 7px 4px; font-size: 12px; line-height: 1.05; }
            .support-btn-code { min-width: 29px; margin-right: 3px; font-size: 9px; }
        }
        @media (max-height: 620px) {
            #bottom-view-wrapper { flex-basis: 146px; min-height: 146px; }
            .split-side-panel { padding: 6px 8px; }
            .panel-title { font-size: 12px; margin-bottom: 4px; padding-bottom: 3px; }
            .control-btn-grid { gap: 4px; }
            .placeholder-btn { padding: 5px 3px; font-size: 11px; }
        }


        /* ===== v6 feedback adjustments: visual hierarchy / controls only ===== */
        .hud-range { display: none !important; }
        #hud-min-cpa { top: 48px; box-shadow: none !important; }
        #hud-action-target { top: 102px; box-shadow: none !important; }
        #hud-action-target.required { box-shadow: none !important; }
        #steering-model-status { box-shadow: none !important; }

        /* Remove glow / blur first; emphasis can be added back selectively later. */
        .hud-label, .support-card-primary { text-shadow: none !important; }
        .target-info-panel, .support-feature-card, .support-feature-card.sa,
        .support-feature-card.dm, .support-feature-card.act, .support-curve-outline,
        #os-fixed-hud, #hud-min-cpa, #hud-action-target, #steering-model-status {
            box-shadow: none !important;
            backdrop-filter: none !important;
            -webkit-backdrop-filter: none !important;
            filter: none !important;
        }

        /* Compact one-row controls inside each of the three existing groups. */
        #bottom-view-wrapper {
            flex: 0 0 clamp(96px, 12.5vh, 122px); min-height: 92px; max-height: 122px;
        }
        .split-side-panel { padding: 8px 9px; }
        .panel-title { margin-bottom: 5px; padding-bottom: 3px; font-size: clamp(10px, 1.25vh, 14px); }
        .control-btn-grid {
            grid-template-rows: minmax(0, 1fr);
            gap: 4px;
        }
        .split-side-panel:nth-child(1) .control-btn-grid { grid-template-columns: repeat(3, minmax(0, 1fr)); }
        .split-side-panel:nth-child(2) .control-btn-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
        .split-side-panel:nth-child(3) .control-btn-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
        .placeholder-btn { padding: 5px 2px; font-size: clamp(18px, 2.30vh, 24px); line-height: 1.0; }
        .support-btn-code { display: block; min-width: 0; margin: 0 0 2px 0; font-size: 16px; }
        .act-control-grid .act-btn { grid-column: auto; }

        /* Neutral information hierarchy: gray by default, red only for danger. */
        .support-feature-card {
            --support-accent: rgba(100,116,139,0.78) !important;
            background: rgba(9,15,26,0.96);
            border-color: rgba(100,116,139,0.72) !important;
            pointer-events: auto;
            resize: both;
            overflow: hidden;
            min-width: 190px;
            min-height: 104px;
            max-width: 390px;
            max-height: 320px;
            transition: opacity 140ms ease !important;
        }
        .support-card-content { overflow: hidden; padding-top: 12px; }
        .support-card-kicker {
            position: absolute; top: 7px; right: 9px; z-index: 3;
            color: #7f8b9d !important; font-size: 9px !important; letter-spacing: 1px;
        }
        .support-card-title {

        }

        .support-card-primary.danger { color: #fb7185 !important; }
        .support-card-secondary { color: #9ca3af; }
        .support-card-status.safe, .support-card-status.caution {
            color: #9ca3af; background: transparent; border-color: rgba(100,116,139,0.45);
        }
        .support-card-status.danger { color: #fb7185; background: transparent; border-color: rgba(244,63,94,0.55); }
        .support-feature-card[data-support-key="act:rot-guidance"] .support-card-primary { font-size: 21px !important; line-height: 1.05; }
        .support-feature-card[data-support-key="act:rot-guidance"] .support-card-secondary { font-size: 17px !important; line-height: 1.08; }

        /* Narrower target-information window. */
        .target-info-panel { width: 178px; padding: 10px 11px; background: rgba(12,18,29,0.97); resize: both; overflow: auto; min-width: 160px; min-height: 190px; max-width: 320px; max-height: 440px; }
        .tgt-title { color: #cbd5e1; font-family: 'Segoe UI', sans-serif; }
        .tgt-val { color: #cbd5e1; }
        .tgt-row { font-size: 13px; }

        #os-fixed-hud { border-color: rgba(100,116,139,0.72); color: #cbd5e1; }
        #os-fixed-hud .os-hud-name { color: #cbd5e1; }
        #hud-min-cpa { background: rgba(12,18,29,0.97); color: #cbd5e1; border-color: rgba(100,116,139,0.72); }
        #hud-min-cpa .min-cpa-value { color: #cbd5e1; }

        #hud-action-target.required { border-color: rgba(234,179,8,0.82); }
        #hud-action-target.required .action-target-value { color: #fde047; }

        @media (max-height: 760px) {
            #bottom-view-wrapper { flex-basis: 94px; min-height: 90px; }
            .split-side-panel { padding: 5px 6px; }
            .panel-title { font-size: 11px; margin-bottom: 3px; padding-bottom: 2px; }
            .placeholder-btn { padding: 3px 1px; font-size: 18px; }
        }

        /* Experiment recording: one top-right toggle. OFF=idle, red=recording. */
        #experiment-record-controls {
            position: absolute; top: 15px; right: 15px; z-index: 47;
            display: flex; align-items: center;
            pointer-events: auto;
        }
        .experiment-record-btn {
            min-width: max-content; min-height: max-content; height: 34px; box-sizing: border-box; padding: 0 13px;
            border: 1px solid rgba(100,116,139,0.72); border-radius: 4px;
            background: rgba(9,15,26,0.96); color: #cbd5e1;
            font-family: 'Segoe UI', sans-serif; font-size: 12px; font-weight: 700;
            white-space: nowrap; cursor: pointer;
        }
        #experiment-record-toggle.recording {
            color: #ffffff; background: #dc2626; border-color: #f87171;
        }

        /* Text-fit rule: do not create accidental line breaks when fonts grow.
           The button/window grows to the content instead. Explicit <br> remains intentional. */
        .placeholder-btn, .experiment-record-btn,
        .support-card-kicker, .support-card-title, .support-card-primary,
        .tgt-title, .tgt-row {
            white-space: nowrap;
        }
        #bottom-view-wrapper { overflow-x: auto; overflow-y: hidden; }
        .split-side-panel { min-width: max-content; }
        .control-btn-grid { overflow: visible; }
        .split-side-panel:nth-child(1) .control-btn-grid { grid-template-columns: repeat(3, minmax(max-content, 1fr)); }
        .split-side-panel:nth-child(2) .control-btn-grid { grid-template-columns: repeat(2, minmax(max-content, 1fr)); }
        .split-side-panel:nth-child(3) .control-btn-grid { grid-template-columns: repeat(2, minmax(max-content, 1fr)); }
        .placeholder-btn { min-width: max-content; min-height: max-content; overflow: visible; }
        .support-feature-card { min-width: max-content; min-height: max-content; }
        .target-info-panel { min-width: max-content; min-height: max-content; }

        /* v15: per-button live settings. Existing group/button layout is preserved. */
        .support-btn-main { display: block; white-space: nowrap; }
        .support-btn-setting {
            display: none; margin-top: 4px; white-space: nowrap;
            font-size: 0.56em; line-height: 1.0; font-weight: 700; opacity: 0.82;
        }
        .placeholder-btn.active-btn .support-btn-setting { display: block; }
        .placeholder-btn.has-inline-setting {
            display: flex; flex-direction: column; align-items: center; justify-content: center;
        }

        /* v16: cursor position readout, own-ship origin. */
        #cursor-brg-dist {
            display: none; position: absolute; left: 18px; bottom: 38px; z-index: 46;
            pointer-events: none; user-select: none; white-space: nowrap;
            padding: 5px 8px; border-radius: 4px;
            background: rgba(9,15,26,0.90); border: 1px solid rgba(100,116,139,0.55);
            color: #cbd5e1; font-family: 'Segoe UI', sans-serif; font-size: 13px; font-weight: 700;
            letter-spacing: 0.45px;
        }
        #cursor-brg-dist.visible { display: block; }


        /* v10 accessibility zoom: keep the existing three-panel layout, but never create a horizontal scrollbar.
           When text grows (browser zoom), button copy wraps inside the button instead. */
        #bottom-view-wrapper { overflow-x: hidden !important; overflow-y: hidden !important; }
        .split-side-panel { min-width: 0 !important; overflow: hidden !important; }
        .control-btn-grid { min-width: 0 !important; overflow: hidden !important; }
        .split-side-panel:nth-child(1) .control-btn-grid { grid-template-columns: repeat(3, minmax(0, 1fr)) !important; }
        .split-side-panel:nth-child(2) .control-btn-grid { grid-template-columns: repeat(2, minmax(0, 1fr)) !important; }
        .split-side-panel:nth-child(3) .control-btn-grid { grid-template-columns: repeat(2, minmax(0, 1fr)) !important; }
        .placeholder-btn {
            min-width: 0 !important; max-width: 100% !important; overflow: hidden !important;
            white-space: normal !important; overflow-wrap: anywhere; word-break: normal;
            line-height: 1.08 !important;
        }
        .support-btn-main, .support-btn-setting {
            white-space: normal !important; overflow-wrap: anywhere; word-break: normal;
        }


        /* ===== Online experiment shell: overlays only, main Navigation Supporter layout unchanged ===== */
        #online-login-overlay, #online-finish-overlay {
            position: fixed; inset: 0; z-index: 100000;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            background: rgba(5,10,18,0.985); color: #e5e7eb; text-align: center;
            font-family: 'Segoe UI', sans-serif;
        }
        #online-finish-overlay { display: none; }
        .online-menu-box {
            width: min(390px, calc(100vw - 40px)); box-sizing: border-box;

        }
        .online-form-row { margin-bottom: 18px; text-align: left; }
        .online-form-row label { display: block; margin-bottom: 7px; color: #9ca3af; font-size: 13px; font-weight: 700; }
        .online-form-row input, .online-form-row select {
            width: 100%; box-sizing: border-box; padding: 10px 11px; border-radius: 4px;
            border: 1px solid #475569; background: #0b0f19; color: #f8fafc; font-size: 15px; outline: none;
        }
        .online-form-row input:focus, .online-form-row select:focus { border-color: #06b6d4; }
        .online-start-btn {
            width: 100%; padding: 11px 12px; border: 1px solid #0891b2; border-radius: 4px;
            background: #0e7490; color: white; font-weight: 800; font-size: 16px; cursor: pointer;
        }
        .online-start-btn:disabled { opacity: 0.55; cursor: default; }
        .online-finish-title { font-size: 30px; font-weight: 800; color: #34d399; margin-bottom: 12px; }
        .online-finish-desc { color: #cbd5e1; font-size: 16px; }

    </style>
</head>
<body>


    <div id="online-login-overlay">
        <h1 style="font-size:38px; margin:0 0 8px; letter-spacing:1px;">[HTMS] Navigation Supporter</h1>
        <div style="color:#06b6d4; letter-spacing:4px; font-size:14px; margin-bottom:30px;">ONLINE SIMULATION</div>
        <div class="online-menu-box">
            <div class="online-form-row">
                <label>학번 (Student ID)</label>
                <input type="text" id="online-student-id" placeholder="예: 20261234" autocomplete="off" />
            </div>
            <div class="online-form-row">
                <label>이름 (Name)</label>
                <input type="text" id="online-student-name" placeholder="예: 홍길동" autocomplete="off" />
            </div>
            <div class="online-form-row">
                <label>시나리오 (Scenario)</label>
                <select id="online-scenario-select"><option value="">목록 로딩 중...</option></select>
            </div>
            <button type="button" class="online-start-btn" id="online-start-btn" onclick="startOnlineLogin()">시작하기</button>
        </div>
    </div>

    <div id="online-finish-overlay">
        <div id="online-finish-title" class="online-finish-title">데이터 전송 중...</div>
        <div id="online-finish-desc" class="online-finish-desc">Navigation Supporter 실험 결과를 저장하고 있습니다.</div>
    </div>


    <div id="main-wrapper">
        <div id="top-view-area">
            <div class="hud-label">[HTMS] Navigation Supporter</div>
            <button type="button" id="online-pause-btn" onclick="toggleOnlinePause()">PAUSE</button>
            <div id="arc-weight-controls" aria-label="ARC plan adjustment">
                <button type="button" class="arc-weight-btn" id="arc-plan-adjustment" title="마우스 휠: PLAN ADJ 조정 · 1.0은 균형, 값이 커질수록 Goal 추종 우선, 작아질수록 변침 억제 우선">PLAN ADJ <b id="arc-plan-adjustment-value">1.00</b></button>
            </div>
            <div id="os-fixed-hud">
                <span class="os-hud-name">OS</span>
                <span class="os-hud-item">HDG <b id="os-hud-hdg">---</b></span>
                <span class="os-hud-item">COG <b id="os-hud-cog">---</b></span>
                <span class="os-hud-item">SOG <b id="os-hud-sog">---</b></span>
                <span class="os-hud-item">ROT <b id="os-hud-rot">---</b></span>
                <span class="os-hud-item">RUD CMD <b id="os-hud-rud-cmd">---</b></span>
                <span class="os-hud-item">RUD ACT <b id="os-hud-rud-act">---</b></span>
            </div>
            <div id="odd-oe-light" title="ODD/OE 상태"></div>
            <div id="steering-model-status"></div>
            
            <div id="target-panels-container"></div>

            <div id="support-cards-container"></div>
            <div id="cursor-brg-dist">BRG ---° &nbsp; DIST --.-- NM</div>

            <canvas id="main-2d-canvas" class="vp-canvas"></canvas>
        </div>

        <div id="bottom-view-wrapper">
            <div class="split-side-panel">
                <div class="panel-title support-group-toggle" data-support-group-title="sa" title="클릭: 상황인지 3개 기능 전체 ON / OFF" style="color: var(--accent-cyan);">SITUATION AWARENESS</div>
                <div class="control-btn-grid">
                    <button class="placeholder-btn sa-btn has-inline-setting" data-support-group="sa" data-support-feature="future-position" title="본선 전방 5 NM·후방 1 NM 범위 선박의 미래 위치를 표시 · 버튼 위 휠로 시간 간격 조정"><span class="support-btn-main">미래 위치</span><span class="support-btn-setting" data-setting-role="future-interval">60s</span></button>
                    <button class="placeholder-btn sa-btn has-inline-setting" data-support-group="sa" data-support-feature="threat-highlight" title="설정 CPA보다 위험한 선박만 빨간색으로 강조 · 버튼 위 휠로 위험 CPA 0.05 NM씩 조정"><span class="support-btn-main">위험 선박 강조</span><span class="support-btn-setting" data-setting-role="target-cpa">위험 CPA : 0.50 NM</span></button>
                    <button class="placeholder-btn sa-btn" data-support-group="sa" data-support-feature="approach-ranking" title="본선 반경 5 NM 이내 모든 선박의 CPA와 TCPA를 기준으로 우선 감시 순위를 표시"><span class="support-btn-main">우선 감시 선박</span></button>
                </div>
            </div>

            <div class="split-side-panel">
                <div class="panel-title support-group-toggle" data-support-group-title="dm" title="클릭: 의사결정 2개 기능 전체 ON / OFF" style="color: var(--accent-yellow);">DECISION MAKING</div>
                <div class="control-btn-grid">
                    <button class="placeholder-btn dm-btn has-inline-setting" data-support-group="dm" data-support-feature="safe-heading-band" title="설정 CPA 기준의 위험 ARC만 표시 · 버튼 위 휠로 목표 CPA 0.05 NM씩 조정"><span class="support-btn-main">위험 HDG 표시</span><span class="support-btn-setting" data-setting-role="target-cpa">목표 CPA : 0.50 NM</span></button>
                    <button class="placeholder-btn dm-btn has-inline-setting" data-support-group="dm" data-support-feature="minimum-alteration" title="ARC 1분 Time Ring 피항경로 · 현재 목표 웨이포인트까지 위험 HDG 벽을 피해 탐색 · 버튼 위 휠로 목표 CPA 0.05 NM씩 조정"><span class="support-btn-main">추천항로</span><span class="support-btn-setting" data-setting-role="target-cpa">목표 CPA : 0.50 NM</span></button>
                </div>
            </div>

            <div class="split-side-panel">
                <div class="panel-title support-group-toggle" data-support-group-title="act" title="클릭: 행동·조종 2개 기능 전체 ON / OFF" style="color: var(--accent-green);">ACTION & CONTROL</div>
                <div class="control-btn-grid act-control-grid">
                    <button class="placeholder-btn act-btn has-inline-setting" data-support-group="act" data-support-feature="rudder-balance" title="PID Rudder 제안 · 버튼 위 휠로 목표 HDG 조정"><span class="support-btn-main">러더 제안</span><span class="support-btn-setting" data-setting-role="target-hdg">목표 HDG : ---°</span></button>
                    <button class="placeholder-btn act-btn has-inline-setting" data-support-group="act" data-support-feature="rot-balance" title="PID 기반 ROT 제안 · 버튼 위 휠로 목표 HDG 조정"><span class="support-btn-main">ROT 제안</span><span class="support-btn-setting" data-setting-role="target-hdg">목표 HDG : ---°</span></button>
                </div>
            </div>
        </div>
    </div>

    <script>
        // ==========================================
        // 1. HTMS 기본 상수 및 상태 변수
        // ==========================================
        const DEG2RAD = Math.PI / 180;
        const SHIP_LEN_UNIT = 64.8;  
        const SHIP_WID_UNIT = 10.8; 
        const VECTOR_SCALE = 8;     

        let systemLogs = [];
        let simStartTime = performance.now();
        let simEntities = []; 
        let isSimulationRunning = false;
        let scenarioRouteData = null;
        let scenarioRouteAnchor = null;
        let forcedStraightRouteAnchor = null;

        const canvas = document.getElementById('main-2d-canvas');
        const container = document.getElementById('top-view-area');
        const panelsContainer = document.getElementById('target-panels-container');
        
        let vObj = {
            panX: 0, panY: 0, 
            panOffsetX: 0, panOffsetY: 0,
            viewScale: 1 / 3.0, 
            isDragging: false, 
            dragStartX: 0, dragStartY: 0, 
            hasDragged: false,
            massEntity: null 
        };

        let selectedTargetIds = new Set();
        let panelSpawnOffset = 0;


        // ==========================================
        // HTMS Navigation Support - 교체 가능한 계산 모델 / UI 상태
        // ==========================================
        const SUPPORT_CONFIG = Object.freeze({
            // User-defined screening thresholds / ranges. Encounter values themselves are calculated from live data.
            safeCpaNM: 0.50,
            cautionCpaNM: 1.00,
            supportRadiusNM: 10.0,
            futureRadiusNM: 5.0,
            futureAsternNM: 1.0,
            safeBandDisplayStepDeg: 5.0,
            horizonMin: 10,
            futureMinutes: [1, 2, 3, 4, 5],
            headingBandSpanDeg: 225,
            headingStepDeg: 2.5,
            compareAlterDeg: 20,
            whatIfStepDeg: 7.5,
            whatIfCpaLevels: [0.10,0.20,0.30,0.40,0.50,0.60,0.70,0.80,0.90,1.00],
            whatIfMaxTurnLimitDeg: 90,
            whatIfHeadingStepDeg: 3,
            whatIfRecalcMs: 1000,
            recommendedArcRecalcMs: 1000,
            recommendedArcTRSec: 60,
            recommendedArcTurnLimitStepDeg: 1,
            routeStepSec: 10,
            // Replaceable generic merchant-ship maneuver assumption for the temporary model.
            routeTurnRateDegPerMin: 12,
            routeRejoinDelayMin: 1.5,
            arcTRSec: 60,
            arcPlanningMaxMin: 30,
            arcHeadingStepDeg: 1,
            arcTurnWeight: 2.0,
            arcGoalWeight: 1.0,
            // ARC virtual-goal / rejoin guidance. The actual route search still uses the
            // existing 1 min Time Rings and the temporary merchant-ship turn-rate model.
            arcVirtualGoalMinNM: 5.0,
            arcRejoinCrossTrackNM: 0.10,
            arcRejoinHeadingToleranceDeg: 15.0,
            maxRudderDeg: 35,
            rudderStepDeg: 5,
            rudderKp: 0.65,
            rudderKd: 0.40,
            maxTargetRotDegPerMin: 15,
            rotKp: 0.25,
            easeTauSec: 20
        });

        const ARC_PLAN_ADJUSTMENT_OPTIONS = Object.freeze([0.05, 0.10, 0.20, 1/3, 0.50, 1.00, 2.00, 3.00, 5.00, 10.00, 20.00]);
        let arcPlanAdjustment = 1.00;
        const arcCostWeightSettings = { goal: 1.0, altering: 1.0 };

        function applyArcPlanAdjustment() {
            const ratio = Math.max(0.01, Number(arcPlanAdjustment) || 1.0);
            // Only the relative ratio matters to route ranking. Normalize the pair so
            // W_goal + W_altering = 2, preventing arbitrary common scaling of all costs.
            arcCostWeightSettings.goal = (2 * ratio) / (1 + ratio);
            arcCostWeightSettings.altering = 2 / (1 + ratio);
        }
        applyArcPlanAdjustment();

        // 사용자에게 보이는 기능명/설명만 한글화. 계산 key와 내부 모델명은 그대로 유지한다.
        const SUPPORT_FEATURE_KO = Object.freeze({
            'sa:future-position': { label: '미래 위치', description: '전방 5 NM·후방 1 NM 범위의 본선/타선 미래 위치를 반투명 선박으로 표시' },
            'sa:threat-highlight': { label: '위험 선박 강조', description: '설정 CPA보다 위험한 선박만 빨간색으로 강조' },
            'sa:relative-motion': { label: '상대운동', description: '본선 기준 상대운동으로 1·2·3·4·5분 후 상대 위치를 표시' },
            'sa:approach-ranking': { label: '우선 감시 선박', description: '본선 반경 5 NM 이내 모든 선박의 CPA와 TCPA를 기준으로 우선 감시 순위를 표시' },
            'sa:maneuver-trend': { label: '조종 추세', description: 'ROT를 이용해 PORT·STBD 선회 추세를 표시' },
            'dm:safe-heading-band': { label: '위험 HDG 표시', description: '설정 CPA 기준으로 진입하면 안 되는 ARC만 표시' },
            'dm:minimum-alteration': { label: '추천항로', description: '1분 Time Ring의 위험 HDG 벽을 피해 현재 목표 웨이포인트로 향하는 가능한 ARC 경로를 표시' },
            'dm:port-starboard': { label: 'PORT / STBD 비교', description: '양쪽 동일 변침 시 예상 CPA를 비교' },
            'dm:speed-option': { label: '속력 대안', description: '침로 유지 시 안전한 속력 대안을 표시' },
            'act:rudder-balance': { label: '러더 제안', description: '현재 Rudder와 PID 목표 Rudder를 비교해 우현·좌현·유지 방향을 표시' },
            'act:rot-balance': { label: 'ROT 제안', description: 'PID 목표 Rudder와 레이더 시뮬레이터 선박동역학으로 현재 ROT의 변화 방향을 표시' }
        });

        // Every button is an independent toggle. Multiple SA/DM/ACT features may coexist.
        const activeSupportFeatures = new Set();
        let supportFocus = { group: null, feature: null };

        // ACTION & CONTROL: BallTree + Captain/Helmsman Q는 내부 의도 추출/Adaptive PID gain 조절에만 사용.
        // 운항자에게 보이는 비교 기준은 Adaptive PID 결과만 사용하며 SA/DM 계산에는 관여하지 않는다.
        let latestControlGuidance = null;
        let controlRequestInFlight = false;
        let dataRequestInFlight = false;
        let controlAbortController = null;
        const CONTROL_REQUEST_TIMEOUT_MS = 10000;
        const ACTION_HEADING_COMMIT_DELAY_MS = 350;
        let actionHeadingCommitTimer = null;
        let steeringSessionId = null;
        let steeringResetPromise = null;
        let controlPolicyReady = false;
        let controlPolicyTargetHeading = null;
        let controlGuidanceDirty = true;
        let steeringStatusTimer = null;
        let steeringStatusPhaseTimer = null;
        const actionTargetSettings = { manualHeading: null, manualOverride: false, stepDeg: 1.0, requestStateTimeSec: null };
        const futureProjectionSettings = { intervalSec: 60, minIntervalSec: 30, stepSec: 30 };
        let controlGuidanceGeneration = 0;
        let frameLabelBoxes = [];
        let supportCardCreationCounter = 0;
        let lastInputDiagnosticsKey = '';

        // CPA는 버튼별로 독립 저장한다. 한 기능에서 휠로 바꾼 CPA가 다른 기능 계산에 섞이지 않는다.
        const supportUserSettings = {
            cpaByFeature: {
                'sa:threat-highlight': SUPPORT_CONFIG.safeCpaNM,
                'dm:safe-heading-band': SUPPORT_CONFIG.safeCpaNM,
                'dm:minimum-alteration': SUPPORT_CONFIG.safeCpaNM
            },
            minAllowedNM: 0.10,
            maxAllowedNM: 3.00,
            stepNM: 0.05
        };

        // Danger HDG and Recommended Route must always use the same navigator-selected CPA.
        const SHARED_ARC_CPA_FEATURES = new Set(['dm:safe-heading-band', 'dm:minimum-alteration']);

        // ARC guidance reference. When MIN ALTERATION / WHAT-IF is first enabled,
        // capture the original track and a fixed virtual goal ahead of it. While either
        // ARC feature remains active, every new live-data update recomputes the desired
        // goal bearing from the CURRENT OS position to this SAME goal. This mirrors the
        // supplied MATLAB test's receding-horizon behaviour: plan -> execute/advance ->
        // recompute v_desired toward a fixed goal, rather than redefining the goal from
        // the already-altered course at every frame.
        let arcNavigationReference = null;

        function resetArcNavigationReference() {
            arcNavigationReference = null;
        }

        function geoOffsetMeters(fromLat, fromLon, toLat, toLon) {
            if (![fromLat, fromLon, toLat, toLon].every(Number.isFinite)) return null;
            const midLat = (fromLat + toLat) * 0.5 * DEG2RAD;
            return {
                east: (toLon - fromLon) * 60.0 * 1852.0 * Math.cos(midLat),
                north: (toLat - fromLat) * 60.0 * 1852.0
            };
        }

        function getScenarioRouteRelativePoints(os) {
            if (!os || !scenarioRouteData || !Array.isArray(scenarioRouteData.local_waypoints)) return [];
            const ownWorld = shipPositionMeters(os);
            return scenarioRouteData.local_waypoints
                .map((wp, index) => ({
                    name: String(wp.name ?? `WP${index}`),
                    index,
                    east: Number(wp.east_m) - ownWorld.east,
                    north: Number(wp.north_m) - ownWorld.north
                }))
                .filter(pt => Number.isFinite(pt.east) && Number.isFinite(pt.north));
        }

        function originToSegmentDistance(a, b) {
            const dx = b.east - a.east, dy = b.north - a.north;
            const dd = dx * dx + dy * dy;
            if (dd < 1e-9) return Math.hypot(a.east, a.north);
            const u = clampValue(-(a.east * dx + a.north * dy) / dd, 0, 1);
            return Math.hypot(a.east + dx * u, a.north + dy * u);
        }

        function getActiveScenarioRouteLeg(os) {
            const pts = getScenarioRouteRelativePoints(os);
            if (pts.length < 2) return null;
            let bestIndex = 0, bestDist = Infinity;
            for (let i = 0; i < pts.length - 1; i++) {
                const d = originToSegmentDistance(pts[i], pts[i + 1]);
                if (d < bestDist) { bestDist = d; bestIndex = i; }
            }
            const from = pts[bestIndex], to = pts[bestIndex + 1];
            const de = to.east - from.east, dn = to.north - from.north;
            const baseHeading = normalize360(Math.atan2(de, dn) / DEG2RAD);
            return { index: bestIndex, from, to, baseHeading, distanceToLegMeters: bestDist };
        }

        function getArcNavigationReference(os) {
            if (!os) return null;
            const p = shipPositionMeters(os);
            const osId = String(os.id ?? 'OS');
            const planned = getScenarioRouteRelativePoints(os);

            // Online experiment: ARC always aims at the waypoint that the simulator is
            // currently navigating to.  Do not infer another leg from nearest geometry.
            if (planned.length >= 2) {
                const rawTargetIndex = Number(onlineCurrentWaypointIndex);
                const targetIndex = clampValue(Number.isFinite(rawTargetIndex) ? Math.round(rawTargetIndex) : 1, 1, planned.length - 1);
                const from = planned[Math.max(0, targetIndex - 1)];
                const to = planned[targetIndex];
                const de = to.east - from.east;
                const dn = to.north - from.north;
                const baseHeading = normalize360(Math.atan2(de, dn) / DEG2RAD);
                const routeKey = `${scenarioRouteData && scenarioRouteData.source_file ? scenarioRouteData.source_file : 'route'}:${targetIndex}`;
                arcNavigationReference = {
                    osId, routeKey, routeBased: true,
                    originEast: p.east + from.east,
                    originNorth: p.north + from.north,
                    baseHeading,
                    goalDistanceNM: Math.hypot(to.east, to.north) / 1852,
                    goalEast: p.east + to.east,
                    goalNorth: p.north + to.north,
                    targetWaypointIndex: to.index,
                    targetWaypointName: to.name
                };
                return arcNavigationReference;
            }

            const needsNew = !arcNavigationReference || arcNavigationReference.osId !== osId || arcNavigationReference.routeBased;
            if (needsNew) {
                const baseHeading = normalize360(Number(os.cog) || Number(os.hdg) || 0);
                const speedKnots = Math.max(0.1, Number(os.sog) || 0);
                const horizonTravelNM = speedKnots * SUPPORT_CONFIG.horizonMin / 60;
                const goalDistanceNM = Math.max(SUPPORT_CONFIG.arcVirtualGoalMinNM, horizonTravelNM * 2);
                const distanceM = goalDistanceNM * 1852;
                const r = baseHeading * DEG2RAD;
                arcNavigationReference = {
                    osId, routeBased: false,
                    originEast: p.east,
                    originNorth: p.north,
                    baseHeading,
                    goalDistanceNM,
                    goalEast: p.east + Math.sin(r) * distanceM,
                    goalNorth: p.north + Math.cos(r) * distanceM
                };
            }
            return arcNavigationReference;
        }

        function arcReferenceGoalHeading(os, ref = getArcNavigationReference(os)) {
            if (!os || !ref) return normalize360(Number(os && os.cog) || 0);
            const p = shipPositionMeters(os);
            const de = ref.goalEast - p.east;
            const dn = ref.goalNorth - p.north;
            if (Math.hypot(de, dn) < 1) return ref.baseHeading;
            return normalize360(Math.atan2(de, dn) / DEG2RAD);
        }

        function arcReferenceCrossTrackMeters(worldEast, worldNorth, ref) {
            if (!ref) return 0;
            const de = worldEast - ref.originEast;
            const dn = worldNorth - ref.originNorth;
            const r = ref.baseHeading * DEG2RAD;
            // Positive/negative sign is not important for the rejoin acceptance test.
            return de * Math.cos(r) - dn * Math.sin(r);
        }

        function syncArcNavigationReferenceLifecycle() {
            const arcUiActive = activeSupportFeatures.has('dm:minimum-alteration');
            if (!arcUiActive) resetArcNavigationReference();
        }

        function getDesiredCpaNM(featureKey = null) {
            if (featureKey && Object.prototype.hasOwnProperty.call(supportUserSettings.cpaByFeature, featureKey)) {
                return Number(supportUserSettings.cpaByFeature[featureKey]);
            }
            return Number(SUPPORT_CONFIG.safeCpaNM);
        }
        function getCautionCpaNM(featureKey = null) {
            return Math.max(SUPPORT_CONFIG.cautionCpaNM, getDesiredCpaNM(featureKey) + 0.50);
        }
        function getFocusedCpaFeatureKey() {
            const key = supportFocus && supportFocus.group && supportFocus.feature
                ? `${supportFocus.group}:${supportFocus.feature}` : null;
            return key && Object.prototype.hasOwnProperty.call(supportUserSettings.cpaByFeature, key) ? key : null;
        }
        function getFutureProjectionSeconds() {
            return [1,2,3,4,5].map(n => n * futureProjectionSettings.intervalSec);
        }
        function formatFutureTime(seconds) {
            const s = Math.max(0, Number(seconds) || 0);
            if (s < 120 || s % 60 !== 0) return `${Math.round(s)}s`;
            return `${Math.round(s / 60)} min`;
        }
        window.HTMSSupportSettings = supportUserSettings;

        const supportCardsContainer = document.getElementById('support-cards-container');
        const minCpaControl = document.getElementById('hud-min-cpa');
        const minCpaValue = document.getElementById('hud-min-cpa-value');
        const osFixedHud = document.getElementById('os-fixed-hud');
        const onlinePauseBtn = document.getElementById('online-pause-btn');
        const arcWeightControls = document.getElementById('arc-weight-controls');
        const arcPlanAdjustmentButton = document.getElementById('arc-plan-adjustment');
        const arcPlanAdjustmentValue = document.getElementById('arc-plan-adjustment-value');
        const osHudHdg = document.getElementById('os-hud-hdg');
        const osHudCog = document.getElementById('os-hud-cog');
        const osHudSog = document.getElementById('os-hud-sog');
        const osHudRot = document.getElementById('os-hud-rot');
        const osHudRudCmd = document.getElementById('os-hud-rud-cmd');
        const osHudRudAct = document.getElementById('os-hud-rud-act');
        const oddOeLight = document.getElementById('odd-oe-light');
        const actionTargetControl = document.getElementById('hud-action-target');
        const actionTargetLabel = document.getElementById('action-target-label');
        const actionTargetValue = document.getElementById('action-target-value');
        const actionTargetMode = document.getElementById('action-target-mode');
        const steeringModelStatus = document.getElementById('steering-model-status');
        const experimentRecordToggle = document.getElementById('experiment-record-toggle');
        const cursorBrgDist = document.getElementById('cursor-brg-dist');

        function formatArcPlanAdjustment(value) {
            const v = Number(value) || 1;
            if (v < 0.1) return v.toFixed(2);
            if (v < 1) return v.toFixed(2);
            return v >= 10 ? v.toFixed(0) : v.toFixed(1);
        }
        function updateArcWeightControls() {
            if (!arcPlanAdjustmentValue) return;
            const ratio = Number(arcPlanAdjustment) || 1;
            arcPlanAdjustmentValue.textContent = formatArcPlanAdjustment(ratio);
            if (arcPlanAdjustmentButton) {
                let meaning = '균형 (Goal:Altering = 1:1)';
                if (ratio > 1 + 1e-9) meaning = `Goal 우선 (Goal:Altering = ${formatArcPlanAdjustment(ratio)}:1)`;
                else if (ratio < 1 - 1e-9) meaning = `Altering 우선 (Goal:Altering = 1:${formatArcPlanAdjustment(1/ratio)})`;
                arcPlanAdjustmentButton.title = meaning;
            }
        }
        function adjustArcPlanAdjustmentFromWheel(e) {
            e.preventDefault(); e.stopPropagation();
            const current = Number(arcPlanAdjustment) || 1;
            let idx = 0, best = Infinity;
            ARC_PLAN_ADJUSTMENT_OPTIONS.forEach((v, i) => {
                const d = Math.abs(v - current);
                if (d < best) { best = d; idx = i; }
            });
            const dir = e.deltaY > 0 ? 1 : -1;
            const nextIdx = clampValue(idx + dir, 0, ARC_PLAN_ADJUSTMENT_OPTIONS.length - 1);
            const next = ARC_PLAN_ADJUSTMENT_OPTIONS[nextIdx];
            if (Math.abs(next - current) < 1e-12) return;
            const previous = current;
            arcPlanAdjustment = next;
            applyArcPlanAdjustment();
            updateArcWeightControls();
            recordExperimentEvent('arc_plan_adjustment_change', {
                previous_value: previous,
                new_value: next,
                weight_goal: arcCostWeightSettings.goal,
                weight_altering: arcCostWeightSettings.altering
            });
            if (isSimulationRunning) render2D(); else updateSupportCards();
        }

        function updateInlineButtonSettings() {
            const futureText = `${futureProjectionSettings.intervalSec}s`;
            document.querySelectorAll('[data-setting-role="future-interval"]').forEach(el => { el.textContent = futureText; });

            document.querySelectorAll('button[data-support-group][data-support-feature]').forEach(button => {
                const el = button.querySelector('[data-setting-role="target-cpa"]');
                if (!el) return;
                const key = `${button.dataset.supportGroup}:${button.dataset.supportFeature}`;
                const value = getDesiredCpaNM(key);
                el.textContent = key === 'sa:threat-highlight'
                    ? `위험 CPA : ${value.toFixed(2)} NM`
                    : `목표 CPA : ${value.toFixed(2)} NM`;
            });

            const resolved = resolveActionTargetHeading();
            const hdgText = Number.isFinite(resolved.heading)
                ? `목표 HDG : ${normalize360(resolved.heading).toFixed(0)}°`
                : '목표 HDG : ---°';
            document.querySelectorAll('[data-setting-role="target-hdg"]').forEach(el => { el.textContent = hdgText; });
        }

        // Experiment recorder: records the same live information the operator sees,
        // button operations, and the active-support state as a time series.
        let lastApiPayload = null;
        const experimentRecorder = {
            recording: false,
            session: null,
            lastCompleted: null
        };

        function nowIsoLocal() {
            const d = new Date();
            const p = n => String(n).padStart(2, '0');
            return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}T${p(d.getHours())}:${p(d.getMinutes())}:${p(d.getSeconds())}.${String(d.getMilliseconds()).padStart(3,'0')}`;
        }

        function experimentFileStamp(isoText) {
            const compact = String(isoText || nowIsoLocal()).replace(/[-:T.]/g, '').slice(0, 14);
            return compact.length >= 14 ? `${compact.slice(0,8)}_${compact.slice(8,14)}` : compact;
        }

        function currentScenarioFileName(data) {
            const routeFile = data && data.scenario_route && data.scenario_route.source_file
                ? String(data.scenario_route.source_file) : '';
            if (routeFile) return routeFile;
            return data ? String(data.scenarioName || data.scenario_name || 'HTMS') : 'HTMS';
        }

        function currentExperimentContext() {
            const resolved = resolveActionTargetHeading();
            return {
                active_features: Array.from(activeSupportFeatures),
                desired_cpa_nm: getFocusedCpaFeatureKey() ? Number(getDesiredCpaNM(getFocusedCpaFeatureKey())) : null,
                desired_cpa_by_feature_nm: { ...supportUserSettings.cpaByFeature },
                desired_hdg_deg: Number.isFinite(resolved.heading) ? Number(normalize360(resolved.heading)) : null,
                desired_hdg_mode: resolved.mode || null,
                future_interval_sec: Number(futureProjectionSettings.intervalSec)
            };
        }

        function currentSimulatorTimeSec(data = lastApiPayload) {
            const osRaw = data && Array.isArray(data.os_data) ? data.os_data : [];
            const v = osRaw.length && osRaw[0]['Time(sec)'] !== undefined ? Number(osRaw[0]['Time(sec)']) : NaN;
            return Number.isFinite(v) ? v : null;
        }

        function recordExperimentEvent(type, details = {}) {
            if (!experimentRecorder.recording || !experimentRecorder.session) return;
            experimentRecorder.session.events.push({
                wall_time: nowIsoLocal(),
                elapsed_sec: Number(((performance.now() - experimentRecorder.session.started_performance_ms) / 1000).toFixed(3)),
                simulator_time_sec: currentSimulatorTimeSec(),
                type,
                ...details,
                ...currentExperimentContext()
            });
        }

        function recordCpaSetting(previousCpa, nextCpa, changeSource = 'wheel') {
            if (!experimentRecorder.recording || !experimentRecorder.session) return;
            const entry = {
                wall_time: nowIsoLocal(),
                elapsed_sec: Number(((performance.now() - experimentRecorder.session.started_performance_ms) / 1000).toFixed(3)),
                simulator_time_sec: currentSimulatorTimeSec(),
                feature_key: String(changeSource).includes(':') ? String(changeSource).split(':').slice(-2).join(':') : null,
                previous_cpa_nm: Number.isFinite(Number(previousCpa)) ? Number(previousCpa) : null,
                desired_cpa_nm: Number(nextCpa),
                change_source: changeSource
            };
            experimentRecorder.session.cpa_setting_timeline.push(entry);
            recordExperimentEvent('desired_cpa_change', {
                previous_cpa_nm: entry.previous_cpa_nm,
                desired_cpa_nm: entry.desired_cpa_nm,
                change_source: changeSource
            });
            if (lastApiPayload) captureExperimentSnapshot(lastApiPayload, 'desired_cpa_change');
        }

        function buildExperimentSnapshot(data, reason = 'live_tick') {
            const osRaw = data && Array.isArray(data.os_data) ? data.os_data : [];
            const trafficRaw = data && Array.isArray(data.traffic_data) ? data.traffic_data : [];
            const isTargetInfoActive = id => Array.from(selectedTargetIds).some(selectedId => String(selectedId) === String(id));
            const recordedTrafficRaw = trafficRaw.map(t => {
                const targetId = t['MMSI'] || t['Name'] || null;
                return { ...t, info_active: targetId !== null && isTargetInfoActive(targetId) };
            });
            const simTime = osRaw.length && osRaw[0]['Time(sec)'] !== undefined ? Number(osRaw[0]['Time(sec)']) : null;
            return {
                wall_time: nowIsoLocal(),
                elapsed_sec: experimentRecorder.session ? Number(((performance.now() - experimentRecorder.session.started_performance_ms) / 1000).toFixed(3)) : 0,
                reason,
                simulator_time_sec: Number.isFinite(simTime) ? simTime : null,
                scenario_name: data ? (data.scenarioName || data.scenario_name || null) : null,
                scenario_file: currentScenarioFileName(data),
                ...currentExperimentContext(),
                ownship_raw: osRaw,
                traffic_raw: recordedTrafficRaw,
                normalized_ships: simEntities.map(s => ({
                    id: s.id, name: s.name, isMASS: !!s.isMASS, info_active: !s.isMASS && isTargetInfoActive(s.id),
                    x: Number(s.x), z: Number(s.z),
                    hdg_deg: Number(s.hdg), cog_deg: Number(s.cog), sog_kn: Number(s.sog),
                    rot_deg_per_min: Number(s.rot),
                    rudder_deg: s.isMASS ? Number(s.rudder || 0) : null,
                    lat: Number.isFinite(Number(s.lat)) ? Number(s.lat) : null,
                    lon: Number.isFinite(Number(s.lon)) ? Number(s.lon) : null
                })),
                steering_guidance: latestControlGuidance ? { ...latestControlGuidance } : null
            };
        }

        function captureExperimentSnapshot(data, reason = 'live_tick') {
            if (!experimentRecorder.recording || !experimentRecorder.session) return;
            experimentRecorder.session.snapshots.push(buildExperimentSnapshot(data, reason));
        }

        function downloadExperimentSession(session) {
            if (!session) return false;
            const payload = { ...session };
            delete payload.started_performance_ms;
            const blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json;charset=utf-8' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            const rawScenarioFile = String(payload.scenario_file || payload.scenario_name || 'HTMS');
            const scenarioStem = rawScenarioFile.replace(/\.[^.]+$/, '').replace(/[^a-zA-Z0-9가-힣_-]+/g, '_');
            a.download = `${scenarioStem}_${experimentFileStamp(payload.started_at)}.json`;
            document.body.appendChild(a);
            a.click();
            a.remove();
            setTimeout(() => URL.revokeObjectURL(url), 1000);
            return true;
        }

        function startExperimentRecording() {
            const startedAt = nowIsoLocal();
            experimentRecorder.session = {
                format: 'HTMS_EXPERIMENT_RECORD_V1',
                started_at: startedAt,
                ended_at: null,
                started_performance_ms: performance.now(),
                scenario_name: lastApiPayload ? (lastApiPayload.scenarioName || lastApiPayload.scenario_name || null) : null,
                scenario_file: currentScenarioFileName(lastApiPayload),
                events: [],
                snapshots: [],
                cpa_setting_timeline: []
            };
            experimentRecorder.recording = true;
            if (experimentRecordToggle) {
                experimentRecordToggle.classList.add('recording');
                experimentRecordToggle.textContent = '기록';
            }
            recordExperimentEvent('record_start', {
                initial_desired_cpa_nm: getFocusedCpaFeatureKey() ? Number(getDesiredCpaNM(getFocusedCpaFeatureKey())) : null,
                initial_cpa_by_feature_nm: { ...supportUserSettings.cpaByFeature }
            });
            Object.entries(supportUserSettings.cpaByFeature).forEach(([featureKey, value]) => {
                experimentRecorder.session.cpa_setting_timeline.push({
                    wall_time: startedAt,
                    elapsed_sec: 0,
                    simulator_time_sec: currentSimulatorTimeSec(),
                    feature_key: featureKey,
                    previous_cpa_nm: null,
                    desired_cpa_nm: Number(value),
                    change_source: 'record_start'
                });
            });
            if (lastApiPayload) captureExperimentSnapshot(lastApiPayload, 'record_start');
        }

        function stopExperimentRecording() {
            if (!experimentRecorder.recording || !experimentRecorder.session) return;
            recordExperimentEvent('record_stop');
            experimentRecorder.session.ended_at = nowIsoLocal();
            experimentRecorder.recording = false;
            experimentRecorder.lastCompleted = experimentRecorder.session;
            experimentRecorder.session = null;
            if (experimentRecordToggle) {
                experimentRecordToggle.classList.remove('recording');
                experimentRecordToggle.textContent = '기록';
            }
            // User requested immediate save when recording is turned off.
            downloadExperimentSession(experimentRecorder.lastCompleted);
        }

        if (experimentRecordToggle) {
            experimentRecordToggle.addEventListener('click', () => {
                if (experimentRecorder.recording) stopExperimentRecording();
                else startExperimentRecording();
            });
        }

        function updateOwnShipHud() {
            const os = vObj.massEntity;
            if (!os || !osFixedHud) {
                if (osFixedHud) osFixedHud.classList.remove('visible');
                if (onlinePauseBtn) onlinePauseBtn.classList.remove('visible');
                if (arcWeightControls) arcWeightControls.classList.remove('visible');
                return;
            }
            osFixedHud.classList.add('visible');
            if (onlinePauseBtn) {
                onlinePauseBtn.classList.add('visible');
                const mapRect = container.getBoundingClientRect();
                const hudRect = osFixedHud.getBoundingClientRect();
                const buttonWidth = onlinePauseBtn.offsetWidth || 72;
                const gap = 8;
                onlinePauseBtn.style.left = `${Math.max(8, hudRect.left - mapRect.left - buttonWidth - gap)}px`;
                onlinePauseBtn.style.top = `${Math.max(8, hudRect.top - mapRect.top + (hudRect.height - (onlinePauseBtn.offsetHeight || 30)) * 0.5)}px`;
            }
            if (arcWeightControls) {
                const showWeights = activeSupportFeatures.has('dm:minimum-alteration');
                arcWeightControls.classList.toggle('visible', showWeights);
                if (showWeights) {
                    updateArcWeightControls();
                    const mapRect = container.getBoundingClientRect();
                    const hudRect = osFixedHud.getBoundingClientRect();
                    const controlWidth = arcWeightControls.offsetWidth || 116;
                    const gap = 8;
                    const pauseRect = onlinePauseBtn && onlinePauseBtn.classList.contains('visible')
                        ? onlinePauseBtn.getBoundingClientRect() : null;
                    let left = pauseRect
                        ? pauseRect.left - mapRect.left - controlWidth - gap
                        : hudRect.left - mapRect.left - controlWidth - gap;
                    let top = hudRect.top - mapRect.top;
                    // Narrow-screen fallback: keep the ODD/OE light on the HUD's right side
                    // untouched and move only the weight controls below the HUD.
                    if (left < 8) {
                        left = Math.max(8, Math.min(mapRect.width - controlWidth - 8, hudRect.left - mapRect.left));
                        top = hudRect.bottom - mapRect.top + 5;
                    }
                    arcWeightControls.style.left = `${left}px`;
                    arcWeightControls.style.top = `${Math.max(8, top)}px`;
                }
            }
            if (osHudHdg) osHudHdg.textContent = `${Number(os.hdg || 0).toFixed(1)}°`;
            if (osHudCog) osHudCog.textContent = `${Number(os.cog || 0).toFixed(1)}°`;
            if (osHudSog) osHudSog.textContent = `${Number(os.sog || 0).toFixed(1)} kt`;
            if (osHudRot) osHudRot.textContent = `${Number(os.rot || 0).toFixed(1)}°/min`;

            const writeRudder = (el, value) => {
                if (!el) return;
                const r = Number(value) || 0;
                el.textContent = Math.abs(r) < 0.05 ? 'MIDSHIP 0.0°' : `${r > 0 ? 'STBD' : 'PORT'} ${Math.abs(r).toFixed(1)}°`;
                el.style.color = r > 0.05 ? '#34d399' : r < -0.05 ? '#fb7185' : '#ffffff';
            };
            writeRudder(osHudRudCmd, Number.isFinite(Number(os.rudderCmd)) ? Number(os.rudderCmd) : Number(os.rudder) || 0);
            writeRudder(osHudRudAct, Number(os.rudder) || 0);
        }

        function updateMinCpaControl() {
            if (minCpaControl && minCpaValue) {
                const featureKey = getFocusedCpaFeatureKey();
                const visible = !!featureKey && activeSupportFeatures.has(featureKey);
                minCpaControl.classList.toggle('visible', visible);
                if (visible) minCpaValue.textContent = `${getDesiredCpaNM(featureKey).toFixed(2)} NM ↕`;
            }
            updateInlineButtonSettings();
        }

        // ==========================================
        // 2. 캔버스 제어 및 마우스 클릭
        // ==========================================
        function drawPlaceholderGrid() {
            const ctx = canvas.getContext('2d');
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.strokeStyle = '#1e293b';
            ctx.lineWidth = 1;
            ctx.beginPath();
            ctx.moveTo(0, canvas.height / 2);
            ctx.lineTo(canvas.width, canvas.height / 2);
            ctx.moveTo(canvas.width / 2, 0);
            ctx.lineTo(canvas.width / 2, canvas.height);
            ctx.stroke();
        }

        function resizeCanvas() {
            canvas.width = container.clientWidth;
            canvas.height = container.clientHeight;
            vObj.panX = canvas.width / 2 + vObj.panOffsetX;
            vObj.panY = canvas.height / 2 + vObj.panOffsetY;
            
            if (!isSimulationRunning) {
                drawPlaceholderGrid();
            } else {
                render2D();
            }
        }
        window.addEventListener('resize', resizeCanvas);
        setTimeout(resizeCanvas, 100);

        function updateCursorBrgDist(e) {
            if (!cursorBrgDist || !vObj.massEntity) {
                if (cursorBrgDist) cursorBrgDist.classList.remove('visible');
                return;
            }
            const rect = container.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const y = e.clientY - rect.top;
            if (x < 0 || y < 0 || x > rect.width || y > rect.height) {
                cursorBrgDist.classList.remove('visible');
                return;
            }

            // Invert the current Head-Up display transform. Cursor straight ahead
            // therefore reads approximately the own-ship true HDG.
            const unit = 400 / 1852;
            const scale = Math.max(1e-9, unit * vObj.viewScale);
            const right = (x - vObj.panX) / scale;
            const forward = -(y - vObj.panY) / scale;
            const h = displayReferenceHeading() * DEG2RAD;
            const east = right * Math.cos(h) + forward * Math.sin(h);
            const north = -right * Math.sin(h) + forward * Math.cos(h);
            const brg = normalize360(Math.atan2(east, north) / DEG2RAD);
            const distNM = Math.hypot(east, north) / 1852;

            cursorBrgDist.textContent = `BRG ${brg.toFixed(1)}°   DIST ${distNM.toFixed(2)} NM`;
            cursorBrgDist.classList.add('visible');
        }

        container.addEventListener('mousemove', updateCursorBrgDist);
        container.addEventListener('mouseleave', () => {
            if (cursorBrgDist) cursorBrgDist.classList.remove('visible');
        });

        canvas.addEventListener('mousedown', (e) => {
            const rect = canvas.getBoundingClientRect();
            vObj.isDragging = true; vObj.hasDragged = false;
            vObj.dragStartX = (e.clientX - rect.left) - vObj.panOffsetX;
            vObj.dragStartY = (e.clientY - rect.top) - vObj.panOffsetY;
        });

        window.addEventListener('mousemove', (e) => {
            if (vObj.isDragging) {
                const rect = canvas.getBoundingClientRect();
                const mx = e.clientX - rect.left; 
                const my = e.clientY - rect.top;
                const dx = mx - vObj.dragStartX - vObj.panOffsetX;
                const dy = my - vObj.dragStartY - vObj.panOffsetY;
                
                if (Math.abs(dx) > 3 || Math.abs(dy) > 3) vObj.hasDragged = true;
                
                vObj.panOffsetX = mx - vObj.dragStartX; 
                vObj.panOffsetY = my - vObj.dragStartY; 
                if (isSimulationRunning) render2D();
            }
        });

        window.addEventListener('mouseup', () => { vObj.isDragging = false; });
        
        canvas.addEventListener('click', (e) => {
            if (vObj.hasDragged) return; 
            
            const rect = canvas.getBoundingClientRect();
            const mx = e.clientX - rect.left;
            const my = e.clientY - rect.top;
            
            let clickedShip = null;
            let minDist = Infinity;
            
            simEntities.forEach(s => {
                if (s.isMASS) return;
                const displayPoint = shipCanvasPoint(s);
                const cx = displayPoint.x;
                const cy = displayPoint.y;
                const distPX = Math.hypot(mx - cx, my - cy);
                
                if (distPX < 20 && distPX < minDist) {
                    minDist = distPX;
                    clickedShip = s;
                }
            });
            
            if (clickedShip) {
                const existingId = Array.from(selectedTargetIds).find(id => String(id) === String(clickedShip.id));
                if (existingId !== undefined) {
                    closeTargetPanel(existingId);
                } else {
                    selectedTargetIds.add(clickedShip.id);
                    createTargetPanel(clickedShip.id, clickedShip.name);
                    recordExperimentEvent('target_info_open', { target_id: clickedShip.id, target_name: clickedShip.name });
                    if (lastApiPayload) captureExperimentSnapshot(lastApiPayload, 'target_info_open');
                }
            }
            
            if (isSimulationRunning) {
                render2D();
                updateAllTargetPanels();
            }
        });
        
        canvas.addEventListener('wheel', (e) => {
            e.preventDefault();
            let range = Math.min(30, Math.max(0.5, (1 / vObj.viewScale) * (e.deltaY < 0 ? 0.9 : 1.1)));
            vObj.viewScale = 1 / range; 
            if (isSimulationRunning) render2D();
        }, { passive: false });

        // ==========================================
        // 3. 다중 타겟 인포 패널 관리 (자동 정렬, 드래그, 상대운동 계산)
        //    변경 범위: 타겟 정보창에만 한정. 데이터 수신/렌더링/버튼은 변경하지 않음.
        // ==========================================
        const targetPanelMargin = 15;
        const targetPanelGap = 12;

        // 자동 배치창만 담는 투명 영역. 수동 이동한 창은 기존 panelsContainer에 둔다.
        const targetAutoArea = document.createElement('div');
        targetAutoArea.id = 'target-auto-area';
        Object.assign(targetAutoArea.style, {
            position: 'absolute', top: '0', left: '0', right: '0', bottom: '0',
            width: '100%', height: '100%', pointerEvents: 'none', zIndex: '0', display: 'none',
            overflow: 'visible'
        });
        const targetAutoContent = document.createElement('div');
        Object.assign(targetAutoContent.style, { position: 'absolute', inset: '0', width: '100%', height: '100%' });
        targetAutoArea.appendChild(targetAutoContent);
        panelsContainer.appendChild(targetAutoArea);

        function keepTargetPanelInMap(panel) {
            const maxLeft = Math.max(0, container.clientWidth - panel.offsetWidth);
            const maxTop = Math.max(0, container.clientHeight - panel.offsetHeight);
            panel.style.left = `${Math.min(maxLeft, Math.max(0, parseFloat(panel.style.left) || 0))}px`;
            panel.style.top = `${Math.min(maxTop, Math.max(0, parseFloat(panel.style.top) || 0))}px`;
        }

        function rectsOverlap(a, b, gap = 8) {
            return !(a.right + gap <= b.left || b.right + gap <= a.left || a.bottom + gap <= b.top || b.bottom + gap <= a.top);
        }

        function domRectRelativeToMap(el) {
            const mr = container.getBoundingClientRect();
            const r = el.getBoundingClientRect();
            return { left: r.left - mr.left, top: r.top - mr.top, right: r.right - mr.left, bottom: r.bottom - mr.top };
        }

        function findFreeMapPosition(width, height, occupied, preferred = []) {
            const W = container.clientWidth, H = container.clientHeight;
            const margin = targetPanelMargin, gap = targetPanelGap;
            const fits = (x, y) => {
                if (x < margin || y < margin || x + width > W - margin || y + height > H - margin) return false;
                const r = { left:x, top:y, right:x+width, bottom:y+height };
                return !occupied.some(o => rectsOverlap(r, o, gap));
            };
            for (const p of preferred) if (fits(p.x, p.y)) return p;

            const stepX = Math.max(40, width + gap), stepY = Math.max(40, height + gap);
            for (let y = margin; y <= H - height - margin; y += stepY) {
                for (let x = W - width - margin; x >= margin; x -= stepX) {
                    if (fits(x, y)) return {x, y};
                }
            }
            for (let y = margin; y <= H - height - margin; y += Math.max(24, Math.floor(height / 2))) {
                for (let x = W - width - margin; x >= margin; x -= Math.max(24, Math.floor(width / 2))) {
                    if (fits(x, y)) return {x, y};
                }
            }
            return { x: Math.max(margin, W - width - margin), y: Math.max(margin, H - height - margin) };
        }

        let floatingLayoutScheduled = false;
        let floatingLayoutBusy = false;
        function scheduleFloatingWindowLayout() {
