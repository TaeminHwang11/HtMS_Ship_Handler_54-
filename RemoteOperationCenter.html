<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>[HTMS] Remote Operation Center</title>
    <!-- Three.js 및 에셋 로더 -->
    <script src="https://unpkg.com/three@0.128.0/build/three.min.js"></script>
    <script src="https://unpkg.com/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&display=swap');

        :root {
            --bg-color: #0b0f19;
            --panel-bg: #111827;
            --border-color: #1f293d;
            --accent-cyan: #06b6d4;
            --accent-green: #10b981;
            --accent-red: #ef4444;
            --accent-yellow: #eab308;
            --text-main: #f3f4f6;
            --text-muted: #9ca3af;
        }

        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: var(--bg-color); color: var(--text-main); font-family: 'Rajdhani', sans-serif; user-select: none; touch-action: none; }

        /* ================= 메인 메뉴 (로그인) ================= */
        #login-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(5, 10, 20, 0.95); z-index: 999; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; }
        #login-overlay h1 { font-size: 42px; color: var(--accent-cyan); letter-spacing: 2px; margin-bottom: 10px; text-shadow: 0 0 20px rgba(6,182,212,0.5); font-family: 'Arial Black', sans-serif;}
        #login-overlay h2 { color: var(--accent-green); letter-spacing: 5px; font-size: 18px; font-weight: bold; margin-bottom: 40px; }
        
        .menu-box { background: rgba(0,0,0,0.6); border: 1px solid var(--accent-cyan); border-radius: 12px; padding: 40px; width: 90%; max-width: 400px; box-sizing: border-box; box-shadow: 0 10px 40px rgba(6,182,212,0.1); }
        .form-row { margin-bottom: 20px; text-align: left; }
        .form-row label { display: block; font-size: 14px; color: #88c0d0; margin-bottom: 8px; font-weight: bold; }
        .form-row input, .form-row select { width: 100%; padding: 12px; background: #111827; border: 1px solid #555; color: #fff; font-family: 'Rajdhani', sans-serif; font-size: 16px; border-radius: 4px; outline: none; box-sizing: border-box; }
        .form-row select option { background: #111827; color: #fff; }
        .form-row input:focus, .form-row select:focus { border-color: var(--accent-cyan); }
        
        .btn-start { width: 100%; padding: 15px; font-size: 20px; font-weight: bold; border: none; border-radius: 6px; cursor: pointer; font-family: 'Rajdhani', sans-serif; background: var(--accent-green); color: #000; transition: 0.2s; margin-top: 10px; }
        .btn-start:hover { background: #0ea5e9; transform: translateY(-2px); }

        #loading-screen { display: none; margin-top: 20px; color: var(--accent-yellow); font-weight: bold; font-size: 16px; }

        /* ================= 메인 레이아웃 ================= */
        #main-wrapper { display: none; width: 100%; height: 100vh; position: absolute; top: 0; left: 0; z-index: 10; background: var(--bg-color); flex-direction: row; }
        
        /* 좌측 뷰 컬럼 */
        #view-column { flex: 1; display: flex; flex-direction: column; overflow: hidden; position: relative; }
        
        /* 스플릿 모드 상단: 3D 집중관찰(FPV) 창 */
        #fpv-area { display: none; background: #050a10; position: relative; box-shadow: inset 0 -10px 30px rgba(0,0,0,0.5); }
        
        /* 상하 크기 조절바 */
        #h-resizer { display: none; height: 8px; background: #1e293b; cursor: row-resize; z-index: 30; border-top: 1px solid #0f172a; border-bottom: 1px solid #0f172a; transition: background 0.2s; flex-shrink: 0; }
        #h-resizer:hover, #h-resizer:active { background: var(--accent-cyan); }
        
        /* 하단: 2D 그리드 영역 */
        #grid-area { flex: 1; display: grid; gap: 2px; background: var(--border-color); height: 100%; min-height: 0; }

        /* Split Mode State Classes */
        #main-wrapper.split-mode #fpv-area { display: flex; flex: 1; min-height: 20%; }
        #main-wrapper.split-mode #h-resizer { display: block; }
        #main-wrapper.split-mode #grid-area { flex: 1; min-height: 20%; display: block; } 

        /* 우측 사이드바 (대시보드 패널) */
        #sidebar { width: 380px; background: var(--panel-bg); border-left: 1px solid var(--border-color); display: flex; flex-direction: column; padding: 20px; box-sizing: border-box; z-index: 20; overflow-y: auto; flex-shrink: 0; }
        .panel-title { font-size: 24px; font-weight: 800; color: var(--accent-cyan); border-bottom: 1px solid var(--border-color); padding-bottom: 10px; margin-bottom: 15px; letter-spacing: 1px; flex-shrink: 0; text-align: center;}
        
        /* ================= 2D 뷰포트 내부 스타일 ================= */
        .viewport { position: relative; background: radial-gradient(circle at center, #111a2e 0%, #0d1322 100%); overflow: hidden; border: 2px solid transparent; transition: border 0.2s; height: 100%; width: 100%; }
        .viewport.active-vp { border: 2px solid var(--accent-yellow); }
        .viewport.hidden-vp { display: none !important; } 
        .vp-canvas { width: 100%; height: 100%; display: block; cursor: crosshair; }
        
        .vp-label { position: absolute; top: 10px; right: 10px; background: rgba(0,0,0,0.6); color: var(--accent-yellow); font-weight: bold; font-size: 14px; padding: 4px 10px; border-radius: 4px; border: 1px solid var(--accent-yellow); z-index: 10; pointer-events: none; }
        .coord-hud { position: absolute; top: 10px; left: 10px; background: rgba(17, 24, 39, 0.85); border: 1px solid var(--border-color); padding: 8px 12px; border-radius: 6px; font-family: monospace; font-size: 12px; backdrop-filter: blur(4px); pointer-events: none; display: flex; flex-direction: column; gap: 4px; z-index: 10; }
        .hud-range { color: var(--accent-cyan); font-weight: bold; }
        
        /* ================= 3D FPV 내부 UI ================= */
        #fpv-label { position: absolute; top: 15px; left: 15px; color: var(--accent-cyan); font-weight: bold; font-size: 16px; letter-spacing: 1px; text-shadow: 0 2px 4px #000; pointer-events: none; background: rgba(0,0,0,0.5); padding: 5px 10px; border-radius: 4px; z-index: 10;}
        
        #intervention-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); display: none; flex-direction: column; justify-content: center; align-items: center; z-index: 55; backdrop-filter: blur(4px); }
        .latency-spinner { border: 4px solid rgba(0, 255, 170, 0.2); border-top: 4px solid #00ffaa; border-radius: 50%; width: 50px; height: 50px; animation: spin 1s linear infinite; margin-bottom: 20px; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        /* ================= 사이드바 컴포넌트 ================= */
        .btn-return { width: 100%; background: rgba(239, 68, 68, 0.15); border: 1px solid #ef4444; color: #fca5a5; padding: 12px; border-radius: 6px; font-family: 'Rajdhani', sans-serif; font-weight: bold; font-size: 16px; cursor: pointer; transition: 0.2s; margin-bottom: 15px; }
        .btn-return:hover { background: #ef4444; color: #fff; transform: translateY(-2px); }

        #btn-intervention { width: 100%; margin-top: auto; background: rgba(16, 185, 129, 0.2); border: 2px solid var(--accent-green); color: var(--accent-green); padding: 18px; font-size: 20px; font-family: 'Rajdhani', sans-serif; font-weight: bold; border-radius: 8px; cursor: pointer; transition: all 0.2s; box-shadow: 0 0 15px rgba(16,185,129,0.1); flex-shrink: 0;}
        #btn-intervention:hover { background: var(--accent-green); color: #000; box-shadow: 0 0 25px rgba(16,185,129,0.5); transform: translateY(-2px); }
        #btn-intervention:disabled { background: #1e293b; border-color: #334155; color: #64748b; cursor: not-allowed; box-shadow: none; transform: none; }

        #btn-end-intervention { width: 100%; display: none; background: rgba(239, 68, 68, 0.2); border: 2px solid #ef4444; color: #ef4444; padding: 18px; font-size: 20px; font-family: 'Rajdhani', sans-serif; font-weight: bold; border-radius: 8px; cursor: pointer; transition: all 0.2s; box-shadow: 0 0 15px rgba(239,68,68,0.1); flex-shrink: 0;}
        #btn-end-intervention:hover { background: #ef4444; color: #fff; box-shadow: 0 0 25px rgba(239,68,68,0.5); transform: translateY(-2px); }

        /* Step 2: 사이드바 조타 버튼 */
        .steer-btn-sidebar { flex: 1; background: rgba(0, 255, 170, 0.15); border: 2px solid #00ffaa; color: #00ffaa; padding: 15px; font-size: 20px; font-family: 'Rajdhani', sans-serif; font-weight: bold; border-radius: 8px; text-align: center; cursor: pointer; transition: 0.1s; user-select: none; box-shadow: 0 0 10px rgba(0,255,170,0.1); }
        .steer-btn-sidebar:active { background: rgba(0, 255, 170, 0.5); transform: scale(0.95); box-shadow: 0 0 20px rgba(0,255,170,0.4); }

        .info-box { background: #172033; border: 1px solid #334155; border-radius: 6px; padding: 12px; margin-bottom: 10px; border-left: 3px solid var(--accent-cyan); flex-shrink: 0; }
        .info-header { font-size: 12px; color: var(--text-muted); margin-bottom: 8px; font-weight: bold; }
        .data-row { display: flex; justify-content: space-between; margin-bottom: 4px; font-size: 13px; align-items: center; }
        .data-row span { color: #94a3b8; font-weight: bold; }
        .data-row b { color: #fff; font-family: monospace; font-size: 15px; }

        .hud-val { color: var(--accent-green) !important; text-shadow: 0 0 10px rgba(16, 185, 129, 0.3); }
    </style>
</head>
<body>

    <!-- 1. 로그인 (메인 화면) -->
    <div id="login-overlay">
        <h1>[HTMS] Remote Operation Center</h1>
        <h2>PORTABLE REMOTE OPERATION SIMULATOR</h2>
        
        <div class="menu-box">
            <div class="form-row">
                <label>학번 (Student ID)</label>
                <input type="text" id="student-id" placeholder="예: 20261234" autocomplete="off" value="20260001" />
            </div>
            <div class="form시작 직후 눈에 띄게 속도가 느려져 작업 흐름이 끊긴다면 정말 답답하시겠네요. 업데이트 이후 발생하는 이런 성능 저하는 보통 초기화 중 백그라운드 충돌, 기존 캐시 데이터와의 꼬임, 또는 새 버전 자체의 최적화 버그가 원인일 가능성이 높습니다.

정확한 원인 파악과 롤백 등의 구체적인 해결책을 찾기 위해, 문제가 발생하는 대상을 조금 더 자세히 알려주시겠어요?

*   **문제가 발생한 소프트웨어 또는 기기:** (예: 윈도우 OS, 특정 프로그램, 스마트폰 앱 등)
*   **주요 증상:** (예: 실행 후 특정 시간 동안 아예 멈춤, 마우스 커서 지연 등)

사용 중인 환경을 알려주시면 그에 맞는 다운그레이드 절차나 초기화 최적화 방법을 바로 안내해 드리겠습니다.
