<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>[HTMS] Remote Operation Center Simulator</title>
    <!-- Three.js 및 컨트롤 패키지 -->
    <script src="https://unpkg.com/three@0.128.0/build/three.min.js"></script>
    <script src="https://unpkg.com/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&display=swap');

        :root {
            --bg-color: #050a10;
            --panel-bg: #0b131e;
            --border-color: #1f293d;
            --accent-cyan: #00ffff;
            --accent-green: #00ffaa;
            --accent-red: #ff3333;
            --accent-yellow: #ffcc00;
            --text-main: #e2e8f0;
            --text-muted: #64748b;
        }

        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: var(--bg-color); color: var(--text-main); font-family: 'Rajdhani', sans-serif; user-select: none; }

        /* ================= 2D 관제 센터 레이아웃 ================= */
        #scc-container { display: flex; width: 100%; height: 100vh; position: absolute; top: 0; left: 0; z-index: 10; background: var(--bg-color); }
        
        #grid-container { flex: 1; display: grid; grid-template-columns: repeat(2, 1fr); grid-template-rows: repeat(2, 1fr); gap: 4px; padding: 4px; background: #000; }
        
        .viewport { position: relative; background: radial-gradient(circle at center, #0f172a 0%, #020617 100%); border: 2px solid var(--border-color); overflow: hidden; cursor: crosshair; }
        .viewport.active-vp { border-color: var(--accent-cyan); box-shadow: inset 0 0 20px rgba(0, 255, 255, 0.1); }
        .vp-canvas { width: 100%; height: 100%; display: block; }
        .vp-label { position: absolute; top: 10px; left: 10px; background: rgba(0,0,0,0.7); color: var(--accent-cyan); font-weight: bold; padding: 5px 10px; border: 1px solid var(--accent-cyan); border-radius: 4px; font-size: 14px; pointer-events: none; }

        /* 우측 정보 패널 */
        #sidebar { width: 380px; background: var(--panel-bg); border-left: 2px solid var(--border-color); display: flex; flex-direction: column; padding: 20px; box-sizing: border-box; }
        .panel-title { font-size: 24px; font-weight: 700; color: var(--accent-cyan); border-bottom: 1px solid var(--accent-cyan); padding-bottom: 10px; margin-bottom: 20px; text-shadow: 0 0 10px rgba(0,255,255,0.4); }
        
        .info-box { background: rgba(0,0,0,0.5); border: 1px solid #334155; border-radius: 8px; padding: 15px; margin-bottom: 15px; }
        .info-header { font-size: 14px; color: var(--text-muted); margin-bottom: 10px; font-weight: bold; }
        .data-row { display: flex; justify-content: space-between; margin-bottom: 8px; font-size: 16px; }
        .data-row span { color: #94a3b8; }
        .data-row b { color: #fff; font-family: monospace; font-size: 18px; }
        .danger-text { color: var(--accent-red) !important; text-shadow: 0 0 5px rgba(255,51,51,0.5); }

        .btn-main { width: 100%; padding: 15px; font-size: 18px; font-weight: bold; background: rgba(0, 255, 170, 0.1); border: 1px solid var(--accent-green); color: var(--accent-green); border-radius: 6px; cursor: pointer; transition: all 0.2s; margin-top: auto; }
        .btn-main:hover { background: var(--accent-green); color: #000; box-shadow: 0 0 20px rgba(0,255,170,0.4); }
        .btn-main:disabled { background: #333; border-color: #555; color: #777; cursor: not-allowed; box-shadow: none; }

        /* ================= 3D FPV 모드 레이아웃 ================= */
        #fpv-container { display: none; width: 100%; height: 100vh; position: absolute; top: 0; left: 0; z-index: 20; background: #000; }
        #fpv-ui { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 25; }
        
        #btn-exit-3d { pointer-events: auto; position: absolute; top: 20px; right: 20px; padding: 10px 20px; font-size: 16px; font-weight: bold; font-family: 'Rajdhani', sans-serif; background: rgba(255, 51, 51, 0.2); border: 1px solid var(--accent-red); color: #ffcccc; cursor: pointer; border-radius: 4px; transition: 0.2s; }
        #btn-exit-3d:hover { background: var(--accent-red); color: #fff; }

        .fpv-hud { position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%); background: rgba(5, 10, 15, 0.7); border: 1px solid var(--accent-cyan); border-radius: 8px; padding: 15px 30px; display: flex; gap: 30px; backdrop-filter: blur(5px); pointer-events: auto; }
        .hud-item { display: flex; flex-direction: column; align-items: center; }
        .hud-item span { font-size: 12px; color: #88c0d0; font-weight: bold; }
        .hud-item b { font-size: 24px; font-family: monospace; color: #fff; }
    </style>
</head>
<body>

    <!-- 1. 2D 다중 관제 센터 (SCC View) -->
    <div id="scc-container">
        <div id="grid-container">
            <!-- 캔버스는 JS에서 동적 생성됨 -->
        </div>
        <div id="sidebar">
            <div class="panel-title">SCC DASHBOARD</div>
            
            <div class="info-box">
                <div class="info-header" style="color: var(--accent-cyan);">SELECTED MASS INFO</div>
                <div class="data-row"><span>NAME:</span> <b id="ui-mass-name">-</b></div>
                <div class="data-row"><span>HDG / COG:</span> <b id="ui-mass-hdg">-</b></div>
                <div class="data-row"><span>SOG:</span> <b id="ui-mass-sog">-</b></div>
            </div>

            <div class="info-box" style="border-color: var(--accent-red);">
                <div class="info-header" style="color: var(--accent-red);">TARGET THREAT ANALYSIS</div>
                <div class="data-row"><span>TARGET:</span> <b id="ui-tgt-name">-</b></div>
                <div class="data-row"><span>DIST:</span> <b id="ui-tgt-dist">-</b></div>
                <div class="data-row"><span>CPA:</span> <b id="ui-tgt-cpa" style="color: var(--accent-yellow);">-</b></div>
                <div class="data-row"><span>TCPA:</span> <b id="ui-tgt-tcpa">-</b></div>
                <div class="data-row"><span>BCR:</span> <b id="ui-tgt-bcr">-</b></div>
                <div id="ui-risk-alert" style="margin-top: 15px; font-size: 14px; font-weight: bold; text-align: center; display: none;" class="danger-text">⚠️ COLLISION ALARM ⚠️</div>
            </div>

            <button id="btn-enter-3d" class="btn-main" disabled>🚀 3D 전방 카메라 접속</button>
        </div>
    </div>

    <!-- 2. 3D FPV 뷰어 (Remote Operation View) -->
    <div id="fpv-container">
        <!-- Three.js 캔버스가 이 배경에 렌더링됨 -->
        <div id="fpv-ui">
            <button id="btn-exit-3d">✖ 관제 화면으로 복귀</button>
            <div style="position: absolute; top: 20px; left: 20px; font-size: 24px; font-weight: bold; color: var(--accent-cyan); text-shadow: 0 0 10px #0ff;" id="fpv-title">MASS_1 FPV CAMERA</div>
            
            <div class="fpv-hud">
                <div class="hud-item"><span>HDG</span><b id="fpv-hdg">000.0°</b></div>
                <div class="hud-item"><span>SOG</span><b id="fpv-sog">00.0 Kt</b></div>
                <div class="hud-item"><span>RUDDER</span><b id="fpv-rud">0.0°</b></div>
                <div class="hud-item"><span style="color:var(--accent-red)">NEAREST TGT</span><b id="fpv-cpa">SAFE</b></div>
            </div>
        </div>
    </div>

<script>
    // ==========================================
    // 0. SCENARIO DATA (제공해주신 JSON)
    // ==========================================
    const rawScenarioData = {
        "ScenarioName": "Exported_MASS_Scenario",
        "map": "Hanbando",
        "environment": { "wind": { "dir": 45, "spd": 12.5 }, "current": { "dir": 0, "spd": 0 } },
        "ships": [
            { "mmsi": 156836315, "isMASS": 1, "shipName": "MASS_1", "initSpeed": 17, "initHeading": 0, "waypointSetID": 0 },
            { "mmsi": 386492446, "isMASS": 1, "shipName": "MASS_2", "initSpeed": 17, "initHeading": 0, "waypointSetID": 1 },
            { "mmsi": 991047364, "isMASS": 1, "shipName": "MASS_3", "initSpeed": 17, "initHeading": 0, "waypointSetID": 2 },
            { "mmsi": 578307389, "isMASS": 0, "shipName": "ALPHA_1", "initSpeed": 10, "initHeading": 180, "waypointSetID": 3 },
            { "mmsi": 234627185, "isMASS": 0, "shipName": "BRAVO_1", "initSpeed": 10, "initHeading": 180, "waypointSetID": 4 },
            { "mmsi": 647906261, "isMASS": 0, "shipName": "CHARLIE_1", "initSpeed": 15, "initHeading": 210.9, "waypointSetID": 5 },
            { "mmsi": 421039662, "isMASS": 0, "shipName": "KILO_2", "initSpeed": 10, "initHeading": 180, "waypointSetID": 6 },
            { "mmsi": 326148647, "isMASS": 0, "shipName": "LIMA_2", "initSpeed": 10, "initHeading": 180, "waypointSetID": 7 },
            { "mmsi": 405204205, "isMASS": 0, "shipName": "MIKE_2", "initSpeed": 15, "initHeading": 210.9, "waypointSetID": 8 },
            { "mmsi": 237531195, "isMASS": 0, "shipName": "HOTEL_3", "initSpeed": 10, "initHeading": 180, "waypointSetID": 9 },
            { "mmsi": 992520821, "isMASS": 0, "shipName": "INDIA_3", "initSpeed": 10, "initHeading": 180, "waypointSetID": 10 },
            { "mmsi": 199105770, "isMASS": 0, "shipName": "JULIET_3", "initSpeed": 15, "initHeading": 210.9, "waypointSetID": 11 }
        ],
        "WayPointSet": [
            { "WayPointSetID": 0, "WayPoints": [{ "Latitude": 34.800000, "Longitude": 126.400000 }] },
            { "WayPointSetID": 1, "WayPoints": [{ "Latitude": 34.800000, "Longitude": 126.602984 }] },
            { "WayPointSetID": 2, "WayPoints": [{ "Latitude": 34.800000, "Longitude": 126.805968 }] },
            { "WayPointSetID": 3, "WayPoints": [{ "Latitude": 34.810709, "Longitude": 126.394164 }] },
            { "WayPointSetID": 4, "WayPoints": [{ "Latitude": 34.817835, "Longitude": 126.400101 }] },
            { "WayPointSetID": 5, "WayPoints": [{ "Latitude": 34.818210, "Longitude": 126.413346 }] },
            { "WayPointSetID": 6, "WayPoints": [{ "Latitude": 34.810709, "Longitude": 126.597148 }] },
            { "WayPointSetID": 7, "WayPoints": [{ "Latitude": 34.817835, "Longitude": 126.603086 }] },
            { "WayPointSetID": 8, "WayPoints": [{ "Latitude": 34.818210, "Longitude": 126.616330 }] },
            { "WayPointSetID": 9, "WayPoints": [{ "Latitude": 34.810709, "Longitude": 126.800132 }] },
            { "WayPointSetID": 10, "WayPoints": [{ "Latitude": 34.817835, "Longitude": 126.806070 }] },
            { "WayPointSetID": 11, "WayPoints": [{ "Latitude": 34.818210, "Longitude": 126.819314 }] }
        ]
    };

    // ==========================================
    // 1. GLOBAL VARIABLES & STATE
    // ==========================================
    const DEG2RAD = Math.PI / 180;
    const REF_LAT = 34.800000;
    const REF_LON = 126.400000;
    
    let simEntities = []; // 모든 선박의 전역 물리 상태 배열
    let massViews = [];   // 2D 캔버스 뷰포트 관리 배열
    
    let selectedMassIndex = -1;
    let selectedTargetIndex = -1;
    
    let is3DMode = false;
    let lastTime = performance.now();

    // ==========================================
    // 2. UTILS & MATH (CPA/TCPA 모듈화)
    // ==========================================
    function latLonToLocal(lat, lon) {
        // 기준 좌표 대비 Local X, Z (미터 단위) 변환
        const dxM = (lon - REF_LON) * 111111 * Math.cos(REF_LAT * DEG2RAD);
        const dzM = -(lat - REF_LAT) * 111111;
        return { x: dxM, z: dzM };
    }

    function calculateCPA(voSpd, voHdg, vtSpd, vtHdg, relX, relZ) { 
        // 단위: 미터, 속력: knot (1 knot ≈ 0.514 m/s)
        const vKt2Ms = 0.51444;
        const voX = (voSpd * vKt2Ms) * Math.sin(voHdg * DEG2RAD); 
        const voZ = -(voSpd * vKt2Ms) * Math.cos(voHdg * DEG2RAD); 
        const vtX = (vtSpd * vKt2Ms) * Math.sin(vtHdg * DEG2RAD); 
        const vtZ = -(vtSpd * vKt2Ms) * Math.cos(vtHdg * DEG2RAD); 
        
        const dvX = vtX - voX; 
        const dvZ = vtZ - voZ; 
        const dotP = (relX * dvX) + (relZ * dvZ); 
        const vrelSq = (dvX * dvX) + (dvZ * dvZ); 
        
        const tcpa = (vrelSq > 0.0001) ? -dotP / vrelSq : 0; // 초 단위
        const cpaMeters = (tcpa > 0) ? Math.sqrt(Math.pow(relX + dvX * tcpa, 2) + Math.pow(relZ + dvZ * tcpa, 2)) : Math.sqrt(relX*relX + relZ*relZ); 
        
        const radH = voHdg * DEG2RAD; 
        const relX_stbd = relX * Math.cos(radH) + relZ * Math.sin(radH); 
        const relZ_fwd = relX * Math.sin(radH) - relZ * Math.cos(radH); 
        const dvX_stbd = dvX * Math.cos(radH) + dvZ * Math.sin(radH); 
        const dvZ_fwd = dvX * Math.sin(radH) - dvZ * Math.cos(radH); 
        
        let bcrMeters = -1; 
        if (Math.abs(dvX_stbd) > 0.0001) { 
            const t_cross = -relX_stbd / dvX_stbd; 
            if (t_cross > 0) { 
                const bcr_units = relZ_fwd + dvZ_fwd * t_cross; 
                if (bcr_units > 0) bcrMeters = bcr_units; 
            } 
        } 
        return { cpa: cpaMeters / 1852, tcpa: tcpa, bcr: bcrMeters > 0 ? bcrMeters / 1852 : -1 }; 
    }

    // ==========================================
    // 3. INITIALIZATION (데이터 파싱)
    // ==========================================
    function initScenario() {
        const grid = document.getElementById('grid-container');
        grid.innerHTML = '';
        massViews = [];
        simEntities = [];

        // 선박 엔티티 생성
        rawScenarioData.ships.forEach(s => {
            const wpSet = rawScenarioData.WayPointSet.find(w => w.WayPointSetID === s.waypointSetID);
            const startWP = wpSet ? wpSet.WayPoints[0] : { Latitude: REF_LAT, Longitude: REF_LON };
            const localPos = latLonToLocal(startWP.Latitude, startWP.Longitude);

            simEntities.push({
                id: s.mmsi,
                name: s.shipName,
                isMASS: s.isMASS === 1,
                x: localPos.x,
                z: localPos.z,
                hdg: s.initHeading,
                spd: s.initSpeed
            });
        });

        // 2D 관제 뷰포트(MASS 기준) 생성
        const massShips = simEntities.filter(s => s.isMASS);
        massShips.forEach((mass, idx) => {
            const vp = document.createElement('div');
            vp.className = `viewport ${idx === 0 ? 'active-vp' : ''}`;
            vp.innerHTML = `
                <div class="vp-label">${mass.name}</div>
                <canvas class="vp-canvas" id="canvas-mass-${idx}"></canvas>
            `;
            
            vp.addEventListener('mousedown', (e) => {
                // MASS 선택
                document.querySelectorAll('.viewport').forEach(v => v.classList.remove('active-vp'));
                vp.classList.add('active-vp');
                selectedMassIndex = idx;
                selectedTargetIndex = -1; // 타겟 초기화
                updateSidebar();
                
                // 타겟 클릭 판별 (매우 단순화된 버전)
                const canvas = document.getElementById(`canvas-mass-${idx}`);
                const rect = canvas.getBoundingClientRect();
                const clickX = e.clientX - rect.left;
                const clickY = e.clientY - rect.top;
                
                const cx = canvas.width / 2;
                const cy = canvas.height / 2;
                const scale = canvas.height / 10000; // 10km 반경 뷰
                
                simEntities.forEach((tgt, tIdx) => {
                    if(tgt.isMASS) return;
                    const relX = tgt.x - mass.x;
                    const relZ = tgt.z - mass.z;
                    // 간단한 2D 회전 (Head up 기반이 아닌 North up 기반)
                    const drawX = cx + (relX * scale);
                    const drawY = cy + (relZ * scale);
                    
                    if(Math.hypot(drawX - clickX, drawY - clickY) < 15) {
                        selectedTargetIndex = tIdx;
                        updateSidebar();
                    }
                });
            });

            grid.appendChild(vp);
            massViews.push({ massEntity: mass, canvasId: `canvas-mass-${idx}` });
        });

        if(massViews.length > 0) {
            selectedMassIndex = 0;
            updateSidebar();
        }

        // 캔버스 사이즈 매칭
        setTimeout(() => {
            massViews.forEach(v => {
                const c = document.getElementById(v.canvasId);
                c.width = c.parentElement.clientWidth;
                c.height = c.parentElement.clientHeight;
            });
        }, 100);
    }

    // ==========================================
    // 4. SCC UI UPDATES (우측 패널)
    // ==========================================
    function updateSidebar() {
        if(selectedMassIndex < 0) return;
        const mass = massViews[selectedMassIndex].massEntity;
        
        document.getElementById('ui-mass-name').innerText = mass.name;
        document.getElementById('ui-mass-hdg').innerText = `${mass.hdg.toFixed(1)}°`;
        document.getElementById('ui-mass-sog').innerText = `${mass.spd.toFixed(1)} Kn`;
        
        document.getElementById('btn-enter-3d').disabled = false;

        if(selectedTargetIndex >= 0) {
            const tgt = simEntities[selectedTargetIndex];
            const relX = tgt.x - mass.x;
            const relZ = tgt.z - mass.z;
            const distNM = Math.sqrt(relX*relX + relZ*relZ) / 1852;
            
            const cpaData = calculateCPA(mass.spd, mass.hdg, tgt.spd, tgt.hdg, relX, relZ);
            
            document.getElementById('ui-tgt-name').innerText = tgt.name;
            document.getElementById('ui-tgt-dist').innerText = `${distNM.toFixed(2)} NM`;
            document.getElementById('ui-tgt-cpa').innerText = `${cpaData.cpa.toFixed(2)} NM`;
            document.getElementById('ui-tgt-tcpa').innerText = cpaData.tcpa > 0 ? `${(cpaData.tcpa/60).toFixed(1)} MIN` : '-';
            document.getElementById('ui-tgt-bcr').innerText = cpaData.bcr > 0 ? `${cpaData.bcr.toFixed(2)} NM` : '-';

            // 알람 시뮬레이션 (CPA 1.5NM 미만, TCPA 20분 미만)
            if(cpaData.cpa < 1.5 && cpaData.tcpa > 0 && cpaData.tcpa < 1200) {
                document.getElementById('ui-risk-alert').style.display = 'block';
            } else {
                document.getElementById('ui-risk-alert').style.display = 'none';
            }
        } else {
            document.getElementById('ui-tgt-name').innerText = '-';
            document.getElementById('ui-tgt-dist').innerText = '-';
            document.getElementById('ui-tgt-cpa').innerText = '-';
            document.getElementById('ui-tgt-tcpa').innerText = '-';
            document.getElementById('ui-tgt-bcr').innerText = '-';
            document.getElementById('ui-risk-alert').style.display = 'none';
        }
    }

    // ==========================================
    // 5. 2D RENDER & PHYSICS LOOP
    // ==========================================
    function updatePhysics(dt) {
        // 단위: knot -> m/s 변환 후 이동
        simEntities.forEach(s => {
            const speedMs = s.spd * 0.51444;
            s.x += speedMs * Math.sin(s.hdg * DEG2RAD) * dt;
            s.z -= speedMs * Math.cos(s.hdg * DEG2RAD) * dt; // 화면/3D 좌표계상 Z는 전방이 -
        });
    }

    function render2D() {
        massViews.forEach((v, idx) => {
            const canvas = document.getElementById(v.canvasId);
            if(!canvas) return;
            const ctx = canvas.getContext('2d');
            const cx = canvas.width / 2;
            const cy = canvas.height / 2;
            const scale = canvas.height / 10000; // 약 5NM 반경 가시

            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            // 레인지 링
            ctx.strokeStyle = '#1e293b'; ctx.lineWidth = 1;
            for(let r=1; r<=4; r++) {
                ctx.beginPath(); ctx.arc(cx, cy, (r * 2500) * scale, 0, Math.PI*2); ctx.stroke();
            }

            // 모든 선박 그리기 (North Up 기준)
            simEntities.forEach((tgt, tIdx) => {
                const relX = tgt.x - v.massEntity.x;
                const relZ = tgt.z - v.massEntity.z;
                const drawX = cx + (relX * scale);
                const drawY = cy + (relZ * scale);

                ctx.save();
                ctx.translate(drawX, drawY);
                ctx.rotate(tgt.hdg * DEG2RAD);
                
                // 본선(해당 View의 MASS) vs 타선 vs 다른 MASS
                if(tgt === v.massEntity) {
                    ctx.fillStyle = '#00ffff'; // 현재 뷰포트 주인공
                } else if (tgt.isMASS) {
                    ctx.fillStyle = '#00ffaa'; // 다른 MASS
                } else {
                    ctx.fillStyle = (selectedMassIndex === idx && selectedTargetIndex === tIdx) ? '#ffcc00' : '#ff3333';
                }

                // 배 모양 폴리곤
                ctx.beginPath(); ctx.moveTo(0, -10); ctx.lineTo(5, 5); ctx.lineTo(-5, 5); ctx.fill();
                ctx.restore();

                // 이름 라벨
                ctx.fillStyle = 'rgba(255,255,255,0.5)';
                ctx.font = '10px monospace';
                ctx.fillText(tgt.name, drawX + 8, drawY + 4);
            });
        });
    }

    // ==========================================
    // 6. THREE.JS 3D ENGINE (FPV View)
    // ==========================================
    let scene, camera3D, renderer3D;
    let mockupOS, targetMeshes = [];
    
    function initThreeJS() {
        const container = document.getElementById('fpv-container');
        scene = new THREE.Scene();
        scene.background = new THREE.Color(0x05101a); // 밤바다 느낌
        scene.fog = new THREE.FogExp2(0x05101a, 0.0001);

        camera3D = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 1, 50000);
        
        renderer3D = new THREE.WebGLRenderer({ antialias: true });
        renderer3D.setSize(window.innerWidth, window.innerHeight);
        container.insertBefore(renderer3D.domElement, document.getElementById('fpv-ui'));

        const ambientLight = new THREE.AmbientLight(0x404040, 1.5);
        scene.add(ambientLight);
        const dirLight = new THREE.DirectionalLight(0xffffff, 0.5);
        dirLight.position.set(0, 1000, -1000);
        scene.add(dirLight);

        // 간이 바다 (단색 Plane)
        const sea = new THREE.Mesh(
            new THREE.PlaneGeometry(80000, 80000),
            new THREE.MeshBasicMaterial({ color: 0x020813, transparent: true, opacity: 0.9 })
        );
        sea.rotation.x = -Math.PI / 2;
        scene.add(sea);

        // 그리드 헬퍼 (스케일감 부여)
        const grid = new THREE.GridHelper(20000, 100, 0x00ffff, 0x1f293d);
        grid.position.y = 0.5;
        scene.add(grid);

        window.addEventListener('resize', () => {
            if(!is3DMode) return;
            camera3D.aspect = window.innerWidth / window.innerHeight;
            camera3D.updateProjectionMatrix();
            renderer3D.setSize(window.innerWidth, window.innerHeight);
        });
    }

    function createMockupShip(colorHex) {
        // 실제 .glb 로더 대신 즉시 렌더링 가능한 임시 박스 모델 생성
        const group = new THREE.Group();
        const hull = new THREE.Mesh(
            new THREE.BoxGeometry(10, 10, 50),
            new THREE.MeshLambertMaterial({ color: colorHex })
        );
        hull.position.y = 5;
        const bridge = new THREE.Mesh(
            new THREE.BoxGeometry(10, 8, 10),
            new THREE.MeshLambertMaterial({ color: 0xaaaaaa })
        );
        bridge.position.set(0, 14, 15);
        group.add(hull);
        group.add(bridge);
        return group;
    }

    function enter3DMode() {
        if(selectedMassIndex < 0) return;
        const mass = massViews[selectedMassIndex].massEntity;
        
        document.getElementById('scc-container').style.display = 'none';
        document.getElementById('fpv-container').style.display = 'block';
        document.getElementById('fpv-title').innerText = `${mass.name} - FPV CAMERA`;
        
        is3DMode = true;

        // 3D 씬 클리어 및 셋업
        if(mockupOS) scene.remove(mockupOS);
        targetMeshes.forEach(m => scene.remove(m));
        targetMeshes = [];

        // 본선(OS) 생성
        mockupOS = createMockupShip(0x00ffff);
        scene.add(mockupOS);

        // 타선 생성
        simEntities.forEach((tgt, idx) => {
            if(tgt === mass) return;
            const isOtherMass = tgt.isMASS;
            const tMesh = createMockupShip(isOtherMass ? 0x00ffaa : 0xff3333);
            scene.add(tMesh);
            targetMeshes.push({ entity: tgt, mesh: tMesh });
        });

        // 리사이즈 트리거
        window.dispatchEvent(new Event('resize'));
    }

    function exit3DMode() {
        is3DMode = false;
        document.getElementById('fpv-container').style.display = 'none';
        document.getElementById('scc-container').style.display = 'flex';
    }

    function sync3DScene() {
        if(!is3DMode || selectedMassIndex < 0) return;
        const mass = massViews[selectedMassIndex].massEntity;

        // OS 위치/회전 동기화
        mockupOS.position.set(mass.x, 0, mass.z);
        mockupOS.rotation.y = -mass.hdg * DEG2RAD;

        // 1인칭 카메라 위치 세팅 (브릿지 위)
        camera3D.position.set(mass.x, 25, mass.z + 10); // 약간 뒤쪽/위쪽
        camera3D.rotation.y = -mass.hdg * DEG2RAD; // 선박이 바라보는 방향
        camera3D.rotation.x = -0.05; // 살짝 아래 보기

        // 타선 동기화
        targetMeshes.forEach(t => {
            t.mesh.position.set(t.entity.x, 0, t.entity.z);
            t.mesh.rotation.y = -t.entity.hdg * DEG2RAD;
        });

        // 3D HUD 업데이트
        document.getElementById('fpv-hdg').innerText = `${mass.hdg.toFixed(1)}°`;
        document.getElementById('fpv-sog').innerText = `${mass.spd.toFixed(1)} Kt`;
        
        // 간단한 CPA 경고 (가장 가까운 타선 기준)
        let minCPA = Infinity;
        simEntities.forEach(tgt => {
            if(tgt === mass) return;
            const cpaData = calculateCPA(mass.spd, mass.hdg, tgt.spd, tgt.hdg, tgt.x - mass.x, tgt.z - mass.z);
            if(cpaData.tcpa > 0 && cpaData.cpa < minCPA) minCPA = cpaData.cpa;
        });

        const cpaEl = document.getElementById('fpv-cpa');
        if(minCPA < 1.5) {
            cpaEl.innerText = `${minCPA.toFixed(2)} NM`;
            cpaEl.style.color = '#ff3333';
        } else {
            cpaEl.innerText = `SAFE`;
            cpaEl.style.color = '#00ffaa';
        }

        renderer3D.render(scene, camera3D);
    }

    // ==========================================
    // 7. MAIN EVENT LOOP
    // ==========================================
    function mainLoop() {
        requestAnimationFrame(mainLoop);
        
        const now = performance.now();
        const dt = (now - lastTime) / 1000; // 초 단위 델타타임 (배속을 원하면 * 배수)
        lastTime = now;

        // 1. 전역 물리 업데이트
        updatePhysics(dt);

        // 2. 뷰어 업데이트 분기
        if(is3DMode) {
            sync3DScene();
        } else {
            render2D();
            updateSidebar(); // 실시간 데이터 라벨 갱신
        }
    }

    // 이벤트 리스너 바인딩
    document.getElementById('btn-enter-3d').addEventListener('click', enter3DMode);
    document.getElementById('btn-exit-3d').addEventListener('click', exit3DMode);

    // 구동 시작
    initScenario();
    initThreeJS();
    mainLoop();

</script>
</body>
</html>
