<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>[HTMS] Portable Remote Operation Center</title>
    <!-- Three.js 및 에셋 로더 -->
    <script src="https://unpkg.com/three@0.128.0/build/three.min.js"></script>
    <script src="https://unpkg.com/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&display=swap');

        :root {
            --bg-color: #0b0f19;
            --panel-bg: #111827;
            --border-color: #1f293d;
            --accent-cyan: #06b6d4;
            --accent-green: #10b981;
            --accent-red: #ef4444;
            --accent-yellow: #eab308;
            --text-main: #f3f4f6;
            --text-muted: #9ca3af;
        }

        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: var(--bg-color); color: var(--text-main); font-family: 'Rajdhani', sans-serif; user-select: none; touch-action: none; }

        /* ================= 메인 메뉴 (로그인) ================= */
        #login-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(5, 10, 20, 0.95); z-index: 999; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; }
        #login-overlay h1 { font-size: 42px; color: var(--accent-cyan); letter-spacing: 2px; margin-bottom: 10px; text-shadow: 0 0 20px rgba(6,182,212,0.5); font-family: 'Arial Black', sans-serif;}
        #login-overlay h2 { color: var(--accent-green); letter-spacing: 5px; font-size: 18px; font-weight: bold; margin-bottom: 40px; }
        
        .menu-box { background: rgba(0,0,0,0.6); border: 1px solid var(--accent-cyan); border-radius: 12px; padding: 40px; width: 90%; max-width: 400px; box-sizing: border-box; box-shadow: 0 10px 40px rgba(6,182,212,0.1); }
        .form-row { margin-bottom: 20px; text-align: left; }
        .form-row label { display: block; font-size: 14px; color: #88c0d0; margin-bottom: 8px; font-weight: bold; }
        .form-row input, .form-row select { width: 100%; padding: 12px; background: rgba(255,255,255,0.05); border: 1px solid #555; color: #fff; font-family: 'Rajdhani', sans-serif; font-size: 16px; border-radius: 4px; outline: none; box-sizing: border-box; }
        .form-row input:focus, .form-row select:focus { border-color: var(--accent-cyan); }
        
        .btn-start { width: 100%; padding: 15px; font-size: 20px; font-weight: bold; border: none; border-radius: 6px; cursor: pointer; font-family: 'Rajdhani', sans-serif; background: var(--accent-green); color: #000; transition: 0.2s; margin-top: 10px; }
        .btn-start:hover { background: #0ea5e9; transform: translateY(-2px); }

        #loading-screen { display: none; margin-top: 20px; color: var(--accent-yellow); font-weight: bold; font-size: 16px; }

        /* ================= 메인 레이아웃 (매크로 뷰 vs 스플릿 뷰) ================= */
        #main-wrapper { display: none; width: 100%; height: 100vh; position: absolute; top: 0; left: 0; z-index: 10; background: var(--bg-color); flex-direction: row; }
        
        /* 좌측 2D 그리드 영역 */
        #grid-area { width: 100%; display: grid; gap: 2px; background: var(--border-color); height: 100%; transition: width 0.35s ease-in-out; }
        
        /* 중앙 분할바 (Resizer) */
        #resizer { display: none; width: 8px; background: #1e293b; cursor: col-resize; z-index: 30; border-left: 1px solid #0f172a; border-right: 1px solid #0f172a; transition: background 0.2s; }
        #resizer:hover, #resizer:active { background: var(--accent-cyan); }

        /* 우측 사이드바 (대시보드) */
        #sidebar { width: 380px; background: var(--panel-bg); border-left: 1px solid var(--border-color); display: flex; flex-direction: column; padding: 20px; box-sizing: border-box; z-index: 20; transition: width 0.35s ease-in-out, padding 0.35s ease-in-out; overflow-y: auto; flex-shrink: 0; }
        .panel-title { font-size: 24px; font-weight: 800; color: var(--accent-cyan); border-bottom: 1px solid var(--border-color); padding-bottom: 10px; margin-bottom: 15px; letter-spacing: 1px; flex-shrink: 0; text-align: center;}
        
        /* 우측 3D 집중관찰(FPV) 영역 */
        #fpv-area { display: none; flex: 1; height: 100%; background: #050a10; position: relative; border-left: 2px solid var(--accent-cyan); flex-direction: column; overflow: hidden; box-shadow: inset 10px 0 30px rgba(0,0,0,0.8); }

        /* Split Mode State Classes */
        #main-wrapper.split-mode #grid-area { width: 50%; }
        #main-wrapper.split-mode #resizer { display: block; }
        #main-wrapper.split-mode #sidebar { width: 0; padding: 0; border: none; overflow: hidden; }
        #main-wrapper.split-mode #fpv-area { display: flex; }

        /* ================= 2D 뷰포트 내부 스타일 ================= */
        .viewport { position: relative; background: radial-gradient(circle at center, #111a2e 0%, #0d1322 100%); overflow: hidden; border: 2px solid transparent; transition: border 0.2s; }
        .viewport.active-vp { border: 2px solid var(--accent-yellow); }
        .viewport.hidden-vp { display: none !important; } /* 스플릿 뷰 시 선택되지 않은 창 숨김 */
        .vp-canvas { width: 100%; height: 100%; display: block; cursor: crosshair; }
        
        .vp-label { position: absolute; top: 10px; right: 10px; background: rgba(0,0,0,0.6); color: var(--accent-yellow); font-weight: bold; font-size: 14px; padding: 4px 10px; border-radius: 4px; border: 1px solid var(--accent-yellow); z-index: 10; pointer-events: none; }
        .coord-hud { position: absolute; top: 10px; left: 10px; background: rgba(17, 24, 39, 0.85); border: 1px solid var(--border-color); padding: 8px 12px; border-radius: 6px; font-family: monospace; font-size: 12px; backdrop-filter: blur(4px); pointer-events: none; display: flex; flex-direction: column; gap: 4px; z-index: 10; }
        .hud-range { color: var(--accent-cyan); font-weight: bold; }
        .hud-cursor { color: var(--text-muted); }
        
        /* ================= 3D FPV UI 스타일 ================= */
        #fpv-header { position: absolute; top: 0; left: 0; width: 100%; padding: 10px 20px; background: linear-gradient(to bottom, rgba(5,10,15,0.9), transparent); display: flex; justify-content: space-between; align-items: center; z-index: 50; box-sizing: border-box; pointer-events: none;}
        #fpv-title { color: var(--accent-cyan); font-weight: bold; font-size: 20px; letter-spacing: 1px; text-shadow: 0 2px 4px #000; }
        
        .btn-return { pointer-events: auto; background: rgba(239, 68, 68, 0.2); border: 1px solid #ef4444; color: #fca5a5; padding: 6px 12px; border-radius: 4px; font-family: 'Rajdhani', sans-serif; font-weight: bold; font-size: 14px; cursor: pointer; transition: 0.2s; }
        .btn-return:hover { background: #ef4444; color: #fff; }

        /* Step 1 임시 개입 버튼 */
        #btn-intervention { position: absolute; bottom: 30px; right: 30px; background: rgba(16, 185, 129, 0.2); border: 2px solid var(--accent-green); color: var(--accent-green); padding: 15px 30px; font-size: 18px; font-family: 'Rajdhani', sans-serif; font-weight: bold; border-radius: 8px; cursor: pointer; z-index: 50; transition: all 0.2s; backdrop-filter: blur(4px); box-shadow: 0 0 15px rgba(16,185,129,0.2); }
        #btn-intervention:hover { background: var(--accent-green); color: #000; box-shadow: 0 0 25px rgba(16,185,129,0.6); transform: scale(1.05); }

        /* 사이드바 데이터 박스 */
        .info-box { background: #172033; border: 1px solid #334155; border-radius: 6px; padding: 15px; margin-bottom: 15px; border-left: 3px solid var(--accent-cyan); flex-shrink: 0; }
        .info-header { font-size: 12px; color: var(--text-muted); margin-bottom: 10px; font-weight: bold; }
        .data-row { display: flex; justify-content: space-between; margin-bottom: 6px; font-size: 14px; align-items: center; }
        .data-row span { color: #94a3b8; font-weight: bold; }
        .data-row b { color: #fff; font-family: monospace; font-size: 16px; }
    </style>
</head>
<body>

    <!-- 1. 로그인 (메인 화면) -->
    <div id="login-overlay">
        <h1>[HTMS] Portable Remote Operation Center</h1>
        <h2>REMOTE OPERATION SIMULATOR</h2>
        
        <div class="menu-box">
            <div class="form-row">
                <label>학번 (Student ID)</label>
                <input type="text" id="student-id" placeholder="예: 20261234" autocomplete="off" value="20260001" />
            </div>
            <div class="form-row">
                <label>이름 (Name)</label>
                <input type="text" id="student-name" placeholder="예: 홍길동" autocomplete="off" value="테스터" />
            </div>
            <div class="form-row">
                <label>시나리오 (Scenario) 선택</label>
                <select id="scenario-select">
                    <option value="">목록 로딩 중...</option>
                </select>
            </div>
            <button class="btn-start" onclick="loadScenarioAndStart()" id="btn-start">시뮬레이션 시작</button>
            <div id="loading-screen">통신 중... 잠시만 기다려주세요.</div>
        </div>
    </div>

    <!-- 2. 메인 관제 레이아웃 -->
    <div id="main-wrapper">
        
        <!-- 좌측: 2D 멀티 그리드 뷰어 -->
        <div id="grid-area"></div>
        
        <!-- 중앙: 스플릿 뷰 크기 조절바 -->
        <div id="resizer"></div>
        
        <!-- 우측: 매크로 모드 시 대시보드 사이드바 -->
        <div id="sidebar">
            <div class="panel-title">MACRO DASHBOARD</div>
            <div class="info-box">
                <div class="info-header" style="color: var(--accent-cyan);">SELECTED MASS INFO</div>
                <div class="data-row"><span>NAME:</span> <b id="ui-mass-name" style="color: var(--accent-yellow);">-</b></div>
                <div class="data-row"><span>HDG:</span> <b id="ui-mass-hdg">-</b></div>
                <div class="data-row"><span>SOG:</span> <b id="ui-mass-sog">-</b></div>
            </div>
            <div style="font-size: 12px; color: #64748b; background: #0f172a; padding: 10px; border-radius: 6px; border: 1px solid #1e293b; text-align: center; margin-top: auto;">
                💡 <b>TIP:</b> 상세 상황을 보려면<br>특정 화면을 <b>더블클릭</b> 하세요.
            </div>
        </div>

        <!-- 우측: 스플릿 모드 시 3D 집중관찰(FPV) 창 -->
        <div id="fpv-area">
            <div id="fpv-header">
                <div id="fpv-title">MASS_1 FPV CAMERA</div>
                <button class="btn-return" onclick="exitSplitMode()">🔙 MACRO VIEW (복귀)</button>
            </div>
            <!-- 임시 개입 버튼 (Step 2에서 기능 연동) -->
            <button id="btn-intervention" onclick="alert('Step 2에서 통신 지연(Latency) 로직과 함께 활성화될 예정입니다.')">원격 개입 (Intervention)</button>
        </div>

    </div>

<script>
    // ==========================================
    // 0. CONSTANTS & FALLBACK DATA
    // ==========================================
    const SCENARIO_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzxl77msNyO5QKHSRSG9QAJlH9r9NGh78iV1KkddiTOHi4WO-SVWw_HAEJZK7qGg8GRig/exec";
    const GITHUB_BASE_URL = "./"; 
    const DEG2RAD = Math.PI / 180;
    
    const SHIP_LEN_UNIT = 64.8;  
    const SHIP_WID_UNIT = 10.8; 
    const VECTOR_SCALE = 8;     

    const modelFiles = [
        "Models/ContainerShip1.glb", "Models/BulkCarrier.glb", "Models/GasCarrier1.glb", "Models/CargoShip1.glb"
    ];

    const fallbackScenarioData = {
        "ScenarioName": "Exported_MASS_Scenario",
        "environment": { "wind": { "dir": 45, "spd": 12.5 }, "current": { "dir": 0, "spd": 0 } },
        "ships": [
            { "mmsi": 111, "isMASS": 1, "shipName": "MASS_1", "shipType": "CNTR_2700", "initSpeed": 15, "initHeading": 45, "waypointSetID": 0 },
            { "mmsi": 222, "isMASS": 1, "shipName": "MASS_2", "shipType": "CNTR_2700", "initSpeed": 12, "initHeading": 0, "waypointSetID": 1 },
            { "mmsi": 333, "isMASS": 1, "shipName": "MASS_3", "shipType": "CNTR_2700", "initSpeed": 18, "initHeading": 315, "waypointSetID": 2 },
            { "mmsi": 444, "isMASS": 0, "shipName": "ALPHA_1", "shipType": "BULK", "initSpeed": 10, "initHeading": 180, "waypointSetID": 3 }
        ],
        "WayPointSet": [
            { "WayPointSetID": 0, "WayPoints": [{ "Latitude": 34.800000, "Longitude": 126.400000 }] },
            { "WayPointSetID": 1, "WayPoints": [{ "Latitude": 34.800000, "Longitude": 126.500000 }] },
            { "WayPointSetID": 2, "WayPoints": [{ "Latitude": 34.800000, "Longitude": 126.600000 }] },
            { "WayPointSetID": 3, "WayPoints": [{ "Latitude": 34.850000, "Longitude": 126.450000 }] }
        ]
    };

    // ==========================================
    // 1. STATE VARIABLES
    // ==========================================
    let simEntities = []; 
    let massViews = [];   
    let activeMassIndex = 0;
    let isSplitMode = false;
    let isSimulationRunning = false;
    let lastTime = performance.now();

    // 3D Variables
    let scene, camera3D, renderer3D;
    let parsedModels = {};
    let daySkybox = null;
    let osShipGroup, targetMeshes = [];
    let isDraggingCam = false; 
    let camAngleX = -0.05, camAngleY = 0; 
    let lastCamTouchX = 0, lastCamTouchY = 0;

    // ==========================================
    // 2. FETCH & INITIALIZATION (캐시 버스팅 포함)
    // ==========================================
    async function fetchScenarioList() {
        const select = document.getElementById('scenario-select');
        try {
            // 💡 캐시 버스팅 적용 (URL에 타임스탬프 추가)
            const res = await fetch(`${SCENARIO_SCRIPT_URL}?action=list&t=${new Date().getTime()}`);
            const data = await res.json();
            let files = Array.isArray(data) ? data : (data.files || data.data || []);
            select.innerHTML = '';
            
            const filteredFiles = files.filter(f => f && f.name && String(f.name).toUpperCase().includes('MASS'));
            if(filteredFiles.length === 0) select.innerHTML = '<option value="">선택할 시나리오가 없습니다.</option>';
            else filteredFiles.forEach(file => {
                const opt = document.createElement('option'); opt.value = file.id; opt.textContent = String(file.name).replace('.json', ''); select.appendChild(opt);
            });
        } catch (err) {
            select.innerHTML = '<option value="local_test">[Local Test] Exported_MASS_Scenario</option>';
        }
    }
    window.addEventListener('DOMContentLoaded', fetchScenarioList);

    function getValidShipType(rawType) {
        if (!rawType) return "CargoShip1.glb";
        const t = String(rawType).toUpperCase();
        if (t.includes("CNTR")) return "ContainerShip1.glb";
        if (t.includes("BULK")) return "BulkCarrier.glb";
        if (t.includes("CHEM") || t.includes("LNG") || t.includes("GAS") || t.includes("TANK")) return "GasCarrier1.glb";
        return "CargoShip1.glb"; 
    }

    async function loadScenarioAndStart() {
        const scnId = document.getElementById('scenario-select').value;
        const loadMsg = document.getElementById('loading-screen');
        const btnStart = document.getElementById('btn-start');
        
        if(!document.getElementById('student-id').value) { alert("학번을 입력해주세요."); return; }
        btnStart.style.display = 'none'; loadMsg.style.display = 'block';

        let scenarioData;
        if(scnId === "local_test") scenarioData = fallbackScenarioData;
        else {
            try {
                // 💡 캐시 버스팅 적용
                const res = await fetch(`${SCENARIO_SCRIPT_URL}?action=load&fileId=${scnId}&t=${new Date().getTime()}`);
                scenarioData = await res.json();
                if(scenarioData.error) throw new Error(scenarioData.error);
            } catch (err) { scenarioData = fallbackScenarioData; }
        }

        // 💡 영점 조절 파일 (Settings.json) 캐시 버스팅 로드 및 적용
        loadMsg.innerText = "영점 조절 세팅 로드 중... (1/3)";
        try { 
            const setRes = await fetch(GITHUB_BASE_URL + "Jsons/Settings.json?t=" + new Date().getTime()); 
            if(setRes.ok) { 
                const settingsData = await setRes.json(); 
                for (const key in settingsData) localStorage.setItem(key, settingsData[key]); 
            } 
        } catch(e) { console.warn("Settings.json 로드 실패", e); }

        const texLoader = new THREE.TextureLoader();
        loadMsg.innerText = "스카이박스 불러오는 중... (2/3)";
        try {
            daySkybox = await new Promise((resolve) => {
                texLoader.load(GITHUB_BASE_URL + "Environment/NiceSky.jpg", (tex) => { 
                    tex.mapping = THREE.EquirectangularReflectionMapping; resolve(tex); 
                }, undefined, () => resolve(null));
            });
        } catch(e) {}

        const gltfLoader = new THREE.GLTFLoader();
        for (let i = 0; i < modelFiles.length; i++) {
            loadMsg.innerText = `3D 선박 로드 중... (${i+1}/${modelFiles.length})`;
            await new Promise((resolve) => {
                gltfLoader.load(GITHUB_BASE_URL + modelFiles[i], (gltf) => {
                    const model = gltf.scene;
                    const box = new THREE.Box3().setFromObject(model); 
                    const size = new THREE.Vector3(); box.getSize(size); 
                    const center = new THREE.Vector3(); box.getCenter(center);
                    model.position.set(-center.x, -center.y, -center.z); 
                    const scale = 150 / Math.max(size.x, size.y, size.z); 
                    const wrapper = new THREE.Group(); wrapper.add(model); wrapper.scale.set(scale, scale, scale);
                    parsedModels[modelFiles[i].split('/').pop()] = { group: wrapper };
                    resolve();
                }, undefined, () => resolve());
            });
            await new Promise(r => setTimeout(r, 20)); 
        }

        initializeSimulation(scenarioData);
    }

    // ==========================================
    // 3. SIMULATION LOGIC & GRID SETUP
    // ==========================================
    function latLonToUnits(lat, lon, refLat, refLon) {
        const dxM = (lon - refLon) * 111111 * Math.cos(refLat * Math.PI / 180);
        const dzM = -(lat - refLat) * 111111;
        return { x: dxM * (400 / 1852), z: dzM * (400 / 1852) };
    }

    function initializeSimulation(data) {
        document.getElementById('login-overlay').style.display = 'none';
        document.getElementById('main-wrapper').style.display = 'flex';
        
        let refLat = 34.8; let refLon = 126.4;
        if(data.WayPointSet && data.WayPointSet.length > 0) { 
            refLat = Number(data.WayPointSet[0].WayPoints[0].Latitude); 
            refLon = Number(data.WayPointSet[0].WayPoints[0].Longitude); 
        }

        simEntities = [];
        data.ships.forEach(s => {
            const wpSet = data.WayPointSet.find(w => w.WayPointSetID === s.waypointSetID);
            const startWP = wpSet ? wpSet.WayPoints[0] : { Latitude: refLat, Longitude: refLon };
            const uPos = latLonToUnits(startWP.Latitude, startWP.Longitude, refLat, refLon);
            simEntities.push({ 
                id: s.mmsi, name: s.shipName, type: getValidShipType(s.shipType), isMASS: s.isMASS === 1, 
                x: uPos.x, z: uPos.z, hdg: s.initHeading, spd: s.initSpeed 
            });
        });

        const massShips = simEntities.filter(s => s.isMASS);
        const grid = document.getElementById('grid-area');
        grid.innerHTML = ''; massViews = [];

        massShips.forEach((mass, idx) => {
            const vp = document.createElement('div');
            vp.className = `viewport ${idx === 0 ? 'active-vp' : ''}`;
            vp.id = `vp-${idx}`;
            vp.innerHTML = `
                <div class="vp-label">${mass.name}</div>
                <div class="coord-hud" id="hud-${idx}">
                    <div class="hud-range">RANGE: 3.0 NM</div>
                </div>
                <canvas class="vp-canvas" id="canvas-mass-${idx}"></canvas>
            `;
            grid.appendChild(vp);

            const vObj = { massEntity: mass, canvasId: `canvas-mass-${idx}`, viewScale: 1 / 3.0, panX: 0, panY: 0, isDragging: false, dragStartX: 0, dragStartY: 0 };
            massViews.push(vObj);

            // 이벤트 바인딩 (단일클릭: 활성화, 더블클릭: 스플릿 뷰 진입)
            vp.addEventListener('mousedown', () => {
                document.querySelectorAll('.viewport').forEach(v => v.classList.remove('active-vp'));
                vp.classList.add('active-vp');
                activeMassIndex = idx; updateSidebar();
            });

            vp.addEventListener('dblclick', () => {
                enterSplitMode(idx);
            });

            setTimeout(() => {
                const canvas = document.getElementById(vObj.canvasId);
                canvas.width = vp.clientWidth; canvas.height = vp.clientHeight;
                vObj.panX = canvas.width / 2; vObj.panY = canvas.height / 2;
                
                // 패닝 로직
                canvas.addEventListener('mousedown', (e) => {
                    const rect = canvas.getBoundingClientRect();
                    vObj.isDragging = true; vObj.dragStartX = (e.clientX - rect.left) - vObj.panX; vObj.dragStartY = (e.clientY - rect.top) - vObj.panY;
                });
                window.addEventListener('mousemove', (e) => {
                    if(vObj.isDragging) { const rect = canvas.getBoundingClientRect(); vObj.panX = (e.clientX - rect.left) - vObj.dragStartX; vObj.panY = (e.clientY - rect.top) - vObj.dragStartY; }
                });
                window.addEventListener('mouseup', () => vObj.isDragging = false);
                
                // 줌(휠) 로직
                canvas.addEventListener('wheel', (e) => {
                    e.preventDefault();
                    let range = 1 / vObj.viewScale; range = Math.min(30, Math.max(0.5, range * (e.deltaY < 0 ? 0.9 : 1.1)));
                    vObj.viewScale = 1 / range; document.querySelector(`#hud-${idx} .hud-range`).textContent = `RANGE: ${range.toFixed(1)} NM`;
                }, { passive: false });
            }, 50);
        });

        updateGridLayout();
        initThreeJS_Lightweight();
        
        isSimulationRunning = true;
        mainLoop();
    }

    function updateGridLayout() {
        if(isSplitMode) return; // 스플릿 모드일때는 CSS로 처리되므로 그리드 계산 생략
        const grid = document.getElementById('grid-area');
        const count = massViews.length;
        if (count === 0) return;
        let cols = 1, rows = 1;
        if (count === 2) { cols = 2; rows = 1; }
        else if (count === 3) { cols = 3; rows = 1; }
        else if (count === 4) { cols = 2; rows = 2; }
        else if (count > 4) { cols = 3; rows = Math.ceil(count / 3); }
        
        grid.style.gridTemplateColumns = `repeat(${cols}, 1fr)`;
        grid.style.gridTemplateRows = `repeat(${rows}, 1fr)`;

        // 리사이즈 시 캔버스 크기 재조정
        setTimeout(() => {
            forceResizeCanvases();
        }, 50);
    }
    
    // 강제 캔버스 리사이즈 헬퍼
    function forceResizeCanvases() {
        massViews.forEach(v => {
            const canvas = document.getElementById(v.canvasId);
            const vp = canvas.parentElement;
            if(vp.classList.contains('hidden-vp')) return;
            canvas.width = vp.clientWidth; canvas.height = vp.clientHeight;
        });
        
        if (isSplitMode && camera3D && renderer3D) {
            const fpvArea = document.getElementById('fpv-area');
            camera3D.aspect = fpvArea.clientWidth / fpvArea.clientHeight;
            camera3D.updateProjectionMatrix();
            renderer3D.setSize(fpvArea.clientWidth, fpvArea.clientHeight);
        }
    }

    window.addEventListener('resize', updateGridLayout);

    function updateSidebar() {
        if(massViews.length === 0) return;
        const mass = massViews[activeMassIndex].massEntity;
        document.getElementById('ui-mass-name').innerText = mass.name;
        document.getElementById('ui-mass-hdg').innerText = `${mass.hdg.toFixed(1)}°`;
        document.getElementById('ui-mass-sog').innerText = `${mass.spd.toFixed(1)} Kn`;
    }

    // ==========================================
    // 4. UX FLOW: SPLIT MODE TOGGLE & RESIZER
    // ==========================================
    const resizer = document.getElementById('resizer');
    const gridArea = document.getElementById('grid-area');
    let isResizing = false;

    // 분할바(Resizer) 드래그 이벤트
    resizer.addEventListener('mousedown', (e) => {
        isResizing = true;
        document.body.style.cursor = 'col-resize';
        e.preventDefault(); 
    });
    window.addEventListener('mousemove', (e) => {
        if (!isResizing) return;
        let newWidth = (e.clientX / window.innerWidth) * 100;
        if(newWidth < 20) newWidth = 20;
        if(newWidth > 80) newWidth = 80;
        gridArea.style.width = `${newWidth}%`;
        forceResizeCanvases();
    });
    window.addEventListener('mouseup', () => {
        if(isResizing) {
            isResizing = false;
            document.body.style.cursor = 'default';
            forceResizeCanvases();
        }
    });

    function enterSplitMode(idx) {
        if(isSplitMode) return;
        activeMassIndex = idx;
        isSplitMode = true;
        
        const wrapper = document.getElementById('main-wrapper');
        wrapper.classList.add('split-mode');
        gridArea.style.width = '50%'; // 💡 기본 50:50 분할

        // 선택되지 않은 뷰포트 숨기기
        massViews.forEach((v, i) => {
            const vp = document.getElementById(`vp-${i}`);
            if(i === idx) {
                vp.classList.remove('hidden-vp');
                vp.classList.add('active-vp');
            } else {
                vp.classList.add('hidden-vp');
                vp.classList.remove('active-vp');
            }
        });

        // 3D 씬 선박 세팅 
        setup3DSceneForMass(idx);

        // 💡 애니메이션 트랜지션 완료 후 강제 리사이즈 (찌그러짐 방지)
        setTimeout(() => {
            forceResizeCanvases();
        }, 360); 
    }

    window.exitSplitMode = function() {
        if(!isSplitMode) return;
        isSplitMode = false;

        const wrapper = document.getElementById('main-wrapper');
        wrapper.classList.remove('split-mode');
        gridArea.style.width = '100%'; // 분할바 초기화

        // 숨겼던 뷰포트 복구
        massViews.forEach((v, i) => {
            const vp = document.getElementById(`vp-${i}`);
            vp.classList.remove('hidden-vp');
        });

        // 💡 CSS 0.35s 애니메이션 종료 타이밍에 맞춰 다시 그리기 (MACRO 뷰 찌그러짐 완벽 해결)
        setTimeout(() => {
            updateGridLayout();
        }, 360);
    }

    // ==========================================
    // 5. LIGHTWEIGHT 3D ENGINE (Step 1)
    // ==========================================
    function initThreeJS_Lightweight() {
        const fpvArea = document.getElementById('fpv-area');
        scene = new THREE.Scene();
        if(daySkybox) { scene.background = daySkybox; } else { scene.background = new THREE.Color(0x5a6a79); }
        scene.fog = new THREE.FogExp2(0x5a6a79, 0.00015);

        osShipGroup = new THREE.Group(); scene.add(osShipGroup);
        camera3D = new THREE.PerspectiveCamera(60, fpvArea.clientWidth / fpvArea.clientHeight, 1, 80000);
        osShipGroup.add(camera3D); // 카메라는 본선에 종속
        
        renderer3D = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
        renderer3D.setPixelRatio(Math.min(window.devicePixelRatio, 1.0)); // 경량화
        renderer3D.setSize(fpvArea.clientWidth, fpvArea.clientHeight);
        fpvArea.insertBefore(renderer3D.domElement, document.getElementById('btn-intervention'));

        scene.add(new THREE.AmbientLight(0x707070, 1.5));
        const dirLight = new THREE.DirectionalLight(0xffffff, 1.0); dirLight.position.set(-1000, 1500, -1000); scene.add(dirLight);

        // Water.js 대신 단순한 단색 Plane (가벼움)
        const simpleSea = new THREE.Mesh(
            new THREE.PlaneGeometry(80000, 80000),
            new THREE.MeshBasicMaterial({ color: 0x004488, transparent: true, opacity: 0.9 })
        );
        simpleSea.rotation.x = -Math.PI / 2;
        scene.add(simpleSea);

        // 카메라 마우스 드래그 조작 로직
        fpvArea.addEventListener('mousedown', (e) => { if(e.target.tagName === 'CANVAS') isDraggingCam = true; });
        window.addEventListener('mouseup', () => { isDraggingCam = false; });
        window.addEventListener('mousemove', (e) => {
            if (isDraggingCam && isSplitMode) { 
                camAngleY -= e.movementX * 0.003; camAngleX -= e.movementY * 0.003; camAngleX = Math.max(-Math.PI / 2, Math.min(Math.PI / 2, camAngleX)); 
            }
        });
    }

    // 💡 모델 생성 및 영점 조절(Calibration) 적용 함수
    function getModelForShip(type) {
        if (parsedModels[type]) {
            const clone = parsedModels[type].group.clone();
            const savedCalib = localStorage.getItem('model_calib_' + type);
            if(savedCalib) { 
                const calib = JSON.parse(savedCalib); 
                clone.position.copy(calib.pos);
                clone.rotation.set(calib.rot.x, calib.rot.y, calib.rot.z);
            }
            return clone;
        }
        // Fallback 박스 모델
        const group = new THREE.Group();
        const hull = new THREE.Mesh( new THREE.BoxGeometry(10, 10, 50), new THREE.MeshLambertMaterial({ color: 0x10b981 }) ); hull.position.y = 5;
        group.add(hull); return group;
    }

    function setup3DSceneForMass(idx) {
        const mass = massViews[idx].massEntity;
        document.getElementById('fpv-title').innerText = `${mass.name} FPV CAMERA`;

        // 기존 자식 정리
        for(let i = osShipGroup.children.length - 1; i >= 0; i--) { 
            if(osShipGroup.children[i] !== camera3D) osShipGroup.remove(osShipGroup.children[i]); 
        }
        targetMeshes.forEach(m => scene.remove(m.mesh)); targetMeshes = [];
        
        // 본선 추가 (캘리브레이션 적용됨)
        const osModel = getModelForShip(mass.type);
        osShipGroup.add(osModel);
        camera3D.position.set(0, 50, -10); // 브릿지 위치
        camAngleX = -0.05; camAngleY = 0;

        // 타선 추가 (월드 이동을 위해 한번 더 Group 래핑)
        simEntities.forEach((tgt) => { 
            if(tgt === mass) return; 
            const tModel = getModelForShip(tgt.type); 
            const tGroup = new THREE.Group();
            tGroup.add(tModel);
            scene.add(tGroup); 
            targetMeshes.push({ entity: tgt, mesh: tGroup }); 
        });
    }

    // ==========================================
    // 6. RENDER LOOP (2D & 3D Sync)
    // ==========================================
    function drawShipHullLocal(ctx, panX, panY, viewScale, x, z, heading, color, isOwnShip, label) {
        const cx = panX + x * viewScale; const cy = panY + z * viewScale;
        ctx.save(); ctx.translate(cx, cy); ctx.rotate(heading * DEG2RAD); ctx.scale(viewScale, viewScale); 
        ctx.shadowColor = color; ctx.shadowBlur = 10; ctx.fillStyle = color;
        const halfLen = SHIP_LEN_UNIT / 2; const halfWid = SHIP_WID_UNIT / 2; 
        ctx.beginPath(); ctx.moveTo(0, -halfLen); ctx.lineTo(halfWid, -halfLen + 12); ctx.lineTo(halfWid, halfLen); ctx.lineTo(-halfWid, halfLen); ctx.lineTo(-halfWid, -halfLen + 12); ctx.closePath(); ctx.fill();
        ctx.lineWidth = 1 / viewScale; ctx.strokeStyle = '#ffffff'; ctx.stroke(); ctx.restore();
        if (label) { ctx.fillStyle = color; ctx.font = 'bold 11px monospace'; ctx.textAlign = 'center'; ctx.fillText(label, cx, cy + Math.max(25, (SHIP_LEN_UNIT / 2) * viewScale + 15)); }
    }
    
    function drawVectorArrowLocal(ctx, panX, panY, viewScale, x, z, heading, distUnit, color) {
        if (distUnit <= 0) return;
        const cx = panX + x * viewScale; const cy = panY + z * viewScale; const rad = (heading - 90) * DEG2RAD;
        const wpX = cx + Math.cos(rad) * (distUnit * viewScale); const wpY = cy + Math.sin(rad) * (distUnit * viewScale);
        ctx.strokeStyle = color; ctx.lineWidth = 1.5; ctx.setLineDash([4, 4]);
        ctx.beginPath(); ctx.moveTo(cx, cy); ctx.lineTo(wpX, wpY); ctx.stroke(); ctx.setLineDash([]);
    }

    function render2D() {
        massViews.forEach((v, idx) => {
            const canvas = document.getElementById(v.canvasId); 
            const vp = canvas.parentElement;
            // 스플릿 뷰에서 숨겨진 캔버스는 그리지 않음 (성능 최적화)
            if(!canvas || vp.classList.contains('hidden-vp')) return;
            
            const ctx = canvas.getContext('2d'); ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.strokeStyle = '#1e293b'; ctx.lineWidth = 1; ctx.beginPath(); ctx.moveTo(0, v.panY); ctx.lineTo(canvas.width, v.panY); ctx.moveTo(v.panX, 0); ctx.lineTo(v.panX, canvas.height); ctx.stroke();
            
            const rangeNM = 1 / v.viewScale;
            let stepCbl = rangeNM <= 1.5 ? 1 : (rangeNM <= 3.5 ? 5 : (rangeNM <= 8.0 ? 10 : 20));   
            let majorCbl = rangeNM <= 1.5 ? 5 : (rangeNM <= 3.5 ? 10 : (rangeNM <= 8.0 ? 20 : 50)); 
            const maxCables = Math.ceil((Math.max(Math.hypot(v.panX, v.panY), Math.hypot(canvas.width - v.panX, v.panY), Math.hypot(v.panX, canvas.height - v.panY), Math.hypot(canvas.width - v.panX, canvas.height - v.panY)) / v.viewScale) / 40);
            
            ctx.setLineDash([4, 4]);
            for (let i = stepCbl; i <= maxCables; i += stepCbl) { const radius_px = (i * 40) * v.viewScale; ctx.strokeStyle = (i % majorCbl === 0) ? '#2d3f5a' : '#1d283a'; ctx.lineWidth = (i % majorCbl === 0) ? 1.5 : 1; ctx.beginPath(); ctx.arc(v.panX, v.panY, radius_px, 0, Math.PI * 2); ctx.stroke(); }
            ctx.setLineDash([]);
            
            simEntities.forEach((s) => {
                const relX = s.x - v.massEntity.x; const relZ = s.z - v.massEntity.z;
                const isOwnShip = s === v.massEntity;
                const color = isOwnShip ? '#10b981' : '#ef4444';
                drawVectorArrowLocal(ctx, v.panX, v.panY, v.viewScale, relX, relZ, s.hdg, s.spd * VECTOR_SCALE, color);
                drawShipHullLocal(ctx, v.panX, v.panY, v.viewScale, relX, relZ, s.hdg, color, isOwnShip, isOwnShip ? "OS" : s.name);
            });
        });
    }

    function mainLoop() {
        requestAnimationFrame(mainLoop);
        if(!isSimulationRunning) return;
        const now = performance.now(); const dt = Math.min((now - lastTime) / 1000, 0.1); lastTime = now;
        
        // 간이 물리 업데이트 (Step 1에서는 등속 직진만 수행)
        simEntities.forEach(s => { 
            const speedUnits = s.spd * (400 / 3600); 
            s.x += speedUnits * Math.sin(s.hdg * DEG2RAD) * dt; 
            s.z -= speedUnits * Math.cos(s.hdg * DEG2RAD) * dt; 
        });
        
        // 2D 렌더링
        render2D();
        
        // 3D 렌더링 (스플릿 모드일 때만 연산하여 부하 최소화)
        if(isSplitMode && massViews[activeMassIndex]) {
            const mass = massViews[activeMassIndex].massEntity;
            const meterScale = 4.63; // unit to meter (약 4.63)

            osShipGroup.position.set(mass.x * meterScale, 0, mass.z * meterScale); 
            osShipGroup.rotation.y = -mass.hdg * DEG2RAD;
            
            camera3D.rotation.order = 'YXZ';
            camera3D.rotation.y = camAngleY; 
            camera3D.rotation.x = camAngleX;

            targetMeshes.forEach(t => { 
                t.mesh.position.set(t.entity.x * meterScale, 0, t.entity.z * meterScale); 
                t.mesh.rotation.y = -t.entity.hdg * DEG2RAD; 
            });

            renderer3D.render(scene, camera3D);
        }
    }

</script>
