            return { candidates, safe, recommended, hasSafe: safe.length > 0 };
        }

        function getDecisionTargetHeading() {
            const os = vObj.massEntity;
            if (!os) return 0;
            // Action-support functions remain independent from which DM buttons are toggled.
            // The current replaceable collision-avoidance model supplies one calculated target heading.
            const solution = SupportModels.collisionAvoidance.findSafeHeading(os, getTrafficShips());
            return solution && solution.recommended ? solution.recommended.heading : normalize360(os.cog);
        }

        function classifyColregCue(os, ts) {
            if (!os || !ts) return { encounter: 'NO TARGET', action: '---', note: 'Select or approach a target.' };
            const op = shipPositionMeters(os), tp = shipPositionMeters(ts);
            const bearing = normalize360(Math.atan2(tp.east - op.east, tp.north - op.north) / DEG2RAD);
            const relBearing = signedAngleDiff(bearing, os.hdg);
            const reciprocal = Math.abs(signedAngleDiff(ts.cog, os.cog));
            const bearingFromTarget = normalize360(Math.atan2(op.east - tp.east, op.north - tp.north) / DEG2RAD);
            const ownInTargetStern = Math.abs(signedAngleDiff(bearingFromTarget, ts.hdg)) > 157.5;
            if (Math.abs(relBearing) <= 10 && reciprocal >= 150) {
                return { encounter: 'HEAD-ON', action: 'ALTER TO STBD', note: 'Simplified screening cue; navigator verifies COLREG applicability.' };
            }
            if (ownInTargetStern) {
                return { encounter: 'OVERTAKING', action: 'KEEP CLEAR', note: 'Own ship appears within target stern sector.' };
            }
            if (relBearing > 0 && relBearing <= 112.5) {
                return { encounter: 'CROSSING', action: 'GIVE-WAY CUE', note: 'Target is on own-ship starboard side.' };
            }
            if (relBearing < 0 && relBearing >= -112.5) {
                return { encounter: 'CROSSING', action: 'STAND-ON CUE', note: 'Target is on own-ship port side; continue monitoring.' };
            }
            return { encounter: 'OTHER', action: 'MONITOR', note: 'Geometry does not fit the simplified screening sectors.' };
        }

        function drawFutureGhostShip(ctx, eastMeters, northMeters, heading, color, alpha, label = '') {
            const relX = eastMeters * (400 / 1852);
            const relZ = -northMeters * (400 / 1852);
            ctx.save();
            ctx.globalAlpha = alpha;
            drawShipHullLocal(ctx, vObj.panX, vObj.panY, vObj.viewScale, relX, relZ, heading, color, false, label);
            ctx.restore();
        }

        function renderFuturePositions(ctx) {
            const os = vObj.massEntity;
            if (!os) return;
            const ownVel = velocityFromCourseMps(os.cog, os.sog);
            const futureShips = getFuturePositionShips();
            const alphas = [0.16, 0.23, 0.30, 0.38, 0.48];

            // 본선도 같은 시간축으로 이동시켜 타선의 미래 위치와 동일한 절대 미래 장면으로 보여준다.
            SUPPORT_CONFIG.futureMinutes.forEach((minute, index) => {
                const sec = minute * 60;
                const e = ownVel.east * sec;
                const n = ownVel.north * sec;
                drawFutureGhostShip(ctx, e, n, os.hdg, '#34d399', alphas[index] || 0.4, '');
                const p = relativeMetersToCanvas(e, n);
                drawSupportTag(ctx, `본선 +${minute}분`, p.x + 8, p.y - 6, '#6ee7b7');
            });

            futureShips.forEach(ts => {
                const tv = velocityFromCourseMps(ts.cog, ts.sog);
                const rel = shipRelativeMeters(ts);
                SUPPORT_CONFIG.futureMinutes.forEach((minute, index) => {
                    const sec = minute * 60;
                    const e = rel.east + tv.east * sec;
                    const n = rel.north + tv.north * sec;
                    drawFutureGhostShip(ctx, e, n, ts.hdg, '#67e8f9', alphas[index] || 0.4, '');
                    if (index === SUPPORT_CONFIG.futureMinutes.length - 1) {
                        const p = relativeMetersToCanvas(e, n);
                        drawSupportTag(ctx, `${ts.name} +${minute}분`, p.x + 8, p.y - 5, '#67e8f9');
                    }
                });
            });
        }
        function renderCollisionPoints(ctx) {
            const os = vObj.massEntity;
            if (!os) return;
            const ownVel = velocityFromCourseMps(os.cog, os.sog);
            getNearbyTrafficShips().forEach(ts => {
                const motion = evaluateRelativeMotion(os, ts);
                if (!Number.isFinite(motion.tcpaMin) || motion.tcpaMin < 0 || motion.tcpaMin > SUPPORT_CONFIG.horizonMin) return;
                if (motion.cpaNM >= getDesiredCpaNM()) return;
                const sec = motion.tcpaMin * 60;
                const targetVel = velocityFromCourseMps(ts.cog, ts.sog);
                const relNow = shipRelativeMeters(ts);
                const ownFuture = { east: ownVel.east * sec, north: ownVel.north * sec };
                const targetFuture = { east: relNow.east + targetVel.east * sec, north: relNow.north + targetVel.north * sec };
                // At true collision the points coincide; for non-zero CPA use the CPA midpoint as the encounter location.
                const encounter = {
                    east: (ownFuture.east + targetFuture.east) / 2,
                    north: (ownFuture.north + targetFuture.north) / 2
                };
                const p = relativeMetersToCanvas(encounter.east, encounter.north);
                const color = '#fb7185';
                ctx.save();
                ctx.strokeStyle = color; ctx.lineWidth = 2.4; ctx.shadowColor = color; ctx.shadowBlur = 12;
                ctx.beginPath(); ctx.arc(p.x, p.y, 13, 0, Math.PI * 2); ctx.stroke();
                ctx.beginPath(); ctx.moveTo(p.x - 9, p.y); ctx.lineTo(p.x + 9, p.y); ctx.moveTo(p.x, p.y - 9); ctx.lineTo(p.x, p.y + 9); ctx.stroke();
                ctx.restore();
                drawSupportTag(ctx, `${ts.name} COLLISION · ${motion.tcpaMin.toFixed(1)}m`, p.x + 15, p.y - 6, color);
            });
        }

        function renderThreatHighlight(ctx) {
            const os = vObj.massEntity;
            if (!os) return;
            getNearbyTrafficShips().forEach(ts => {
                const motion = evaluateRelativeMotion(os, ts);
                const risk = supportRiskClass(motion.cpaNM, motion.tcpaMin);
                const color = riskColorFromEncounter(motion.cpaNM, motion.tcpaMin);
                const p = shipCanvasPoint(ts);
                const radius = risk === 'danger' ? 29 : risk === 'caution' ? 25 : 21;
                ctx.save();
                ctx.strokeStyle = color; ctx.lineWidth = risk === 'danger' ? 2.8 : 2.0; ctx.shadowColor = color; ctx.shadowBlur = 12;
                ctx.beginPath(); ctx.arc(p.x, p.y, radius, 0, Math.PI * 2); ctx.stroke(); ctx.restore();
                drawSupportTag(ctx, `${ts.name} CPA ${motion.cpaNM.toFixed(2)}`, p.x + radius, p.y - radius + 3, color);
            });
        }

        function renderRelativeMotion(ctx) {
            const os = vObj.massEntity;
            if (!os) return;
            const ov = velocityFromCourseMps(os.cog, os.sog);
            getFuturePositionShips().forEach(ts => {
                const tv = velocityFromCourseMps(ts.cog, ts.sog);
                const rel = shipRelativeMeters(ts);
                let prev = relativeMetersToCanvas(rel.east, rel.north);
                SUPPORT_CONFIG.futureMinutes.forEach((minute, j) => {
                    const sec = minute * 60;
                    const e = rel.east + (tv.east - ov.east) * sec;
                    const n = rel.north + (tv.north - ov.north) * sec;
                    const p = relativeMetersToCanvas(e, n);
                    drawGlowLine(ctx, prev.x, prev.y, p.x, p.y, 'rgba(34,211,238,0.64)', 1.25, [4, 4]);
                    ctx.save();
                    ctx.strokeStyle = j === SUPPORT_CONFIG.futureMinutes.length - 1 ? '#22d3ee' : 'rgba(34,211,238,0.72)';
                    ctx.fillStyle = 'rgba(34,211,238,0.08)';
                    ctx.lineWidth = 1.4;
                    ctx.beginPath(); ctx.arc(p.x, p.y, 5 + j * 1.4, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
                    ctx.restore();
                    drawSupportTag(ctx, `${ts.name} +${minute}분`, p.x + 7, p.y - 4, '#67e8f9');
                    prev = p;
                });
            });
        }
        function renderApproachRanking(ctx) {
            getVisibleApproachRankingList().slice(0, 5).forEach((item, index) => {
                const p = shipCanvasPoint(item.ship);
                const color = index === 0 ? '#fb7185' : '#38bdf8';
                ctx.save(); ctx.fillStyle = 'rgba(5,10,18,0.90)'; ctx.strokeStyle = color; ctx.lineWidth = 1.5;
                ctx.beginPath(); ctx.arc(p.x - 18, p.y - 18, 11, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
                ctx.fillStyle = color; ctx.font = 'bold 11px Rajdhani'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText(String(index + 1), p.x - 18, p.y - 18); ctx.restore();
            });
        }

        function renderManeuverTrend(ctx) {
            getTrafficShips().slice(0, 12).forEach(ts => {
                const p = shipCanvasPoint(ts);
                const rot = Number(ts.rot) || 0;
                const color = Math.abs(rot) < 0.5 ? '#94a3b8' : '#38bdf8';
                const label = Math.abs(rot) < 0.5 ? 'STEADY' : rot > 0 ? `STBD ${Math.abs(rot).toFixed(1)}` : `PORT ${Math.abs(rot).toFixed(1)}`;
                ctx.save(); ctx.strokeStyle = color; ctx.lineWidth = 1.6; ctx.setLineDash([3,3]);
                ctx.beginPath(); ctx.arc(p.x, p.y, 25, rot > 0 ? -Math.PI * 0.65 : Math.PI * 0.15, rot > 0 ? Math.PI * 0.15 : Math.PI * 0.85, rot < 0); ctx.stroke(); ctx.restore();
                drawSupportTag(ctx, label, p.x + 18, p.y - 23, color);
            });
        }

        function getSafeHeadingBandSamples(os, targets) {
            if (!os) return [];
            const samples = [];
            const halfSpan = SUPPORT_CONFIG.headingBandSpanDeg / 2;
            for (let d = -halfSpan; d <= halfSpan + 1e-9; d += SUPPORT_CONFIG.safeBandDisplayStepDeg) {
                const r = SupportModels.collisionAvoidance.evaluateHeading(os, targets, os.cog + d, os.sog);
                r.delta = signedAngleDiff(r.heading, os.cog);
                samples.push(r);
            }
            return samples;
        }

        function renderSafeHeadingBand(ctx) {
            const os = vObj.massEntity, targets = getTrafficShips();
            if (!os || !targets.length) return;
            const solution = SupportModels.collisionAvoidance.findSafeHeading(os, targets);
            const samples = getSafeHeadingBandSamples(os, targets);
            const radius = 96;
            const tickInner = 84, tickOuter = 108;
            samples.forEach(c => {
                const a = (c.heading - 90) * DEG2RAD;
                const half = SUPPORT_CONFIG.safeBandDisplayStepDeg * DEG2RAD * 0.48;
                const color = c.safe ? 'rgba(16,185,129,0.92)' : 'rgba(244,63,94,0.86)';
                ctx.save();
                ctx.strokeStyle = color;
                ctx.lineWidth = 11;
                ctx.shadowColor = c.safe ? '#10b981' : '#f43f5e';
                ctx.shadowBlur = 5;
                ctx.beginPath();
                ctx.arc(vObj.panX, vObj.panY, radius, a - half, a + half);
                ctx.stroke();
                ctx.shadowBlur = 0;
                ctx.strokeStyle = 'rgba(248,250,252,0.70)';
                ctx.lineWidth = 1;
                ctx.beginPath();
                ctx.moveTo(vObj.panX + Math.cos(a) * tickInner, vObj.panY + Math.sin(a) * tickInner);
                ctx.lineTo(vObj.panX + Math.cos(a) * tickOuter, vObj.panY + Math.sin(a) * tickOuter);
                ctx.stroke();
                ctx.restore();
            });
            if (solution && solution.recommended) {
                const tip = drawHeadingRay(ctx, solution.recommended.heading, '#facc15', 128, [7,4]);
                drawSupportTag(ctx, `${solution.recommended.heading.toFixed(0)}°`, tip.x + 5, tip.y, '#facc15');
            }
        }
        function renderArcTimeRings(ctx, solution) {
            if (!solution || !solution.arc || !Array.isArray(solution.arcRings)) return;
            const unit = 400 / 1852;
            const maxVisiblePx = Math.hypot(canvas.width, canvas.height);
            solution.arcRings.forEach((ring, index) => {
                const radiusPx = ring.radiusMeters * unit * vObj.viewScale;
                if (radiusPx < 2 || radiusPx > maxVisiblePx) return;
                const major = ((index + 1) % 2 === 0); // 60-second visual emphasis; every ring is still 30 s.
                ctx.save();
                ctx.strokeStyle = major ? 'rgba(148,163,184,0.24)' : 'rgba(148,163,184,0.13)';
                ctx.lineWidth = major ? 1.0 : 0.7;
                ctx.setLineDash(major ? [4,5] : [2,6]);
                ctx.beginPath(); ctx.arc(vObj.panX, vObj.panY, radiusPx, 0, Math.PI * 2); ctx.stroke();
                ctx.setLineDash([]);
                // Exactly one rendered collision ARC per target: the target's single TCPA is assigned to one TR.
                ctx.strokeStyle = 'rgba(244,63,94,0.48)';
                ctx.shadowColor = '#f43f5e'; ctx.shadowBlur = 4; ctx.lineWidth = 5;
                (ring.arcs || []).forEach(arc => {
                    const center = (arc.bearing - 90) * DEG2RAD;
                    const half = arc.halfDeg * DEG2RAD;
                    ctx.beginPath(); ctx.arc(vObj.panX, vObj.panY, radiusPx, center - half, center + half, false); ctx.stroke();
                });
                ctx.restore();
                if (index === 0 || major) {
                    const label = ring.minute < 1 ? `TR ${ring.timeSec}s` : `TR ${ring.minute.toFixed(0)}m`;
                    drawSupportTag(ctx, label, vObj.panX + 6, vObj.panY - radiusPx + 14, '#94a3b8');
                }
            });
        }

        function renderAvoidanceRoute(ctx) {
            const os = vObj.massEntity, targets = getTrafficShips();
            if (!os || !targets.length) return;
            const solution = SupportModels.collisionAvoidance.findMinimumAlterationOptions(os, targets);
            if (!solution) return;

            renderArcTimeRings(ctx, solution);
            drawHeadingRay(ctx, os.cog, 'rgba(148,163,184,0.55)', 105, [4,5]);

            const drawSide = (candidate, isSafe, side) => {
                if (!candidate) return;
                const route = SupportModels.collisionAvoidance.buildAvoidanceRoute(os, targets, candidate);
                if (route.length < 2) return;
                const sideColor = side === 'PORT' ? '#38bdf8' : '#facc15';
                const color = isSafe ? sideColor : '#fb7185';
                ctx.save();
                ctx.strokeStyle = color; ctx.lineWidth = isSafe ? 2.8 : 2.0;
                ctx.shadowColor = color; ctx.shadowBlur = 7; ctx.setLineDash(isSafe ? [9,5] : [4,6]);
                ctx.beginPath();
                route.forEach((pt, index) => {
                    const p = relativeMetersToCanvas(pt.east, pt.north);
                    if (index === 0) ctx.moveTo(p.x, p.y); else ctx.lineTo(p.x, p.y);
                });
                ctx.stroke(); ctx.restore();

                const delta = Math.abs(signedAngleDiff(candidate.heading, os.cog));
                // Put the text where the plotted route actually reaches the displayed candidate course.
                const labelPoint = route.slice(1).reduce((best, pt) => {
                    if (!Number.isFinite(pt.heading)) return best;
                    const err = Math.abs(signedAngleDiff(candidate.heading, pt.heading));
                    return !best || err < best.err ? { pt, err } : best;
                }, null)?.pt || route[Math.min(route.length - 1, Math.max(1, Math.floor(route.length * 0.34)))];
                const lp = relativeMetersToCanvas(labelPoint.east, labelPoint.north);
                const cpa = candidate.worst && Number.isFinite(candidate.worst.cpaNM) ? candidate.worst.cpaNM.toFixed(2) : '--';
                drawSupportTag(ctx, `${side} ${delta.toFixed(0)}° · MIN ${cpa} NM`, lp.x + (side === 'PORT' ? -92 : 8), lp.y - 5, color);
            };

            drawSide(solution.portRecommended, solution.portHasSafe, 'PORT');
            drawSide(solution.starboardRecommended, solution.starboardHasSafe, 'STBD');
        }

        function renderPortStarboard(ctx) {
            const os = vObj.massEntity;
            if (!os) return;
            const p = drawHeadingRay(ctx, os.cog - SUPPORT_CONFIG.compareAlterDeg, '#38bdf8', 115, [6,4]);
            const s = drawHeadingRay(ctx, os.cog + SUPPORT_CONFIG.compareAlterDeg, '#facc15', 115, [6,4]);
            drawSupportTag(ctx, `PORT ${SUPPORT_CONFIG.compareAlterDeg}°`, p.x + 4, p.y, '#38bdf8');
            drawSupportTag(ctx, `STBD ${SUPPORT_CONFIG.compareAlterDeg}°`, s.x + 4, s.y, '#facc15');
        }

        function renderSpeedOption(ctx) {
            const os = vObj.massEntity;
            if (!os) return;
            const option = findSpeedOption(os, getTrafficShips());
            if (!option || !option.recommended) return;
            const scale = os.sog > 0 ? clampValue(option.recommended.speed / os.sog, 0.35, 1.5) : 1;
            const tip = drawHeadingRay(ctx, os.cog, '#facc15', 110 * scale, []);
            drawSupportTag(ctx, `${option.recommended.speed.toFixed(1)} kt`, tip.x + 5, tip.y, '#facc15');
        }

        function renderWhatIfCourse(ctx) {
            const os = vObj.massEntity;
            if (!os) return;
            const targets = getTrafficShips();
            const scenarios = getArcWhatIfScenarios(os, targets);
            const available = scenarios.filter(s => s.available);
            if (!available.length) return;

            available.forEach((scenario, drawIndex) => {
                const route = scenario.route;
                const hue = 190 + scenario.index * 14;
                const color = `hsl(${hue}, 92%, ${scenario.index < 5 ? 62 : 68}%)`;
                ctx.save();
                ctx.strokeStyle = color;
                ctx.lineWidth = 1.8 + scenario.index * 0.06;
                ctx.globalAlpha = 0.78;
                ctx.shadowColor = color;
                ctx.shadowBlur = 5;
                ctx.beginPath();
                route.forEach((pt, index) => {
                    const p = relativeMetersToCanvas(pt.east, pt.north);
                    if (index === 0) ctx.moveTo(p.x, p.y); else ctx.lineTo(p.x, p.y);
                });
                ctx.stroke();
                ctx.restore();

                // Spread labels along each ARC route so the CPA criterion is immediately identifiable.
                const frac = 0.28 + 0.055 * scenario.index;
                const labelIndex = Math.min(route.length - 1, Math.max(1, Math.floor((route.length - 1) * frac)));
                const lp0 = route[labelIndex];
                const lp = relativeMetersToCanvas(lp0.east, lp0.north);
                drawSupportTag(ctx, `CPA ${scenario.cpaNM.toFixed(1)} NM`, lp.x + 5, lp.y - 3, color);
            });
        }
        function renderColregCue(ctx) {
            const ts = getPreferredTarget();
            if (!ts) return;
            const p = shipCanvasPoint(ts);
            ctx.save(); ctx.strokeStyle = '#facc15'; ctx.lineWidth = 2.2; ctx.setLineDash([5,4]); ctx.beginPath(); ctx.arc(p.x, p.y, 32, 0, Math.PI * 2); ctx.stroke(); ctx.restore();
        }

        function renderTargetHeading(ctx) {
            const target = getDecisionTargetHeading();
            const tip = drawHeadingRay(ctx, target, '#34d399', 145, []);
            ctx.save(); ctx.strokeStyle = '#34d399'; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(tip.x, tip.y, 8, 0, Math.PI * 2); ctx.stroke(); ctx.restore();
            drawSupportTag(ctx, `TARGET ${target.toFixed(0)}°`, tip.x + 7, tip.y, '#34d399');
        }

        function renderRudderDirection(ctx) {
            const os = vObj.massEntity; if (!os) return;
            const target = getDecisionTargetHeading();
            const error = signedAngleDiff(target, os.hdg);
            const color = '#34d399';
            ctx.save(); ctx.strokeStyle = color; ctx.lineWidth = 5; ctx.shadowColor = color; ctx.shadowBlur = 8;
            const start = (os.hdg - 90) * DEG2RAD;
            const sweep = clampValue(error, -80, 80) * DEG2RAD;
            ctx.beginPath(); ctx.arc(vObj.panX, vObj.panY, 52, start, start + sweep, sweep < 0); ctx.stroke(); ctx.restore();
        }

        function renderHeadingError(ctx) {
            const os = vObj.massEntity; if (!os) return;
            const target = getDecisionTargetHeading();
            drawHeadingRay(ctx, os.hdg, 'rgba(148,163,184,0.70)', 95, [4,4]);
            drawHeadingRay(ctx, target, '#34d399', 115, []);
        }

        function renderActionOverlay(ctx, feature) {
            if (feature === 'target-heading') renderTargetHeading(ctx);
            else if (feature === 'rudder-direction') renderRudderDirection(ctx);
            else if (feature === 'rudder-angle') renderRudderDirection(ctx);
            else if (feature === 'heading-error') renderHeadingError(ctx);
            else if (feature === 'rot-guidance') renderHeadingError(ctx);
            else if (feature === 'ease-timing') renderHeadingError(ctx);
        }

        function renderSupportOverlay(ctx) {
            if (!vObj.massEntity) { updateSupportCards(); return; }

            if (activeSupportFeatures.has('sa:future-position')) renderFuturePositions(ctx);
            if (activeSupportFeatures.has('sa:collision-point')) renderCollisionPoints(ctx);
            if (activeSupportFeatures.has('sa:threat-highlight')) renderThreatHighlight(ctx);
            if (activeSupportFeatures.has('sa:relative-motion')) renderRelativeMotion(ctx);
            if (activeSupportFeatures.has('sa:approach-ranking')) renderApproachRanking(ctx);
            if (activeSupportFeatures.has('sa:maneuver-trend')) renderManeuverTrend(ctx);

            if (activeSupportFeatures.has('dm:safe-heading-band')) renderSafeHeadingBand(ctx);
            if (activeSupportFeatures.has('dm:minimum-alteration')) renderAvoidanceRoute(ctx);
            if (activeSupportFeatures.has('dm:port-starboard')) renderPortStarboard(ctx);
            if (activeSupportFeatures.has('dm:speed-option')) renderSpeedOption(ctx);
            if (activeSupportFeatures.has('dm:what-if-course')) renderWhatIfCourse(ctx);
            if (activeSupportFeatures.has('dm:colreg-cue')) renderColregCue(ctx);

            ['target-heading','rudder-direction','rudder-angle','heading-error','rot-guidance','ease-timing'].forEach(feature => {
                if (activeSupportFeatures.has(`act:${feature}`)) renderActionOverlay(ctx, feature);
            });
            updateSupportCards();
        }

        function cardRows(rows, note = '', status = null) {
            const body = rows.map(([key, value]) => `<div class="support-card-row"><span class="support-card-key">${key}</span><span class="support-card-value">${value}</span></div>`).join('');
            const noteHtml = note ? `<div class="support-card-note">${note}</div>` : '';
            const statusHtml = status ? `<div class="support-card-status ${status[0]}">${status[1]}</div>` : '';
            return body + noteHtml + statusHtml;
        }

        function buildSupportCardModel(group, feature) {
            const os = vObj.massEntity;
            if (!os || !feature) return null;
            const targets = getTrafficShips();
            const target = getPreferredTarget();
            const threatList = getThreatList();
            const primary = threatList[0];
            if (group === 'sa') {
                if (feature === 'future-position') {
                    const count = getFuturePositionShips().length;
                    return { title: 'FUTURE POSITION', rows: [['Projected targets', String(count)], ['Time marks', '1 / 3 / 5 min'], ['Basis', 'COG · SOG']], note: `Projects unique vessels currently within ${SUPPORT_CONFIG.futureRadiusNM.toFixed(0)} NM using live COG/SOG.`, status: count ? ['caution', 'FUTURE TRAFFIC PROJECTION'] : ['safe', 'NO TARGET WITHIN 5 NM'] };
                }
                if (feature === 'collision-point') {
                    const collisionCandidates = threatList.filter(t => t.future && t.motion.cpaNM < getDesiredCpaNM()); const c = collisionCandidates[0]; return { title: 'COLLISION POINT', rows: [['Primary', c ? c.ship.name : '---'], ['CPA', c ? `${c.motion.cpaNM.toFixed(2)} NM` : '---'], ['TCPA', c && Number.isFinite(c.motion.tcpaMin) ? `${c.motion.tcpaMin.toFixed(1)} min` : '---']], note: 'Marks the calculated future encounter location on the chart, not the own-ship position.', status: c ? ['danger', 'PROJECTED COLLISION LOCATION'] : ['safe', 'NO CPA BELOW SELECTED LIMIT'] };
                }
                if (feature === 'threat-highlight') {
                    const nearby = getNearbyTrafficShips().map(ship => ({ ship, motion: evaluateRelativeMotion(os, ship) }));
                    const danger = nearby.filter(t => supportRiskClass(t.motion.cpaNM, t.motion.tcpaMin) === 'danger').length;
                    const caution = nearby.filter(t => supportRiskClass(t.motion.cpaNM, t.motion.tcpaMin) === 'caution').length;
                    const safe = nearby.length - danger - caution;
                    return { title: 'THREAT HIGHLIGHT', rows: [['Red < MIN CPA', String(danger)], ['Yellow = CAUTION', String(caution)], ['Green = CLEAR', String(safe)]], note: `Classification is calculated for vessels within ${SUPPORT_CONFIG.supportRadiusNM.toFixed(0)} NM.`, status: danger ? ['danger', `${danger} HIGH-RISK TARGET(S)`] : caution ? ['caution', `${caution} CAUTION TARGET(S)`] : ['safe', 'NO HIGH-RISK TARGET'] };
                }
                if (feature === 'relative-motion') {
                    const m = target ? evaluateRelativeMotion(os, target) : null;
                    const relSpeed = m ? Math.hypot(m.relVelEast, m.relVelNorth) / 0.514444 : 0;
                    return { title: 'RELATIVE MOTION', rows: [['Target', target ? target.name : '---'], ['Relative speed', target ? `${relSpeed.toFixed(1)} kt` : '---'], ['CPA', m ? `${m.cpaNM.toFixed(2)} NM` : '---']], note: 'Selected target first; otherwise the current highest-risk target.', status: m ? [supportRiskClass(m.cpaNM, m.tcpaMin), '5-MIN RELATIVE TRACK'] : ['safe', 'NO TARGET'] };
                }
                if (feature === 'approach-ranking') {
                    const top = getVisibleApproachRankingList().slice(0, 5);
                    return { title: 'APPROACH RANK', html: cardRows(top.map((t,i) => [`#${i+1} ${t.ship.name}`, `CPA ${t.motion.cpaNM.toFixed(2)} / ${Number.isFinite(t.motion.tcpaMin) ? t.motion.tcpaMin.toFixed(1) : '--'}m`]), 'Rank #1 is the visible nearby vessel with the earliest positive TCPA; map and list use the same ordered set.', top[0] ? [supportRiskClass(top[0].motion.cpaNM, top[0].motion.tcpaMin), 'PRIORITY MONITORING LIST'] : ['safe','NO TARGET']) };
                }
                if (feature === 'maneuver-trend') {
                    const moving = targets.filter(t => Math.abs(Number(t.rot)||0) >= 0.5).length;
                    return { title: 'MANEUVER TREND', rows: [['Turning targets', String(moving)], ['Signal', 'ROT sign / magnitude'], ['STBD / PORT', '+ / −']], note: 'Displays observed turn trend only; it does not infer intention.', status: moving ? ['caution', 'MANEUVER CHANGE DETECTED'] : ['safe', 'TARGETS MOSTLY STEADY'] };
                }
            }

            if (group === 'dm') {
                if (feature === 'safe-heading-band') {
                    const sol = SupportModels.collisionAvoidance.findSafeHeading(os, targets);
                    const safeCount = sol ? sol.candidates.filter(c=>c.safe).length : 0;
                    return { title: 'SAFE HDG BAND', rows: [['Band span', `${SUPPORT_CONFIG.headingBandSpanDeg}°`], ['Safe candidates', String(safeCount)], ['CPA limit', `≥ ${getDesiredCpaNM().toFixed(2)} NM`]], note: 'The 225° band is recalculated from live traffic: green passes the selected minimum CPA; red does not.', status: sol && sol.hasSafe ? ['safe', 'SAFE HEADING SECTOR FOUND'] : ['danger', 'NO FULLY SAFE SECTOR IN SEARCH RANGE'] };
                }
                if (feature === 'minimum-alteration') {
                    const sol = SupportModels.collisionAvoidance.findMinimumAlterationOptions(os, targets);
                    const choices = [sol && sol.portRecommended, sol && sol.starboardRecommended].filter(Boolean);
                    const r = choices.sort((a,b) => Math.abs(a.delta)-Math.abs(b.delta))[0] || null;
                    const delta = r ? signedAngleDiff(r.heading, os.cog) : 0;
                    return { title: 'MIN ALTERATION', rows: [['Current COG', `${os.cog.toFixed(0)}°`], ['Target COG', r ? `${r.heading.toFixed(0)}°` : '---'], ['Course change', r ? `${delta>=0?'STBD':'PORT'} ${Math.abs(delta).toFixed(0)}°` : '---'], ['Worst CPA', r && r.worst ? `${r.worst.cpaNM.toFixed(2)} NM` : '---']], note: 'Displayed curve and number use the same replaceable turn-rate model.', status: sol && (sol.portHasSafe || sol.starboardHasSafe) ? ['safe','REACHABLE SAFE ALTERATION'] : ['danger','BEST-EFFORT WITHIN MANEUVER RANGE'] };
                }
                if (feature === 'port-starboard') {
                    const p = SupportModels.collisionAvoidance.evaluateHeading(os, targets, os.cog - SUPPORT_CONFIG.compareAlterDeg, os.sog);
                    const s = SupportModels.collisionAvoidance.evaluateHeading(os, targets, os.cog + SUPPORT_CONFIG.compareAlterDeg, os.sog);
                    const better = [p,s].sort((a,b)=>a.unsafeCount-b.unsafeCount || b.worst.cpaNM-a.worst.cpaNM)[0];
                    return { title: 'PORT / STBD', rows: [['PORT worst CPA', `${p.worst.cpaNM.toFixed(2)} NM`], ['STBD worst CPA', `${s.worst.cpaNM.toFixed(2)} NM`], ['Screened option', signedAngleDiff(better.heading, os.cog) >= 0 ? 'STBD' : 'PORT']], note: `Compares equal ${SUPPORT_CONFIG.compareAlterDeg}° trial alterations only.`, status: better.safe ? ['safe','ONE OR MORE OPTIONS PASS CPA LIMIT'] : ['danger','BOTH OPTIONS NEED REVIEW'] };
                }
                if (feature === 'speed-option') {
                    const opt = findSpeedOption(os, targets);
                    const safeSpeeds = opt ? opt.safe.map(c=>c.speed) : [];
                    return { title: 'SPEED OPTION', rows: [['Current SOG', `${os.sog.toFixed(1)} kt`], ['Suggested', opt && opt.recommended ? `${opt.recommended.speed.toFixed(1)} kt` : '---'], ['Safe samples', safeSpeeds.length ? `${Math.min(...safeSpeeds).toFixed(1)}–${Math.max(...safeSpeeds).toFixed(1)} kt` : 'NONE']], note: 'Heading is held constant while speed samples are screened.', status: opt && opt.hasSafe ? ['safe','SPEED-ONLY OPTION FOUND'] : ['danger','NO SAFE SPEED SAMPLE'] };
                }
                if (feature === 'what-if-course') {
                    const scenarios = getArcWhatIfScenarios(os, targets);
                    const available = scenarios.filter(s => s.available);
                    return { title: 'WHAT-IF COURSE', rows: [['CPA criteria', '0.1–1.0 NM'], ['ARC routes', `${available.length} / ${scenarios.length}`], ['TR', `${SUPPORT_CONFIG.arcTRSec}s`]], note: 'Each displayed line is an ARC avoidance-and-rejoin route calculated for its own CPA criterion; ARC sectors themselves are intentionally hidden in this feature.', status: available.length ? ['safe','MULTI-CPA ARC ROUTES'] : ['danger','NO ARC ROUTE FOUND'] };
                }
                if (feature === 'colreg-cue') {
                    const cue = classifyColregCue(os, target);
                    return { title: 'COLREG CUE', rows: [['Target', target ? target.name : '---'], ['Encounter', cue.encounter], ['Cue', cue.action]], note: cue.note, status: cue.action.includes('GIVE') || cue.action.includes('ALTER') || cue.action.includes('KEEP') ? ['caution','NAVIGATOR VERIFICATION REQUIRED'] : ['safe','MONITOR / VERIFY'] };
                }
            }

            if (group === 'act') {
                const targetHeading = getDecisionTargetHeading();
                const error = signedAngleDiff(targetHeading, os.hdg);
                const rudder = SupportModels.shipControl.rudderCommand(os, targetHeading);
                const rot = SupportModels.shipControl.rotGuidance(os, targetHeading);
                const ease = SupportModels.shipControl.easeGuidance(os, targetHeading);
                if (feature === 'target-heading') return { title: 'TARGET HEADING', rows: [['Current HDG', `${os.hdg.toFixed(1)}°`], ['Target HDG', `${targetHeading.toFixed(1)}°`], ['Difference', `${error>=0?'+':''}${error.toFixed(1)}°`]], note: 'Execution cue only; target heading comes from the active decision model.', status: Math.abs(error)<2 ? ['safe','ON TARGET HEADING'] : ['caution','HEADING CHANGE REQUIRED'] };
                if (feature === 'rudder-direction') return { title: 'RUDDER DIRECTION', rows: [['Target HDG', `${targetHeading.toFixed(1)}°`], ['Heading error', `${error>=0?'+':''}${error.toFixed(1)}°`], ['Direction', rudder.direction]], note: 'Shows direction only; no rudder magnitude is included.', status: rudder.direction==='MIDSHIP' ? ['safe','MIDSHIP'] : ['caution',`${rudder.direction} RUDDER`] };
                if (feature === 'rudder-angle') return { title: 'RUDDER ANGLE', rows: [['Target HDG', `${targetHeading.toFixed(1)}°`], ['Current ROT', `${(Number(os.rot)||0).toFixed(1)}°/min`], ['Rudder cue', rudder.rudder===0 ? 'MIDSHIP' : `${rudder.direction} ${Math.abs(rudder.rudder).toFixed(0)}°`]], note: 'Current implementation is a replaceable proportional + ROT-damping model.', status: rudder.rudder===0 ? ['safe','MIDSHIP'] : ['caution','RUDDER COMMAND CUE'] };
                if (feature === 'heading-error') return { title: 'HEADING ERROR', rows: [['Current', `${os.hdg.toFixed(1)}°`], ['Target', `${targetHeading.toFixed(1)}°`], ['Error', `${error>=0?'+':''}${error.toFixed(1)}°`]], note: 'Positive error = starboard direction; negative = port direction.', status: Math.abs(error)<2 ? ['safe','HEADING CAPTURED'] : ['caution',`${Math.abs(error).toFixed(1)}° TO GO`] };
                if (feature === 'rot-guidance') return { title: 'ROT GUIDANCE', rows: [['Current ROT', `${rot.currentRot.toFixed(1)}°/min`], ['Target ROT', `${rot.targetRot.toFixed(1)}°/min`], ['Cue', rot.cue]], note: 'Target ROT is a simple heading-error proportional model and can be replaced later.', status: rot.cue==='HOLD ROT' ? ['safe','ROT ON GUIDANCE'] : ['caution',rot.cue] };
                if (feature === 'ease-timing') return { title: 'EASE / MIDSHIP', rows: [['Target HDG', `${targetHeading.toFixed(1)}°`], ['Ease at', `${ease.easeHeading.toFixed(1)}°`], ['Predicted stop', `${ease.predictedStop.toFixed(1)}°`], ['Residual turn', `${ease.residualDeg.toFixed(1)}°`]], note: `Current model assumes ROT decays with τ=${SUPPORT_CONFIG.easeTauSec}s after easing. Replaceable with simulator-identified dynamics later.`, status: ease.easeNow ? ['danger','EASE / MIDSHIP NOW'] : ease.sameTurn ? ['caution',`EASE NEAR ${ease.easeHeading.toFixed(0)}°`] : ['safe','BUILD / STABILIZE TURN FIRST'] };
            }
            return null;
        }

        function buildSupportCardPresentation(group, feature, model) {
            const os = vObj.massEntity;
            if (!os) return null;
            const targets = getTrafficShips();
            const target = getPreferredTarget();
            const limit = getDesiredCpaNM();
            const cls = model && model.status ? model.status[0] : 'safe';
            const p = (primary, secondary = '', status = '', state = cls) => ({ primary, secondary, status, state });

            if (group === 'sa') {
                if (feature === 'future-position') {
                    const count = getFuturePositionShips().length;
                    return p(`${count}척`, `전방 ${SUPPORT_CONFIG.futureRadiusNM.toFixed(0)} NM · 후방 ${SUPPORT_CONFIG.futureAsternNM.toFixed(0)} NM`, count ? '본선·타선 1 / 2 / 3 / 4 / 5분 미래 위치' : '해당 범위 선박 없음', count ? 'caution' : 'safe');
                }
                if (feature === 'collision-point') {
                    const c = getThreatList().find(t => t.future && t.motion.cpaNM < limit);
                    return c ? p(`${c.motion.tcpaMin.toFixed(1)}분 후`, `${c.ship.name} · CPA ${c.motion.cpaNM.toFixed(2)} NM`, '충돌 예상 위치 표시', 'danger')
                             : p('충돌 예상 없음', `CPA < ${limit.toFixed(2)} NM 없음`, '현재 기준', 'safe');
                }
                if (feature === 'threat-highlight') {
                    const items = getNearbyTrafficShips().map(ship => ({ship, motion:evaluateRelativeMotion(os, ship)}));
                    const d = items.filter(t => supportRiskClass(t.motion.cpaNM,t.motion.tcpaMin)==='danger').length;
                    const c = items.filter(t => supportRiskClass(t.motion.cpaNM,t.motion.tcpaMin)==='caution').length;
                    const g = items.length - d - c;
                    return d ? p(`위험 ${d}척`, `빨강 ${d} · 노랑 ${c} · 녹색 ${g}`, `MIN CPA ${limit.toFixed(2)} NM`, 'danger')
                             : c ? p(`주의 ${c}척`, `노랑 ${c} · 녹색 ${g}`, `MIN CPA ${limit.toFixed(2)} NM`, 'caution')
                             : p('위험 없음', `녹색 ${g}척`, `MIN CPA ${limit.toFixed(2)} NM`, 'safe');
                }
                if (feature === 'relative-motion') {
                    const count = getFuturePositionShips().length;
                    return p(`${count}척 추적`, '본선 기준 상대운동', count ? '1 / 2 / 3 / 4 / 5분 상대 위치' : '해당 범위 선박 없음', count ? 'caution' : 'safe');
                }
                if (feature === 'approach-ranking') {
                    const top = getVisibleApproachRankingList()[0];
                    return top ? p(`#1 ${top.ship.name}`, `접근율 ${(top.approachRatio*100).toFixed(0)}% · ${top.closingSpeedKnots.toFixed(1)} kt`, `예상 ${top.motion.distanceNM.toFixed(2)} → ${top.motion.cpaNM.toFixed(2)} NM`, supportRiskClass(top.motion.cpaNM,top.motion.tcpaMin))
                               : p('대상 없음','현재 접근 중인 선박 없음','접근 순위','safe');
                }
                if (feature === 'maneuver-trend') {
                    const moving = targets.filter(t => Math.abs(Number(t.rot)||0) >= 0.5).length;
                    return moving ? p(`${moving}척 선회`, 'ROT로 PORT / STBD 추세 판별', '조종 변화 감지','caution')
                                  : p('대체로 직진','큰 ROT 없음','조종 추세','safe');
                }
            }

            if (group === 'dm') {
                if (feature === 'safe-heading-band') {
                    const samples = getSafeHeadingBandSamples(os, targets);
                    const danger = samples.filter(c => !c.safe).length;
                    const total = samples.length;
                    const state = total && danger === total ? 'danger' : danger > 0 ? 'caution' : 'safe';
                    return p(`위험 ${danger} / ${total}`, `5° 간격 · CPA ≥ ${limit.toFixed(2)} NM`, '녹색=안전 · 빨강=위험', state);
                }
                if (feature === 'minimum-alteration') {
                    const sol = SupportModels.collisionAvoidance.findMinimumAlterationOptions(os,targets);
                    const port = sol && sol.portRecommended;
                    const stbd = sol && sol.starboardRecommended;
                    const pd = port ? Math.abs(signedAngleDiff(port.heading,os.cog)).toFixed(0) : '--';
                    const sd = stbd ? Math.abs(signedAngleDiff(stbd.heading,os.cog)).toFixed(0) : '--';
                    const state = sol && (sol.portHasSafe || sol.starboardHasSafe) ? 'safe' : 'danger';
                    return p(`◀ PORT ${pd}°<br>STBD ${sd}° ▶`, `ARC TR 30초 · MIN CPA ${limit.toFixed(2)} NM`, 'Time Ring 피항 경로', state);
                }
                if (feature === 'port-starboard') {
                    const port = SupportModels.collisionAvoidance.evaluateHeading(os,targets,os.cog-SUPPORT_CONFIG.compareAlterDeg,os.sog);
                    const stbd = SupportModels.collisionAvoidance.evaluateHeading(os,targets,os.cog+SUPPORT_CONFIG.compareAlterDeg,os.sog);
                    const better = [port,stbd].sort((a,b)=>a.unsafeCount-b.unsafeCount || b.worst.cpaNM-a.worst.cpaNM)[0];
                    const side = signedAngleDiff(better.heading,os.cog) >= 0 ? 'STBD ▶' : '◀ PORT';
                    return p(side, `CPA PORT ${port.worst.cpaNM.toFixed(2)} · STBD ${stbd.worst.cpaNM.toFixed(2)}`, `${SUPPORT_CONFIG.compareAlterDeg}° 동일 변침 비교`, better.safe?'safe':'danger');
                }
                if (feature === 'speed-option') {
                    const opt = findSpeedOption(os,targets);
                    if (!opt || !opt.recommended) return p('대안 없음',`현재 ${os.sog.toFixed(1)} kt`,'속력만 변경','danger');
                    return p(`${opt.recommended.speed.toFixed(1)} kt`, `현재 ${os.sog.toFixed(1)} kt`, opt.hasSafe?'CPA 기준 만족 속력':'최선 속력 대안', opt.hasSafe?'safe':'danger');
                }
                if (feature === 'what-if-course') {
                    const scenarios = getArcWhatIfScenarios(os, targets);
                    const available = scenarios.filter(s => s.available);
                    return available.length
                        ? p(`${available.length} / ${scenarios.length} 경로`, 'CPA 0.1 → 1.0 NM · ARC', '피항 후 원침로 복귀 경로', 'safe')
                        : p('경로 없음', 'CPA 0.1 → 1.0 NM · ARC', '현재 교통에서 계산 불가', 'danger');
                }
                if (feature === 'colreg-cue') {
                    const cue=classifyColregCue(os,target);
                    const encounterMap = { 'HEAD-ON':'정면 상태', 'OVERTAKING':'추월 상태', 'CROSSING':'횡단 상태', 'OTHER':'기타 상태', 'NO TARGET':'대상 없음' };
                    const actionMap = { 'ALTER TO STBD':'STBD 변침 검토', 'KEEP CLEAR':'충분히 피항', 'GIVE-WAY CUE':'피항선 판단', 'STAND-ON CUE':'유지선 판단', 'MONITOR':'감시 유지', '---':'---' };
                    const state=(cue.action.includes('GIVE')||cue.action.includes('ALTER')||cue.action.includes('KEEP'))?'caution':'safe';
                    return p(actionMap[cue.action] || cue.action, encounterMap[cue.encounter] || cue.encounter, target ? target.name : '대상 없음', state);
                }
            }

            if (group === 'act') {
                const targetHeading=getDecisionTargetHeading();
                const error=signedAngleDiff(targetHeading,os.hdg);
                const rudder=SupportModels.shipControl.rudderCommand(os,targetHeading);
                const rot=SupportModels.shipControl.rotGuidance(os,targetHeading);
                const ease=SupportModels.shipControl.easeGuidance(os,targetHeading);
                if(feature==='target-heading') return p(`${targetHeading.toFixed(0)}°`,'목표 HDG',Math.abs(error)<2?'목표 HDG 유지':'목표 HDG로 변침',Math.abs(error)<2?'safe':'caution');
                if(feature==='rudder-direction') return p(rudder.direction==='PORT'?'◀ PORT':rudder.direction==='STBD'?'STBD ▶':'MIDSHIP','필요 타 방향',rudder.direction==='MIDSHIP'?'타 중앙':'조타 필요',rudder.direction==='MIDSHIP'?'safe':'caution');
                if(feature==='rudder-angle') return p(rudder.rudder===0?'MIDSHIP':`${rudder.direction} ${Math.abs(rudder.rudder).toFixed(0)}°`,'추천 타각',`목표 ${targetHeading.toFixed(0)}°`,rudder.rudder===0?'safe':'caution');
                if(feature==='heading-error') return Math.abs(error)<2 ? p('목표 HDG 도달',`${targetHeading.toFixed(0)}°`,'HDG 오차','safe') : p(`${Math.abs(error).toFixed(1)}°`,error>0?'STBD 방향 ▶':'◀ PORT 방향','남은 HDG 오차','caution');
                if(feature==='rot-guidance') {
                    const cueMap = { 'HOLD ROT':'ROT 유지', 'INCREASE STBD ROT':'STBD ROT 증가', 'INCREASE PORT ROT':'PORT ROT 증가', 'REDUCE STBD ROT':'STBD ROT 감소', 'REDUCE PORT ROT':'PORT ROT 감소' };
                    return p(cueMap[rot.cue] || rot.cue,`${rot.currentRot.toFixed(1)} → ${rot.targetRot.toFixed(1)} °/min`,'ROT 유도',rot.cue==='HOLD ROT'?'safe':'caution');
                }
                if(feature==='ease-timing') return ease.easeNow ? p('지금 타 풀기',`예상 정지 ${ease.predictedStop.toFixed(0)}°`,'MIDSHIP / EASE','danger') : p(`${ease.easeHeading.toFixed(0)}°`,'타 풀기 / MIDSHIP 시작',ease.sameTurn?'곧 타를 풀 준비':'먼저 선회 형성',ease.sameTurn?'caution':'safe');
            }
            return p('활성','','지원 기능 ON',cls);
        }

        const SUPPORT_PANEL_LAYOUT = {
            compactThreshold: 4,
            gap: 9,
            compactWidth: 258,
            transitionMs: 280
        };

        function clearSupportCardCut(card) {
            card.classList.remove('dynamic-cut');
            card.style.removeProperty('--support-mask');
            card.style.paddingLeft = '12px';
            card.style.paddingRight = '12px';
            const outline = card.querySelector('.support-curve-outline');
            if (outline) outline.removeAttribute('style');
        }

        function applySupportCardCut(card, side, x, y, width, height, circle) {
            const nearestX = Math.max(x, Math.min(circle.cx, x + width));
            const nearestY = Math.max(y, Math.min(circle.cy, y + height));
            const intersects = Math.hypot(nearestX - circle.cx, nearestY - circle.cy) < circle.r - 2;
            if (!intersects) {
                clearSupportCardCut(card);
                return;
            }

            const localCx = circle.cx - x;
            const localCy = circle.cy - y;
            const innerStop = Math.max(0, circle.r - 1.5);
            const outerStop = circle.r + 1.5;
            const mask = `radial-gradient(circle ${circle.r.toFixed(1)}px at ${localCx.toFixed(1)}px ${localCy.toFixed(1)}px, transparent 0 ${innerStop.toFixed(1)}px, #000 ${outerStop.toFixed(1)}px)`;
            card.style.setProperty('--support-mask', mask);
            card.classList.add('dynamic-cut');

            const midY = y + height / 2;
            const dy = Math.abs(midY - circle.cy);
            let cutDepth = 0;
            if (dy < circle.r) {
                const dx = Math.sqrt(Math.max(0, circle.r * circle.r - dy * dy));
                if (side === 'left') {
                    const boundaryX = circle.cx - dx;
                    cutDepth = Math.max(0, x + width - boundaryX);
                    card.style.paddingRight = `${Math.min(width * 0.44, 12 + cutDepth).toFixed(1)}px`;
                    card.style.paddingLeft = '12px';
                } else {
                    const boundaryX = circle.cx + dx;
                    cutDepth = Math.max(0, boundaryX - x);
                    card.style.paddingLeft = `${Math.min(width * 0.44, 12 + cutDepth).toFixed(1)}px`;
                    card.style.paddingRight = '12px';
                }
            }

            const outline = card.querySelector('.support-curve-outline');
            if (outline) {
                const outlineR = circle.r + 1.5;
                outline.style.width = `${(outlineR * 2).toFixed(1)}px`;
                outline.style.height = `${(outlineR * 2).toFixed(1)}px`;
                outline.style.left = `${(localCx - outlineR).toFixed(1)}px`;
                outline.style.top = `${(localCy - outlineR).toFixed(1)}px`;
            }
        }

        function placeSupportCard(card, x, y, width, height) {
            card.style.left = `${Math.round(x)}px`;
            card.style.top = `${Math.round(y)}px`;
            card.style.width = `${Math.max(96, Math.round(width))}px`;
            card.style.height = `${Math.max(88, Math.round(height))}px`;
        }

        function balancedRowsForColumn(size) {
            if (size <= 0) return [];
            if (size === 1) return [1];
            if (size === 2) return [0, 2];
            return [0, 1, 2];
        }

        function layoutSupportSide(cards, side, geometry) {
            if (!cards.length) return;
            const { width: W, height: H, circle, gap, maxCardWidth } = geometry;
            const margin = 0;
            const cols = Math.max(1, Math.ceil(cards.length / 3));
            const overlap = geometry.overlap;
            const bankLimit = side === 'left' ? circle.cx - circle.r + overlap : W - (circle.cx + circle.r - overlap);
            const bankWidth = Math.max(1, bankLimit - margin);
            const usableWidth = Math.max(1, bankWidth - gap * (cols - 1));
            let weights = cols === 3 ? [0.30, 0.30, 0.40] : cols === 2 ? [0.44, 0.56] : [1];
            let colWidths = weights.map(w => Math.max(105, Math.min(maxCardWidth, usableWidth * w)));
            const totalCols = colWidths.reduce((a,b) => a+b, 0) + gap * (cols - 1);
            if (totalCols > bankWidth) {
                const scale = Math.max(0.72, (bankWidth - gap * (cols - 1)) / Math.max(1, colWidths.reduce((a,b)=>a+b,0)));
                colWidths = colWidths.map(w => Math.max(96, w * scale));
            }
            const cellH = Math.max(118, (H - gap * 2) / 3);
            const offsets = [];
            let cursor = 0;
            colWidths.forEach((w, i) => { offsets.push(cursor); cursor += w + (i < colWidths.length - 1 ? gap : 0); });

            let index = 0;
            for (let col = 0; col < cols; col++) {
                const remain = cards.length - index;
                const inColumn = Math.min(3, remain);
                const rows = balancedRowsForColumn(inColumn);
                const cellW = colWidths[col];
                rows.forEach(row => {
                    const card = cards[index++];
                    const x = side === 'left'
                        ? margin + offsets[col]
                        : W - margin - cellW - offsets[col];
                    const y = row * (cellH + gap);
                    placeSupportCard(card, x, y, cellW, cellH);
                    card.dataset.layoutSide = side;
                    applySupportCardCut(card, side, x, y, cellW, cellH, circle);
                });
            }
        }

        function layoutAllSupportCardsByGroupRows(cards, geometry) {
            const { width: W, height: H, circle, gap, maxCardWidth } = geometry;
            const groups = ['sa', 'dm', 'act'];
            const rows = { sa: 0, dm: 1, act: 2 };
            const cellH = Math.max(88, (H - gap * 2) / 3);
            const overlap = geometry.overlap;
            const bankLimit = circle.cx - circle.r + overlap;
            const bankWidth = Math.max(1, bankLimit);
            const cols = 3;
            const usable = Math.max(1, bankWidth - gap * (cols - 1));
            let colWidths = [0.30, 0.30, 0.40].map(w => Math.max(96, Math.min(maxCardWidth, usable * w)));
            const sum = colWidths.reduce((a,b)=>a+b,0);
            if (sum + gap * 2 > bankWidth) {
                const scale = (bankWidth - gap * 2) / Math.max(1, sum);
                colWidths = colWidths.map(w => Math.max(88, w * scale));
            }
            const offsets=[]; let cursor=0;
            colWidths.forEach((w,i)=>{ offsets.push(cursor); cursor += w + (i<2?gap:0); });

            groups.forEach(group => {
                const groupCards = cards
                    .filter(card => String(card.dataset.supportKey || '').startsWith(group + ':'))
                    .sort((a,b) => Number(a.dataset.buttonIndex||0) - Number(b.dataset.buttonIndex||0));
                const row = rows[group];
                groupCards.forEach((card, i) => {
                    const side = i < 3 ? 'left' : 'right';
                    const col = i < 3 ? i : i - 3;
                    const cellW = colWidths[col];
                    const x = side === 'left' ? offsets[col] : W - cellW - offsets[col];
                    const y = row * (cellH + gap);
                    placeSupportCard(card, x, y, cellW, cellH);
                    card.dataset.layoutSide = side;
                    applySupportCardCut(card, side, x, y, cellW, cellH, circle);
                });
            });
        }

        function layoutSupportCards(cards) {
            if (!supportCardsContainer || !cards.length) return;
            const W = supportCardsContainer.clientWidth;
            const H = supportCardsContainer.clientHeight;
            if (W <= 0 || H <= 0) return;
            const count = cards.length;
            supportCardsContainer.classList.toggle('layout-compact', count <= SUPPORT_PANEL_LAYOUT.compactThreshold);
            supportCardsContainer.classList.toggle('layout-dynamic', count > SUPPORT_PANEL_LAYOUT.compactThreshold);
            supportCardsContainer.classList.toggle('layout-dense', count >= 13);

            if (count <= SUPPORT_PANEL_LAYOUT.compactThreshold) {
                const gap = SUPPORT_PANEL_LAYOUT.gap;
                const cardWidth = Math.min(SUPPORT_PANEL_LAYOUT.compactWidth, Math.max(210, W * 0.24));
                let x = 0;
                let y = 0;
                let colWidth = cardWidth;
                cards.forEach(card => {
                    clearSupportCardCut(card);
                    card.dataset.layoutSide = 'compact';
                    card.style.width = `${cardWidth}px`;
                    card.style.height = 'auto';
                    const naturalH = Math.max(118, Math.min(220, card.scrollHeight + 2));
                    if (y > 0 && y + naturalH > H) {
                        x += colWidth + gap;
                        y = 0;
                    }
                    placeSupportCard(card, x, y, cardWidth, naturalH);
                    y += naturalH + gap;
                });
                return;
            }

            const density = (count - 5) / 13;
            const gap = count >= 13 ? 8 : 10;
            const circleScale = 0.34 + Math.max(0, Math.min(1, density)) * 0.11;
            const desiredR = Math.min(H * circleScale, W * (0.245 + 0.02 * density));
            const maxSideCount = Math.ceil(count / 2);
            const cols = Math.max(1, Math.ceil(maxSideCount / 3));
            const minimumCellW = count >= 13 ? Math.max(105, Math.min(138, W * 0.072)) : Math.max(125, Math.min(170, W * 0.095));
            const overlapRatio = 0.08 + 0.06 * Math.max(0, Math.min(1, density));
            const halfW = W / 2;
            const minimumBank = cols * minimumCellW + Math.max(0, cols - 1) * gap;
            const maxRByWidth = Math.max(92, (halfW - minimumBank) / Math.max(0.62, 1 - overlapRatio));
            const r = Math.max(92, Math.min(desiredR, maxRByWidth));
            const circle = { cx: W / 2, cy: H / 2, r };
            const overlap = r * overlapRatio;
            const maxCardWidth = count >= 16 ? 224 : count >= 13 ? 238 : count >= 9 ? 272 : 300;

            const geometry = { width: W, height: H, circle, overlap, gap, maxCardWidth };

            // With all 18 supports active: row 1 = six SA, row 2 = six DM, row 3 = six ACT.
            // Each row is split 3 left / 3 right so the existing central circular tactical opening remains clear.
            if (count === 18) {
                layoutAllSupportCardsByGroupRows(cards, geometry);
                return;
            }

            const left = [];
            const right = [];
            cards.forEach(card => {
                const fullIndex = Number(card.dataset.buttonIndex || 0);
                (fullIndex % 2 === 0 ? left : right).push(card);
            });

            // In rare uneven toggle combinations, rebalance only enough to keep the center open.
            while (left.length - right.length > 1) right.push(left.pop());
            while (right.length - left.length > 1) left.push(right.pop());

            layoutSupportSide(left, 'left', geometry);
            layoutSupportSide(right, 'right', geometry);
        }

        function updateSupportCards() {
            if (!supportCardsContainer) return;
            const buttons = Array.from(document.querySelectorAll('[data-support-group]'));
            const activeEntries = [];

            if (vObj.massEntity && activeSupportFeatures.size > 0) {
                buttons.forEach((button, buttonIndex) => {
                    const group = button.dataset.supportGroup;
                    const feature = button.dataset.supportFeature;
                    const key = `${group}:${feature}`;
                    if (!activeSupportFeatures.has(key)) return;
                    const model = buildSupportCardModel(group, feature);
                    if (!model) return;
                    activeEntries.push({ button, buttonIndex, group, feature, key, model });
                });
            }

            const activeKeys = new Set(activeEntries.map(e => e.key));
            Array.from(supportCardsContainer.querySelectorAll('.support-feature-card')).forEach(card => {
                if (activeKeys.has(card.dataset.supportKey)) return;
                if (card._removeTimer) return;
                card.classList.add('support-card-exit');
                const side = card.dataset.layoutSide;
                card.style.transform = side === 'left' ? 'translateX(-18px) scale(.98)' : side === 'right' ? 'translateX(18px) scale(.98)' : 'scale(.97)';
                card._removeTimer = setTimeout(() => card.remove(), 190);
            });

            const cards = [];
            activeEntries.forEach(({ buttonIndex, group, feature, key, model }) => {
                let card = Array.from(supportCardsContainer.children).find(el => el.dataset && el.dataset.supportKey === key);
                const isNew = !card;
                if (!card) {
                    card = document.createElement('div');
                    card.dataset.supportKey = key;
                    card.dataset.buttonIndex = String(buttonIndex);
                    card.className = `support-feature-card ${group} support-card-enter`;
                    card.innerHTML = `<div class="support-card-content"></div><span class="support-curve-outline"></span>`;
                    supportCardsContainer.appendChild(card);
                } else {
                    if (card._removeTimer) { clearTimeout(card._removeTimer); card._removeTimer = null; }
                    card.classList.remove('support-card-exit');
                    card.style.transform = '';
                }

                const codeIndex = buttons.filter(b => b.dataset.supportGroup === group).findIndex(b => b.dataset.supportFeature === feature) + 1;
                const content = card.querySelector('.support-card-content');
                const view = buildSupportCardPresentation(group, feature, model);
                const html = `
                    <div class="support-card-kicker">${group.toUpperCase()}${String(codeIndex).padStart(2,'0')}</div>
                    <div class="support-card-title">${(SUPPORT_FEATURE_KO[key] && SUPPORT_FEATURE_KO[key].label) || model.title}</div>
                    <div class="support-card-rule"></div>
                    <div class="support-card-primary ${view ? view.state : ''}">${view ? view.primary : ''}</div>
                    <div class="support-card-secondary">${view ? view.secondary : ''}</div>
                    ${view && view.status ? `<div class="support-card-status ${view.state}">${view.status}</div>` : ''}
                `;
                if (content && content.__lastHtml !== html) {
                    content.innerHTML = html;
                    content.__lastHtml = html;
                }
                cards.push(card);
                if (isNew) requestAnimationFrame(() => card.classList.remove('support-card-enter'));
            });

            if (!cards.length) {
                supportCardsContainer.classList.remove('layout-compact', 'layout-dynamic', 'layout-dense');
                return;
            }
            layoutSupportCards(cards);
        }

        document.querySelectorAll('[data-support-group-title]').forEach(title => {
            title.addEventListener('click', () => {
                const group = title.dataset.supportGroupTitle;
                const buttons = Array.from(document.querySelectorAll(`[data-support-group="${group}"]`));
                const allOn = buttons.length > 0 && buttons.every(button => activeSupportFeatures.has(`${group}:${button.dataset.supportFeature}`));
                buttons.forEach(button => {
                    const key = `${group}:${button.dataset.supportFeature}`;
                    if (allOn) {
                        activeSupportFeatures.delete(key);
                        button.classList.remove('active-btn');
                    } else {
                        activeSupportFeatures.add(key);
                        button.classList.add('active-btn');
                    }
                });
                supportFocus = allOn || !buttons.length
                    ? { group: null, feature: null }
                    : { group, feature: buttons[0].dataset.supportFeature };
                updateMinCpaControl();
                if (isSimulationRunning) render2D(); else updateSupportCards();
            });
        });

        document.querySelectorAll('[data-support-group]').forEach(button => {
            button.addEventListener('click', () => {
                const group = button.dataset.supportGroup;
                const feature = button.dataset.supportFeature;
                const key = `${group}:${feature}`;
                if (activeSupportFeatures.has(key)) {
                    activeSupportFeatures.delete(key);
                    button.classList.remove('active-btn');
                    if (supportFocus.group === group && supportFocus.feature === feature) supportFocus = { group: null, feature: null };
                } else {
                    activeSupportFeatures.add(key);
                    button.classList.add('active-btn');
                    supportFocus = { group, feature };
                }
                updateMinCpaControl();
                if (isSimulationRunning) render2D(); else updateSupportCards();
            });
        });

        if (minCpaControl) {
            minCpaControl.addEventListener('wheel', (e) => {
                e.preventDefault(); e.stopPropagation();
                if (!activeSupportFeatures.size) return;
                const dir = e.deltaY < 0 ? 1 : -1;
                const next = clampValue(getDesiredCpaNM() + dir * supportUserSettings.stepNM, supportUserSettings.minAllowedNM, supportUserSettings.maxAllowedNM);
                supportUserSettings.minCpaNM = Math.round(next * 100) / 100;
                updateMinCpaControl();
                if (isSimulationRunning) render2D(); else updateSupportCards();
            }, { passive: false });
        }
        updateMinCpaControl();

        // ==========================================
        // 4. HTMS 오리지널 렌더링 함수
        // ==========================================
        function drawShipHullLocal(ctx, panX, panY, viewScale, x, z, heading, color, isOwnShip, label) {
            const cx = panX + x * viewScale; 
            const cy = panY + z * viewScale;
            
            ctx.save(); 
            ctx.translate(cx, cy); 
            ctx.rotate(heading * DEG2RAD); 
            ctx.scale(viewScale, viewScale); 
            
            ctx.shadowColor = color; 
            ctx.shadowBlur = 10; 
            ctx.fillStyle = color;
            
            const halfLen = SHIP_LEN_UNIT / 2; 
            const halfWid = SHIP_WID_UNIT / 2; 
            
            ctx.beginPath(); 
            ctx.moveTo(0, -halfLen); 
            ctx.lineTo(halfWid, -halfLen + 12); 
            ctx.lineTo(halfWid, halfLen); 
            ctx.lineTo(-halfWid, halfLen); 
            ctx.lineTo(-halfWid, -halfLen + 12); 
            ctx.closePath(); 
            ctx.fill();
            
            ctx.lineWidth = 1 / viewScale; 
            ctx.strokeStyle = '#ffffff'; 
            ctx.stroke(); 
            ctx.restore();
            
            if (label) { 
                ctx.fillStyle = color; 
                ctx.font = 'bold 12px monospace'; 
                ctx.textAlign = 'center'; 
                ctx.fillText(label, cx, cy + Math.max(25, (SHIP_LEN_UNIT / 2) * viewScale + 15)); 
            }
        }
        
        function drawVectorArrowLocal(ctx, panX, panY, viewScale, x, z, heading, distUnit, color) {
            if (distUnit <= 0) return;
            const cx = panX + x * viewScale; 
            const cy = panY + z * viewScale; 
            const rad = (heading - 90) * DEG2RAD;
            
            const wpX = cx + Math.cos(rad) * (distUnit * viewScale); 
            const wpY = cy + Math.sin(rad) * (distUnit * viewScale);
            
            ctx.strokeStyle = color; 
            ctx.lineWidth = 1.5; 
            ctx.setLineDash([4, 4]);
            ctx.beginPath(); 
            ctx.moveTo(cx, cy); 
            ctx.lineTo(wpX, wpY); 
            ctx.stroke(); 
            ctx.setLineDash([]);
            
            ctx.save(); 
            ctx.translate(wpX, wpY); 
            ctx.rotate(heading * DEG2RAD);
            ctx.fillStyle = color; 
            ctx.beginPath(); 
            ctx.moveTo(0, -6); /* 오타 복구 완료된 부분 */
            ctx.lineTo(6, 6); 
            ctx.lineTo(-6, 6); 
            ctx.closePath(); 
            ctx.fill(); 
            ctx.restore();
        }

        function render2D() {
            if (!vObj.massEntity || !isSimulationRunning) { updateOwnShipHud(); return; }
            updateOwnShipHud();
            
            vObj.panX = canvas.width / 2 + vObj.panOffsetX; 
            vObj.panY = canvas.height / 2 + vObj.panOffsetY;
            
            const ctx = canvas.getContext('2d'); 
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            ctx.strokeStyle = '#1e293b'; 
            ctx.lineWidth = 1; 
            ctx.beginPath(); 
            ctx.moveTo(0, vObj.panY); ctx.lineTo(canvas.width, vObj.panY); 
            ctx.moveTo(vObj.panX, 0); ctx.lineTo(vObj.panX, canvas.height); 
            ctx.stroke();
            
            const rangeNM = 1 / vObj.viewScale;
            let stepCbl = rangeNM <= 1.5 ? 1 : (rangeNM <= 3.5 ? 5 : (rangeNM <= 8.0 ? 10 : 20));   
            let majorCbl = rangeNM <= 1.5 ? 5 : (rangeNM <= 3.5 ? 10 : (rangeNM <= 8.0 ? 20 : 50)); 
            const maxCables = Math.ceil((Math.max(Math.hypot(vObj.panX, vObj.panY), Math.hypot(canvas.width - vObj.panX, vObj.panY), Math.hypot(vObj.panX, canvas.height - vObj.panY), Math.hypot(canvas.width - vObj.panX, canvas.height - vObj.panY)) / vObj.viewScale) / 40);
            
            ctx.setLineDash([4, 4]);
            for (let i = stepCbl; i <= maxCables; i += stepCbl) { 
                const radius_px = (i * 40) * vObj.viewScale; 
                ctx.strokeStyle = (i % majorCbl === 0) ? '#2d3f5a' : '#1d283a'; 
                ctx.lineWidth = (i % majorCbl === 0) ? 1.5 : 1; 
                ctx.beginPath(); 
                ctx.arc(vObj.panX, vObj.panY, radius_px, 0, Math.PI * 2); 
                ctx.stroke(); 
            }
            ctx.setLineDash([]);

            // 지원 그래픽을 먼저 그린 뒤 선박을 최상단에 완전 불투명으로 다시 그려
            // 모든 기능을 동시에 켜도 본선/상대선 식별이 묻히지 않게 한다.
            renderSupportOverlay(ctx);

            simEntities.forEach((s) => {
                const isOwnShip = (s === vObj.massEntity);
                const relX = s.x - vObj.massEntity.x; 
                const relZ = s.z - vObj.massEntity.z; 
                const color = isOwnShip ? '#10b981' : '#ef4444';
                
                ctx.save();
                ctx.globalAlpha = 1;
                drawVectorArrowLocal(ctx, vObj.panX, vObj.panY, vObj.viewScale, relX, relZ, s.cog, s.sog * VECTOR_SCALE, color);
                drawShipHullLocal(ctx, vObj.panX, vObj.panY, vObj.viewScale, relX, relZ, s.hdg, color, isOwnShip, isOwnShip ? "OS" : s.name);
                ctx.restore();
                
                if (Array.from(selectedTargetIds).some(id => String(id) === String(s.id))) {
                    ctx.save();
                    ctx.strokeStyle = '#f97316';
                    ctx.lineWidth = 2;
                    ctx.beginPath();
                    const markerRadius = Math.max(20, (SHIP_LEN_UNIT / 2) * vObj.viewScale + 12);
                    ctx.arc(vObj.panX + relX * vObj.viewScale, vObj.panY + relZ * vObj.viewScale, markerRadius, 0, Math.PI * 2);
                    ctx.stroke();
                    ctx.restore();
                }
            });
        }

        // ==========================================
        // ★ 5. 파이썬 실시간 데이터 로드 
        // ==========================================
        function getFuzzyVal(obj, possibleKeys, defaultVal) {
            for (let k of possibleKeys) {
                if (obj[k] !== undefined && obj[k] !== null) return parseFloat(obj[k]);
            }
            return defaultVal;
        }

        function getSpeedKnots(obj, knotKeys, mpsKeys, defaultVal = 0) {
            for (const k of knotKeys) {
                if (obj[k] !== undefined && obj[k] !== null && obj[k] !== '') {
                    const v = parseFloat(obj[k]);
                    if (Number.isFinite(v)) return v;
                }
            }
            for (const k of mpsKeys) {
                if (obj[k] !== undefined && obj[k] !== null && obj[k] !== '') {
                    const v = parseFloat(obj[k]);
                    if (Number.isFinite(v)) return v * 1.9438444924406;
                }
            }
            return defaultVal;
        }

        function fetchFlaskData() {
            fetch('http://localhost:5000/api/data')
                .then(res => {
                    if (!res.ok) throw new Error("서버 응답 오류: " + res.status);
                    return res.json();
                })
                .then(data => {
                    if (data.error) throw new Error("백엔드 에러: " + data.error);
                    
                    isSimulationRunning = true;
                    simEntities = []; 
                    
                    if (data.os_data && data.os_data.length > 0) {
                        const currentOsFrame = data.os_data[0];
                        let osEntity = {
                            id: currentOsFrame['MMSI'] || currentOsFrame['Name'] || "OS",
                            name: currentOsFrame['Name'] || "OS",
                            isMASS: true,
                            x: getFuzzyVal(currentOsFrame, ['East(m)', 'East'], 0) * (400 / 1852),
                            z: -getFuzzyVal(currentOsFrame, ['North(m)', 'North'], 0) * (400 / 1852),
                            hdg: getFuzzyVal(currentOsFrame, ['Heading(deg)', 'Heading', 'Yaw(deg)'], 0),
                            cog: getFuzzyVal(currentOsFrame, ['Course'], getFuzzyVal(currentOsFrame, ['Heading(deg)', 'Heading', 'Yaw(deg)'], 0)), 
                            sog: getSpeedKnots(currentOsFrame, ['SOG(knot)', 'SpeedOverGround'], ['u(m/sec)'], 0),
                            spd: getSpeedKnots(currentOsFrame, ['SOG(knot)', 'SpeedOverGround'], ['u(m/sec)'], 0),
                            rot: getFuzzyVal(currentOsFrame, ['RateOfTurn', 'r(deg/sec)'], 0),
                            color: '#10b981'
                        };
                        simEntities.push(osEntity);
                        vObj.massEntity = osEntity;
                    }

                    if (data.traffic_data && data.traffic_data.length > 0) {
                        data.traffic_data.forEach(t => {
                            simEntities.push({
                                id: t['MMSI'] || t['Name'] || Math.random(),
                                name: t['Name'] || `Target`,
                                isMASS: false,
                                x: getFuzzyVal(t, ['East(m)', 'East'], 0) * (400 / 1852),
                                z: -getFuzzyVal(t, ['North(m)', 'North'], 0) * (400 / 1852),
                                hdg: getFuzzyVal(t, ['Heading', 'Yaw(deg)'], 0),
                                cog: getFuzzyVal(t, ['Course'], getFuzzyVal(t, ['Heading', 'Yaw(deg)'], 0)), 
                                sog: getSpeedKnots(t, ['SOG(knot)', 'SpeedOverGround'], ['V(m/sec)'], 0), 
                                spd: getSpeedKnots(t, ['SOG(knot)', 'SpeedOverGround'], ['V(m/sec)'], 0), 
                                rot: getFuzzyVal(t, ['RateOfTurn', 'r(deg/sec)'], 0), 
                                color: '#ef4444'
                            });
                        });
                    }

                    render2D(); 
                    updateAllTargetPanels();
                })
                .catch(err => {
                    console.error("데이터 로드 실패:", err);
                    if (!isSimulationRunning) {
                        showErrorOnCanvas(err.message);
                    }
                });
        }

        function showErrorOnCanvas(msg) {
            if (osFixedHud) osFixedHud.classList.remove('visible');
            const ctx = canvas.getContext('2d');
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            drawPlaceholderGrid();
            ctx.fillStyle = '#f43f5e';
            ctx.font = 'bold 16px Rajdhani';
            ctx.textAlign = 'center';
            ctx.fillText("오류 발생 (F12 콘솔 창을 확인하세요):", canvas.width / 2, canvas.height / 2 - 20);
            ctx.fillText(msg, canvas.width / 2, canvas.height / 2 + 10);
        }

        // 무한 반복 타이머 설정 (1초 간격으로 우체국 호출)
        window.addEventListener('DOMContentLoaded', () => {
            setInterval(fetchFlaskData, 1000);
        });
    </script>
