<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>[HTMS] ROC - 2D Tactical Display</title>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&display=swap');

        :root {
            --bg-color: #0b0f19;
            --panel-bg: #111827;
            --border-color: #1f293d;
            --accent-cyan: #06b6d4;
            --accent-green: #10b981;
            --accent-rose: #f43f5e;
            --accent-yellow: #eab308;
            --accent-orange: #f97316; 
            --text-main: #f3f4f6;
            --text-muted: #9ca3af;
        }

        body, html { 
            margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; 
            background: var(--bg-color); color: var(--text-main); 
            font-family: 'Rajdhani', sans-serif; user-select: none; touch-action: none; 
        }

        #main-wrapper { 
            display: flex; flex-direction: column; width: 100vw; height: 100vh; 
        }

        /* --- 상단 2D 탑뷰 영역 --- */
        #top-view-area { 
            flex: 1 1 auto; min-height: 0;
            position: relative; background: radial-gradient(circle at center, #111a2e 0%, #050a10 100%);
            border-bottom: 2px solid var(--border-color); overflow: hidden; 
        }
        
        .vp-canvas { 
            width: 100%; height: 100%; display: block; cursor: crosshair; 
        }

        .hud-label {
            position: absolute; top: 15px; left: 15px; color: var(--accent-cyan); 
            font-weight: bold; font-size: 18px; letter-spacing: 1px; text-shadow: 0 2px 4px #000; 
            background: rgba(0,0,0,0.5); padding: 8px 15px; border-radius: 4px; 
            border: 1px solid var(--accent-cyan); pointer-events: none; z-index: 10;
        }

        .hud-range {
            position: absolute; top: 15px; left: 50%; transform: translateX(-50%);
            color: var(--accent-yellow); font-weight: bold; font-size: 16px; 
            background: rgba(0,0,0,0.6); padding: 6px 12px; border-radius: 4px; 
            border: 1px solid var(--accent-yellow); z-index: 10;
        }

        /* --- 다중 타겟 인포 패널 스타일 --- */
        #target-panels-container {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 20;
        }

        .target-info-panel {
            position: absolute; 
            background: rgba(17, 24, 39, 0.85); border: 1px solid var(--accent-cyan); 
            padding: 15px; border-radius: 6px; width: 220px;
            backdrop-filter: blur(4px); box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            pointer-events: auto; /* 패널 위에서는 클릭 이벤트 받기 */
        }

        .tgt-header {
            display: flex; justify-content: space-between; align-items: center;
            margin-bottom: 12px; padding-bottom: 6px; border-bottom: 1px solid var(--border-color);
            cursor: grab; /* 드래그 가능하다는 커서 표시 */
        }
        .tgt-header:active { cursor: grabbing; }

        .tgt-title { font-size: 16px; font-weight: 700; color: var(--accent-orange); pointer-events: none;}
        
        .tgt-close-btn {
            background: none; border: none; color: var(--text-muted); font-size: 16px; 
            cursor: pointer; padding: 0 4px; font-weight: bold; transition: 0.2s;
        }
        .tgt-close-btn:hover { color: var(--accent-rose); transform: scale(1.1); }

        .tgt-row { display: flex; justify-content: space-between; margin-bottom: 6px; font-size: 15px; pointer-events: none;}
        .tgt-val { font-weight: bold; color: var(--accent-yellow); }

        /* --- 하단 3분할 컨트롤 패널 --- */
        #bottom-view-wrapper { 
            flex: 0 0 clamp(190px, 25vh, 250px); min-height: 180px; max-height: 250px;
            display: flex; flex-direction: row; background: #000; overflow: hidden;
        }

        .split-side-panel { 
            display: flex; flex-direction: column; background: var(--panel-bg); 
            padding: 15px; overflow: hidden; flex: 1; min-width: 0; min-height: 0; border-right: 1px solid var(--border-color); 
        }
        .split-side-panel:last-child { border-right: none; }

        .panel-title { 
            font-size: clamp(10px, 1.5vh, 16px); font-weight: 700; text-align: center; margin-bottom: clamp(4px, 1vh, 12px); 
            letter-spacing: 1.5px; border-bottom: 1px solid var(--border-color); padding-bottom: clamp(3px, 0.7vh, 8px);
            flex-shrink: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
        }
        .panel-title.support-group-toggle { cursor: pointer; }

        .control-btn-grid { 
            display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); grid-template-rows: repeat(3, minmax(0, 1fr));
            gap: clamp(3px, 0.75vh, 8px); width: 100%; flex: 1; min-height: 0; overflow: hidden;
        }
        
        .placeholder-btn { 
            background: #1e293b; color: #94a3b8; border: 1px solid #334155; 
            padding: clamp(3px, 0.9vh, 12px) 4px; min-width: 0; min-height: 0; overflow: hidden;
            border-radius: 6px; font-family: 'Rajdhani', sans-serif; line-height: 1.04;
            font-weight: bold; font-size: clamp(9px, 1.35vh, 14px); cursor: pointer; transition: 0.2s; text-align: center; 
        }
        
        .sa-btn:hover { background: rgba(6,182,212,0.2); color: #fff; border-color: var(--accent-cyan); transform: translateY(-2px); }
        .sa-btn.active-btn { background: var(--accent-cyan); color: #000; border-color: var(--accent-cyan); }

        .dm-btn:hover { background: rgba(234,179,8,0.2); color: #fff; border-color: var(--accent-yellow); transform: translateY(-2px); }
        .dm-btn.active-btn { background: var(--accent-yellow); color: #000; border-color: var(--accent-yellow); }

        .act-btn:hover { background: rgba(16,185,129,0.2); color: #fff; border-color: var(--accent-green); transform: translateY(-2px); }
        .act-btn.active-btn { background: var(--accent-green); color: #000; border-color: var(--accent-green); }


        /* --- HTMS Navigation Support 기능 표시 (기존 레이아웃 비변경, 오버레이만 사용) --- */
        .support-btn-code {
            display: inline-block; min-width: clamp(25px, 3.2vw, 34px); margin-right: clamp(2px, 0.35vw, 5px); opacity: 0.72;
            font-size: clamp(8px, 1.0vh, 11px); letter-spacing: 0.5px;
        }
        #support-cards-container {
            position: absolute; left: 15px; top: 68px; right: 15px; bottom: 15px;
            pointer-events: none; z-index: 15; overflow: visible;
        }
        .support-feature-card {
            --support-accent: rgba(148,163,184,0.72);
            position: absolute; width: 258px;
            box-sizing: border-box; padding: 10px 12px 11px;
            background: linear-gradient(145deg, rgb(8,15,28), rgb(17,24,39));
            border: 1px solid var(--support-accent); border-radius: 8px;
            box-shadow: 0 10px 28px rgba(0,0,0,0.42), inset 0 0 24px rgba(255,255,255,0.015);
            backdrop-filter: blur(6px); pointer-events: none; overflow: hidden;
            transform-origin: center center; opacity: 1;
            transition:
                left 280ms cubic-bezier(.22,.8,.28,1),
                top 280ms cubic-bezier(.22,.8,.28,1),
                width 280ms cubic-bezier(.22,.8,.28,1),
                height 280ms cubic-bezier(.22,.8,.28,1),
                padding 280ms cubic-bezier(.22,.8,.28,1),
                border-radius 280ms ease, opacity 180ms ease, transform 220ms ease, filter 220ms ease;
            will-change: left, top, width, height, padding, transform;
        }
        .support-feature-card.sa { --support-accent: rgba(6,182,212,0.88); box-shadow: 0 10px 28px rgba(0,0,0,0.42), 0 0 18px rgba(6,182,212,0.13); }
        .support-feature-card.dm { --support-accent: rgba(234,179,8,0.88); box-shadow: 0 10px 28px rgba(0,0,0,0.42), 0 0 18px rgba(234,179,8,0.13); }
        .support-feature-card.act { --support-accent: rgba(16,185,129,0.88); box-shadow: 0 10px 28px rgba(0,0,0,0.42), 0 0 18px rgba(16,185,129,0.13); }
        .support-feature-card.sa .support-card-kicker { color: #67e8f9; }
        .support-feature-card.dm .support-card-kicker { color: #fde047; }
        .support-feature-card.act .support-card-kicker { color: #6ee7b7; }
        .support-feature-card.support-card-enter { opacity: 0; transform: scale(0.96); }
        .support-feature-card.support-card-exit { opacity: 0; filter: blur(2px); }
        .support-feature-card.dynamic-cut {
            -webkit-mask-image: var(--support-mask);
            mask-image: var(--support-mask);
            -webkit-mask-repeat: no-repeat; mask-repeat: no-repeat;
            -webkit-mask-size: 100% 100%; mask-size: 100% 100%;
        }
        .support-card-content { position: relative; z-index: 2; height: 100%; box-sizing: border-box; overflow: hidden; }
        .support-curve-outline {
            display: none; position: absolute; z-index: 1; pointer-events: none;
            border: 1px solid var(--support-accent); border-radius: 50%;
            box-shadow: 0 0 16px color-mix(in srgb, var(--support-accent) 44%, transparent);
        }
        .support-feature-card.dynamic-cut .support-curve-outline { display: block; }
        #support-cards-container.layout-dynamic .support-feature-card { border-radius: 10px; }
        #support-cards-container.layout-dense .support-card-kicker { font-size: 10px; letter-spacing: 1.3px; }
        #support-cards-container.layout-dense .support-card-title { font-size: 17px; }
        #support-cards-container.layout-dense .support-card-primary { font-size: 24px; }
        #support-cards-container.layout-dense .support-card-secondary { font-size: 12px; }
        #support-cards-container.layout-dense .support-card-status { font-size: 11px; margin-top: 7px; padding: 5px 7px; }
        #support-cards-container.layout-dense .support-card-rule { margin: 6px 0 7px; }
        .support-card-kicker { font-size: 11px; color: #94a3b8; letter-spacing: 1.6px; font-weight: 700; }
        .support-card-title { margin-top: 2px; font-size: 20px; line-height: 1.03; color: #f8fafc; font-weight: 700; letter-spacing: 0.8px; }
        .support-card-rule { height: 1px; margin: 8px 0 9px; background: linear-gradient(90deg, rgba(148,163,184,0.55), transparent); }
        .support-card-primary { margin-top: 2px; color: #ffffff; font-family: 'Rajdhani', sans-serif; font-size: 30px; line-height: 0.98; font-weight: 700; letter-spacing: 0.4px; text-shadow: 0 2px 8px rgba(0,0,0,0.55); white-space: normal; }
        .support-card-primary.safe { color: #6ee7b7; }
        .support-card-primary.caution { color: #fde047; }
        .support-card-primary.danger { color: #fb7185; }
        .support-card-secondary { margin-top: 8px; color: #cbd5e1; font-size: 14px; line-height: 1.1; font-weight: 700; letter-spacing: 0.35px; }
        .support-card-status { margin-top: 10px; padding: 6px 8px; border-radius: 4px; font-size: 12px; font-weight: 700; letter-spacing: 0.8px; text-align: center; }
        .support-card-status.safe { color: #6ee7b7; background: rgba(16,185,129,0.12); border: 1px solid rgba(16,185,129,0.35); }
        .support-card-status.caution { color: #fde047; background: rgba(234,179,8,0.12); border: 1px solid rgba(234,179,8,0.35); }
        .support-card-status.danger { color: #fb7185; background: rgba(244,63,94,0.12); border: 1px solid rgba(244,63,94,0.35); }

        /* 본선 정보는 2D 화면 패닝/확대축소와 무관한 고정 HUD로 항상 최상단에 유지 */
        #os-fixed-hud {
            display: none; position: absolute; top: 9px; right: 15px; z-index: 45; pointer-events: none;
            align-items: center; gap: clamp(5px, 0.7vw, 10px); max-width: calc(100% - 470px);
            padding: 6px 10px; box-sizing: border-box; border-radius: 5px;
            background: rgba(5,10,18,0.92); border: 1px solid rgba(16,185,129,0.72);
            box-shadow: 0 5px 16px rgba(0,0,0,0.42), 0 0 10px rgba(16,185,129,0.16);
            color: #d1fae5; font-family: 'Rajdhani', sans-serif; font-size: clamp(10px, 1.2vw, 14px); font-weight: 700;
            white-space: nowrap; overflow: hidden;
        }
        #os-fixed-hud.visible { display: flex; }
        #os-fixed-hud .os-hud-name { color: #34d399; font-size: 1.08em; letter-spacing: 1px; }
        #os-fixed-hud .os-hud-item { color: #94a3b8; }
        #os-fixed-hud .os-hud-item b { color: #ffffff; margin-left: 3px; }

        /* 사용자가 직접 조정하는 최소 피항거리: 지원기능이 켜졌을 때만 RANGE 아래에 표시 */
        #hud-min-cpa {
            display: none; position: absolute; top: 54px; left: 50%; transform: translateX(-50%);
            z-index: 30; min-width: 176px; box-sizing: border-box; padding: 6px 12px 5px;
            color: #111827; background: #facc15; border: 1px solid #fde047; border-radius: 5px;
            font-family: 'Rajdhani', sans-serif; text-align: center; font-weight: 700; cursor: ns-resize;
            box-shadow: 0 5px 18px rgba(0,0,0,0.45), 0 0 12px rgba(250,204,21,0.36); pointer-events: auto; user-select: none;
        }
        #hud-min-cpa.visible { display: block; }
        #hud-min-cpa:hover { box-shadow: 0 5px 18px rgba(0,0,0,0.45), 0 0 19px rgba(250,204,21,0.62); }
        #hud-min-cpa .min-cpa-label { display:block; font-size: 10px; letter-spacing: 1.25px; line-height: 1; opacity: 0.82; }
        #hud-min-cpa .min-cpa-value { display:block; margin-top: 2px; font-size: 19px; line-height: 1; letter-spacing: 0.6px; }

        /* 화면 높이가 작아져도 하단 18개 버튼이 잘리지 않도록 동일한 3분할 구조 안에서만 축소 */
        @media (max-height: 760px) {
            #bottom-view-wrapper { flex-basis: clamp(174px, 29vh, 210px); min-height: 174px; }
            .split-side-panel { padding: 8px 10px; }
            .panel-title { font-size: 14px; margin-bottom: 6px; padding-bottom: 4px; }
            .control-btn-grid { gap: 5px; }
            .placeholder-btn { padding: 7px 4px; font-size: 12px; line-height: 1.05; }
            .support-btn-code { min-width: 29px; margin-right: 3px; font-size: 9px; }
        }
        @media (max-height: 620px) {
            #bottom-view-wrapper { flex-basis: 164px; min-height: 164px; }
            .split-side-panel { padding: 6px 8px; }
            .panel-title { font-size: 12px; margin-bottom: 4px; padding-bottom: 3px; }
            .control-btn-grid { gap: 4px; }
            .placeholder-btn { padding: 5px 3px; font-size: 11px; }
        }
    </style>
</head>
<body>

    <div id="main-wrapper">
        <div id="top-view-area">
            <div class="hud-label">[HTMS] Navigation Supporter</div>
            <div class="hud-range" id="hud-range-display">RANGE: 3.0 NM</div>
            <div id="hud-min-cpa" title="Place the pointer here and use the mouse wheel to change the desired minimum CPA">
                <span class="min-cpa-label">DESIRED MIN CPA · WHEEL TO ADJUST</span>
                <span class="min-cpa-value" id="hud-min-cpa-value">0.50 NM ↕</span>
            </div>
            <div id="os-fixed-hud">
                <span class="os-hud-name">OS</span>
                <span class="os-hud-item">HDG <b id="os-hud-hdg">---</b></span>
                <span class="os-hud-item">COG <b id="os-hud-cog">---</b></span>
                <span class="os-hud-item">SOG <b id="os-hud-sog">---</b></span>
                <span class="os-hud-item">ROT <b id="os-hud-rot">---</b></span>
            </div>
            
            <div id="target-panels-container"></div>

            <div id="support-cards-container"></div>

            <canvas id="main-2d-canvas" class="vp-canvas"></canvas>
        </div>

        <div id="bottom-view-wrapper">
            <div class="split-side-panel">
                <div class="panel-title support-group-toggle" data-support-group-title="sa" title="클릭: 상황인지 6개 기능 전체 ON / OFF" style="color: var(--accent-cyan);">SITUATION AWARENESS</div>
                <div class="control-btn-grid">
                    <button class="placeholder-btn sa-btn" data-support-group="sa" data-support-feature="future-position" title="본선 전방 5 NM·후방 1 NM 범위 선박의 1·2·3·4·5분 후 위치를 반투명 선박으로 표시"><span class="support-btn-code">SA01</span>미래 위치</button>
                    <button class="placeholder-btn sa-btn" data-support-group="sa" data-support-feature="collision-point" title="현재 상대운동을 기준으로 계산된 미래 충돌·근접 위치를 해도에 표시"><span class="support-btn-code">SA02</span>충돌 예상 위치</button>
                    <button class="placeholder-btn sa-btn" data-support-group="sa" data-support-feature="threat-highlight" title="CPA에 따라 주변 선박을 녹색·노란색·빨간색으로 구분하여 강조"><span class="support-btn-code">SA03</span>위험 선박 강조</button>
                    <button class="placeholder-btn sa-btn" data-support-group="sa" data-support-feature="relative-motion" title="본선 기준 상대운동으로 1·2·3·4·5분 후 타선 위치와 상대궤적을 표시"><span class="support-btn-code">SA04</span>상대운동</button>
                    <button class="placeholder-btn sa-btn" data-support-group="sa" data-support-feature="approach-ranking" title="예측시간 동안 현재 거리 대비 가까워지는 비율이 큰 선박부터 접근 순위를 표시"><span class="support-btn-code">SA05</span>접근 순위</button>
                    <button class="placeholder-btn sa-btn" data-support-group="sa" data-support-feature="maneuver-trend" title="각 선박의 현재 ROT를 이용해 PORT·STBD 선회 또는 직진 추세를 표시"><span class="support-btn-code">SA06</span>조종 추세</button>
                </div>
            </div>

            <div class="split-side-panel">
                <div class="panel-title support-group-toggle" data-support-group-title="dm" title="클릭: 의사결정 6개 기능 전체 ON / OFF" style="color: var(--accent-yellow);">DECISION MAKING</div>
                <div class="control-btn-grid">
                    <button class="placeholder-btn dm-btn" data-support-group="dm" data-support-feature="safe-heading-band" title="225° 범위를 5° 간격으로 평가해 선택한 CPA를 만족하는 안전·위험 HDG를 표시"><span class="support-btn-code">DM01</span>안전 HDG 범위</button>
                    <button class="placeholder-btn dm-btn" data-support-group="dm" data-support-feature="minimum-alteration" title="ARC 30초 Time Ring으로 PORT와 STBD 양쪽의 선택 CPA 피항경로를 계산해 표시"><span class="support-btn-code">DM02</span>최소 변침</button>
                    <button class="placeholder-btn dm-btn" data-support-group="dm" data-support-feature="port-starboard" title="동일한 변침각을 기준으로 PORT와 STBD의 예상 CPA를 비교"><span class="support-btn-code">DM03</span>PORT / STBD 비교</button>
                    <button class="placeholder-btn dm-btn" data-support-group="dm" data-support-feature="speed-option" title="침로를 유지하고 속력만 바꿀 때 선택 CPA를 만족하는 속력 대안을 표시"><span class="support-btn-code">DM04</span>속력 대안</button>
                    <button class="placeholder-btn dm-btn" data-support-group="dm" data-support-feature="what-if-course" title="ARC 기반 CPA 0.1~1.0 NM 기준별 피항·복귀 경로를 비교 표시"><span class="support-btn-code">DM05</span>가상 항로 비교</button>
                    <button class="placeholder-btn dm-btn" data-support-group="dm" data-support-feature="colreg-cue" title="현재 조우기하를 기준으로 간단한 COLREG 상황과 행동 단서를 표시"><span class="support-btn-code">DM06</span>COLREG 판단</button>
                </div>
            </div>

            <div class="split-side-panel">
                <div class="panel-title support-group-toggle" data-support-group-title="act" title="클릭: 행동·조종 6개 기능 전체 ON / OFF" style="color: var(--accent-green);">ACTION & CONTROL</div>
                <div class="control-btn-grid">
                    <button class="placeholder-btn act-btn" data-support-group="act" data-support-feature="target-heading" title="현재 의사결정 계산에서 선택된 목표 HDG를 크게 표시"><span class="support-btn-code">AC01</span>목표 HDG</button>
                    <button class="placeholder-btn act-btn" data-support-group="act" data-support-feature="rudder-direction" title="목표 HDG로 가기 위해 필요한 PORT·STBD 타 방향만 표시"><span class="support-btn-code">AC02</span>타 방향</button>
                    <button class="placeholder-btn act-btn" data-support-group="act" data-support-feature="rudder-angle" title="현재 임시 조종모델을 이용해 목표 HDG를 위한 타각을 표시"><span class="support-btn-code">AC03</span>타각</button>
                    <button class="placeholder-btn act-btn" data-support-group="act" data-support-feature="heading-error" title="현재 HDG와 목표 HDG의 차이를 표시"><span class="support-btn-code">AC04</span>HDG 오차</button>
                    <button class="placeholder-btn act-btn" data-support-group="act" data-support-feature="rot-guidance" title="현재 ROT와 목표 ROT를 비교해 회두율 조정 방향을 표시"><span class="support-btn-code">AC05</span>ROT 유도</button>
                    <button class="placeholder-btn act-btn" data-support-group="act" data-support-feature="ease-timing" title="현재 ROT를 이용해 타를 풀거나 MIDSHIP을 시작할 예상 시점을 표시"><span class="support-btn-code">AC06</span>타 풀기 / MIDSHIP</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        // ==========================================
        // 1. HTMS 기본 상수 및 상태 변수
        // ==========================================
        const DEG2RAD = Math.PI / 180;
        const SHIP_LEN_UNIT = 64.8;  
        const SHIP_WID_UNIT = 10.8; 
        const VECTOR_SCALE = 8;     

        let systemLogs = [];
        let simStartTime = performance.now();
        let simEntities = []; 
        let isSimulationRunning = false;

        const canvas = document.getElementById('main-2d-canvas');
        const container = document.getElementById('top-view-area');
        const panelsContainer = document.getElementById('target-panels-container');
        
        let vObj = {
            panX: 0, panY: 0, 
            panOffsetX: 0, panOffsetY: 0,
            viewScale: 1 / 3.0, 
            isDragging: false, 
            dragStartX: 0, dragStartY: 0, 
            hasDragged: false,
            massEntity: null 
        };

        let selectedTargetIds = new Set();
        let panelSpawnOffset = 0;


        // ==========================================
        // HTMS Navigation Support - 교체 가능한 계산 모델 / UI 상태
        // ==========================================
        const SUPPORT_CONFIG = Object.freeze({
            // User-defined screening thresholds / ranges. Encounter values themselves are calculated from live data.
            safeCpaNM: 0.50,
            cautionCpaNM: 1.00,
            supportRadiusNM: 10.0,
            futureRadiusNM: 5.0,
            futureAsternNM: 1.0,
            safeBandDisplayStepDeg: 5.0,
            horizonMin: 10,
            futureMinutes: [1, 2, 3, 4, 5],
            headingBandSpanDeg: 225,
            headingStepDeg: 2.5,
            compareAlterDeg: 20,
            whatIfStepDeg: 7.5,
            whatIfCpaLevels: [0.10,0.20,0.30,0.40,0.50,0.60,0.70,0.80,0.90,1.00],
            routeStepSec: 10,
            // Replaceable generic merchant-ship maneuver assumption for the temporary model.
            routeTurnRateDegPerMin: 12,
            routeRejoinDelayMin: 1.5,
            arcTRSec: 30,
            arcHeadingStepDeg: 3,
            arcTurnWeight: 2.0,
            arcGoalWeight: 1.0,
            maxRudderDeg: 35,
            rudderStepDeg: 5,
            rudderKp: 0.65,
            rudderKd: 0.40,
            maxTargetRotDegPerMin: 15,
            rotKp: 0.25,
            easeTauSec: 20
        });

        // 사용자에게 보이는 기능명/설명만 한글화. 계산 key와 내부 모델명은 그대로 유지한다.
        const SUPPORT_FEATURE_KO = Object.freeze({
            'sa:future-position': { label: '미래 위치', description: '전방 5 NM·후방 1 NM 범위의 본선/타선 미래 위치를 반투명 선박으로 표시' },
            'sa:collision-point': { label: '충돌 예상 위치', description: '계산된 미래 충돌·근접 위치를 해도에 표시' },
            'sa:threat-highlight': { label: '위험 선박 강조', description: 'CPA에 따라 선박을 녹색·노란색·빨간색으로 강조' },
            'sa:relative-motion': { label: '상대운동', description: '본선 기준 상대운동으로 1·2·3·4·5분 후 상대 위치를 표시' },
            'sa:approach-ranking': { label: '접근 순위', description: '예측시간 동안 현재 거리 대비 가까워지는 정도가 큰 순서로 표시' },
            'sa:maneuver-trend': { label: '조종 추세', description: 'ROT를 이용해 PORT·STBD 선회 추세를 표시' },
            'dm:safe-heading-band': { label: '안전 HDG 범위', description: '225°를 5° 간격으로 평가해 안전·위험 방위를 표시' },
            'dm:minimum-alteration': { label: '최소 변침', description: 'ARC 30초 Time Ring 기반 PORT/STBD 피항경로를 표시' },
            'dm:port-starboard': { label: 'PORT / STBD 비교', description: '양쪽 동일 변침 시 예상 CPA를 비교' },
            'dm:speed-option': { label: '속력 대안', description: '침로 유지 시 안전한 속력 대안을 표시' },
            'dm:what-if-course': { label: '가상 항로 비교', description: 'ARC를 이용해 CPA 0.1~1.0 NM 기준별 피항·복귀 경로를 비교 표시' },
            'dm:colreg-cue': { label: 'COLREG 판단', description: '조우상황의 COLREG 행동 단서를 표시' },
            'act:target-heading': { label: '목표 HDG', description: '선택된 목표 HDG를 표시' },
            'act:rudder-direction': { label: '타 방향', description: '필요한 PORT/STBD 타 방향을 표시' },
            'act:rudder-angle': { label: '타각', description: '임시 조종모델 기반 타각을 표시' },
            'act:heading-error': { label: 'HDG 오차', description: '현재 HDG와 목표 HDG의 차이를 표시' },
            'act:rot-guidance': { label: 'ROT 유도', description: '현재 ROT와 목표 ROT 차이를 표시' },
            'act:ease-timing': { label: '타 풀기 / MIDSHIP', description: '타를 풀거나 MIDSHIP할 예상 시점을 표시' }
        });

        // Every button is an independent toggle. Multiple SA/DM/ACT features may coexist.
        const activeSupportFeatures = new Set();
        let supportFocus = { group: null, feature: null };

        // 사용자가 운항 중 직접 정하는 최소 피항거리. 기본값만 SUPPORT_CONFIG에서 가져오며 계산값은 고정하지 않는다.
        const supportUserSettings = { minCpaNM: SUPPORT_CONFIG.safeCpaNM, minAllowedNM: 0.10, maxAllowedNM: 3.00, stepNM: 0.10 };
        function getDesiredCpaNM() { return supportUserSettings.minCpaNM; }
        function getCautionCpaNM() { return Math.max(SUPPORT_CONFIG.cautionCpaNM, getDesiredCpaNM() + 0.50); }
        window.HTMSSupportSettings = supportUserSettings;

        const supportCardsContainer = document.getElementById('support-cards-container');
        const minCpaControl = document.getElementById('hud-min-cpa');
        const minCpaValue = document.getElementById('hud-min-cpa-value');
        const osFixedHud = document.getElementById('os-fixed-hud');
        const osHudHdg = document.getElementById('os-hud-hdg');
        const osHudCog = document.getElementById('os-hud-cog');
        const osHudSog = document.getElementById('os-hud-sog');
        const osHudRot = document.getElementById('os-hud-rot');

        function updateOwnShipHud() {
            const os = vObj.massEntity;
            if (!os || !osFixedHud) { if (osFixedHud) osFixedHud.classList.remove('visible'); return; }
            osFixedHud.classList.add('visible');
            if (osHudHdg) osHudHdg.textContent = `${Number(os.hdg || 0).toFixed(1)}°`;
            if (osHudCog) osHudCog.textContent = `${Number(os.cog || 0).toFixed(1)}°`;
            if (osHudSog) osHudSog.textContent = `${Number(os.sog || 0).toFixed(1)} kt`;
            if (osHudRot) osHudRot.textContent = `${Number(os.rot || 0).toFixed(1)}°/min`;
        }

        function updateMinCpaControl() {
            if (!minCpaControl || !minCpaValue) return;
            const visible = activeSupportFeatures.size > 0;
            minCpaControl.classList.toggle('visible', visible);
            minCpaValue.textContent = `${getDesiredCpaNM().toFixed(2)} NM ↕`;
        }

        // ==========================================
        // 2. 캔버스 제어 및 마우스 클릭
        // ==========================================
        function drawPlaceholderGrid() {
            const ctx = canvas.getContext('2d');
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.strokeStyle = '#1e293b';
            ctx.lineWidth = 1;
            ctx.beginPath();
            ctx.moveTo(0, canvas.height / 2);
            ctx.lineTo(canvas.width, canvas.height / 2);
            ctx.moveTo(canvas.width / 2, 0);
            ctx.lineTo(canvas.width / 2, canvas.height);
            ctx.stroke();
        }

        function resizeCanvas() {
            canvas.width = container.clientWidth;
            canvas.height = container.clientHeight;
            vObj.panX = canvas.width / 2 + vObj.panOffsetX;
            vObj.panY = canvas.height / 2 + vObj.panOffsetY;
            
            if (!isSimulationRunning) {
                drawPlaceholderGrid();
            } else {
                render2D();
            }
        }
        window.addEventListener('resize', resizeCanvas);
        setTimeout(resizeCanvas, 100);

        canvas.addEventListener('mousedown', (e) => {
            const rect = canvas.getBoundingClientRect();
            vObj.isDragging = true; vObj.hasDragged = false;
            vObj.dragStartX = (e.clientX - rect.left) - vObj.panOffsetX;
            vObj.dragStartY = (e.clientY - rect.top) - vObj.panOffsetY;
        });

        window.addEventListener('mousemove', (e) => {
            if (vObj.isDragging) {
                const rect = canvas.getBoundingClientRect();
                const mx = e.clientX - rect.left; 
                const my = e.clientY - rect.top;
                const dx = mx - vObj.dragStartX - vObj.panOffsetX;
                const dy = my - vObj.dragStartY - vObj.panOffsetY;
                
                if (Math.abs(dx) > 3 || Math.abs(dy) > 3) vObj.hasDragged = true;
                
                vObj.panOffsetX = mx - vObj.dragStartX; 
                vObj.panOffsetY = my - vObj.dragStartY; 
                if (isSimulationRunning) render2D();
            }
        });

        window.addEventListener('mouseup', () => { vObj.isDragging = false; });
        
        canvas.addEventListener('click', (e) => {
            if (vObj.hasDragged) return; 
            
            const rect = canvas.getBoundingClientRect();
            const mx = e.clientX - rect.left;
            const my = e.clientY - rect.top;
            
            let clickedShip = null;
            let minDist = Infinity;
            
            simEntities.forEach(s => {
                if (s.isMASS) return; 
                
                const relX = s.x - vObj.massEntity.x;
                const relZ = s.z - vObj.massEntity.z;
                const cx = vObj.panX + relX * vObj.viewScale;
                const cy = vObj.panY + relZ * vObj.viewScale;
                
                const distPX = Math.hypot(mx - cx, my - cy);
                
                if (distPX < 20 && distPX < minDist) {
                    minDist = distPX;
                    clickedShip = s;
                }
            });
            
            if (clickedShip) {
                const existingId = Array.from(selectedTargetIds).find(id => String(id) === String(clickedShip.id));
                if (existingId !== undefined) {
                    closeTargetPanel(existingId);
                } else {
                    selectedTargetIds.add(clickedShip.id);
                    createTargetPanel(clickedShip.id, clickedShip.name);
                }
            }
            
            if (isSimulationRunning) {
                render2D();
                updateAllTargetPanels();
            }
        });
        
        canvas.addEventListener('wheel', (e) => {
            e.preventDefault();
            let range = Math.min(30, Math.max(0.5, (1 / vObj.viewScale) * (e.deltaY < 0 ? 0.9 : 1.1)));
            vObj.viewScale = 1 / range; 
            document.getElementById('hud-range-display').innerText = `RANGE: ${range.toFixed(1)} NM`;
            if (isSimulationRunning) render2D();
        }, { passive: false });

        // ==========================================
        // 3. 다중 타겟 인포 패널 관리 (자동 정렬, 드래그, 상대운동 계산)
        //    변경 범위: 타겟 정보창에만 한정. 데이터 수신/렌더링/버튼은 변경하지 않음.
        // ==========================================
        const targetPanelMargin = 15;
        const targetPanelGap = 12;

        // 자동 배치창만 담는 투명 영역. 수동 이동한 창은 기존 panelsContainer에 둔다.
        const targetAutoArea = document.createElement('div');
        targetAutoArea.id = 'target-auto-area';
        Object.assign(targetAutoArea.style, {
            position: 'absolute', top: '15px', right: '15px',
            pointerEvents: 'none', zIndex: '0', display: 'none',
            overflowX: 'auto', overflowY: 'hidden', overscrollBehavior: 'contain'
        });
        const targetAutoContent = document.createElement('div');
        targetAutoContent.style.position = 'relative';
        targetAutoArea.appendChild(targetAutoContent);
        panelsContainer.appendChild(targetAutoArea);

        function keepTargetPanelInMap(panel) {
            const maxLeft = Math.max(0, container.clientWidth - panel.offsetWidth);
            const maxTop = Math.max(0, container.clientHeight - panel.offsetHeight);
            panel.style.left = `${Math.min(maxLeft, Math.max(0, parseFloat(panel.style.left) || 0))}px`;
            panel.style.top = `${Math.min(maxTop, Math.max(0, parseFloat(panel.style.top) || 0))}px`;
        }

        function arrangeTargetPanels() {
            // 수동으로 옮긴 창은 재정렬하지 않는다. 화면 축소 시에만 경계 안으로 보정.
            panelsContainer.querySelectorAll('.target-info-panel[data-manual="true"]')
                .forEach(keepTargetPanelInMap);

            const panels = Array.from(targetAutoContent.children);
            if (!panels.length) {
                targetAutoArea.style.display = 'none';
                return;
            }
            targetAutoArea.style.display = 'block';
            const availableWidth = Math.max(1, container.clientWidth - targetPanelMargin * 2);
            const availableHeight = Math.max(1, container.clientHeight - targetPanelMargin * 2);
            const panelWidth = Math.max(...panels.map(p => p.offsetWidth));
            const panelHeight = Math.max(...panels.map(p => p.offsetHeight));
            const stepX = panelWidth + targetPanelGap;
            const stepY = panelHeight + targetPanelGap;
            const rows = Math.max(1, Math.floor((availableHeight + targetPanelGap) / stepY));
            let columns = Math.max(1, Math.min(
                Math.ceil(panels.length / rows),
                Math.floor((availableWidth + targetPanelGap) / stepX)
            ));
            const needsScroll = panels.length > rows * columns || panelHeight > availableHeight;
            // 아주 많은 창을 열어도 버리거나 겹쳐 쌓지 않고 정보창 영역에서만 스크롤.
            const scrollbarAllowance = needsScroll ? 24 : 0;
            if (needsScroll) {
                columns = Math.max(1, Math.min(columns,
                    Math.floor((availableWidth - scrollbarAllowance + targetPanelGap) / stepX)));
            }
            const pageSize = rows * columns;
            const positions = panels.map((panel, index) => {
                const page = Math.floor(index / pageSize);
                const inPage = index % pageSize;
                return {
                    panel,
                    column: Math.floor(inPage / rows),
                    top: (page * rows + inPage % rows) * stepY
                };
            });
            const contentHeight = Math.max(...positions.map(p => p.top + panelHeight));
            targetAutoArea.style.width = `${Math.min(availableWidth,
                columns * stepX - targetPanelGap + scrollbarAllowance)}px`;
            targetAutoArea.style.height = `${Math.min(availableHeight, contentHeight)}px`;
            targetAutoArea.style.overflowX = needsScroll || panelWidth > availableWidth ? 'auto' : 'visible';
            targetAutoArea.style.overflowY = needsScroll ? 'auto' : 'visible';
            // 일반 배치에서는 창 사이의 빈 공간으로 기존 맵 조작이 통과한다.
            targetAutoArea.style.pointerEvents = needsScroll ? 'auto' : 'none';
            const contentWidth = Math.max(panelWidth, targetAutoArea.clientWidth);
            targetAutoContent.style.width = `${contentWidth}px`;
            targetAutoContent.style.height = `${contentHeight}px`;
            positions.forEach(({ panel, column, top }) => {
                panel.style.left = `${contentWidth - panel.offsetWidth - column * stepX}px`;
                panel.style.top = `${top}px`;
            });
        }

        // 폰트 로딩/창 크기/패널 높이 변화에도 실제 크기로 재배치한다.
        const targetPanelResizeObserver = typeof ResizeObserver === 'function'
            ? new ResizeObserver(arrangeTargetPanels) : null;
        if (targetPanelResizeObserver) targetPanelResizeObserver.observe(container);
        window.addEventListener('resize', arrangeTargetPanels);
        if (document.fonts && document.fonts.ready) {
            document.fonts.ready.then(arrangeTargetPanels);
        }

        function createTargetPanel(id, name) {
            if (document.getElementById(`panel-${id}`)) return;
            const panel = document.createElement('div');
            panel.className = 'target-info-panel';
            panel.id = `panel-${id}`;
            panel.dataset.manual = 'false';
            // 항목/순서/클래스/기존 CSS 크기는 원본과 동일하게 유지.
            panel.innerHTML = `
                <div class="tgt-header">
                    <span class="tgt-title"></span>
                    <button class="tgt-close-btn" type="button">✖</button>
                </div>
                <div class="tgt-row"><span>HDG:</span> <span class="tgt-val">-</span></div>
                <div class="tgt-row"><span>COG:</span> <span class="tgt-val">-</span></div>
                <div class="tgt-row"><span>SOG:</span> <span class="tgt-val">-</span></div>
                <div class="tgt-row"><span>ROT:</span> <span class="tgt-val">-</span></div>
                <div class="tgt-row"><span>DIST:</span> <span class="tgt-val">-</span></div>
                <div class="tgt-row"><span>BRG:</span> <span class="tgt-val">-</span></div>
                <div class="tgt-row"><span>CPA:</span> <span class="tgt-val">---</span></div>
                <div class="tgt-row"><span>TCPA:</span> <span class="tgt-val">---</span></div>
                <div class="tgt-row"><span>BCR:</span> <span class="tgt-val">---</span></div>
            `;
            panel.querySelector('.tgt-title').textContent = name;
            const fields = ['hdg', 'cog', 'sog', 'rot', 'dist', 'brg', 'cpa', 'tcpa', 'bcr'];
            panel.querySelectorAll('.tgt-val').forEach((value, index) => {
                value.id = `${fields[index]}-${id}`;
            });
            // 인라인 문자열 변환 없이 원래 ID를 전달: 숫자 MMSI도 정상적으로 해제.
            panel.querySelector('.tgt-close-btn').addEventListener('click', e => {
                e.stopPropagation();
                closeTargetPanel(id);
            });
            targetAutoContent.appendChild(panel);
            makePanelDraggable(panel);
            if (targetPanelResizeObserver) targetPanelResizeObserver.observe(panel);
            arrangeTargetPanels();
            // 스크롤이 필요한 경우에도 방금 선택한 창이 보이도록 한다.
            const panelBottom = panel.offsetTop + panel.offsetHeight;
            if (panelBottom > targetAutoArea.scrollTop + targetAutoArea.clientHeight) {
                targetAutoArea.scrollTop = panelBottom - targetAutoArea.clientHeight;
            }
        }

        window.closeTargetPanel = function(id) {
            const panel = document.getElementById(`panel-${id}`);
            if (panel) {
                if (panel.finishTargetDrag) panel.finishTargetDrag();
                if (targetPanelResizeObserver) targetPanelResizeObserver.unobserve(panel);
                panel.remove();
            }
            selectedTargetIds.forEach(selectedId => {
                if (String(selectedId) === String(id)) selectedTargetIds.delete(selectedId);
            });
            arrangeTargetPanels();
            if (isSimulationRunning) render2D();
        };

        function makePanelDraggable(panel) {
            const header = panel.querySelector('.tgt-header');
            header.addEventListener('mousedown', e => {
                if (e.button !== 0 || e.target.closest('.tgt-close-btn')) return;
                e.preventDefault();
                e.stopPropagation();
                const mapRect = panelsContainer.getBoundingClientRect();
                const panelRect = panel.getBoundingClientRect();
                const startX = e.clientX;
                const startY = e.clientY;
                const startLeft = panelRect.left - mapRect.left;
                const startTop = panelRect.top - mapRect.top;
                let hasMoved = false;

                panelsContainer.querySelectorAll('.target-info-panel')
                    .forEach(p => p.style.zIndex = '20');
                panel.style.zIndex = '21';

                function move(ev) {
                    const dx = ev.clientX - startX;
                    const dy = ev.clientY - startY;
                    if (!hasMoved && Math.abs(dx) <= 3 && Math.abs(dy) <= 3) return;
                    ev.preventDefault();
                    if (!hasMoved) {
                        hasMoved = true;
                        panel.dataset.manual = 'true';
                        panelsContainer.appendChild(panel);
                        panel.style.left = `${startLeft}px`;
                        panel.style.top = `${startTop}px`;
                        arrangeTargetPanels();
                    }
                    panel.style.left = `${startLeft + dx}px`;
                    panel.style.top = `${startTop + dy}px`;
                    keepTargetPanelInMap(panel);
                }
                function finish() {
                    window.removeEventListener('mousemove', move);
                    window.removeEventListener('mouseup', finish);
                    window.removeEventListener('blur', finish);
                    delete panel.finishTargetDrag;
                }
                panel.finishTargetDrag = finish;
                window.addEventListener('mousemove', move);
                window.addEventListener('mouseup', finish);
                window.addEventListener('blur', finish);
            });
        }

        function calculateTargetEncounter(os, ts) {
            const result = {
                cpaNM: null, tcpaMin: null, bcrNM: null,
                cpaNote: '위치 또는 속도 데이터가 유효하지 않습니다.', bcrNote: '위치/속도 또는 자선 HDG가 유효하지 않습니다.'
            };
            if (!os || !ts || ![os.x, os.z, ts.x, ts.z].every(Number.isFinite)) return result;

            // 기존 수신부가 만든 좌표를 그대로 역변환: 400 display units = 1 NM.
            // 기존 sog는 화면에 표시되는 knot 값으로 가정. 수신부 단위 변환은 변경하지 않음.
            const unitsPerMetre = 400 / 1852;
            const rEast = (ts.x - os.x) / unitsPerMetre;
            const rNorth = -(ts.z - os.z) / unitsPerMetre;
            const knotToMps = 1852 / 3600;
            const velocityEpsilon = 1e-6; // m/s, 0 나눗셈 방지용 수치 허용오차
            const timeEpsilon = 1e-6; // seconds

            function velocity(ship) {
                if (!Number.isFinite(ship.sog) || ship.sog < 0) return null;
                if (ship.sog === 0) return { east: 0, north: 0 };
                if (!Number.isFinite(ship.cog)) return null;
                const angle = ship.cog * DEG2RAD;
                return {
                    east: ship.sog * knotToMps * Math.sin(angle),
                    north: ship.sog * knotToMps * Math.cos(angle)
                };
            }
            const ownVelocity = velocity(os);
            const targetVelocity = velocity(ts);
            if (!ownVelocity || !targetVelocity) return result;
            const vEast = targetVelocity.east - ownVelocity.east;
            const vNorth = targetVelocity.north - ownVelocity.north;
            const relativeSpeedSquared = vEast * vEast + vNorth * vNorth;

            // 등속·직진 상대운동. TCPA는 음수를 유지하며 과거로 외삽된 CPA와 짝지음.
            if (relativeSpeedSquared <= velocityEpsilon * velocityEpsilon) {
                result.cpaNM = Math.hypot(rEast, rNorth) / 1852;
                result.cpaNote = '상대속도가 0에 가까워 거리가 일정합니다. CPA=현재 거리, TCPA=미정.';
            } else {
                const tcpaSeconds = -(rEast * vEast + rNorth * vNorth) / relativeSpeedSquared;
                result.tcpaMin = tcpaSeconds / 60;
                result.cpaNM = Math.hypot(
                    rEast + vEast * tcpaSeconds, rNorth + vNorth * tcpaSeconds
                ) / 1852;
                result.cpaNote = tcpaSeconds < 0
                    ? '현재 COG/SOG를 직선으로 연장하면 최근접 시점이 과거입니다. 과거 실측값은 아닙니다.'
                    : '현재 COG/SOG를 유지하는 등속·직진 예측값입니다. 선회/가감속/선체 크기는 미반영.';
            }

            // BCR: 움직이는 자선의 현재 HDG 선수미선과 타선 상대궤적의 교차.
            // 자선 데이터 기준점에서 잰 부호 있는 거리. 실제 선수 끝 오프셋은 사용하지 않음.
            if (!Number.isFinite(os.hdg)) return result;
            const heading = os.hdg * DEG2RAD;
            const forwardEast = Math.sin(heading);
            const forwardNorth = Math.cos(heading);
            const rStarboard = rEast * forwardNorth - rNorth * forwardEast;
            const vStarboard = vEast * forwardNorth - vNorth * forwardEast;
            if (Math.abs(vStarboard) <= velocityEpsilon) {
                result.bcrNote = '상대궤적이 선수미선과 평행하거나 일치하여 유일한 횡단점이 없습니다.';
                return result;
            }
            const crossingSeconds = -rStarboard / vStarboard;
            if (crossingSeconds < -timeEpsilon) {
                result.bcrNote = '현재 상대운동 기준 선수미선 교차시점이 과거여서 향후 BCR은 표시하지 않습니다.';
                return result;
            }
            const futureTime = Math.max(0, crossingSeconds);
            const crossEast = rEast + vEast * futureTime;
            const crossNorth = rNorth + vNorth * futureTime;
            result.bcrNM = (crossEast * forwardEast + crossNorth * forwardNorth) / 1852;
            result.bcrNote = '자선 데이터 기준점/현재 HDG 기준. +: 선수 쪽, -: 선미 쪽 통과. 등속·직진 예측.';
            return result;
        }

        function formatTargetEncounterValue(value, digits, unit, showPlus = false) {
            if (!Number.isFinite(value)) return '---';
            // 부동소수점 오차나 반올림 때문에 -0.00으로 표시되지 않도록 한다.
            const rounded = Number(value.toFixed(digits));
            const prefix = showPlus && rounded > 0 ? '+' : '';
            return `${prefix}${rounded.toFixed(digits)} ${unit}`;
        }

        function writeTargetEncounter(id, values) {
            const fields = [
                ['cpa', values.cpaNM, 2, 'NM', false, values.cpaNote],
                ['tcpa', values.tcpaMin, 1, 'min', false, values.cpaNote],
                ['bcr', values.bcrNM, 2, 'NM', true, values.bcrNote]
            ];
            fields.forEach(([key, value, digits, unit, showPlus, note]) => {
                const element = document.getElementById(`${key}-${id}`);
                if (!element) return;
                element.textContent = formatTargetEncounterValue(value, digits, unit, showPlus);
                // 기존 행은 pointer-events:none이므로 실제 포인터를 받는 패널에도 설명 제공.
                element.title = note;
            });
            const panel = document.getElementById(`panel-${id}`);
            if (panel) panel.title = `CPA/TCPA: ${values.cpaNote}\nBCR: ${values.bcrNote}`;
        }

        function updateAllTargetPanels() {
            const os = vObj.massEntity;
            const hasCurrentOwnShip = os && simEntities.includes(os);
            selectedTargetIds.forEach(id => {
                const panel = document.getElementById(`panel-${id}`);
                if (!panel) return;
                const ts = simEntities.find(s => String(s.id) === String(id));
                if (!hasCurrentOwnShip || !ts) {
                    writeTargetEncounter(id, {
                        cpaNM: null, tcpaMin: null, bcrNM: null,
                        cpaNote: '현재 프레임에 자선 또는 타선 데이터가 없습니다.',
                        bcrNote: '현재 프레임에 자선 또는 타선 데이터가 없습니다.'
                    });
                    return;
                }

                // 기존 6개 정보의 계산/표시 방식은 유지.
                document.getElementById(`hdg-${id}`).innerText = ts.hdg.toFixed(1) + '°';
                document.getElementById(`cog-${id}`).innerText = ts.cog.toFixed(1) + '°';
                document.getElementById(`sog-${id}`).innerText = ts.sog.toFixed(1) + ' kt';
                document.getElementById(`rot-${id}`).innerText = ts.rot.toFixed(1) + '°/min';

                const dEast = (ts.x - os.x) / (400 / 1852);
                const dNorth = -(ts.z - os.z) / (400 / 1852);
                const distMeters = Math.hypot(dEast, dNorth);
                const distNM = distMeters / 1852;
                let brgRad = Math.atan2(dEast, dNorth);
                let brgDeg = brgRad * (180 / Math.PI);
                if (brgDeg < 0) brgDeg += 360;
                document.getElementById(`dist-${id}`).innerText = distNM.toFixed(2) + ' NM';
                document.getElementById(`brg-${id}`).innerText = brgDeg.toFixed(1) + '°';

                writeTargetEncounter(id, calculateTargetEncounter(os, ts));
            });
        }


        // ==========================================
        // 3-B. HTMS Navigation Support 기능
        //      아래 SupportModels의 함수만 교체하면 추후 다른 충돌회피/조종모델로 대체 가능.
        // ==========================================
        function normalize360(deg) {
            deg %= 360;
            return deg < 0 ? deg + 360 : deg;
        }

        function signedAngleDiff(targetDeg, currentDeg) {
            return ((targetDeg - currentDeg + 540) % 360) - 180;
        }

        function clampValue(value, minValue, maxValue) {
            return Math.max(minValue, Math.min(maxValue, value));
        }

        function shipPositionMeters(ship) {
            const unit = 400 / 1852;
            return { east: ship.x / unit, north: -ship.z / unit };
        }

        function velocityFromCourseMps(courseDeg, sogKnots) {
            const speed = Math.max(0, Number(sogKnots) || 0) * 0.514444;
            const rad = normalize360(Number(courseDeg) || 0) * DEG2RAD;
            return { east: speed * Math.sin(rad), north: speed * Math.cos(rad) };
        }

        function getTrafficShips() {
            // Support calculations use one current record per vessel ID. The raw simEntities array and map rendering stay untouched.
            // If the backend ever contains repeated rows for the same MMSI/ID in one snapshot, counting those rows as separate ships
            // inflates support-feature counts and can distort collision-avoidance screening.
            const unique = new Map();
            simEntities.forEach(s => {
                if (s.isMASS) return;
                const key = String(s.id);
                unique.set(key, s); // last current-snapshot row wins for a repeated stable ID
            });
            return Array.from(unique.values());
        }

        function getNearbyTrafficShips(radiusNM = SUPPORT_CONFIG.supportRadiusNM) {
            if (!vObj.massEntity) return [];
            const os = vObj.massEntity;
            return getTrafficShips().filter(ts => evaluateRelativeMotion(os, ts).distanceNM <= radiusNM + 1e-9);
        }

        function isShipInForwardSupportArea(os, ts) {
            if (!os || !ts) return false;
            const own = shipPositionMeters(os);
            const pos = shipPositionMeters(ts);
            const relEast = pos.east - own.east;
            const relNorth = pos.north - own.north;
            const distanceNM = Math.hypot(relEast, relNorth) / 1852;
            if (distanceNM > SUPPORT_CONFIG.futureRadiusNM + 1e-9) return false;
            const rad = normalize360(os.cog) * DEG2RAD;
            const alongTrackNM = (relEast * Math.sin(rad) + relNorth * Math.cos(rad)) / 1852;
            return alongTrackNM >= -SUPPORT_CONFIG.futureAsternNM - 1e-9;
        }

        function getFuturePositionShips() {
            if (!vObj.massEntity) return [];
            const os = vObj.massEntity;
            return getTrafficShips().filter(ts => isShipInForwardSupportArea(os, ts));
        }

        function getVisibleApproachRankingList() {
            if (!vObj.massEntity) return [];
            const os = vObj.massEntity;
            return getNearbyTrafficShips().map(ship => {
                const motion = evaluateRelativeMotion(os, ship);
                const distanceReductionNM = Math.max(0, motion.distanceNM - motion.cpaNM);
                const approachRatio = motion.distanceNM > 1e-6 ? distanceReductionNM / motion.distanceNM : 0;
                const rangeMeters = Math.hypot(motion.relEast, motion.relNorth);
                const radialClosingMps = rangeMeters > 1e-6
                    ? -((motion.relEast * motion.relVelEast + motion.relNorth * motion.relVelNorth) / rangeMeters)
                    : 0;
                const closingSpeedKnots = Math.max(0, radialClosingMps * 1.9438444924406);
                return { ship, motion, distanceReductionNM, approachRatio, closingSpeedKnots };
            })
                // Only ships actually closing during the prediction horizon participate in the ranking.
                .filter(item => item.distanceReductionNM > 0.01 && item.closingSpeedKnots > 0.05)
                .filter(item => {
                    const p = shipCanvasPoint(item.ship);
                    return p.x >= 0 && p.x <= canvas.width && p.y >= 0 && p.y <= canvas.height;
                })
                // Severity = proportion of the current separation that is expected to disappear.
                // Ties are broken by current radial closing speed, then smaller predicted separation.
                .sort((a, b) => b.approachRatio - a.approachRatio
                    || b.closingSpeedKnots - a.closingSpeedKnots
                    || a.motion.cpaNM - b.motion.cpaNM
                    || b.distanceReductionNM - a.distanceReductionNM);
        }

        function evaluateRelativeMotion(os, ts, ownHeading = os.cog, ownSpeed = os.sog, horizonMin = SUPPORT_CONFIG.horizonMin) {
            const op = shipPositionMeters(os);
            const tp = shipPositionMeters(ts);
            const ov = velocityFromCourseMps(ownHeading, ownSpeed);
            const tv = velocityFromCourseMps(ts.cog, ts.sog);
            const rE = tp.east - op.east;
            const rN = tp.north - op.north;
            const vE = tv.east - ov.east;
            const vN = tv.north - ov.north;
            const vv = vE * vE + vN * vN;
            const horizonSec = horizonMin * 60;
            const rawTcpaSec = vv < 1e-8 ? Infinity : -(rE * vE + rN * vN) / vv;
            const evalSec = vv < 1e-8 ? 0 : clampValue(rawTcpaSec, 0, horizonSec);
            const cpaMeters = Math.hypot(rE + vE * evalSec, rN + vN * evalSec);
            const currentDistanceNM = Math.hypot(rE, rN) / 1852;
            return {
                cpaNM: cpaMeters / 1852,
                tcpaMin: Number.isFinite(rawTcpaSec) ? rawTcpaSec / 60 : null,
                evalTcpaMin: evalSec / 60,
                distanceNM: currentDistanceNM,
                relEast: rE,
                relNorth: rN,
                relVelEast: vE,
                relVelNorth: vN
            };
        }

        function getThreatList() {
            if (!vObj.massEntity) return [];
            const os = vObj.massEntity;
            return getTrafficShips().map(ship => {
                const motion = evaluateRelativeMotion(os, ship);
                const tcpa = motion.tcpaMin;
                const future = Number.isFinite(tcpa) && tcpa >= 0 && tcpa <= SUPPORT_CONFIG.horizonMin;
                const cpaTerm = Math.max(0, (getCautionCpaNM() - motion.cpaNM) / getCautionCpaNM());
                const timeTerm = future ? Math.max(0, 1 - tcpa / SUPPORT_CONFIG.horizonMin) : 0;
                const distanceTerm = Math.max(0, 1 - motion.distanceNM / 6);
                const score = future ? cpaTerm * 0.60 + timeTerm * 0.28 + distanceTerm * 0.12 : distanceTerm * 0.08;
                return { ship, motion, score, future };
            }).sort((a, b) => b.score - a.score || a.motion.distanceNM - b.motion.distanceNM);
        }

        function getPreferredTarget() {
            const ids = Array.from(selectedTargetIds);
            for (let i = ids.length - 1; i >= 0; i--) {
                const selected = simEntities.find(s => !s.isMASS && String(s.id) === String(ids[i]));
                if (selected) return selected;
            }
            const threat = getThreatList()[0];
            return threat ? threat.ship : null;
        }

        function relativeMetersToCanvas(eastMeters, northMeters) {
            const unit = 400 / 1852;
            return {
                x: vObj.panX + eastMeters * unit * vObj.viewScale,
                y: vObj.panY - northMeters * unit * vObj.viewScale
            };
        }

        function shipRelativeMeters(ship) {
            if (!vObj.massEntity) return { east: 0, north: 0 };
            const own = shipPositionMeters(vObj.massEntity);
            const pos = shipPositionMeters(ship);
            return { east: pos.east - own.east, north: pos.north - own.north };
        }

        function shipCanvasPoint(ship) {
            const rel = shipRelativeMeters(ship);
            return relativeMetersToCanvas(rel.east, rel.north);
        }

        function drawGlowLine(ctx, x1, y1, x2, y2, color, width = 2, dash = []) {
            ctx.save();
            ctx.strokeStyle = color;
            ctx.lineWidth = width;
            ctx.shadowColor = color;
            ctx.shadowBlur = 8;
            ctx.setLineDash(dash);
            ctx.beginPath();
            ctx.moveTo(x1, y1);
            ctx.lineTo(x2, y2);
            ctx.stroke();
            ctx.restore();
        }

        function drawSupportTag(ctx, text, x, y, color) {
            ctx.save();
            ctx.font = 'bold 11px Rajdhani';
            const width = ctx.measureText(text).width + 12;
            ctx.fillStyle = 'rgba(5,10,18,0.86)';
            ctx.strokeStyle = color;
            ctx.lineWidth = 1;
            ctx.beginPath();
            if (ctx.roundRect) ctx.roundRect(x, y - 14, width, 18, 4);
            else ctx.rect(x, y - 14, width, 18);
            ctx.fill();
            ctx.stroke();
            ctx.fillStyle = color;
            ctx.textAlign = 'left';
            ctx.fillText(text, x + 6, y);
            ctx.restore();
        }

        function drawHeadingRay(ctx, heading, color, lengthPx = 125, dash = []) {
            const rad = normalize360(heading) * DEG2RAD;
            const x2 = vObj.panX + Math.sin(rad) * lengthPx;
            const y2 = vObj.panY - Math.cos(rad) * lengthPx;
            drawGlowLine(ctx, vObj.panX, vObj.panY, x2, y2, color, 2.2, dash);
            return { x: x2, y: y2 };
        }

        function supportRiskClass(cpaNM, tcpaMin) {
            const futureEncounter = Number.isFinite(tcpaMin) && tcpaMin >= 0 && tcpaMin <= SUPPORT_CONFIG.horizonMin;
            if (!futureEncounter) return 'safe';
            if (cpaNM < getDesiredCpaNM()) return 'danger';
            if (cpaNM < getCautionCpaNM()) return 'caution';
            return 'safe';
        }

        function riskColorFromEncounter(cpaNM, tcpaMin) {
            const risk = supportRiskClass(cpaNM, tcpaMin);
            return risk === 'danger' ? '#fb7185' : risk === 'caution' ? '#facc15' : '#34d399';
        }


        // ==========================================
        // ARC collision-avoidance planner (TR = 30 s)
        // Time Rings are centered at the current own-ship position. Each ring represents
        // the distance own ship would travel in one more TR while maintaining current SOG.
        // The safety radius is the navigator-selected DESIRED MIN CPA itself (not half of it).
        // ==========================================
        function arcTargetState(os, ts) {
            const own = shipPositionMeters(os);
            const pos = shipPositionMeters(ts);
            const ownVel = velocityFromCourseMps(os.cog, os.sog);
            const vel = velocityFromCourseMps(ts.cog, ts.sog);
            const relEast = pos.east - own.east;
            const relNorth = pos.north - own.north;
            const relVelEast = vel.east - ownVel.east;
            const relVelNorth = vel.north - ownVel.north;
            const vv = relVelEast * relVelEast + relVelNorth * relVelNorth;
            const tcpaSec = vv > 1e-10 ? -(relEast * relVelEast + relNorth * relVelNorth) / vv : Infinity;
            return {
                ship: ts, relEast, relNorth, velEast: vel.east, velNorth: vel.north,
                relVelEast, relVelNorth, tcpaSec
            };
        }

        function arcFutureTargetPoint(targetState, timeSec) {
            return {
                east: targetState.relEast + targetState.velEast * timeSec,
                north: targetState.relNorth + targetState.velNorth * timeSec
            };
        }

        function blockedSectorsFromAngles(blockedAngles) {
            const sectors = [];
            let start = null;
            for (let a = 0; a < 360; a++) {
                if (blockedAngles[a] && start === null) start = a;
                if ((!blockedAngles[a] || a === 359) && start !== null) {
                    const end = blockedAngles[a] && a === 359 ? 359 : a - 1;
                    sectors.push({ start, end });
                    start = null;
                }
            }
            return sectors;
        }

        function buildArcRingData(os, targets, safetyNM = getDesiredCpaNM()) {
            const trSec = SUPPORT_CONFIG.arcTRSec;
            const horizonSec = Math.max(trSec, Math.round(SUPPORT_CONFIG.horizonMin * 60));
            const ownSpeedMps = Math.max(0.1, Number(os.sog) || 0) * 0.514444;
            const safetyMeters = Math.max(0.01, Number(safetyNM) || getDesiredCpaNM()) * 1852;
            const targetStates = targets.map(ts => arcTargetState(os, ts));
            const ringCount = Math.max(1, Math.floor(horizonSec / trSec));
            const rings = [];

            for (let i = 1; i <= ringCount; i++) {
                const timeSec = i * trSec;
                rings.push({
                    index: i,
                    timeSec,
                    minute: timeSec / 60,
                    radiusMeters: ownSpeedMps * timeSec,
                    blockedAngles: new Array(360).fill(false),
                    blockedSectors: [],
                    arcs: []
                });
            }

            // ARC definition used here follows the supplied radar implementation:
            // one target has one TCPA, that TCPA belongs to one 30 s Time Ring, therefore
            // that target contributes at most one collision ARC to the whole ring set.
            targetStates.forEach(targetState => {
                const tcpaSec = targetState.tcpaSec;
                if (!Number.isFinite(tcpaSec) || tcpaSec < 0 || tcpaSec > horizonSec + 1e-9) return;
                const ringIndex = clampValue(Math.max(1, Math.ceil(Math.max(tcpaSec, 1e-9) / trSec)), 1, ringCount);
                const ring = rings[ringIndex - 1];
                const tf = arcFutureTargetPoint(targetState, tcpaSec);
                const d = Math.hypot(tf.east, tf.north);
                if (d < 1e-9) return;

                const bearing = normalize360(Math.atan2(tf.east, tf.north) / DEG2RAD);
                const halfDeg = d <= safetyMeters
                    ? 90
                    : Math.asin(clampValue(safetyMeters / d, 0, 1)) / DEG2RAD;

                for (let a = 0; a < 360; a++) {
                    if (Math.abs(signedAngleDiff(a, bearing)) <= halfDeg + 0.5) ring.blockedAngles[a] = true;
                }
                ring.arcs.push({
                    targetId: String(targetState.ship.id),
                    targetName: targetState.ship.name || String(targetState.ship.id),
                    tcpaSec, bearing, halfDeg
                });
            });

            rings.forEach(ring => { ring.blockedSectors = blockedSectorsFromAngles(ring.blockedAngles); });
            return { trSec, safetyMeters, safetyNM: safetyMeters / 1852, ownSpeedMps, targetStates, rings };
        }

        function arcSegmentMinSeparationMeters(p0, p1, t0Sec, t1Sec, targetState) {
            const tf0 = arcFutureTargetPoint(targetState, t0Sec);
            const tf1 = arcFutureTargetPoint(targetState, t1Sec);
            const r0e = tf0.east - p0.east;
            const r0n = tf0.north - p0.north;
            const r1e = tf1.east - p1.east;
            const r1n = tf1.north - p1.north;
            const de = r1e - r0e;
            const dn = r1n - r0n;
            const dd = de * de + dn * dn;
            const u = dd > 1e-12 ? clampValue(-(r0e * de + r0n * dn) / dd, 0, 1) : 0;
            return Math.hypot(r0e + de * u, r0n + dn * u);
        }

        function arcSegmentIsSafe(p0, p1, t0Sec, t1Sec, arcData) {
            const safety = arcData.safetyMeters;
            for (const targetState of arcData.targetStates) {
                if (arcSegmentMinSeparationMeters(p0, p1, t0Sec, t1Sec, targetState) < safety - 0.5) return false;
            }
            return true;
        }

        function validateArcPath(points, arcData) {
            let minMeters = Infinity;
            for (let i = 1; i < points.length; i++) {
                const p0 = points[i - 1], p1 = points[i];
                for (const targetState of arcData.targetStates) {
                    minMeters = Math.min(minMeters, arcSegmentMinSeparationMeters(p0, p1, p0.timeSec, p1.timeSec, targetState));
                }
            }
            if (!Number.isFinite(minMeters)) minMeters = Infinity;
            return { minSeparationNM: minMeters / 1852, safe: minMeters + 0.5 >= arcData.safetyMeters };
        }

        function planArcSide(os, arcData, side) {
            const baseHeading = normalize360(os.cog);
            const sideSign = side === 'PORT' ? -1 : 1;
            const headingStep = SUPPORT_CONFIG.arcHeadingStepDeg;
            const maxSideDeg = SUPPORT_CONFIG.headingBandSpanDeg / 2;
            const maxTurnPerRing = Math.max(
                headingStep,
                SUPPORT_CONFIG.routeTurnRateDegPerMin * (SUPPORT_CONFIG.arcTRSec / 60)
            );

            const sideDeltas = [0];
            for (let d = headingStep; d <= maxSideDeg + 1e-9; d += headingStep) sideDeltas.push(sideSign * d);

            let states = [{
                heading: baseHeading,
                cost: 0,
                point: { east: 0, north: 0, timeSec: 0, minute: 0, heading: baseHeading },
                points: [{ east: 0, north: 0, timeSec: 0, minute: 0, heading: baseHeading }]
            }];

            for (const ring of arcData.rings) {
                const nextStates = [];
                for (const delta of sideDeltas) {
                    const heading = normalize360(baseHeading + delta);
                    if (ring.blockedAngles[Math.round(heading) % 360]) continue;
                    const rad = heading * DEG2RAD;
                    const point = {
                        east: Math.sin(rad) * ring.radiusMeters,
                        north: Math.cos(rad) * ring.radiusMeters,
                        timeSec: ring.timeSec,
                        minute: ring.minute,
                        heading
                    };

                    let best = null;
                    for (const prev of states) {
                        const turnDeg = Math.abs(signedAngleDiff(heading, prev.heading));
                        if (turnDeg > maxTurnPerRing + 1e-9) continue;
                        if (!arcSegmentIsSafe(prev.point, point, prev.point.timeSec, point.timeSec, arcData)) continue;
                        const goalErrorDeg = Math.abs(signedAngleDiff(heading, baseHeading));
                        const cost = prev.cost
                            + turnDeg * SUPPORT_CONFIG.arcTurnWeight
                            + goalErrorDeg * SUPPORT_CONFIG.arcGoalWeight;
                        if (!best || cost < best.cost) best = { prev, cost };
                    }
                    if (!best) continue;
                    nextStates.push({
                        heading,
                        cost: best.cost,
                        point,
                        points: [...best.prev.points, point]
                    });
                }
                if (!nextStates.length) return { side, hasPath: false, safe: false, points: [], minSeparationNM: 0 };
                states = nextStates;
            }

            states.sort((a, b) => a.cost - b.cost || Math.abs(signedAngleDiff(a.heading, baseHeading)) - Math.abs(signedAngleDiff(b.heading, baseHeading)));
            for (const state of states) {
                const validation = validateArcPath(state.points, arcData);
                if (!validation.safe) continue;
                let peakPoint = state.points[0];
                let peakDelta = 0;
                state.points.forEach(pt => {
                    const d = signedAngleDiff(pt.heading, baseHeading);
                    if (Math.abs(d) > Math.abs(peakDelta)) { peakDelta = d; peakPoint = pt; }
                });
                return {
                    side,
                    hasPath: true,
                    safe: true,
                    points: state.points,
                    cost: state.cost,
                    peakHeading: peakPoint.heading,
                    peakDelta,
                    finalHeading: state.heading,
                    minSeparationNM: validation.minSeparationNM
                };
            }
            return { side, hasPath: false, safe: false, points: [], minSeparationNM: 0 };
        }

        function buildArcMinimumAlterationOptions(os, targets, minCpaNM = getDesiredCpaNM()) {
            if (!os || !targets.length) return null;
            const arcTargets = targets.filter(ts => isShipInForwardSupportArea(os, ts));
            if (!arcTargets.length) return null;
            const arcData = buildArcRingData(os, arcTargets, minCpaNM);
            const portPath = planArcSide(os, arcData, 'PORT');
            const starboardPath = planArcSide(os, arcData, 'STBD');

            const asCandidate = path => path && path.hasPath ? {
                heading: path.peakHeading,
                delta: path.peakDelta,
                safe: true,
                unsafeCount: 0,
                worst: { cpaNM: path.minSeparationNM, tcpaMin: null, ship: null },
                arcPath: path
            } : null;

            return {
                baseHeading: normalize360(os.cog),
                arc: true,
                minCpaNM: arcData.safetyNM,
                arcTargets,
                trSec: arcData.trSec,
                arcRings: arcData.rings,
                arcData,
                portRecommended: asCandidate(portPath),
                starboardRecommended: asCandidate(starboardPath),
                portHasSafe: !!portPath.hasPath,
                starboardHasSafe: !!starboardPath.hasPath,
                portPath,
                starboardPath
            };
        }

        const SupportModels = {
            collisionAvoidance: {
                evaluateHeading(os, targets, headingDeg, speedKnots = os.sog) {
                    const encounters = targets.map(ts => ({ ship: ts, ...evaluateRelativeMotion(os, ts, headingDeg, speedKnots) }));
                    const future = encounters.filter(e => Number.isFinite(e.tcpaMin) && e.tcpaMin >= 0 && e.tcpaMin <= SUPPORT_CONFIG.horizonMin);
                    const worst = future.length
                        ? future.reduce((a, b) => a.cpaNM <= b.cpaNM ? a : b)
                        : encounters.reduce((a, b) => a.cpaNM <= b.cpaNM ? a : b, { cpaNM: Infinity, tcpaMin: null, ship: null });
                    const unsafeCount = future.filter(e => e.cpaNM < getDesiredCpaNM()).length;
                    return { heading: normalize360(headingDeg), speed: speedKnots, encounters, worst, unsafeCount, safe: unsafeCount === 0 };
                },

                findSafeHeading(os, targets) {
                    if (!os || !targets.length) return null;
                    const base = normalize360(os.cog);
                    const candidates = [];
                    const halfSpan = SUPPORT_CONFIG.headingBandSpanDeg / 2;
                    for (let d = -halfSpan; d <= halfSpan + 1e-9; d += SUPPORT_CONFIG.headingStepDeg) {
                        const result = this.evaluateHeading(os, targets, base + d, os.sog);
                        result.delta = signedAngleDiff(result.heading, base);
                        candidates.push(result);
                    }
                    const safe = candidates.filter(c => c.safe).sort((a, b) => Math.abs(a.delta) - Math.abs(b.delta) || b.worst.cpaNM - a.worst.cpaNM);
                    const bestEffort = candidates.slice().sort((a, b) => a.unsafeCount - b.unsafeCount || b.worst.cpaNM - a.worst.cpaNM || Math.abs(a.delta) - Math.abs(b.delta))[0];

                    const chooseSide = (sideCandidates) => {
                        const orderedSafe = sideCandidates.filter(c => c.safe).sort((a,b) => Math.abs(a.delta)-Math.abs(b.delta) || b.worst.cpaNM-a.worst.cpaNM);
                        const fallback = sideCandidates.slice().sort((a,b) => a.unsafeCount-b.unsafeCount || b.worst.cpaNM-a.worst.cpaNM || Math.abs(a.delta)-Math.abs(b.delta))[0] || null;
                        return { candidate: orderedSafe[0] || fallback, hasSafe: orderedSafe.length > 0 };
                    };
                    const port = chooseSide(candidates.filter(c => c.delta < -1e-6));
                    const starboard = chooseSide(candidates.filter(c => c.delta > 1e-6));

                    return {
                        baseHeading: base, candidates, recommended: safe[0] || bestEffort, hasSafe: safe.length > 0,
                        portRecommended: port.candidate, starboardRecommended: starboard.candidate,
                        portHasSafe: port.hasSafe, starboardHasSafe: starboard.hasSafe
                    };
                },

                findMinimumAlterationOptions(os, targets, minCpaNM = getDesiredCpaNM()) {
                    if (!os || !targets.length) return null;
                    const cpaNM = clampValue(Number(minCpaNM) || getDesiredCpaNM(), 0.10, 3.00);
                    const keyParts = [
                        Number(os.x).toFixed(6), Number(os.z).toFixed(6), Number(os.cog).toFixed(3), Number(os.sog).toFixed(3),
                        cpaNM.toFixed(3), SUPPORT_CONFIG.arcTRSec
                    ];
                    targets.forEach(t => keyParts.push(String(t.id), Number(t.x).toFixed(6), Number(t.z).toFixed(6), Number(t.cog).toFixed(3), Number(t.sog).toFixed(3)));
                    const cacheKey = keyParts.join('|');
                    if (!this._arcCacheMap) this._arcCacheMap = new Map();
                    if (this._arcCacheMap.has(cacheKey)) return this._arcCacheMap.get(cacheKey);
                    const result = buildArcMinimumAlterationOptions(os, targets, cpaNM);
                    this._arcCacheMap.set(cacheKey, result);
                    while (this._arcCacheMap.size > 40) this._arcCacheMap.delete(this._arcCacheMap.keys().next().value);
                    return result;
                },

                buildAvoidanceRoute(os, targets, solutionOrCandidate) {
                    if (!os || !solutionOrCandidate) return [];
                    const candidate = solutionOrCandidate.recommended || solutionOrCandidate;
                    if (candidate.arcPath && Array.isArray(candidate.arcPath.points)) return candidate.arcPath.points;
                    return [];
                }
            },

            shipControl: {
                rudderCommand(os, targetHeading) {
                    const error = signedAngleDiff(targetHeading, os.hdg);
                    if (Math.abs(error) < 1.2 && Math.abs(os.rot) < 0.8) return { error, rudder: 0, direction: 'MIDSHIP' };
                    let raw = SUPPORT_CONFIG.rudderKp * error - SUPPORT_CONFIG.rudderKd * (Number(os.rot) || 0);
                    raw = clampValue(raw, -SUPPORT_CONFIG.maxRudderDeg, SUPPORT_CONFIG.maxRudderDeg);
                    const stepped = Math.round(raw / SUPPORT_CONFIG.rudderStepDeg) * SUPPORT_CONFIG.rudderStepDeg;
                    return { error, rudder: stepped, direction: stepped > 0 ? 'STBD' : stepped < 0 ? 'PORT' : 'MIDSHIP' };
                },

                rotGuidance(os, targetHeading) {
                    const error = signedAngleDiff(targetHeading, os.hdg);
                    const targetRot = clampValue(error * SUPPORT_CONFIG.rotKp, -SUPPORT_CONFIG.maxTargetRotDegPerMin, SUPPORT_CONFIG.maxTargetRotDegPerMin);
                    const currentRot = Number(os.rot) || 0;
                    const delta = targetRot - currentRot;
                    const cue = Math.abs(delta) < 1.0 ? 'HOLD ROT' : Math.sign(delta) === Math.sign(targetRot || 1) ? 'BUILD ROT' : 'REDUCE ROT';
                    return { error, targetRot, currentRot, cue };
                },

                easeGuidance(os, targetHeading) {
                    const error = signedAngleDiff(targetHeading, os.hdg);
                    const direction = Math.sign(error);
                    const currentRot = Number(os.rot) || 0;
                    const sameTurn = direction !== 0 && Math.sign(currentRot) === direction;
                    const residualDeg = sameTurn ? Math.abs(currentRot) * SUPPORT_CONFIG.easeTauSec / 60 : 0;
                    const easeHeading = normalize360(targetHeading - direction * residualDeg);
                    const toEase = signedAngleDiff(easeHeading, os.hdg);
                    const predictedStop = normalize360(os.hdg + currentRot * SUPPORT_CONFIG.easeTauSec / 60);
                    const easeNow = sameTurn && direction * toEase <= 0.8;
                    return { error, residualDeg, easeHeading, predictedStop, easeNow, sameTurn };
                }
            }
        };
        // 외부에서 모델만 교체할 수 있도록 명시적 접근점을 둔다.
        window.HTMSSupportModels = SupportModels;

        function chooseBestArcCandidate(solution) {
            if (!solution) return null;
            const choices = [solution.portRecommended, solution.starboardRecommended].filter(Boolean);
            if (!choices.length) return null;
            return choices.sort((a, b) =>
                Math.abs(Number(a.delta) || 0) - Math.abs(Number(b.delta) || 0) ||
                ((a.arcPath && a.arcPath.cost) || Infinity) - ((b.arcPath && b.arcPath.cost) || Infinity)
            )[0];
        }

        function getArcWhatIfScenarios(os, targets) {
            if (!os || !targets.length) return [];
            return SUPPORT_CONFIG.whatIfCpaLevels.map((cpaNM, index) => {
                const solution = SupportModels.collisionAvoidance.findMinimumAlterationOptions(os, targets, cpaNM);
                const candidate = chooseBestArcCandidate(solution);
                const route = candidate ? SupportModels.collisionAvoidance.buildAvoidanceRoute(os, targets, candidate) : [];
                return { cpaNM, index, solution, candidate, route, available: !!candidate && route.length > 1 };
            });
        }

        function findSpeedOption(os, targets) {
            if (!os || !targets.length) return null;
            const minSpeed = Math.max(0, Math.min(os.sog, Math.max(1, os.sog * 0.30)));
            const maxSpeed = Math.max(os.sog + 0.5, os.sog * 1.20);
            const candidates = [];
            for (let speed = minSpeed; speed <= maxSpeed + 1e-6; speed += 0.5) {
                const result = SupportModels.collisionAvoidance.evaluateHeading(os, targets, os.cog, speed);
                result.deltaSpeed = speed - os.sog;
                candidates.push(result);
            }
            const safe = candidates.filter(c => c.safe).sort((a, b) => Math.abs(a.deltaSpeed) - Math.abs(b.deltaSpeed) || b.worst.cpaNM - a.worst.cpaNM);
            const recommended = safe[0] || candidates.slice().sort((a, b) => a.unsafeCount - b.unsafeCount || b.worst.cpaNM - a.worst.cpaNM || Math.abs(a.deltaSpeed) - Math.abs(b.deltaSpeed))[0];
